        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/summary:
    get:
      operationId: getConfigSummary
      summary: Configuration numbers for the dashboard
      description: |
        Added in 0.8.0. Servers that wait for a restart, parameters that differ between the servers of one server group
        without a server-level override to explain it, the failed and waiting servers, and the largest clock
        difference. A number the server cannot know is null, never 0.
