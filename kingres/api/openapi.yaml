        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/time:
    get:
      operationId: getClusterTime
      summary: Clocks and time zones of the servers
      description: |
        Added in 0.8.0. Per server its clock, the difference from the clock of the manager leader, which answers (`referenceServerId`), with the uncertainty of the
        measurement (half the round trip of the best of five probes plus one millisecond; the difference is
        exact only if both directions of the network take equally long), the operating system's time zone and
        PostgreSQL's `TimeZone` and `log_timezone`; and the time zone set for each database. `kingresd` does not
        set the system clock of a server: that is the job of time synchronization (NTP, chrony). A server that
        cannot be reached has `reachable` false and null values, never 0.
      tags: [Configuration]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The clocks.
