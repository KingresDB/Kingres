                createdAt: '2026-11-14T09:58:00Z'
                updatedAt: '2026-11-14T09:58:02Z'
                createdBy: alice

  schemas:
    # ------------------------------------------------------------------ errors
    ProblemCode:
      type: string
      description: |
        Stable machine-readable error code. Clients branch on this, not on `title` or `detail`.

        422: `table_not_eligible` (added in 0.14.0: the table cannot take the requested change; `blockers` says why).

        Added in 0.19.0 (data transfer): 403 `data_transfer_disabled` (the cluster setting is off) and `insecure_transport` (the request did not arrive over TLS); 409 `transfer_quota_exceeded` (the staging quota or the number of running transfers; `Retry-After` for the second), `upload_incomplete` and `upload_offset_mismatch` (the response header `Upload-Offset` has the right offset); 413 `chunk_too_large`; 422 `upload_checksum_mismatch`, `import_header_mismatch`, `import_ledger_policy`, `import_too_large` (a file above 2 GiB decompressed: split it), `import_end_marker` (an unquoted `.` line) and `export_untrusted_code`. An expired file is 410 with the code `not_found`. The error text of a data transfer never carries a value, a row or text of the server. Clients must tolerate codes they do not know.

        409 (state conflict): `conflict` (generic), `already_exists`, `immutable_field`,
        `rebalance_in_progress`, `operation_in_progress`, `task_not_cancellable`, `last_admin`, `role_in_use`,
        `optimistic_lock_failed`, `no_replica_available` (the instance or server is the only up-to-date copy),
        `instance_already_running` (`startThisServerInstance`), `instance_already_stopped`
        (`stopThisServerInstance`, `restartThisServerInstance`), `server_owns_buckets`,
        `server_hosts_map_group`, `last_server` (`removeServer`, `leaveCluster`), `server_group_not_empty`
        (`deleteServerGroup`), `ledger_entry_pending` (`createInclusionProof`).

        Added in 0.11.0 (409, ledger phase 7): `ledger_not_published` (the database has no published aggregate: `getLedgerAggregate`, `anchorLedgerNow`, `createLedgerBundle`), `origin_prefix_locked` (`updateLedgerSettings`: a checkpoint exists, the prefix cannot change), `signing_key_missing` (`createLedgerSigningKey` for a rotation when no key is active; `getLedgerTrustFile` when no key exists), `last_signing_key` (`retireLedgerSigningKey`, `revokeLedgerSigningKey`: no other key is active and in force) and `chain_not_diverged` (`acknowledgeLedgerDivergence`). Clients must tolerate codes they do not know.

        Added in 0.9.0 (409, rebalancing): `nothing_to_rebalance` (`startRebalance`: the plan is empty),
        `rebalance_not_running` (`stopRebalance`), `cluster_inconsistent` (`kingres.check_cluster()` reports something that
        makes moving buckets unsafe), `version_mismatch` (the servers do not run the same version of the sharding
        extension and the same PostgreSQL major), `failover_in_progress`, `no_receiving_server` (no server should hold
        shards). `insufficient_disk` is reserved for a later increment and `group_degraded` is used by `failoverServer` in mode `graceful` since 0.13.0 (a move that meets them is
        skipped and reported, not refused). `leader_unavailable` (503) names, in `serverIds`, servers that can be opened
        instead. Clients must tolerate codes they do not know.

        Added in 0.5.0: `certificate_revoked` (409: `renewServerCertificates`, `revokeServerCertificates`) and
        `certificate_authority_unavailable` (503: the operation needs the certificate authority key and the manager
        leader does not hold it; `renewServerCertificates`, `revokeServerCertificates`, `addServer`, `removeServer`,
        `leaveCluster`, `joinCluster`). Clients must tolerate codes they do not know.

        Added in 0.8.0: 404 `config_parameter_unknown` (`getConfigParameter`); 422 `config_parameter_managed` (`kingresd` needs the value), `config_parameter_refused` (runs a command, loads code, names a file or is unsafe), `config_level_not_allowed` (the value must be equal on every server, or PostgreSQL has no database level for it) and `config_value_below_floor` (below what `kingresd` needs); 409 `config_change_superseded` (`revertConfigChange`), `config_restart_order_conflict` and `nothing_pending` (`restartPendingInstances`). A value that is not valid for its parameter is 400 `validation_failed`.

        Added in 0.7.0: `workbench_busy` (429: the role already runs its two workbench statements on this server, or
        the server runs four in all; `executeQuery`; with `Retry-After`). `leader_unavailable` (503) is now also
        answered by a follower that has not heard from the manager leader for longer than the leader-loss bound
        (30 s by default) to a request that needs a session check; shorter interruptions change nothing.

        Added in 0.6.0: `internal_api_disabled` (409: the server was started without its internal API, so it cannot
        take part in a cluster; `addServer`, `removeServer`, `leaveCluster`, `renewServerCertificates`,
        `revokeServerCertificates`). It is a state of the server's configuration, not a missing feature: start
        `kingresd` with an internal listen address. Before 0.6.0 these operations answered 422
        `unsupported_operation`, which a client showed as "not implemented in this version".

        503 (cannot serve now): `node_uninitialized`, `map_group_unavailable`, `leader_unavailable`,
        `quorum_unavailable`, `service_unavailable`, `system_database_stopped` (the instance that hosts the
        system database was stopped on purpose; start it with `startThisServerInstance`).
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - invalid_credentials
        - session_expired
        - csrf_token_invalid
        - forbidden
        - setup_token_invalid
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - immutable_field
        - rebalance_in_progress
        - operation_in_progress
        - task_not_cancellable
        - last_admin
        - role_in_use
        - optimistic_lock_failed
        - no_replica_available
        - instance_already_running
        - instance_already_stopped
        - server_owns_buckets
        - server_hosts_map_group
        - last_server
        - server_group_not_empty
        - ledger_entry_pending
        - quorum_unavailable
        - system_database_stopped
        - unprocessable
        - sql_error
        - unsupported_operation
        - node_state_invalid
        - node_uninitialized
        - map_group_unavailable
        - leader_unavailable
        - rate_limited
        - service_unavailable
        - internal_error
        - certificate_revoked
        - certificate_authority_unavailable
        - internal_api_disabled
        - workbench_busy
        - config_parameter_unknown
        - config_parameter_managed
        - config_parameter_refused
        - config_level_not_allowed
        - config_value_below_floor
        - config_change_superseded
        - config_restart_order_conflict
        - nothing_pending
        - nothing_to_rebalance
        - rebalance_not_running
        - cluster_inconsistent
        - version_mismatch
        - failover_in_progress
        - group_degraded
        - insufficient_disk
        - no_receiving_server
        - replicas_cannot_be_kept
        - sharding_mode_in_use
        - schema_not_distributable
        - schema_pinned
        - schema_move_in_progress
        - bucket_busy
        - split_unsupported
        - failover_needs_decision
        - lease_settings_differ
        - ledger_not_published
        - origin_prefix_locked
        - signing_key_missing
        - last_signing_key
        - chain_not_diverged
        - table_not_eligible
        - extension_unavailable
        - extension_version_mismatch
        - sketch_hash_mismatch
        - extension_missing
        - conversion_refused
        - partition_policy_conflict
        - data_transfer_disabled
        - insecure_transport
        - transfer_quota_exceeded
        - upload_incomplete
        - upload_offset_mismatch
        - chunk_too_large
        - upload_checksum_mismatch
        - import_header_mismatch
        - import_ledger_policy
        - import_too_large
        - import_end_marker
        - export_untrusted_code
        - export_not_readable
        - large_objects_present
        - schema_unrecognised
        - archive_invalid
        - archive_incompatible
        - archive_statement_refused
        - ledger_restart_not_acknowledged
    ValidationIssue:
      type: object
      description: One invalid field of a request.
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid property of the request body, or the name of the invalid query or path parameter.
        message:
          type: string
          description: Human-readable explanation.
        code:
          type: string
          description: Short machine-readable reason, for example `required`, `out_of_range`, `pattern`, `unknown_value`.
    Problem:
      type: object
      description: RFC 9457 problem details, served as `application/problem+json`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI that identifies the problem type. `about:blank` when no more specific type exists.
        title:
          type: string
          description: Short, human-readable summary that does not change between occurrences.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference of the request that caused the problem.
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
          description: Value of the `X-Request-Id` response header, for log correlation.
        errors:
          type: array
          description: Field-level problems; present for `validation_failed`.
          items: { $ref: '#/components/schemas/ValidationIssue' }
        sqlState:
          type: string
          pattern: '^[0-9A-Z]{5}$'
          description: PostgreSQL SQLSTATE; present when `code` is `sql_error`.
        sqlPosition:
          type: integer
          minimum: 1
          description: 1-based character position of the error in the statement; present for some `sql_error` problems.
        blockers:
          type: array
          description: Added in 0.14.0. The lines of the report of the sharding extension that make a table not eligible; present for `table_not_eligible` and, from 0.17.0, for `conversion_refused` (the reasons of the refusal, one entry each).
          items: { $ref: '#/components/schemas/TableBlocker' }
        reasons:
          type: array
          description: "Added in 0.19.0, optional. Further reasons in the shape of `blockers`. From 0.29.0: for `export_not_readable` one entry per object the role cannot read (at most 20; `code` is `no_privilege` or `no_usage`, `object` the name), and for `archive_incompatible` the reasons the archive does not fit."
          items: { $ref: '#/components/schemas/TableBlocker' }
        plan:
          $ref: '#/components/schemas/FailoverPlan'
          description: 'Added in 0.12.0, optional. The whole plan of the request (the same body as `dryRun` answers), present only when `code` is `failover_needs_decision`: the console shows the groups, the candidates and the verdict without asking again.'
        serverIds:
          type: array
          description: 'Added in 0.9.0, optional. Servers that can be opened instead; set for `leader_unavailable`: the manager leader first when this server knows it, then the other servers of the cluster as this server knows them. Empty or absent when it knows none.'
          items: { $ref: '#/components/schemas/ServerId' }

    # ------------------------------------------------------------------ health and auth
    HealthStatus:
      type: object
      description: Liveness result.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`.
    ReadinessStatus:
      type: object
      description: Readiness result.
      required: [status, nodeState, checks]
      properties:
        status:
          type: string
          enum: [ready]
          description: Always `ready`; a server that is not ready answers 503 instead.
        nodeState:
          $ref: '#/components/schemas/NodeState'
        checks:
          type: array
          description: Individual readiness checks.
          items:
            type: object
            description: One readiness check.
            required: [name, ok]
            properties:
              name:
                type: string
                description: Check name, for example `localPostgres` or `managerReachable`.
              ok:
                type: boolean
                description: Whether the check passed.
              detail:
                type: string
                description: Explanation when the check failed.
    ClusterRoleName:
      type: string
      description: A built-in cluster role.
      enum: [kingres_admin, kingres_ops, kingres_readonly, kingres_stats]
    LoginRequest:
      type: object
      description: Credentials of a PostgreSQL role.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 63
          description: PostgreSQL role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: Role password.
        issueToken:
          type: boolean
          default: false
          description: Also return a bearer token in the response (for the CLI).
    Session:
      type: object
      description: The signed-in user, the session and the identity of the cluster.
      required: [username, clusterRoles, expiresAt, clusterId, clusterName]
      properties:
        username:
          type: string
          description: Signed-in PostgreSQL role.
        clusterRoles:
          type: array
          description: Built-in cluster roles the user is a member of.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
        expiresAt:
          type: string
          format: date-time
          description: When the session or token expires (absolute).
        csrfToken:
          type:
            - string
            - 'null'
          description: |
            CSRF token to send as `X-CSRF-Token` with cookie authentication; null for bearer authentication.
            It is fixed for the lifetime of the session: `login` issues it and `GET /auth/session` returns the
            same value; nothing rotates it.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server that issued the session; null when that server is not part of a cluster.
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Identifier of the cluster; null when the server is not part of a cluster. Present for every role, so the shell can render for an account that only has `kingres_stats`.
        clusterName:
          type:
            - string
            - 'null'
          description: Display name of the cluster; null when the server is not part of a cluster.
        token:
          type:
            - string
            - 'null'
          description: Bearer token; only present in the login response when `issueToken` was true.
        clientAddress:
          type: string
          description: |
            Added in 0.6.0, optional. The network address (IP, no port) this server saw the request come from, in
            `login` and `getSession`. It is the address of the TCP peer: behind a reverse proxy it is the proxy's.
        degraded:
          type: boolean
          description: |
            Added in 0.6.0, optional (absent means false). True when the answer was given from the memory of this
            server because the instance that hosts its system database is stopped (see `stopThisServerInstance`):
            `clusterRoles` are those of the last successful role check of this server, `serverId` may be null
            although the server is in a cluster, and nothing was read from the database. Only `getSession` can answer
            like this, and only for a session this server has checked before the stop.
        degradedReason:
          type: string
          description: Added in 0.6.0, optional. A sentence that says why `degraded` is true; present only then.

    # ------------------------------------------------------------------ setup
    NodeState:
      type: string
      description: Lifecycle state of a server.
      enum: [uninitialized, standalone, clustered]
    ServerId:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Identifier of a server. A server is a machine, defined as one distinct `host` value of the
        `kingres.node` catalog table; its id is that host string exactly as stored there (a DNS name or an
        IPv4/IPv6 address, IPv6 without brackets). The id is opaque to clients: compare it for equality, never
        parse or sort it numerically. It is a string so that the backend can later switch to a registered
        server id without changing the contract. Percent-encode it when it is used in a URL path.
      examples: ['10.0.0.11', db1.example.com]
    SetupTaskSummary:
      type: object
      description: |
        Summary of the task started by `initCluster` or `joinCluster`, served by `GET /setup/state` so that the
        wizard needs neither the setup token nor a session to follow it. It is the same task that
        `GET /tasks/{taskId}` returns after sign-in.
      required: [id, kind, state, progressPercent, steps, createdAt, updatedAt, error]
      properties:
        id:
          type: integer
          format: int64
          description: Task identifier.
        steps:
          type: array
          description: The ordered steps of the task with their state, so that the wizard can show where a failure happened.
          items:
            type: object
            description: One step.
            required: [name, state]
            properties:
              name:
                type: string
                description: Human-readable step name (English).
              state:
                type: string
                enum: [pending, running, done, failed]
                description: State of the step.
        createdAt:
          type: string
          format: date-time
          description: When the setup request was accepted.
        updatedAt:
          type: string
          format: date-time
          description: When the task last changed state or progress.
        kind:
          type: string
          enum: [cluster.init, cluster.join]
          description: Which setup operation started the task.
        state:
          $ref: '#/components/schemas/TaskState'
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress (`Task.progress.percent`).
        error:
          oneOf:
            - $ref: '#/components/schemas/TaskError'
            - type: 'null'
          description: Failure information; null unless `state` is `failed`.
        detail:
          type:
            - string
            - 'null'
          description: |
            Added in 0.6.0, optional (absent from a server of an older revision). The same text as `Task.detail`:
            for `cluster.join` the fingerprint of the existing server's certificate that was checked ("pinned") or
            only seen ("first use, not verified"), so that the wizard can show it. Null when the running step
            recorded none.
    NodeStateInfo:
      type: object
      description: Setup state of a server.
      required: [state, address, hostname, version, postgresVersion, setupTokenRequired, localhostOnly, setupTask]
      properties:
        state:
          $ref: '#/components/schemas/NodeState'
        address:
          type: string
          description: Address (host:port) of this server's panel and REST API.
        hostname:
          type: string
          description: Host name of the machine.
        version:
          type: string
          description: KingresDB version.
        commit:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{7,64}$'
          description: Added in 0.8.0 (optional; absent from a server of an older revision). The source commit this server was built from, as 7 to 64 lower-case hexadecimal characters; null when the build does not know it. The panel links the source of the running version to it (the licence, AGPL-3.0-only section 13, asks that users of a network service can get the source). A client must check the pattern before it builds a link.
        postgresVersion:
          type: string
          description: Version of the bundled PostgreSQL.
        setupTokenRequired:
          type: boolean
          description: True while the node is uninitialized and `X-Setup-Token` is needed for setup calls.
        localhostOnly:
          type: boolean
          description: True while the panel listens only on localhost (until the setup token is used).
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server identifier once the server belongs to a cluster; null before.
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier once the server belongs to a cluster; null before.
        setupTask:
          oneOf:
            - $ref: '#/components/schemas/SetupTaskSummary'
            - type: 'null'
          description: |
            Summary of the setup task. Null while no `initCluster` or `joinCluster` request was accepted; set
            from acceptance on, and kept after the task finished and after the node left `uninitialized`.
        internalFingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: |
            Added in 0.6.0, optional. SHA-256 fingerprint of the certificate this server's internal API presents to
            a server that adds it (`addServer`) while it is `uninitialized`: what an administrator pins as
            `AddServerRequest.expectedFingerprint`. It is not a secret (every machine that reaches the internal
            port sees the certificate), but the pin only protects when it comes by another way than the channel
            it protects, so the server answers it only to a request from the machine itself, which is where the
            setup wizard runs (`localhostOnly`); for every other caller, and once the server belongs to a cluster
            (then see `LocalServerInfo.internalFingerprint`), it is null.
    NodeAddress:
      type: string
      description: Address of a server's panel and REST API as host:port, host being a DNS name, IPv4 or bracketed IPv6 address and port a number from 1 to 65535.
      pattern: '^(\[[0-9a-fA-F:]+\]|[A-Za-z0-9.-]+):([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
      examples: ['10.0.0.11:8091']
    DataPaths:
      type: object
      description: Directories used by this server.
      required: [dataDirectory]
      properties:
        dataDirectory:
          type: string
          description: Absolute path under which instance data directories are created. Immutable after initialization.
        walDirectory:
          type:
            - string
            - 'null'
          description: Absolute path for WAL files; null means inside the data directory.
        logDirectory:
          type:
            - string
            - 'null'
          description: Absolute path for log files; null means the system default.
    MemoryQuota:
      type: object
      description: Memory budget of this server.
      required: [totalMegabytes]
      properties:
        totalMegabytes:
          type: integer
          minimum: 512
          description: Total memory in MiB that KingresDB may use on this server; divided among its instances.
    FeatureFlags:
      type: object
      description: Optional engine features. Each can be turned on, never off again.
      required: [sharding, ledger]
      properties:
        sharding:
          type: boolean
          description: The `kingres_shard` extension is enabled.
        ledger:
          type: boolean
          description: The `kingres_ledger` extension is enabled.
    AdminAccount:
      type: object
      description: The first administrator account (a PostgreSQL role in `kingres_admin`).
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: Password, at least 12 characters.
    AdminCredentials:
      type: object
      description: Credentials of an existing cluster administrator.
      required: [username, password]
      properties:
        username:
          type: string
          description: Role name in `kingres_admin`.
        password:
          type: string
          format: password
          writeOnly: true
          description: Role password.
    InitClusterRequest:
      type: object
      description: Settings for creating a new cluster on this server.
      required: [clusterName, admin, dataPaths, memoryQuota]
      properties:
        clusterName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'
          description: Display name of the cluster.
        admin:
          $ref: '#/components/schemas/AdminAccount'
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        features:
          $ref: '#/components/schemas/FeatureFlags'
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          default: 1
          description: Default number of standby copies of every shard group.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
    JoinClusterRequest:
      type: object
      description: Settings for joining this server to an existing cluster.
      required: [existingNodeAddress, admin, dataPaths]
      properties:
        existingNodeAddress:
          $ref: '#/components/schemas/NodeAddress'
        admin:
          $ref: '#/components/schemas/AdminCredentials'
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group (rack or zone) to place this server in.
        advertiseAddress:
          oneOf:
            - $ref: '#/components/schemas/NodeAddress'
            - type: 'null'
          description: Address other servers use to reach this one, if different from its listen address.
        expectedFingerprint:
          type:
            - string
            - 'null'
          description: |
            SHA-256 fingerprint (hex, colons allowed) that the internal certificate of the existing server must
            have. With it, a different certificate is refused before the administrator's password is sent. From
            0.6.0 one of `expectedFingerprint` and `allowUnpinned: true` is required (see there); a malformed
            value is 400 `validation_failed`. Replaces the header `X-Kingres-Pin-Sha256` of 0.3.0, which is
            still accepted; both must agree if both are given. The internal API of a server is at its REST host
            and the port above its REST port. An administrator reads the value on the existing server's panel
            (`internalFingerprint` of `GET /this-server`).
        allowUnpinned:
          type: boolean
          default: false
          description: |
            Added in 0.6.0. Without an `expectedFingerprint` the administrator's user name and password are sent
            to whatever certificate answers at `existingNodeAddress` (trust on first use), where a machine on the
            path receives them. Since 0.6.0 such a request is refused with 400 `validation_failed`
            (`errors[].field` `/expectedFingerprint`, code `required`) unless `allowUnpinned` is true, which is
            the administrator's explicit acceptance of that risk. Ignored when a fingerprint is given.

    # ------------------------------------------------------------------ this server
    ServiceName:
      type: string
      description: A process role inside `kingresd` or a bundled component.
      enum: [api, agent, manager, router, etcd, patroni, metrics]
    ServiceStatus:
      type: object
      description: Status of one service of this server.
      required: [name, state]
      properties:
        name:
          $ref: '#/components/schemas/ServiceName'
        state:
          type: string
          enum: [running, stopped, degraded, disabled]
          description: Service state.
        since:
          type: string
          format: date-time
          description: When the service entered this state.
        detail:
          type: string
          description: Explanation for `degraded` or `stopped`.
    LocalServerInfo:
      type: object
      description: Node-local summary of the server that served the request.
      required: [serverId, address, hostname, version, postgresVersion, nodeState, clusterId, uptimeSeconds, isManagerLeader, services]
      properties:
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server identifier; null unless clustered.
        address:
          type: string
          description: Address (host:port) of this server's REST API.
        hostname:
          type: string
          description: Host name.
        version:
          type: string
          description: KingresDB version.
        postgresVersion:
          type:
            - string
            - 'null'
          description: PostgreSQL version of the managed instance; null when no instance is running.
        nodeState:
          $ref: '#/components/schemas/NodeState'
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null unless clustered.
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds since `kingresd` started.
        isManagerLeader:
          type: boolean
          description: Whether this server currently runs the active manager.
        services:
          type: array
          description: Status of the local services.
          items: { $ref: '#/components/schemas/ServiceStatus' }
        internalFingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: |
            Added in 0.6.0, optional. SHA-256 fingerprint of the certificate this server's internal API presents
            now (its cluster certificate); what an administrator pins as `JoinClusterRequest.expectedFingerprint`
            when another server joins through this one. Null when the server has no certificate. It follows a
            certificate renewal.
    CpuUsage:
      type: object
      description: CPU usage. A value the server cannot measure is null ("not available"), never 0.
      required: [cores, usagePercent]
      properties:
        cores:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Number of logical CPUs; null when not available.
        usagePercent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: Average utilization over the last sampling interval; null when not available.
        loadAverage1m:
          type:
            - number
            - 'null'
          minimum: 0
          description: One-minute load average; null when not available.
    MemoryUsage:
      type: object
      description: Memory usage. A value the server cannot measure is null ("not available"), never 0.
      required: [totalBytes, usedBytes]
      properties:
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Physical memory; null when not available.
        usedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Memory in use; null when not available.
        quotaBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Configured memory quota for KingresDB; null when not available.
    DiskUsage:
      type: object
      description: Usage of one filesystem. A value the server cannot measure is null ("not available"), never 0.
      required: [path, purpose, totalBytes, usedBytes]
      properties:
        path:
          type: string
          description: Mount point or directory.
        purpose:
          type: string
          enum: [data, wal, log, other]
          description: What KingresDB stores there.
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Capacity; null when not available.
        usedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Used space; null when not available.
    ServerResources:
      type: object
      description: Disk, memory and CPU of a server.
      required: [cpu, memory, disks, sampledAt]
      properties:
        cpu:
          $ref: '#/components/schemas/CpuUsage'
        memory:
          $ref: '#/components/schemas/MemoryUsage'
        disks:
          type: array
          description: Filesystems used by KingresDB.
          items: { $ref: '#/components/schemas/DiskUsage' }
        sampledAt:
          type: string
          format: date-time
          description: When the values were sampled.
    InstanceRole:
      type: string
      description: Role of an instance in its shard group.
      enum: [primary, standby]
    Instance:
      type: object
      description: One PostgreSQL instance on a server. It is the primary or a standby of exactly one shard group.
      required: [id, serverId, shardGroupId, isMapGroup, role, state, port]
      properties:
        id:
          type: integer
          format: int32
          description: Instance identifier, equal to `node_id` in `kingres.node`.
        serverId:
          $ref: '#/components/schemas/ServerId'
        shardGroupId:
          type: integer
          format: int32
          minimum: 0
          description: Shard group the instance belongs to, equal to `group_id` in `kingres.node`. The map group has id 0.
        isMapGroup:
          type: boolean
          description: Whether the shard group is the map group (holds the cluster catalog).
        role:
          $ref: '#/components/schemas/InstanceRole'
        state:
          type: string
          enum: [running, starting, stopping, stopped, restarting, failed]
          description: Process state.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: PostgreSQL port of the instance.
        dataDirectory:
          type: string
          description: Data directory of the instance.
        version:
          type: string
          description: PostgreSQL version.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Size of the data directory; null when not available.
        upstreamInstanceId:
          type:
            - integer
            - 'null'
          format: int32
          description: For a standby, the instance it replicates from.
        replicationLagBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: For a standby, WAL bytes behind the primary; null for a primary.
        replicationLagSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: For a standby, replay lag in seconds; null for a primary.
    InstanceList:
      type: object
      description: Instances of a server.
      required: [items]
      properties:
        items:
          type: array
          description: The instances.
          items: { $ref: '#/components/schemas/Instance' }
    InstanceActionRequest:
      type: object
      description: Options of an instance stop or restart.
      properties:
        force:
          type: boolean
          default: false
          description: Proceed even when the instance holds the only up-to-date copy of a shard group.
    LogLevel:
      type: string
      description: Log severity.
      enum: [debug, info, warning, error]
    LogComponent:
      type: string
      description: Source of a log entry.
      enum: [api, agent, manager, router, etcd, patroni, postgres, metrics]
    LocalSettings:
      type: object
      description: Settings of this server only.
      required: [dataPaths, memoryQuota, logLevel, clientPorts, restartRequired]
      properties:
        dataPaths:
          description: |
            The directories of this server. In this answer `walDirectory` and `logDirectory` are always
            present (0.6.0 states it; 0.5.0 left them out when they were not set): `null` means the default
            named in `DataPaths`, otherwise the absolute path. They stay optional in `DataPaths` because
            the setup requests may leave them out.
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        clientPorts:
          type: object
          description: Client ports of the router on this server.
          required: [readWritePort]
          properties:
            readWritePort:
              type: integer
              minimum: 1
              maximum: 65535
              description: Read-write client port.
            readOnlyPort:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 65535
              description: Optional read-only client port; null when disabled.
        restartRequired:
          type: boolean
          description: True when a saved change needs a restart of this server's instances to take effect.
    LocalSettingsUpdate:
      type: object
      description: |
        Partial update of local settings. Only the three members below exist; any other member (for
        example `dataPaths` or `clientPorts`) is refused with 400 `validation_failed`. `memoryQuota` and
        `logDirectory` need a restart of this server's instances (`LocalSettings.restartRequired`),
        `logLevel` does not.
      minProperties: 1
      additionalProperties: false
      properties:
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        logDirectory:
          type:
            - string
            - 'null'
          description: Absolute log directory; null for the system default.
    LeaveClusterRequest:
      type: object
      description: Options of leaving the cluster.
      properties:
        force:
          type: boolean
          default: false
          description: Leave even if the rest of the cluster cannot be reached.
    LogEntry:
      type: object
      description: One log line.
      required: [timestamp, level, component, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the entry was written.
        level:
          $ref: '#/components/schemas/LogLevel'
        component:
          $ref: '#/components/schemas/LogComponent'
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server that wrote the entry.
        instanceId:
          type:
            - integer
            - 'null'
          format: int32
          description: Instance that wrote the entry, for `postgres` and `patroni`.
        message:
          type: string
          description: Log message.
    MissingServer:
      type: object
      description: |
        Added in 0.5.0. A server that did not take part in a cluster-wide answer (`listLogs`, `listAlerts`,
        `queryMetrics`): the receiving server asks every other server for its part in parallel, each with its own
        deadline, and says here which ones it could not use.
      required: [serverId, reason]
      properties:
        serverId:
          $ref: '#/components/schemas/ServerId'
        reason:
          type: string
          description: |
            Why: `timeout` (no answer within the deadline), `unreachable` (the connection failed), `refused` (the
            server answered with an error, for example because it no longer accepts the caller's role) or
            `invalidAnswer` (the answer was too large or not well formed). Clients must tolerate other values.
          enum: [timeout, unreachable, refused, invalidAnswer]
    LogPage:
      type: object
      description: A page of log entries.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Entries, newest first.
          items: { $ref: '#/components/schemas/LogEntry' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        partial:
          type: boolean
          description: Added in 0.5.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.5.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }
    NextCursor:
      type:
        - string
        - 'null'
      description: Cursor for the next page; null when this is the last page.

    # ------------------------------------------------------------------ cluster
    ClusterHealth:
      type: string
      description: Overall health.
      enum: [healthy, degraded, critical]
    ServerStatus:
      type: string
      description: |
        `live` healthy; `suspect` heartbeats are late; `draining` (0.9.0 states what decides it): the server should not hold
        shards (`shouldHaveShards` false) and still runs the primary of at least one shard group that owns buckets, so a
        rebalance has buckets to move away from it; it is `live` again when none is left (the standbys it hosts for other
        groups do not count: a rebalance does not move them); `decommissioning` (0.9.0, it was never set before): its
        removal task (`server.remove`) is running; `dead` no liveness for the failure timeout;

        **Liveness (0.7.0).** Servers send each other a heartbeat every second. A server from which the answering
        server has heard nothing for the suspect timeout (5 s by default) is `suspect`, after the failure timeout
        (10 s by default) `dead`; it comes back to the status the catalog gives it as soon as it is heard again
        (nothing is stored). `suspect` and `dead` therefore depend on **the answering server's own view**: two
        servers can differ for a moment, and a server cut off from the others shows them all as dead. The counts
        of `ClusterOverview` and the list of `listServers` come from the same snapshot on the answering server and
        always agree.
        `pendingRebalance` joined but holds no data yet.

        `pendingRebalance` (0.6.0 states what decides it): the server should hold shards, it is the primary of no
        bucket, and buckets exist in the cluster. The replicas of a neighbouring group's buckets that a joining
        server gets a standby for do not count as data; the same server was `live` in one answer and
        `pendingRebalance` in the next while that copy was still running. Every server answers the same for the
        same catalog, except for `suspect` and `dead` (see liveness).
      enum: [live, suspect, draining, decommissioning, dead, pendingRebalance]
    ServerCounts:
      type: object
      description: Number of servers per status.
      required: [total, live, suspect, draining, decommissioning, dead, pendingRebalance]
      properties:
        total:
          type: integer
          minimum: 0
          description: All servers.
        live:
          type: integer
          minimum: 0
          description: Servers with status `live`.
        suspect:
          type: integer
          minimum: 0
          description: Servers with status `suspect`.
        draining:
          type: integer
          minimum: 0
          description: Servers with status `draining`.
        decommissioning:
          type: integer
          minimum: 0
          description: Servers with status `decommissioning`.
        dead:
          type: integer
          minimum: 0
          description: Servers with status `dead`.
        pendingRebalance:
          type: integer
          minimum: 0
          description: Servers with status `pendingRebalance`.
    BucketCounts:
      type: object
      description: Bucket totals over all colocation groups.
      required: [total, underReplicated, unavailable, moving, orphan]
      properties:
        total:
          type: integer
          minimum: 0
          description: All buckets.
        underReplicated:
          type: integer
          minimum: 0
          description: Buckets with fewer live copies than the replica count.
        unavailable:
          type: integer
          minimum: 0
          description: Buckets with no live primary.
        moving:
          type: integer
          minimum: 0
          description: Buckets in state `moving`.
        orphan:
          type: integer
          minimum: 0
          description: Buckets in state `orphan` (left-over shards awaiting cleanup).
    RebalanceReason:
      type: string
      description: Why a rebalance is needed.
      enum: [serverAdded, serverRemoved, replicaCountChanged, replicasMissing, skewed, serverGroupChanged]
    ClusterSummary:
      type: object
      description: Short cluster summary for statistics-only accounts. Null means "not available".
      required: [clusterId, name, health, serverCount, databaseCount, openAlerts]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null when the node state carries no cluster identity.
        name:
          type:
            - string
            - 'null'
          description: Cluster name; null when the node state carries no cluster identity.
        health:
          $ref: '#/components/schemas/ClusterHealth'
        serverCount:
          type: integer
          minimum: 0
          description: Number of servers.
        databaseCount:
          type: integer
          minimum: 0
          description: Number of user databases.
        openAlerts:
          type: integer
          minimum: 0
          description: Number of open alerts; 0 when the alert system is not available.
    ClusterOverview:
      type: object
      description: Cluster-wide health summary.
      required: [clusterId, name, health, version, mapVersion, mapGroupAvailable, managerLeader, servers, buckets, databaseCount, rebalance, autoFailover, openAlerts, features, updatedAt]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null when the node state carries no cluster identity.
        name:
          type:
            - string
            - 'null'
          description: Cluster name; null when the node state carries no cluster identity.
        health:
          $ref: '#/components/schemas/ClusterHealth'
        version:
          type: string
          description: KingresDB version of the cluster.
        mapVersion:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic version of the bucket map.
        mapGroupAvailable:
          type: boolean
          description: False while the map group is failing over; topology changes are paused.
        managerLeader:
          oneOf:
            - type: object
              description: The elected manager.
              required: [serverId, address]
              properties:
                serverId:
                  $ref: '#/components/schemas/ServerId'
                address:
                  type: string
                  description: Address of that server.
                since:
                  type: string
                  format: date-time
                  description: When it became leader.
            - type: 'null'
          description: The manager leader; null while an election is in progress.
        servers:
          $ref: '#/components/schemas/ServerCounts'
        buckets:
          $ref: '#/components/schemas/BucketCounts'
        databaseCount:
          type: integer
          minimum: 0
          description: Number of user databases.
        rebalance:
          type: object
          description: Rebalance summary.
          required: [needed, reasons, running, taskId]
          properties:
            needed:
              type: boolean
              description: Whether the current placement differs from the target placement.
            reasons:
              type: array
              description: Reasons a rebalance is needed.
              items: { $ref: '#/components/schemas/RebalanceReason' }
            running:
              type: boolean
              description: Whether a rebalance is running.
            taskId:
              type:
                - integer
                - 'null'
              format: int64
              description: Task of the running rebalance.
        failover:
          type: object
          description: Added in 0.10.0, optional. Whether a failover is running, as `rebalance` does for a rebalance.
          required: [running]
          properties:
            running:
              type: boolean
            taskId:
              type:
                - integer
                - 'null'
              format: int64
            serverId:
              type:
                - string
                - 'null'
            phase:
              type:
                - string
                - 'null'
        autoFailover:
          type: object
          description: Auto-failover summary.
          required: [enabled, eventsSinceReset, maxCount]
          properties:
            enabled:
              type: boolean
              description: Whether auto-failover is enabled.
            eventsSinceReset:
              type: integer
              minimum: 0
              description: Automatic failovers since the last reset (a rebalance resets it).
            maxCount:
              type: integer
              minimum: 1
              description: Maximum automatic failovers before manual intervention is required.
            limitReached:
              type: boolean
              description: Added in 0.10.0, optional. True when `eventsSinceReset` has reached `maxCount`.
            lastEventAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Added in 0.10.0, optional. When the last automatic failover was made.
        openAlerts:
          type: object
          description: Number of open alerts per severity.
          required: [critical, warning, info]
          properties:
            critical:
              type: integer
              minimum: 0
              description: Open critical alerts.
            warning:
              type: integer
              minimum: 0
              description: Open warning alerts.
            info:
              type: integer
              minimum: 0
              description: Open info alerts.
        features:
          $ref: '#/components/schemas/FeatureFlags'
        updatedAt:
          type: string
          format: date-time
          description: When this summary was computed.

    # ------------------------------------------------------------------ servers
    ServerResourceSummary:
      type: object
      description: Compact resource usage of a server. A value the server cannot measure is null ("not available"), never 0.
      required: [cpuUsagePercent, memoryUsedBytes, memoryTotalBytes, diskUsedBytes, diskTotalBytes]
      properties:
        cpuUsagePercent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: CPU utilization; null when not available.
        memoryUsedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Memory in use; null when not available.
        memoryTotalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Physical memory; null when not available.
        diskUsedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Used space on the data filesystem; null when not available.
        diskTotalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Capacity of the data filesystem; null when not available.
    BucketHolding:
      type: object
      description: Number of buckets held as primary and as replica.
      required: [primary, replica]
      properties:
        primary:
          type: integer
          minimum: 0
          description: Buckets for which this server hosts the primary copy.
        replica:
          type: integer
          minimum: 0
          description: Buckets for which this server hosts a replica copy.
    Server:
      type: object
      description: A machine in the cluster, defined as one distinct host of the `kingres.node` catalog. Values the backend does not know yet are null ("not available"), never invented zeros.
      required: [id, address, hostname, status, serverGroup, shouldHaveShards, isManagerLeader, version, uptimeSeconds, joinedAt, lastHeartbeatAt, certificateExpiresAt, seenFingerprint, fingerprintPinned, instances, buckets, sizeBytes, resources]
      properties:
        certificateRevokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Added in 0.5.0, optional. When the certificates of this server were revoked (`revokeServerCertificates`); absent or null when they were not. A server with revoked certificates cannot take part in the cluster until it is removed and joined again.
        id:
          $ref: '#/components/schemas/ServerId'
        address:
          type: string
          description: Address (host:port) of the server's REST API.
        hostname:
          type: string
          description: Host name.
        status:
          $ref: '#/components/schemas/ServerStatus'
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group (rack or zone) name.
        shouldHaveShards:
          type: boolean
          description: Whether rebalance may place buckets on this server; false drains it.
        weight:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          description: 'Added in 0.15.0, optional (absent when the sharding extension has no weights). The capacity of the server relative to the others (default 1).'
        isManagerLeader:
          type: boolean
          description: Whether the active manager runs here.
        version:
          type:
            - string
            - 'null'
          description: KingresDB version of that server; null when the server cannot know it (a remote server whose version has not been reported).
        uptimeSeconds:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Seconds since `kingresd` started; null when not available (the server's agent is not reachable). Since 0.6.0 every server that answers the manager's question has one, not only the server that served the request.
        joinedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the server joined the cluster (the manager leader's record); null when not available. Set for every server of a cluster since 0.6.0 (it was always null before).
        lastHeartbeatAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Last heartbeat the answering server heard from this server (0.7.0 and later; the heartbeats go between all servers, not to the manager); null when it has heard none, and for the answering server itself.
        certificateExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            `notAfter` of the server certificate the cluster issued to this server (the one its internal API
            presents); null when not available (the certificate has not been read, for example the server is
            unreachable and the leader holds no copy). The alert kind `certificateExpiring` is raised from it.
        seenFingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: |
            SHA-256 fingerprint of the bootstrap certificate this server presented when it was added or joined
            (the value recorded on first contact, 64 lower-case hex characters, no colons; the same value
            as in `Task.detail` of `server.add`). Null when no first contact was recorded: the server that
            created the cluster, and servers added before this property existed.
        fingerprintPinned:
          type: boolean
          description: |
            True when the fingerprint was checked against an expected one given by the operator
            (`expectedFingerprint` or the `X-Kingres-Pin-Sha256` header) before the server was trusted; false
            for trust on first use and whenever `seenFingerprint` is null.
        instances:
          type: array
          description: Instances on this server with role, shard group, port and lag.
          items: { $ref: '#/components/schemas/Instance' }
        buckets:
          $ref: '#/components/schemas/BucketHolding'
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Data size on this server; null when not available.
        replicationLagMaxSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: Largest replay lag of any standby on this server.
        resources:
          $ref: '#/components/schemas/ServerResourceSummary'
    DatabaseBucketCount:
      type: object
      description: Buckets of one database held by a server.
      required: [databaseName, primaryBuckets, replicaBuckets, primarySizeBytes, replicaSizeBytes]
      properties:
        databaseName:
          type: string
          description: Database name.
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets with their primary copy on the server.
        replicaBuckets:
          type: integer
          minimum: 0
          description: Buckets with a replica copy on the server.
        primarySizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of primary copies; null when bucket sizes are not available.
        replicaSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of replica copies; null when bucket sizes are not available.
    ServerDetail:
      description: A server with its bucket counts per database.
      allOf:
        - $ref: '#/components/schemas/Server'
        - type: object
          required: [bucketsByDatabase]
          properties:
            bucketsByDatabase:
              type: array
              description: Bucket counts per database.
              items: { $ref: '#/components/schemas/DatabaseBucketCount' }
    ServerList:
      type: object
      description: All servers.
      required: [items]
      properties:
        items:
          type: array
          description: The servers.
          items: { $ref: '#/components/schemas/Server' }
    AddServerRequest:
      type: object
      description: A server to add.
      required: [address, setupToken]
      properties:
        address:
          $ref: '#/components/schemas/NodeAddress'
        setupToken:
          type: string
          writeOnly: true
          minLength: 1
          description: The new server's one-time setup token.
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group to place the server in.
        expectedFingerprint:
          type:
            - string
            - 'null'
          description: |
            SHA-256 fingerprint (hex, colons allowed) that the bootstrap certificate of the new server must have
            (the server logs it at start). With it, a different certificate is refused before the setup token is
            sent. From 0.6.0 one of `expectedFingerprint` and `allowUnpinned: true` is required (see there). A
            malformed value is 400 `validation_failed` on every server, also when the request is sent to a server
            that is not the manager leader, and the pin is kept on the way to the leader. Replaces the header
            `X-Kingres-Pin-Sha256` of 0.3.0, which is still accepted; both must agree if both are given. The
            internal API of the new server is at its REST host and the port above its REST port. The new server
            shows the value in `GET /node` (`internalFingerprint`) on its own panel.
        allowUnpinned:
          type: boolean
          default: false
          description: |
            Added in 0.6.0. Without an `expectedFingerprint` the first contact trusts whatever certificate answers
            at `address` (trust on first use): a machine on the path then receives the setup token and a
            certificate of the cluster. Since 0.6.0 such a request is refused with 400 `validation_failed`
            (`errors[].field` `/expectedFingerprint`, code `required`) unless `allowUnpinned` is true, which
            is the administrator's explicit acceptance of that risk. Ignored when a fingerprint is given.
    ServerUpdateRequest:
      type: object
      description: |
        Partial update of a server. Only these three members exist (`weight` since 0.15.0); every other property of `Server` is
        read-only and is refused with 400 `validation_failed`.
      minProperties: 1
      additionalProperties: false
      properties:
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group name; null removes the server from its group. The group must exist (422 `unprocessable` otherwise).
        shouldHaveShards:
          type: boolean
          description: False excludes the server from bucket placement at the next rebalance.
        weight:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          description: 'Added in 0.15.0. The capacity of the server relative to the others (default 1): a server of weight 2 receives twice the buckets, or bytes, of one of weight 1. A change is written to every node of the server and shows at the next rebalance; it needs the sharding extension 0.8 (422 `unsupported_operation` otherwise).'
    FailoverRequest:
      type: object
      description: Failover options. Members after `mode` were added in 0.10.0 and are optional.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [hard, graceful]
          description: '`graceful` is the planned switchover: it waits for standbys to catch up (server must be live); `hard` promotes immediately and can lose async writes.'
        shardGroupIds:
          type: array
          minItems: 1
          description: The groups whose primary runs on the server that are failed over. Default all of them.
          items: { type: integer, format: int32, minimum: 0 }
        targets:
          type: array
          description: The standby to promote, per group. Default the standby that holds the most WAL.
          items: { $ref: '#/components/schemas/FailoverTarget' }
        allowDataLoss:
          type: boolean
          default: false
          description: The operator accepts the loss the plan states. A failover whose verdict is not `none` is refused with 409 `failover_needs_decision` without it. Ignored by a switchover.
        dryRun:
          type: boolean
          default: false
          description: Compute and answer the plan (200 `FailoverPlan`); change nothing.
        comment:
          type: string
          minLength: 0
          maxLength: 500
          description: Recorded in the audit event.
    FailoverTarget:
      type: object
      description: The standby to promote for one group.
      required: [shardGroupId, serverId]
      properties:
        shardGroupId:
          type: integer
          format: int32
          minimum: 0
        serverId:
          $ref: '#/components/schemas/ServerId'
    RestorePreferredPrimariesRequest:
      type: object
      description: Added in 0.10.0. Options of `restorePreferredPrimaries`; every member is optional.
      properties:
        shardGroupIds:
          type: array
          minItems: 1
          items: { type: integer, format: int32, minimum: 0 }
          description: Restore only these groups.
        dryRun:
          type: boolean
          default: false
          description: Answer the plan and change nothing.
    FailoverPlan:
      type: object
      description: Added in 0.10.0. What a failover or restore would do, answered for `dryRun` and carried by the 409 `failover_needs_decision`.
      required: [generatedAt, kind, mode, serverId, canProceed, blockers, willStopRebalance, groups]
      properties:
        generatedAt: { type: string, format: date-time }
        kind: { type: string, enum: [failover, restorePreferredPrimaries] }
        mode: { type: string, enum: [hard, graceful, restore] }
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server that is failed over; null for a restore.
        canProceed:
          type: boolean
          description: Whether the request would be accepted as it is (blockers that `allowDataLoss` lifts are listed and make this false).
        blockers:
          type: array
          items: { $ref: '#/components/schemas/FailoverBlocker' }
        willStopRebalance:
          type: boolean
        groups:
          type: array
          items: { $ref: '#/components/schemas/FailoverGroupPlan' }
    FailoverBlocker:
      type: object
      description: Why a failover cannot proceed as asked.
      required: [code, shardGroupId, message]
      properties:
        code:
          type: string
          description: The problem code the request would get, or `failoverNeedsDecision`.
        shardGroupId:
          type: [integer, 'null']
          format: int32
        message: { type: string }
    AbandonMapGroupBootstrapRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the bootstrap is given up; it is kept in the journal of the bootstrap and in the audit event.
        lostServerId:
          $ref: '#/components/schemas/ServerId'
          description: |
            Added in 0.28.0. The operator declares that this server, to which the map group was handed (a hard failover of a live leader's server or a planned
            switchover), is lost. It must not be heard by the cluster (409 `conflict` otherwise). The old leader then ends the hold of its primary without the word of that
            server, when the hold was made for it (or has no record), every other server answers, none runs a bootstrap that names the old leader and none was promoted;
            what the lost server may have promoted and acknowledged before it was lost is accepted with the declaration. A new request for the failover may then choose
            another standby. It is part of the audit event.
    AbandonMapGroupBootstrapResult:
      type: object
      required: [abandoned]
      properties:
        abandoned:
          type: boolean
          description: True when a bootstrap was in progress and is given up; false when none was.
        resumedServerId:
          $ref: '#/components/schemas/ServerId'
          description: The server whose primary of the map group, held back for a planned switchover, was started again by this call; absent when none was.
    FailoverGroupPlan:
      type: object
      description: The plan for one group.
      required: [shardGroupId, isMapGroup, fromServerId, toServerId, candidates, dataLoss, estimatedSeconds, writesPausedSeconds, steps, movesTheManager]
      properties:
        shardGroupId: { type: integer, format: int32, minimum: 0 }
        isMapGroup: { type: boolean }
        fromServerId: { $ref: '#/components/schemas/ServerId' }
        toServerId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Null when no candidate qualifies.
        candidates:
          type: array
          items: { $ref: '#/components/schemas/FailoverCandidate' }
        dataLoss: { $ref: '#/components/schemas/DataLossAssessment' }
        estimatedSeconds: { type: [integer, 'null'] }
        writesPausedSeconds:
          type: [integer, 'null']
          description: Only for a switchover.
        steps:
          type: array
          description: The step names, English.
          items: { type: string }
        movesTheManager:
          type: boolean
          description: True for the map group.
        skipped:
          type: object
          description: |
            Added in 0.18.0. Present only for a group that a `restorePreferredPrimaries` leaves alone (the plan then has `toServerId` null, no
            candidates and no steps). The report lists the same group as `skipped` with the same reason.
          required: [reason, message]
          properties:
            reason:
              type: string
              enum: [preferredNotReady, mapGroup]
              description: '`preferredNotReady`: the preferred server has no ready, registered standby of the group. `mapGroup`: reserved; the map group is restored like any group since 0.18.0 and is skipped with `preferredNotReady` when its preferred server has no ready standby of it.'
            message: { type: string }
    FailoverCandidate:
      type: object
      description: A standby that could be promoted.
      required: [serverId, standbyId, readable, eligible, ineligibleReason, receiveLsn, replayLsn, lagBytes, syncState, chosen]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        standbyId: { type: integer, format: int64 }
        readable: { type: boolean, description: Whether its position could be read. }
        eligible: { type: boolean }
        ineligibleReason: { type: [string, 'null'] }
        receiveLsn: { type: [string, 'null'], description: 'Flushed WAL position, PostgreSQL X/Y form.' }
        replayLsn: { type: [string, 'null'] }
        lagBytes: { type: [integer, 'null'], format: int64, description: Against the last position of the primary the leader knew. }
        syncState:
          oneOf:
            - $ref: '#/components/schemas/ReplicationSyncState'
            - type: 'null'
        chosen: { type: boolean }
    DataLossAssessment:
      type: object
      description: What a failover of one group can lose.
      required: [verdict, message, lastKnownPrimaryLsn, chosenReceiveLsn, lastKnownAgeSeconds, groupRanWithoutSynchronousStandby, asyncDatabases, unreadableServerIds]
      properties:
        verdict:
          type: string
          enum: [none, asyncOnly, possible, unknown]
          description: '`none`: every ready standby was read, the best is the one chosen and the group streamed a synchronous standby (or every database is `async`). `asyncOnly`: only commits acknowledged under `async` can be lost. `possible`: the group ran without its synchronous standby, or the target is behind the best. `unknown`: a ready standby could not be read.'
        message: { type: string }
        lastKnownPrimaryLsn: { type: [string, 'null'] }
        chosenReceiveLsn: { type: [string, 'null'] }
        lastKnownAgeSeconds: { type: [integer, 'null'] }
        groupRanWithoutSynchronousStandby: { type: boolean }
        asyncDatabases:
          type: array
          items: { type: string }
        unreadableServerIds:
          type: array
          items: { $ref: '#/components/schemas/ServerId' }
    FailoverStatus:
      type: object
      description: Added in 0.10.0. Current failover state.
      required: [state, needsDecision, groups, cancellable, lastReport]
      properties:
        state: { type: string, enum: [idle, running, paused, failed] }
        phase:
          type: [string, 'null']
          description: 'One of `checking`, `waitingForLease`, `choosing`, `promoting`, `followingCatalog`, `repointing`, `finishing`, and for a switchover `quiescing`, `waitingForTransactions`, `stopping`, `verifying`; `bootstrap` for the map group. Clients must tolerate other values.'
        kind: { type: [string, 'null'], enum: [failover, restorePreferredPrimaries, null] }
        trigger: { type: [string, 'null'], enum: [manual, automatic, null] }
        taskId: { type: [integer, 'null'], format: int64 }
        serverId: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        pausedReason: { type: [string, 'null'] }
        needsDecision:
          type: array
          items: { $ref: '#/components/schemas/FailoverBlocker' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/FailoverGroupProgress' }
        cancellable: { type: boolean }
        lastReport:
          oneOf:
            - $ref: '#/components/schemas/FailoverReportSummary'
            - type: 'null'
    FailoverGroupProgress:
      type: object
      required: [shardGroupId, state, fromServerId]
      properties:
        shardGroupId: { type: integer, format: int32, minimum: 0 }
        state: { type: string, enum: [pending, frozen, fenced, pinned, promoted, done, failed, skipped] }
        phase: { type: [string, 'null'] }
        fromServerId: { $ref: '#/components/schemas/ServerId' }
        toServerId: { type: [string, 'null'] }
        writesPausedSince: { type: [string, 'null'], format: date-time }
        message: { type: [string, 'null'] }
    FailoverReportSummary:
      type: object
      required: [id, kind, trigger, serverId, outcome, startedAt, finishedAt, requestedBy, totals, dataLossPossible, error]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [failover, restorePreferredPrimaries] }
        trigger: { type: string, enum: [manual, automatic] }
        serverId: { type: [string, 'null'] }
        outcome: { type: string, enum: [completed, completedWithWarnings, partial, failed, cancelled, paused] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        requestedBy: { type: string }
        totals:
          type: object
          required: [groupsTotal, groupsDone, groupsFailed, groupsSkipped, durationSeconds]
          properties:
            groupsTotal: { type: integer, minimum: 0 }
            groupsDone: { type: integer, minimum: 0 }
            groupsFailed: { type: integer, minimum: 0 }
            groupsSkipped: { type: integer, minimum: 0 }
            durationSeconds: { type: integer, minimum: 0 }
        dataLossPossible: { type: boolean }
        error: { type: [string, 'null'] }
    FailoverReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Summaries, newest first.
          items: { $ref: '#/components/schemas/FailoverReportSummary' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    FailoverReport:
      description: The full report of one run.
      allOf:
        - $ref: '#/components/schemas/FailoverReportSummary'
        - type: object
          required: [mode, options, groups, events]
          properties:
            mode: { type: string, enum: [hard, graceful, restore] }
            options: { $ref: '#/components/schemas/FailoverRequest' }
            groups:
              type: array
              items: { $ref: '#/components/schemas/FailoverGroupReport' }
            events:
              type: array
              items: { $ref: '#/components/schemas/FailoverEvent' }
    FailoverGroupReport:
      type: object
      required: [shardGroupId, outcome, skipReason, fromServerId, toServerId, termBefore, termAfter, timeline, leaseWaitMs, durationSeconds, candidates, dataLoss, unreachedServerIds, incidents, oldPrimary, error]
      properties:
        shardGroupId: { type: integer, format: int32, minimum: 0 }
        outcome: { type: string, enum: [done, failed, skipped, pending] }
        skipReason: { type: [string, 'null'] }
        fromServerId: { $ref: '#/components/schemas/ServerId' }
        toServerId: { type: [string, 'null'] }
        termBefore: { type: [integer, 'null'], format: int64 }
        termAfter: { type: [integer, 'null'], format: int64 }
        timeline: { type: [integer, 'null'], format: int64 }
        leaseWaitMs: { type: [integer, 'null'] }
        durationSeconds: { type: integer, minimum: 0 }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/FailoverCandidate' }
        dataLoss: { $ref: '#/components/schemas/DataLossAssessment' }
        unreachedServerIds:
          type: array
          items: { $ref: '#/components/schemas/ServerId' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/FailoverIncident' }
        oldPrimary: { $ref: '#/components/schemas/OldPrimaryReport' }
        error: { type: [string, 'null'] }
    FailoverIncident:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: The extension's names, for example `prepared_rolled_back_after_failover`, `participant_lost_committed_transaction`, `foreign_prepared_transaction`.
        message: { type: string }
    OldPrimaryReport:
      type: object
      required: [state, method, divergenceBytes, rewindBytes, message]
      properties:
        state: { type: string, enum: [notScheduled, rebuildScheduled, rebuilding, standby, waitingForServer, removed, failed], description: '`notScheduled`: no rebuild of the old primary is scheduled for the group (for a record of an earlier revision of kingresd that never rebuilt it, and for a group whose old primary has no directory to rebuild); it stays stopped and fenced until an operator acts. From 0.12.0 kingresd rebuilds the old primary of an ordinary group by itself (`rebuildScheduled`, `rebuilding`, `standby`).' }
        method: { type: [string, 'null'], enum: [clean, pgRewind, baseBackup, null] }
        divergenceBytes: { type: [integer, 'null'], format: int64, description: 'What the old primary wrote after the point where the histories parted (the writes that were discarded), at least: the distance to its shutdown checkpoint, whose own record is not counted. Zero when its WAL ends before that point. Null when the instance had not finished its crash recovery and the end of its WAL could not be told (then `message` says so), and for a base backup.' }
        rewindBytes: { type: [integer, 'null'], format: int64 }
        message: { type: [string, 'null'] }
    FailoverEvent:
      type: object
      required: [at, shardGroupId, step, kind, message]
      properties:
        at: { type: string, format: date-time }
        shardGroupId: { type: [integer, 'null'], format: int32 }
        step: { type: string }
        kind: { type: string }
        message: { type: string }
    FailoverReadiness:
      type: object
      description: Added in 0.10.0. Whether a failover of the group would be possible now, computed by the leader from its last standby check and the liveness view without a network call per request; never `possible` while a failover runs.
      required: [possible, candidateServerId, dataLossVerdict, blockers, checkedAt]
      properties:
        possible: { type: boolean }
        candidateServerId: { type: [string, 'null'] }
        dataLossVerdict: { type: [string, 'null'], enum: [none, asyncOnly, possible, unknown, null] }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/FailoverBlocker' }
        checkedAt: { type: string, format: date-time }
    ServerGroup:
      type: object
      description: A rack or zone.
      required: [name, serverIds]
      properties:
        name:
          type: string
          description: Group name.
        description:
          type: string
          description: Free text.
        serverIds:
          type: array
          description: Member servers.
          items: { $ref: '#/components/schemas/ServerId' }
    ServerGroupCreateRequest:
      type: object
      description: A new server group.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'
          description: Unique name (exact, case-sensitive comparison); an existing name is 409 `already_exists`, a name that does not match the pattern is 400 `validation_failed`.
        description:
          type: string
          maxLength: 200
          description: Free text.
    ServerGroupList:
      type: object
      description: All server groups.
      required: [items]
      properties:
        items:
          type: array
          description: The groups.
          items: { $ref: '#/components/schemas/ServerGroup' }

    # ------------------------------------------------------------------ databases
    Durability:
      type: string
      description: |
        Commit durability. `async` maps to `synchronous_commit = local` (a commit waits only for the
        local flush), `sync` to `on` (it waits until a quorum of synchronous standbys has flushed the
        commit to disk), and `syncApply` to `remote_apply` (it also waits until those standbys have
        applied it, so a read on them sees the commit).
      enum: [async, sync, syncApply]
      default: sync
    LedgerMode:
      type: string
      description: |
        `off` no ledger; `optIn` tables choose ledger individually; `appendOnly` or `updatable` make every
        new table a ledger table of that type.
      enum: [off, optIn, appendOnly, updatable]
    DatabaseStatus:
      type: string
      description: Lifecycle status of a database.
      enum: [creating, ready, dropping, failed]
    DatabaseGeneral:
      type: object
      description: General settings as read back. Per-database settings the backend cannot determine yet are null ("not available").
      required: [owner, encoding, lcCollate, lcCtype, connectionLimit]
      properties:
        owner:
          type:
            - string
            - 'null'
          description: Owner role. Can be changed later. Null when not available.
        encoding:
          type:
            - string
            - 'null'
          description: Character set encoding, for example `UTF8`. Immutable after creation. Null when not available.
          x-immutable: true
        lcCollate:
          type:
            - string
            - 'null'
          description: Collation locale. Immutable after creation. Null when not available.
          x-immutable: true
        lcCtype:
          type:
            - string
            - 'null'
          description: Character classification locale. Immutable after creation. Null when not available.
          x-immutable: true
        connectionLimit:
          type:
            - integer
            - 'null'
          minimum: -1
          description: Maximum concurrent connections; -1 is unlimited. Can be changed later. Null when not available.
    DatabaseGeneralCreate:
      type: object
      description: General settings for a new database; omitted fields take server defaults.
      properties:
        owner:
          type: string
          description: Owner role; defaults to the caller.
        encoding:
          type: string
          default: UTF8
          description: Character set encoding.
        lcCollate:
          type: string
          description: Collation locale; defaults to the cluster default.
        lcCtype:
          type: string
          description: Character classification locale; defaults to the cluster default.
        connectionLimit:
          type: integer
          minimum: -1
          default: -1
          description: Maximum concurrent connections; -1 is unlimited.
    ShardingSettings:
      type: object
      description: Sharding settings as read back (response only; the create request uses `ShardingCreateSettings`).
      required: [enabled, bucketCount]
      properties:
        enabled:
          type: boolean
          description: Whether tables of this database can be distributed. Can be turned on later, never off.
        bucketCount:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 4096
          description: Number of hash buckets per colocation group. Fixed at creation (immutable). Null when not available, and in mode `schema`.
          x-immutable: true
        mode:
          $ref: '#/components/schemas/ShardingMode'
        distributeNewSchemas:
          type: boolean
          description: Added in 0.15.0, optional. Whether a schema created in the database is placed on a shard group by itself.
    ShardingMode:
      type: string
      description: 'Added in 0.15.0. How tables are sharded: `row` (the default; a table is split into buckets by a column), `schema` (each schema lives in one shard group) or `both`. Clients must tolerate other values.'
      enum: [row, schema, both]
    ShardingCreateSettings:
      type: object
      description: Sharding settings of a create request. A group that is present must be complete.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether tables of this database can be distributed. Can be turned on later, never off.
        bucketCount:
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
          description: Number of hash buckets per colocation group, 1 to 4096, default 128. Fixed at creation (immutable). Optional since 0.15.0 (it was required) and ignored in mode `schema`.
          x-immutable: true
        mode:
          $ref: '#/components/schemas/ShardingMode'
        distributeNewSchemas:
          type: boolean
          default: false
          description: Added in 0.15.0. Place every schema created in the database on a shard group. Only with mode `schema` or `both`.
    ReplicationSettings:
      type: object
      description: Replication settings as read back (response only; the create request uses `ReplicationCreateSettings`).
      required: [durability, replicaCount]
      properties:
        durability:
          oneOf:
            - $ref: '#/components/schemas/Durability'
            - type: 'null'
          description: Commit durability of the database; null when not available.
        replicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Current cluster-wide replica count, shown for information. It is a cluster setting (physical
            replication copies whole instances); change it with PATCH /settings/cluster. It does not exist
            in any request schema.
    ReplicationCreateSettings:
      type: object
      description: Replication settings of a create request. The replica count is a cluster setting and cannot be given here.
      required: [durability]
      properties:
        durability:
          $ref: '#/components/schemas/Durability'
    LedgerSettings:
      type: object
      description: Ledger settings as read back (response only; the create request uses `LedgerCreateSettings`).
      required: [mode, digestIntervalSeconds]
      properties:
        mode:
          oneOf:
            - $ref: '#/components/schemas/LedgerMode'
            - type: 'null'
          description: Ledger mode; null when not available.
        digestIntervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 60
          maximum: 86400
          description: How often a block is closed and a digest generated automatically; null when not available.
    LedgerCreateSettings:
      type: object
      description: Ledger settings of a create request. A group that is present must be complete.
      required: [mode, digestIntervalSeconds]
      properties:
        mode:
          $ref: '#/components/schemas/LedgerMode'
        digestIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: How often a block is closed and a digest generated automatically.
    DatabaseStats:
      type: object
      description: Live statistics of a database. A statistic the backend cannot measure is null ("not available"), never 0.
      required: [sizeBytes, tableCount, activeConnections, transactionsPerSecond]
      properties:
        distributedSchemaCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Added in 0.15.0, optional. Distributed schemas; null when not available.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Total size over all shard groups (primary copies); null when not available.
        tableCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of user tables; null when not available.
        activeConnections:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Current connections; null when not available.
        transactionsPerSecond:
          type:
            - number
            - 'null'
          minimum: 0
          description: Committed transactions per second (recent average); null when not available.
    DatabaseHealth:
      type: object
      description: Replication health of a database. Null counters mean "not available" (no bucket map yet), never 0.
      required: [underReplicatedBuckets, unavailableBuckets]
      properties:
        underReplicatedBuckets:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Buckets with fewer live copies than the replica count; null when not available.
        unavailableBuckets:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Buckets with no live primary; null when not available.
    LedgerVerificationState:
      type: string
      description: '`never` not verified yet; `running` a verification is in progress; `passed` the last verification found nothing; `failed` the last verification found inconsistencies.'
      enum: [never, running, passed, failed]
    Database:
      type: object
      description: A database with its four settings groups and live statistics.
      required: [name, status, general, sharding, replication, ledger, stats, health, ledgerSummary, rebalanceRequired, createdBy, createdAt]
      properties:
        name:
          type: string
          description: Database name. Immutable.
          x-immutable: true
        status:
          $ref: '#/components/schemas/DatabaseStatus'
        general:
          $ref: '#/components/schemas/DatabaseGeneral'
        sharding:
          $ref: '#/components/schemas/ShardingSettings'
        replication:
          $ref: '#/components/schemas/ReplicationSettings'
        ledger:
          $ref: '#/components/schemas/LedgerSettings'
        stats:
          $ref: '#/components/schemas/DatabaseStats'
        health:
          $ref: '#/components/schemas/DatabaseHealth'
        ledgerSummary:
          type: object
          description: Ledger status summary.
          required: [verificationState, lastVerifiedBlockHeight]
          properties:
            verificationState:
              oneOf:
                - $ref: '#/components/schemas/LedgerVerificationState'
                - type: 'null'
              description: Verification state; null when not available (as opposed to `never`, which means the database was never verified).
            lastVerifiedBlockHeight:
              type:
                - integer
                - 'null'
              format: int64
              description: Highest verified block height (minimum over chains); null if never verified.
            complete:
              type: boolean
              description: 'Added in 0.9.0, optional. The coverage of the summary, with the meaning of `LedgerStatus.complete`: true when the summary covers the chains of every shard group of the database, false when the answering server knows only the chains of its own group; then `uncoveredShardGroupIds` lists the others.'
            uncoveredShardGroupIds:
              type: array
              description: Added in 0.9.0, optional. The shard groups whose chains the summary does not cover (empty when `complete`).
              items: { type: integer, format: int32, minimum: 0 }
        approximateAggregates:
          type: object
          description: 'Added in 0.17.0, optional. The approximate-aggregates setting (`GET /databases/{databaseName}/approximate-aggregates` has the state of every server).'
          required: [enabled, countDistinct]
          properties:
            enabled: { type: boolean }
            countDistinct: { type: string, enum: [exact, approximate] }
        rebalanceRequired:
          type: boolean
          description: Whether this database's buckets need rebalancing.
        createdBy:
          type:
            - string
            - 'null'
          description: Role that created the database; null when not recorded (databases created outside the control plane).
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Creation time; null when not recorded (databases created outside the control plane).
    DatabaseList:
      type: object
      description: All databases.
      required: [items]
      properties:
        items:
          type: array
          description: The databases.
          items: { $ref: '#/components/schemas/Database' }
    DatabaseCreateRequest:
      type: object
      description: A new database. A settings group that is present must be complete; an omitted group takes cluster defaults.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Database name; lower-case letters, digits and underscore.
        general:
          $ref: '#/components/schemas/DatabaseGeneralCreate'
        sharding:
          $ref: '#/components/schemas/ShardingCreateSettings'
        replication:
          $ref: '#/components/schemas/ReplicationCreateSettings'
        ledger:
          $ref: '#/components/schemas/LedgerCreateSettings'
    DatabaseUpdateRequest:
      type: object
      description: Partial update of the mutable settings. Immutable fields are not accepted.
      minProperties: 1
      properties:
        general:
          type: object
          description: Mutable general settings.
          minProperties: 1
          properties:
            owner:
              type: string
              description: New owner role.
            connectionLimit:
              type: integer
              minimum: -1
              description: New connection limit; -1 is unlimited.
        sharding:
          type: object
          description: Sharding changes.
          minProperties: 1
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              enum: [true]
              description: Turn sharding on. Turning it off is not possible.
            mode:
              $ref: '#/components/schemas/ShardingMode'
            distributeNewSchemas:
              type: boolean
              description: 'Added in 0.15.0. Default for new schemas. Changing the mode is synchronous (200); it is refused with 409 `sharding_mode_in_use` while schemas or tables of the other kind exist.'
        replication:
          type: object
          description: Replication changes.
          required: [durability]
          properties:
            durability:
              $ref: '#/components/schemas/Durability'
        ledger:
          type: object
          description: Ledger changes. The mode can be raised from `off` and switched between `appendOnly` and `updatable` for new tables, but never set back to `off`.
          minProperties: 1
          properties:
            mode:
              $ref: '#/components/schemas/LedgerMode'
            digestIntervalSeconds:
              type: integer
              minimum: 60
              maximum: 86400
              description: New digest interval.
    IntegerRange:
      type: object
      description: A default value and its allowed range.
      required: [default, minimum, maximum]
      properties:
        default:
          type: integer
          description: Default value.
        minimum:
          type: integer
          description: Smallest allowed value.
        maximum:
          type: integer
          description: Largest allowed value.
    DatabaseCreateOptions:
      type: object
      description: What the create-database dialog offers.
      required: [encodings, collations, bucketCount, replicaCount, defaultDurability, ledgerDigestIntervalSeconds]
      properties:
        shardingModes:
          type: array
          description: Added in 0.15.0, optional. The values of `sharding.mode`.
          items: { $ref: '#/components/schemas/ShardingMode' }
        shardingModeDefault:
          $ref: '#/components/schemas/ShardingMode'
        encodings:
          type: array
          description: Valid values of `general.encoding`.
          items:
            type: object
            description: One encoding.
            required: [name, isDefault]
            properties:
              name:
                type: string
                description: Encoding name as accepted by `general.encoding`, for example `UTF8`.
              isDefault:
                type: boolean
                description: Whether it is used when `general.encoding` is omitted.
        collations:
          type: array
          description: Valid values of `general.lcCollate` and `general.lcCtype` (the same list serves both).
          items:
            type: object
            description: One locale.
            required: [name, encodings, isDefault]
            properties:
              name:
                type: string
                description: Locale name, for example `en_US.UTF-8` or `C`.
              encodings:
                type:
                  - array
                  - 'null'
                description: Encodings the locale can be combined with. `null` means every encoding; an empty array means none (the locale is listed but cannot be combined with any encoding the server offers).
                items: { type: string }
              isDefault:
                type: boolean
                description: Whether it is used when the field is omitted.
        bucketCount:
          description: Bucket count of a sharded database; default 128, range 1 to 4096.
          $ref: '#/components/schemas/IntegerRange'
        replicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: Current cluster-wide replica count (cluster setting, shown for information).
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        ledgerDigestIntervalSeconds:
          description: Automatic digest interval of the ledger; default 3600, range 60 to 86400.
          $ref: '#/components/schemas/IntegerRange'

    # ------------------------------------------------------------------ tables
    TableClass:
      type: string
      description: |
        A table has one or more classes. `plain` is a normal table on its home shard group; `distributed` is
        hash-distributed over buckets; `reference` is copied to every shard group; `ledger` has a tamper-evident
        ledger. A table can be `distributed` and `ledger` (or `reference` and `ledger`) at the same time.
        **`plain` is never combined with another class**: a plain table with a ledger is `[ledger]`, not
        `[plain, ledger]`.
      enum: [plain, distributed, reference, ledger]
    TableDistribution:
      type: object
      description: How a distributed or reference table is spread over shard groups.
      required: [method, column, colocationId, bucketCount]
      properties:
        method:
          type: string
          enum: [hash, reference, schema]
          description: '`hash` distributes rows by hash of the column; `reference` copies the table to every group; `schema` (0.15.0) the table belongs to a distributed schema and lives in its one group. Clients must tolerate other values.'
        column:
          type:
            - string
            - 'null'
          description: Distribution column; null for reference tables.
        colocationId:
          type:
            - integer
            - 'null'
          format: int32
          description: Colocation group of the table; null for a reference table, which is in none (0.9.0; a reference table could not be made before).
        bucketCount:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Bucket count of the colocation group; null for a reference table.
    TableLedger:
      type: object
      description: Ledger properties of a table.
      required: [mode, historyTable]
      properties:
        mode:
          type: string
          enum: [appendOnly, updatable]
          description: '`appendOnly` allows INSERT only; `updatable` keeps a history table of changed rows.'
        historyTable:
          type:
            - string
            - 'null'
          description: Name of the history table in the same schema; null for `appendOnly`.
    Table:
      type: object
      description: A table with its distribution and ledger properties.
      required: [schema, name, classes, distribution, ledger, homeShardGroupId, estimatedRows, sizeBytes]
      properties:
        schema:
          type: string
          description: Schema name.
        name:
          type: string
          description: Table name.
        classes:
          type: array
          description: Classes of the table (see `TableClass`).
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/TableClass' }
        distribution:
          oneOf:
            - $ref: '#/components/schemas/TableDistribution'
            - type: 'null'
          description: Distribution; null for a plain table.
        ledger:
          oneOf:
            - $ref: '#/components/schemas/TableLedger'
            - type: 'null'
          description: Ledger properties; null when the table is not a ledger table. Cannot be removed once set.
        homeShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Shard group (`group_id`; 0 is the map group, the default home) holding a plain table; null for distributed and reference tables.
        estimatedRows:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Estimated row count over all shards; null when not available.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Table size over all shards (primary copies); null when not available.
        operation:
          description: Added in 0.32.0, optional. The long operation that runs on the table now; null when there is none.
          oneOf:
            - $ref: '#/components/schemas/TableOperation'
            - type: 'null'
        partitioning:
          description: Added in 0.14.0, optional. How the user partitioned the table (a user-partitioned distributed table is also `distributed`); null when it is not partitioned.
          oneOf:
            - type: object
              required: [method, key, partitionCount]
              properties:
                method: { type: string, enum: [range, list] }
                key: { type: string, description: The partition column. }
                partitionCount: { type: integer, minimum: 0 }
                columnType: { type: string, enum: [date, timestamp, timestamptz], description: 'Added in 0.17.0, optional. Present when the key is a time column of a range-partitioned table.' }
                hasPolicy: { type: boolean, description: 'Added in 0.17.0, optional. Whether the table has a time-partitioning policy.' }
                defaultPartition: { type: boolean, description: 'Added in 0.17.0, optional. Whether the table has a default partition.' }
            - type: 'null'
        storage:
          description: Added in 0.17.0, optional. The storage format; null when not available.
          oneOf:
            - $ref: '#/components/schemas/TableStorage'
            - type: 'null'
    DistributionBlockedReason:
      type: string
      description: |
        Why a column cannot be the distribution column. When several reasons apply the first of this list wins:
        `shardingDisabled` sharding is not enabled on the database; `tableNotPlain` the table is already
        distributed or a reference table; `unsupportedType` the column type cannot be hashed by the engine;
        `notInUniqueKey` the table has at least one primary or unique key that does not contain this column
        (PostgreSQL requires the partition key in every unique index; the keys are listed in
        `TableColumn.blockingKeys`). A table without any unique key never has this reason.
      enum: [shardingDisabled, tableNotPlain, unsupportedType, notInUniqueKey]
    TableColumn:
      type: object
      description: One column of a table.
      required: [name, type, nullable, canBeDistributionColumn, distributionBlockedReason, blockingKeys]
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          description: The text of PostgreSQL `format_type(atttypid, atttypmod)`, for example `bigint`, `character varying(20)` or `numeric(12,2)`. For display only; clients must not parse it.
        blockingKeys:
          type: array
          description: Names of the primary and unique keys (index names) that do not contain this column. Non-empty exactly when `distributionBlockedReason` is `notInUniqueKey`.
          items: { type: string }
        nullable:
          type: boolean
          description: True when the column has no NOT NULL constraint.
        canBeDistributionColumn:
          type: boolean
          description: Whether `PUT .../distribution` accepts this column as `distributionColumn` now.
        distributionBlockedReason:
          oneOf:
            - $ref: '#/components/schemas/DistributionBlockedReason'
            - type: 'null'
          description: Why the column cannot be the distribution column; null when `canBeDistributionColumn` is true.
    TableDetail:
      description: A table with its columns.
      allOf:
        - $ref: '#/components/schemas/Table'
        - type: object
          required: [columns]
          properties:
            columns:
              type: array
              description: Columns in ordinal position order.
              items: { $ref: '#/components/schemas/TableColumn' }
    TablePage:
      type: object
      description: A page of tables.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The tables.
          items: { $ref: '#/components/schemas/Table' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    TableRef:
      type: object
      description: A table reference.
      required: [schema, table]
      properties:
        schema:
          type: string
          description: Schema name.
        table:
          type: string
          description: Table name.
    EnableTableLedgerRequest:
      type: object
      description: How to put a table under ledger control.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [appendOnly, updatable]
          description: '`appendOnly` allows INSERT only; `updatable` also allows UPDATE and DELETE and keeps a history table.'
    DistributeTableRequest:
      type: object
      description: How to distribute a plain table.
      required: [method]
      properties:
        method:
          type: string
          enum: [hash, reference]
          description: Distribution method.
        distributionColumn:
          type: string
          description: Column to hash; required for `hash`, forbidden for `reference`.
        colocateWith:
          oneOf:
            - $ref: '#/components/schemas/TableRef'
            - type: 'null'
          description: Existing distributed table whose colocation group to join; null creates or reuses a group by column type.
        bucketCount:
          type: integer
          minimum: 1
          maximum: 4096
          description: 'Added in 0.14.0. Bucket count of a new colocation group; ignored with `colocateWith`. Default: the database setting.'
        mode:
          $ref: '#/components/schemas/TableChangeMode'
        dependentViews:
          $ref: '#/components/schemas/DependentViews'
        relatedTables:
          type: array
          maxItems: 100
          description: 'Added in 0.32.0, optional, for method `hash` only. The tables linked to this one by foreign keys that are distributed together with it (see `listRelatedTables`); an empty or missing list distributes the table alone.'
          items: { $ref: '#/components/schemas/RelatedTableChoice' }

    TableChangeMode:
      type: string
      description: |
        Added in 0.14.0. How a table operation copies the rows. `auto` (the default): online when the table has a usable key and more than 100000 estimated rows, otherwise blocking.
        `online`: writers go on (a capture trigger and a log on every node; needs a primary key or a unique index on NOT NULL columns). `blocking`: writers wait for the whole copy.
      enum: [auto, online, blocking]
      default: auto
    DependentViews:
      type: string
      description: |
        Added in 0.14.0. What an operation does with the plain views that use the table it replaces: `refuse` (the default; the view stops the operation, 422 `table_not_eligible`) or `recreate`
        (the views and the views on them are dropped in the switch and made again on the new table with their owner, options, privileges and comments; sets
        `kingres_shard.dependent_views` for the operation).
      enum: [refuse, recreate]
      default: refuse
    AlterTableDistributionRequest:
      type: object
      description: |
        Added in 0.14.0. What to change; at least one of `distributionColumn`, `bucketCount` and `colocateWith`.
      minProperties: 1
      properties:
        distributionColumn:
          type: string
          description: The new distribution column (part of every unique key of the table).
        bucketCount:
          type: integer
          minimum: 1
          maximum: 4096
          description: The new bucket count; a multiple of the old one moves no row between servers.
        colocateWith:
          oneOf:
            - $ref: '#/components/schemas/TableRef'
            - type: string
              enum: [default, none]
          description: A table whose colocation group to join, `default` (a group of the same type and bucket count) or `none` (a group of its own).
        cascadeToColocated:
          type: boolean
          default: false
          description: Change the tables of the colocation group together (blocking mode only).
        mode:
          $ref: '#/components/schemas/TableChangeMode'
        dependentViews:
          $ref: '#/components/schemas/DependentViews'
    TableBlocker:
      type: object
      description: |
        Added in 0.14.0. One line of the report of the sharding extension about a table: a blocker (the operation is refused), a warning or a note.
      required: [code, object, message]
      properties:
        code:
          type: string
          description: The code of the extension, for example `partitioned_table`, `dependent_object`, `trigger`, `foreign_key_linked`, `no_unique_key`, `group_busy`. Clients tolerate codes they do not know.
        object:
          type: string
          description: What the line is about (a table, a view, a constraint, a node).
        message:
          type: string
          description: Human-readable text.
    TableChangeRequest:
      type: object
      description: Added in 0.14.0. A change to preview.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [distribute, undistribute, alter, createPartition, attachPartition, detachPartition, dropPartition]
        distribute:
          $ref: '#/components/schemas/DistributeTableRequest'
        undistribute:
          type: object
          properties:
            cascadeViaForeignKeys: { type: boolean }
            targetGroupId: { type: integer, format: int32, minimum: 0 }
            mode: { $ref: '#/components/schemas/TableChangeMode' }
            dependentViews: { $ref: '#/components/schemas/DependentViews' }
        alter:
          $ref: '#/components/schemas/AlterTableDistributionRequest'
        partition:
          type: object
          properties:
            name: { type: string }
            bound: { type: string }
            table: { $ref: '#/components/schemas/TableRef' }
    RelatedTableChoice:
      type: object
      description: Added in 0.32.0. A table that is distributed together with the table of the request.
      required: [schema, table]
      properties:
        schema: { type: string }
        table: { type: string }
        distributionColumn:
          type: string
          description: The column to hash; when left out, the column that follows from the foreign keys is used (a table whose column does not follow from them is refused).
    RelatedKey:
      type: object
      description: Added in 0.32.0. A foreign key between two tables of the set, which the task drops and adds again.
      required: [name, schema, table, referencesSchema, referencesTable, definition]
      properties:
        name: { type: string }
        schema: { type: string, description: The schema of the table that has the key. }
        table: { type: string, description: The table that has the key. }
        referencesSchema: { type: string }
        referencesTable: { type: string }
        definition: { type: string, description: 'The definition of the key as PostgreSQL prints it (`FOREIGN KEY (...) REFERENCES ...`).' }
    RelatedTable:
      type: object
      description: Added in 0.32.0. A table of the foreign key closure of the table.
      required: [schema, table, distributionColumn, estimatedRows, sizeBytes]
      properties:
        schema: { type: string }
        table: { type: string }
        distributionColumn:
          type: [string, 'null']
          description: The column the table would be distributed by; null when it does not follow from the keys and was not given.
        estimatedRows: { type: [integer, 'null'], format: int64, minimum: 0 }
        sizeBytes: { type: [integer, 'null'], format: int64, minimum: 0 }
    RelatedTablesPlan:
      type: object
      description: Added in 0.32.0. The answer of `listRelatedTables`.
      required: [tables, keys, blockers, warnings, colocateWith]
      properties:
        tables:
          type: array
          description: The related tables (not the table itself), in the order the task distributes them.
          items: { $ref: '#/components/schemas/RelatedTable' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/RelatedKey' }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/TableBlocker' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/TableBlocker' }
        colocateWith:
          $ref: '#/components/schemas/TableRef'
    TableOperation:
      type: object
      description: |
        Added in 0.32.0. The long operation that is running on a table: a task of the control plane that has the table as its subject or among its related tables, or
        an unfinished operation that the sharding extension recorded for it (one that was started from SQL). Clients tolerate kinds they do not know. While it is
        set, the changes of the table (distribute, undistribute, alter, the partition operations, the storage format, the ledger) conflict with it and the
        console does not offer them.
      required: [kind, role, source, taskId, state, startedAt, percent, step]
      properties:
        kind:
          type: string
          description: 'The change: `distribute`, `undistribute`, `alter`, `partition`, `convertStorage`, `maintain` (time partitions), `export`, `import`, or `other`.'
        role:
          type: string
          enum: [subject, related]
          description: '`related` when the table is one of the related tables of a distribute with related tables whose subject is another table.'
        source:
          type: string
          enum: [task, extension]
        taskId:
          type: [integer, 'null']
          format: int64
          description: The task, when the control plane runs it; null for an operation that was started from SQL.
        state:
          type: string
          description: The state of the task (`pending`, `running`, `paused`), or the phase that the extension recorded (`preparing`, `shadow`, `copying`, `catching_up`, `switching`, `cleaning`).
        startedAt: { type: [string, 'null'], format: date-time }
        percent: { type: [number, 'null'], minimum: 0, maximum: 100, description: Progress when known. }
        step: { type: [string, 'null'], description: The name of the step that runs. }
    TableChangeTable:
      type: object
      description: Added in 0.14.0. A table that a change would touch.
      required: [schema, name, role, sizeBytes, estimatedRows]
      properties:
        schema: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [source, colocated, linked, related]
        sizeBytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
        estimatedRows:
          type: [integer, 'null']
          format: int64
          minimum: 0
    TableChangePreview:
      type: object
      description: Added in 0.14.0. The answer of `previewTableChange`.
      required: [blockers, warnings, notes, affectedTables, estimate]
      properties:
        blockers:
          type: array
          items: { $ref: '#/components/schemas/TableBlocker' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/TableBlocker' }
        notes:
          type: array
          items: { $ref: '#/components/schemas/TableBlocker' }
        affectedTables:
          type: array
          items: { $ref: '#/components/schemas/TableChangeTable' }
        estimate:
          type: object
          required: [rows, bytes, modeRecommended, onlineAvailable, onlineUnavailableReason, writersBlocked]
          properties:
            rows: { type: [integer, 'null'], format: int64, minimum: 0, description: 'Estimated rows to copy; null when not available.' }
            bytes: { type: [integer, 'null'], format: int64, minimum: 0, description: 'Estimated bytes to copy; null when not available.' }
            modeRecommended: { type: string, enum: [online, blocking] }
            onlineAvailable: { type: boolean }
            onlineUnavailableReason: { type: [string, 'null'] }
            writersBlocked: { type: string, enum: [none, switchOnly, wholeCopy], description: 'Who waits: nobody (a change of the catalog), writers during the switch only (online) or for the whole copy (blocking).' }
    TablePartition:
      type: object
      description: Added in 0.14.0. A user partition of a distributed table.
      required: [name, method, bound, isDefault, leafCount, sizeBytes]
      properties:
        name: { type: string }
        method: { type: string, enum: [range, list] }
        bound: { type: string, description: 'The text that follows `FOR VALUES`, or `DEFAULT`.' }
        isDefault: { type: boolean }
        leafCount: { type: integer, minimum: 0, description: 'One leaf per bucket.' }
        sizeBytes: { type: [integer, 'null'], format: int64, minimum: 0, description: 'Size of the leaves that this server holds; null when not available.' }
        accessMethod: { type: [string, 'null'], description: 'Added in 0.17.0, optional. The storage format of the partition (`heap`, `columnar`). From 0.25.0 a user partition of a distributed table has it too: `heap` when every leaf is, `columnar` when every leaf is, `mixed` while the leaves are in both formats (a conversion that stopped half way) and `other` when a leaf is missing or has another access method; it is read on the servers that hold the leaves and is left out when a server does not answer or the sharding extension is older than 0.9.' }
        rangeFrom: { type: [string, 'null'], description: 'Added in 0.17.0, optional. The lower bound of a range partition, as text (a user partition of a distributed table has it from 0.25.0).' }
        rangeTo: { type: [string, 'null'], description: 'Added in 0.17.0, optional. The upper bound of a range partition, as text (a user partition of a distributed table has it from 0.25.0).' }
        estimatedRows: { type: [integer, 'null'], format: int64, minimum: 0, description: 'Added in 0.17.0, optional.' }
        compressionRatio: { type: [number, 'null'], description: 'Added in 0.17.0, optional. Uncompressed over stored bytes of a columnar partition; null otherwise.' }
    TablePartitionPage:
      type: object
      description: Added in 0.14.0. A page of partitions.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TablePartition' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    CreateTablePartitionRequest:
      type: object
      description: Added in 0.14.0.
      required: [name, bound]
      properties:
        name:
          type: string
          maxLength: 57
          description: Name of the partition; at most 57 bytes (leaf names append `_bNNNN`).
        bound:
          type: string
          description: The text that follows `FOR VALUES` (`FROM ('2026-01-01') TO ('2026-02-01')`, `IN ('a')`) or `DEFAULT`.
        ifNotExists:
          type: boolean
          default: false
    AttachTablePartitionRequest:
      type: object
      description: Added in 0.14.0.
      required: [table, bound]
      properties:
        table: { $ref: '#/components/schemas/TableRef' }
        bound:
          type: string
          description: The text that follows `FOR VALUES`, or `DEFAULT`.
    DetachTablePartitionRequest:
      type: object
      description: Added in 0.14.0. Reserved for options; the body may be absent.
      properties: {}

    # ------------------------------------------------------------------ shards
    BucketState:
      type: string
      description: '`active` normal; `moving` being copied to another group; `orphan` left-over shard awaiting deferred cleanup; `splitting` (0.15.0) being replaced by buckets of a larger modulus. Clients must tolerate other values.'
      enum: [active, moving, orphan, splitting]
    SchemaDistribution:
      type: object
      description: Where a distributed schema lives.
      required: [state, colocationId, shardGroupId, serverId, movingToShardGroupId]
      properties:
        state:
          type: string
          description: '`active` or `moving`. Clients must tolerate other values.'
        colocationId:
          type: integer
          format: int32
          description: The colocation group of the schema (one bucket).
        shardGroupId:
          type: integer
          format: int32
          description: The shard group that holds the schema.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server that runs the primary of the group; null when it has none.
        movingToShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: The target of a running move.
    SchemaSummary:
      type: object
      description: One schema of a database.
      required: [name, owner, distribution, tableCount, sizeBytes, estimatedRows]
      properties:
        name:
          type: string
          description: Schema name; any text.
        owner:
          type: string
          description: Owner role.
        distribution:
          oneOf:
            - $ref: '#/components/schemas/SchemaDistribution'
            - type: 'null'
          description: Null for a local schema.
        tableCount:
          type: integer
          minimum: 0
          description: Tables (partitions not counted).
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of the tables of a distributed schema; null when not available.
        estimatedRows:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: The planner's estimate of the rows; null when not available.
    SchemaBlocker:
      type: object
      description: An object that keeps a schema from being distributed.
      required: [objectKind, objectName, reason]
      properties:
        objectKind:
          type: string
          description: Kind of the object.
        objectName:
          type: string
          description: Name of the object.
        reason:
          type: string
          description: Why it is not supported.
    SchemaDetail:
      description: A schema with what stands in the way of distributing or moving it.
      allOf:
        - $ref: '#/components/schemas/SchemaSummary'
        - type: object
          required: [distributionBlockers, pinned, moveInProgress, tablesWithoutReplicaIdentity]
          properties:
            distributionBlockers:
              type: array
              description: For a local schema, the unsupported objects; empty when it can be distributed.
              items: { $ref: '#/components/schemas/SchemaBlocker' }
            pinned:
              oneOf:
                - type: object
                  description: Why the schema cannot move or become local.
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      description: The reason, for example a ledger table.
                - type: 'null'
              description: Null when nothing pins the schema.
            moveInProgress:
              type:
                - integer
                - 'null'
              format: int64
              description: The task of a move that is running.
            tablesWithoutReplicaIdentity:
              type: array
              description: Tables with no primary key and no replica identity; a move needs one of them (`setReplicaIdentityFull` makes them movable).
              items: { type: string }
    SchemaPage:
      type: object
      description: A page of schemas.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Schemas, ordered by name.
          items: { $ref: '#/components/schemas/SchemaSummary' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    DistributeSchemaRequest:
      type: object
      description: Added in 0.15.0. Body of `distributeSchema`; every member is optional.
      additionalProperties: false
      properties:
        shardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: The group that holds the schema; null or absent keeps the data where it is.
        setReplicaIdentityFull:
          type: boolean
          default: false
          description: Set REPLICA IDENTITY FULL on the tables that have no key, so that the schema can be moved later.
    MoveSchemaRequest:
      type: object
      description: Added in 0.15.0. Body of `moveSchema`.
      required: [targetShardGroupId]
      additionalProperties: false
      properties:
        targetShardGroupId:
          type: integer
          format: int32
          description: The group the schema moves to.
        setReplicaIdentityFull:
          type: boolean
          default: false
          description: Set REPLICA IDENTITY FULL on the tables that have no key (required to go on when there are any).
    BucketSplitRequest:
      type: object
      description: Added in 0.15.0. Body of `splitBucket` and `previewBucketSplit`; every member is optional.
      additionalProperties: false
      properties:
        parts:
          type: integer
          enum: [2, 4, 8, 16]
          default: 2
          description: Into how many buckets the bucket is split.
        verify:
          type: string
          enum: [count, none]
          default: count
          description: How the extension checks the copy before the switch; `count` compares the row count of every old partition with its children, `none` trusts the triggers that kept the children current.
    BucketSplitChild:
      type: object
      description: One bucket a split makes.
      required: [bucket, modulus, remainder, estimatedSizeBytes]
      properties:
        bucket:
          type: integer
          minimum: 0
          description: Bucket number (equal to `remainder`).
        modulus:
          type: integer
          minimum: 1
          description: The modulus of the new bucket.
        remainder:
          type: integer
          minimum: 0
          description: The remainder of the hash modulo `modulus` that the bucket holds.
        estimatedSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: A share of the size of the bucket; null when the size is not known.
    BucketSplitPreview:
      type: object
      description: Added in 0.15.0. What a split would make and what stands in its way.
      required: [canSplit, parts, children, estimatedSizeBytes, extraDiskBytes, blockers]
      properties:
        canSplit:
          type: boolean
          description: True when no blocker exists.
        parts:
          type: integer
          description: The parts asked for (default 2).
        children:
          type: array
          description: The buckets the split makes, the first with the number of the bucket.
          items: { $ref: '#/components/schemas/BucketSplitChild' }
        estimatedSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          description: The size of the bucket over the tables of its group; null when not known.
        extraDiskBytes:
          type:
            - integer
            - 'null'
          format: int64
          description: Disk the owning server, and each standby of its group, needs until the old partitions are dropped (about the size of the bucket).
        blockers:
          type: array
          description: What stands in the way; empty when `canSplit`.
          items: { $ref: '#/components/schemas/DrainBlocker' }
    ColocationGroup:
      type: object
      description: Tables that share one bucket map.
      required: [colocationId, bucketCount, distributionColumnType, tableCount, sizeBytes]
      properties:
        colocationId:
          type: integer
          format: int32
          description: Colocation group identifier.
        bucketCount:
          type: integer
          minimum: 1
          description: Number of buckets.
        distributionColumnType:
          type: string
          description: PostgreSQL type of the distribution column.
        tableCount:
          type: integer
          minimum: 0
          description: Tables in the group.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Size of the group's data (primary copies); null when not available.
        baseBucketCount:
          type: integer
          minimum: 1
          description: Added in 0.15.0, optional. The number of buckets the group was made with; `bucketCount` is the current number, which a split raises.
        maxModulus:
          type: integer
          minimum: 1
          description: Added in 0.15.0, optional. The greatest modulus of a bucket of the group (the base count until a split).
        kind:
          type: string
          description: 'Added in 0.15.0, optional. `hash` (the buckets of hash-distributed tables) or `schema` (one bucket: the group that holds one distributed schema). Clients must tolerate other values.'
        schemaName:
          type:
            - string
            - 'null'
          description: Added in 0.15.0, optional. The distributed schema of a `schema` group; null for a `hash` group. A name can be any text, so show it as text.
    ColocationGroupList:
      type: object
      description: Colocation groups of a database.
      required: [items]
      properties:
        items:
          type: array
          description: The groups.
          items: { $ref: '#/components/schemas/ColocationGroup' }
    Bucket:
      type: object
      description: One hash bucket of a colocation group.
      required: [bucket, shardGroupId, state, primaryServerId, replicaServerIds, sizeBytes, movingToShardGroupId]
      properties:
        bucket:
          type: integer
          minimum: 0
          description: 'Bucket number: `hash(key)` reduced to the number of buckets of the colocation group (`ColocationGroup.bucketCount`) by the sharding extension''s own hash function, which is not PostgreSQL''s `hashtext` followed by a modulo; use `kingres.bucket_for` to find the bucket of a value.'
        modulus:
          type: integer
          minimum: 1
          description: Added in 0.15.0, optional. The modulus of the bucket (it holds the hashes whose remainder modulo `modulus` is `remainder`); equal to the base bucket count until a split.
        remainder:
          type: integer
          minimum: 0
          description: Added in 0.15.0, optional. Equal to `bucket`.
        shardGroupId:
          type: integer
          format: int32
          description: Shard group that owns the bucket.
        state:
          $ref: '#/components/schemas/BucketState'
        primaryServerId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server currently hosting the owning group's primary; null if the group has no primary.
        replicaServerIds:
          type: array
          description: Servers hosting the owning group's standbys.
          items: { $ref: '#/components/schemas/ServerId' }
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of the bucket over all tables of the group; null when not available.
        movingToShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Destination group while `state` is `moving`.
    BucketPage:
      type: object
      description: A page of the bucket map.
      required: [mapVersion, items, nextCursor]
      properties:
        mapVersion:
          type: integer
          format: int64
          description: Version of the bucket map the page was read from.
        items:
          type: array
          description: The buckets, ordered by number.
          items: { $ref: '#/components/schemas/Bucket' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    ServerBucketCount:
      type: object
      description: Buckets held by one server.
      required: [serverId, primaryBuckets, replicaBuckets, primarySizeBytes, replicaSizeBytes]
      properties:
        serverId:
          $ref: '#/components/schemas/ServerId'
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets with their primary copy here.
        replicaBuckets:
          type: integer
          minimum: 0
          description: Buckets with a replica copy here.
        primarySizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of primary copies; null when bucket sizes are not available.
        replicaSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of replica copies; null when bucket sizes are not available.
    BucketDistribution:
      type: object
      description: Bucket counts and sizes per server.
      required: [mapVersion, servers]
      properties:
        mapVersion:
          type: integer
          format: int64
          description: Version of the bucket map.
        servers:
          type: array
          description: One entry per server.
          items: { $ref: '#/components/schemas/ServerBucketCount' }

    # ------------------------------------------------------------------ replication
    ReplicationSyncState:
      type: string
      description: Synchronous state of a standby as in `pg_stat_replication.sync_state`.
      enum: [async, potential, sync, quorum]
    ReplicationMember:
      type: object
      description: One instance of a shard group in the replication topology.
      required: [instanceId, serverId, role, state, port, timeline, syncState, lagBytes, lagSeconds, isOnPreferredServer]
      properties:
        instanceId:
          type: integer
          format: int32
          description: Instance identifier. For a standby that kingresd manages and that is not in the sharding catalog yet (until the extension supports standby nodes) it is 1048576 plus the standby's own id, outside the range of the catalog's node ids; clients treat it as opaque.
        serverId:
          $ref: '#/components/schemas/ServerId'
        role:
          $ref: '#/components/schemas/InstanceRole'
        state:
          type: string
          enum: [running, starting, stopping, stopped, restarting, failed]
          description: Process state.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: PostgreSQL port.
        timeline:
          type: integer
          minimum: 1
          description: PostgreSQL timeline id.
        syncState:
          oneOf:
            - $ref: '#/components/schemas/ReplicationSyncState'
            - type: 'null'
          description: Synchronous state; null for a primary.
        lagBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: WAL bytes behind the primary; null for a primary.
        lagSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: Replay lag in seconds; null for a primary.
        isOnPreferredServer:
          type: boolean
          description: For a primary, whether it runs on the group's preferred (home) server.
    ReplicationSlot:
      type: object
      description: A replication slot on a primary.
      required: [name, type, active, instanceId, retainedWalBytes]
      properties:
        name:
          type: string
          description: Slot name.
        type:
          type: string
          enum: [physical, logical]
          description: Slot type; logical slots are used by bucket moves.
        active:
          type: boolean
          description: Whether a consumer is connected.
        instanceId:
          type: integer
          format: int32
          description: Instance that owns the slot.
        retainedWalBytes:
          type: integer
          format: int64
          minimum: 0
          description: WAL retained for the slot.
    ShardGroup:
      type: object
      description: A shard group (or the map group) with its replication state.
      required: [id, isMapGroup, preferredPrimaryServerId, health, primary, standbys, slots]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
          description: Shard group identifier, equal to `group_id` in `kingres.node`. The map group is group 0.
        isMapGroup:
          type: boolean
          description: Whether this is the map group (`group_id` 0).
        preferredPrimaryServerId:
          $ref: '#/components/schemas/ServerId'
        health:
          type: string
          enum: [healthy, degraded, unavailable]
          description: '`healthy` all standbys in sync; `degraded` a standby missing or lagging; `unavailable` no primary.'
        primary:
          oneOf:
            - $ref: '#/components/schemas/ReplicationMember'
            - type: 'null'
          description: Current primary; null while the group has none.
        standbys:
          type: array
          description: Standbys of the group.
          items: { $ref: '#/components/schemas/ReplicationMember' }
        slots:
          type: array
          description: Replication slots on the primary.
          items: { $ref: '#/components/schemas/ReplicationSlot' }
        lease:
          $ref: '#/components/schemas/GroupLease'
        failover:
          $ref: '#/components/schemas/FailoverReadiness'
    GroupLease:
      type: object
      description: |
        Added in 0.7.0, optional (absent when the answering server knows nothing about the group's lease). The lease
        that keeps two primaries from running for one shard group: the server that runs the primary renews it from a
        majority of the servers every two seconds, and stops its instance when it cannot (a group with a standby) or
        raises the alert `leaseLost` (a group without one). The state is **the answering server's knowledge**, not a
        cluster-wide agreement: `held`/`lost` for a group whose primary the answering server runs, `granted` for
        a group it granted to another server.
      required: [holder, state, enforced]
      properties:
        holder:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server that holds the lease as far as the answering server knows; **null when `state` is `none`** (0.9.0; the property stays required, its value can now be null).
        state:
          type: string
          enum: [held, lost, granted, none]
          description: '`held` valid now; `lost` the primary of this group runs here and the lease was not renewed; `granted` granted by the answering server to `holder`; `none`.'
        remainingMillis:
          type: integer
          format: int64
          minimum: 0
          description: Time left on the answering server's monotonic clock; absent when not meaningful.
        enforced:
          type: boolean
          description: Whether losing the lease stops the instance (the group has a standby).
    ReplicationTopology:
      type: object
      description: Replication state of the whole cluster.
      required: [generatedAt, groups]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the topology was read.
        groups:
          type: array
          description: All shard groups including the map group.
          items: { $ref: '#/components/schemas/ShardGroup' }

    # ------------------------------------------------------------------ rebalance
    RebalanceOptions:
      type: object
      description: Options of a rebalance.
      properties:
        databases:
          type: array
          description: Restrict to these databases; omitted or empty means all.
          items: { type: string }
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          description: Concurrent bucket moves; defaults to 1 when omitted and is recorded as sent (or 1). **This version runs one move at a time** whatever the value (0.9.0).
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: 'Added in 0.15.0. The largest deviation of a server from the ideal load that is accepted: nothing moves while every server is within it. Default: the cluster setting, else 0 by `byBucketCount` and 0.1 by `byDiskSize`. The answer shows the value used.'
        drainOnly:
          type: boolean
          description: 'Added in 0.15.0. Move only the buckets off servers that should not hold shards (`shouldHaveShards` false); nothing else is balanced.'
        maxMovesPerServer:
          type: integer
          minimum: 1
          maximum: 16
          description: 'Added in 0.15.0. Moves that may involve one server as source or target at once. Default: the cluster setting (2).'
        acknowledgeFailures:
          type: boolean
          description: 'Added in 0.15.0. Clears the suspension that failed moves of an earlier run left (a manual start acknowledges them anyway).'
        cleanupDelaySeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: 'Added in 0.15.0. Overrides, for this run, the delay before the source copy of a moved bucket is dropped.'
        force:
          type: boolean
          description: 'Added in 0.27.0. Starts a manual run although a group has a standby that is behind its primary by more than `maxStandbyLagBytes` (409 `group_degraded` without it). It lifts only that refusal, and only for this start; the guard of a run that is going on and the automatic mode do not read it.'
    DrainRequest:
      type: object
      description: Added in 0.15.0. Body of `drainServer`; every member is optional.
      additionalProperties: false
      properties:
        removeWhenDone:
          type: boolean
          default: false
          description: Remove the server (the task of `removeServer`) when it owns no bucket. Made after the drain task has ended; if the manager restarts in between, the server stays drained and the operator removes it.
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          description: Concurrent moves (see `RebalanceOptions`).
        acceptFewerReplicas:
          type: boolean
          default: false
          description: Go on although fewer servers than `replicaCount + 1` would remain.
        acknowledgeLocalData:
          type: boolean
          default: false
          description: Go on although the server holds ordinary tables whose data leaves with it.
    DrainBlocker:
      type: object
      description: Something that stands in the way of a drain.
      required: [code, detail]
      properties:
        code:
          type: string
          description: The problem code `drainServer` would answer with (`last_server`, `no_receiving_server`, `server_hosts_map_group`, `replicas_cannot_be_kept`, `group_degraded`, `node_state_invalid`). Clients must tolerate other values.
        detail:
          type: string
          description: What is wrong.
    DrainPreview:
      type: object
      description: Added in 0.15.0. What a drain would do now.
      required: [serverId, canDrain, moveCount, totalBytes, moves, standbyShardGroupIds, canKeepReplicas, localData, blockers, warnings]
      properties:
        serverId:
          $ref: '#/components/schemas/ServerId'
        canDrain:
          type: boolean
          description: True when no blocker exists.
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        moveCount:
          type: integer
          minimum: 0
          description: Moves of the plan.
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes to copy; null when sizes are not available.
        moves:
          type: array
          description: The first moves of the plan (at most 200).
          items: { $ref: '#/components/schemas/PlannedMove' }
        standbyShardGroupIds:
          type: array
          description: The groups whose standby instance runs on the server. This revision does not relocate them.
          items: { type: integer, format: int32 }
        canKeepReplicas:
          type: boolean
          description: Whether the servers that remain are enough for the replica count (no server may hold two instances of a group).
        localData:
          type: array
          description: Databases in which the server holds ordinary tables; their data leaves with the server.
          items:
            type: object
            description: One database.
            required: [databaseName, tableCount, sizeBytes]
            properties:
              databaseName:
                type: string
                description: Database.
              tableCount:
                type: integer
                minimum: 0
                description: Ordinary tables.
              sizeBytes:
                type:
                  - integer
                  - 'null'
                format: int64
                description: Their size; null when not known.
        blockers:
          type: array
          description: What stands in the way; empty when `canDrain`.
          items: { $ref: '#/components/schemas/DrainBlocker' }
        warnings:
          type: array
          description: Conditions to know about (see `RebalancePlan.warnings`).
          items: { type: string }
    RebalanceStrategy:
      type: string
      description: 'Added in 0.15.0. How a bucket is counted: `byBucketCount` every bucket counts 1; `byDiskSize` a bucket counts its bytes (at least 1 MiB). Clients must tolerate other values.'
      enum: [byBucketCount, byDiskSize]
    RebalancePlanRequest:
      description: Options of a plan preview.
      allOf:
        - $ref: '#/components/schemas/RebalanceOptions'
        - type: object
          properties:
            moveLimit:
              type: integer
              minimum: 1
              maximum: 5000
              default: 200
              description: Maximum number of moves listed in the response.
            excludeServerIds:
              type: array
              description: 'Added in 0.15.0. Plan as if these servers should not hold shards: the preview of a drain.'
              items: { $ref: '#/components/schemas/ServerId' }
    PlannedMove:
      type: object
      description: One bucket move of a plan.
      required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, estimatedSizeBytes, rank]
      properties:
        databaseName:
          type: string
          description: Database.
        colocationId:
          type: integer
          format: int32
          description: Colocation group.
        bucket:
          type: integer
          minimum: 0
          description: Bucket number.
        fromShardGroupId:
          type: integer
          format: int32
          description: Source shard group.
        toShardGroupId:
          type: integer
          format: int32
          description: Destination shard group.
        fromServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the source group when the plan was made; the page shows servers, not group numbers.
        toServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the destination group.
        estimatedSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Estimated bytes to copy; null when bucket sizes are not available.
        rank:
          type: integer
          minimum: 0
          maximum: 1000
          description: Priority from 0 to 1000; higher moves run earlier.
        kind:
          type: string
          description: 'Added in 0.15.0, optional. `move` (the default) or `schema`: a unit of the plan that is a distributed schema. The extension does not plan schemas yet; a panel shows them when a server sends them.'
        schemaName:
          type:
            - string
            - 'null'
          description: Added in 0.15.0, optional. The schema, for kind `schema`.
        cost:
          type: integer
          format: int64
          minimum: 0
          description: 'Added in 0.15.0, optional. What the plan counted for the bucket: 1 by `byBucketCount`, its bytes by `byDiskSize`.'
        reason:
          type: string
          description: 'Added in 0.15.0, optional. `balance` or `drain` (a move off a server that should not hold shards). Clients must tolerate other values.'
    RebalancePlan:
      type: object
      description: A rebalance plan preview.
      required: [needed, totals, truncated, moves, serverImpacts, warnings]
      properties:
        needed:
          type: boolean
          description: False when nothing would move.
        totals:
          type: object
          description: Totals over the full plan.
          required: [moveCount, totalBytes, estimatedDurationSeconds]
          properties:
            moveCount:
              type: integer
              minimum: 0
              description: Number of bucket moves.
            totalBytes:
              type:
                - integer
                - 'null'
              format: int64
              minimum: 0
              description: Bytes to copy; null when bucket sizes are not available.
            estimatedDurationSeconds:
              type:
                - integer
                - 'null'
              minimum: 0
              description: Rough duration estimate; null when not available.
        truncated:
          type: boolean
          description: True when `moves` is shorter than `totals.moveCount`.
        moves:
          type: array
          description: The first moves of the plan.
          items: { $ref: '#/components/schemas/PlannedMove' }
        serverImpacts:
          type: array
          description: Primary bucket count per server before and after the plan.
          items:
            type: object
            description: Effect of the plan on one server.
            required: [serverId, primaryBucketsBefore, primaryBucketsAfter]
            properties:
              serverId:
                $ref: '#/components/schemas/ServerId'
              primaryBucketsBefore:
                type: integer
                minimum: 0
                description: Primary buckets now.
              primaryBucketsAfter:
                type: integer
                minimum: 0
                description: Primary buckets after the plan.
              loadBefore:
                type: number
                description: Added in 0.15.0, optional. The load of the server by the strategy now (buckets, or bytes).
              loadAfter:
                type: number
                description: Added in 0.15.0, optional. The load after the plan.
        warnings:
          type: array
          description: 'Conditions the operator should know about, for example tables without a replica identity. Since 0.15.0 also `groupUnavailable: ...` for a shard group without a primary, whose buckets are not planned.'
          items: { type: string }
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type: number
          description: Added in 0.15.0, optional. The threshold the plan used.
        imbalance:
          type: number
          minimum: 0
          description: Added in 0.15.0, optional. The largest deviation of a server from the ideal load now (0.1 is 10 percent); the plan brings every server within `threshold`.
    BucketMove:
      type: object
      description: A bucket move in flight.
      required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, phase, percent, sizeBytes]
      properties:
        databaseName:
          type: string
          description: Database.
        colocationId:
          type: integer
          format: int32
          description: Colocation group.
        bucket:
          type: integer
          minimum: 0
          description: Bucket number.
        fromShardGroupId:
          type: integer
          format: int32
          description: Source shard group.
        toShardGroupId:
          type: integer
          format: int32
          description: Destination shard group.
        fromServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the source group.
        toServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the destination group.
        kind:
          type: string
          description: 'Added in 0.15.0, optional. What moves: `move` (a bucket, the default), `split` (a bucket is being split) or `schema` (a distributed schema, one bucket of its own group). Clients must tolerate other values.'
        schemaName:
          type:
            - string
            - 'null'
          description: Added in 0.15.0, optional. The schema, for kind `schema`; a name can be any text, so show it as text.
        phase:
          type: string
          enum: [prepare, copy, catchUp, switch, cleanup]
          description: |
            Current phase of the move: the extension's `preparing`, `copying`, `catching_up`, `switching` and
            `cleaning`. `percent` is an estimate by phase (5, 30, 85, 95, 100): the extension does not report how much of
            the copy is done.
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Progress of the move.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes to move; null when bucket sizes are not available.
    RebalanceProgress:
      type: object
      description: Progress counters of a rebalance.
      required: [movesTotal, movesDone, movesInFlight, movesFailed, bytesMoved, percent]
      properties:
        movesTotal:
          type: integer
          minimum: 0
          description: Moves planned.
        movesDone:
          type: integer
          minimum: 0
          description: Moves completed.
        movesInFlight:
          type: integer
          minimum: 0
          description: Moves running now.
        movesFailed:
          type: integer
          minimum: 0
          description: Moves that failed.
        movesSkipped:
          type: integer
          minimum: 0
          description: Added in 0.9.0, optional. Moves not made in this run (skipped by a condition, or cancelled by a stop).
        bytesMoved:
          type: integer
          format: int64
          minimum: 0
          description: Bytes copied so far (the planned size of the moves that are done).
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress.
    RebalanceStatus:
      type: object
      description: Current rebalance state.
      required: [state, needed, reasons, lastReport]
      properties:
        state:
          type: string
          enum: [idle, running, stopping, stopped, failed]
          description: '`idle` no unfinished run; `running`; `stopping` a stop was asked and the move in flight has not ended; `stopped` a paused run that `POST /rebalance` goes on with; `failed` no unfinished run and the last one ended failed (see `getRebalanceStatus`).'
        needed:
          type: boolean
          description: Whether the placement differs from the target placement.
        reasons:
          type: array
          description: Why a rebalance is needed.
          items: { $ref: '#/components/schemas/RebalanceReason' }
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Task of the current or stopped run.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current run started.
        options:
          oneOf:
            - $ref: '#/components/schemas/RebalanceOptions'
            - type: 'null'
          description: Options of the current run.
        progress:
          oneOf:
            - $ref: '#/components/schemas/RebalanceProgress'
            - type: 'null'
          description: Progress of the current run; null while no run is active.
        inFlightMoves:
          type: array
          description: Moves running now.
          items: { $ref: '#/components/schemas/BucketMove' }
        stoppedBy:
          type:
            - string
            - 'null'
          description: 'Added in 0.9.0, optional. Who stopped the run, while it is `stopping` or `stopped`: `operator` or `safetyRule`. Clients must tolerate other values. Null otherwise.'
        pausedReason:
          type:
            - string
            - 'null'
          description: Added in 0.9.0, optional. The text the run recorded when it paused (what stopped it, and that `POST /rebalance` goes on). Null while it is not stopped.
        lastReport:
          oneOf:
            - $ref: '#/components/schemas/RebalanceReportSummary'
            - type: 'null'
          description: Summary of the most recent finished or failed run other than the current one, so the page can show what happened last while `progress` is null; null when no run has finished yet.
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type: number
          description: Added in 0.15.0, optional. The threshold of the current run.
        trigger:
          type: string
          description: 'Added in 0.15.0, optional. What started the current run: `manual`, `automatic` or `drain`. Clients must tolerate other values.'
        automatic:
          $ref: '#/components/schemas/RebalanceAutomaticStatus'
    RebalanceReportSummary:
      type: object
      description: Summary of one rebalance run.
      required: [id, outcome, startedAt, finishedAt, totals]
      properties:
        id:
          type: integer
          format: int64
          description: Report identifier; equals the identifier of the rebalance task.
        outcome:
          type: string
          enum: [completed, stopped, failed, cancelled]
          description: 'How the run ended. `cancelled` (added in 0.9.0): a person cancelled the task (`cancelTask`), also while the run was stopped; `stoppedBy` is `operator`, no `taskFailed` alert is raised and the moves in flight are listed as skipped (`stopped`).'
        startedAt:
          type: string
          format: date-time
          description: Start time.
        finishedAt:
          type: string
          format: date-time
          description: End time.
        options:
          $ref: '#/components/schemas/RebalanceOptions'
        trigger:
          type: string
          description: 'Added in 0.15.0, optional. `manual`, `automatic` or `drain`.'
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type: number
          description: Added in 0.15.0, optional. The threshold the run used.
        stoppedBy:
          type:
            - string
            - 'null'
          description: 'Added in 0.9.0, optional. For outcome `stopped`: `operator` or `safetyRule`; for outcome `cancelled`: `operator`.'
        error:
          type:
            - string
            - 'null'
          description: Added in 0.9.0, optional. Why the run failed or was stopped by a safety rule; null otherwise.
        totals:
          type: object
          description: Totals of the run.
          required: [movesTotal, movesDone, movesFailed, bytesMoved, durationSeconds]
          properties:
            movesSkipped:
              type: integer
              minimum: 0
              description: Added in 0.9.0, optional. Moves not made (skipped by a condition, or cancelled by a stop).
            movesTotal:
              type: integer
              minimum: 0
              description: Moves planned (at least the moves of the report).
            movesDone:
              type: integer
              minimum: 0
              description: Moves completed.
            movesFailed:
              type: integer
              minimum: 0
              description: Moves failed.
            bytesMoved:
              type: integer
              format: int64
              minimum: 0
              description: Bytes copied.
            durationSeconds:
              type: integer
              minimum: 0
              description: Wall-clock duration.
    RebalanceReport:
      description: Full report of a rebalance run.
      allOf:
        - $ref: '#/components/schemas/RebalanceReportSummary'
        - type: object
          required: [moves]
          properties:
            placementBefore:
              type: array
              description: Added in 0.9.0, optional. Primary buckets per database and server when the run started.
              items: { $ref: '#/components/schemas/PlacementEntry' }
            placementAfter:
              type: array
              description: Added in 0.9.0, optional. The same when the run ended; empty for a run that has not ended.
              items: { $ref: '#/components/schemas/PlacementEntry' }
            moves:
              type: array
              description: Every move of the run.
              items:
                type: object
                description: Result of one move.
                required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, outcome]
                properties:
                  databaseName:
                    type: string
                    description: Database.
                  colocationId:
                    type: integer
                    format: int32
                    description: Colocation group.
                  bucket:
                    type: integer
                    minimum: 0
                    description: Bucket number.
                  fromShardGroupId:
                    type: integer
                    format: int32
                    description: Source shard group.
                  toShardGroupId:
                    type: integer
                    format: int32
                    description: Destination shard group.
                  fromServerId:
                    type: string
                    description: Added in 0.9.0, optional. The server that ran the primary of the source group.
                  toServerId:
                    type: string
                    description: Added in 0.9.0, optional. The server that ran the primary of the destination group.
                  attempts:
                    type: integer
                    minimum: 0
                    description: Added in 0.9.0, optional. How many times the move was tried.
                  reason:
                    type: string
                    description: 'Added in 0.15.0, optional. `balance` or `drain`.'
                  kind:
                    type: string
                    description: 'Added in 0.31.0, optional. `schema` when the move was a distributed schema (the one bucket of its colocation group, moved by the extension''s schema move); absent for a bucket. Clients must tolerate other values.'
                  schemaName:
                    type:
                      - string
                      - 'null'
                    description: Added in 0.31.0, optional. The schema, for kind `schema`; a name can be any text, so show it as text.
                  skipReason:
                    type:
                      - string
                      - 'null'
                    description: 'Added in 0.9.0, optional. For outcome `skipped`: `stopped` (cancelled by a stop), `targetDiskLow`, `groupDegraded` or `groupLeaseLost`. Clients must tolerate other values.'
                  sizeBytes:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Bytes copied (the size the plan estimated).
                  outcome:
                    type: string
                    enum: [done, failed, skipped]
                    description: Result of the move.
                  durationSeconds:
                    type: number
                    minimum: 0
                    description: Duration of the move.
                  error:
                    type:
                      - string
                      - 'null'
                    description: Error message for a failed move.
    PlacementEntry:
      type: object
      description: Added in 0.9.0. The primary buckets one server holds in one database.
      required: [databaseName, serverId, primaryBuckets]
      properties:
        databaseName:
          type: string
          description: Database.
        serverId:
          $ref: '#/components/schemas/ServerId'
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets of the groups whose primary the server runs, over all colocation groups of the database.
    RebalanceReportPage:
      type: object
      description: A page of rebalance report summaries.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Summaries, newest first.
          items: { $ref: '#/components/schemas/RebalanceReportSummary' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ tasks
    TaskState:
      type: string
      description: Task state machine state.
      enum: [pending, running, paused, failed, done]
    ApproximateAggregates:
      type: object
      description: Added in 0.17.0. The approximate-aggregates setting of a database and the state of the extension `kingres_sketch` on every server.
      required: [enabled, extensionVersion, countDistinct, errorRate, servers]
      properties:
        enabled: { type: boolean, description: The recorded setting. }
        extensionVersion:
          type: [string, 'null']
          description: The version every server runs; null when no server has the extension or the versions differ.
        countDistinct:
          type: string
          enum: [exact, approximate]
          description: Whether `count(DISTINCT x)` is rewritten to a sketch (`kingres_shard.count_distinct_mode`).
        errorRate:
          type: [number, 'null']
          minimum: 0.0005
          maximum: 0.1
          description: The relative error of the approximate count; null when `countDistinct` is `exact`.
        servers:
          type: array
          items:
            type: object
            required: [serverId, installedVersion, state]
            properties:
              serverId: { type: string }
              installedVersion: { type: [string, 'null'] }
              state: { type: string, enum: [ok, notInstalled, versionMismatch, unreachable] }
    ApproximateAggregatesRequest:
      type: object
      description: Added in 0.17.0.
      required: [enabled]
      properties:
        enabled: { type: boolean }
        countDistinct:
          type: string
          enum: [exact, approximate]
          default: exact
          description: '`approximate` needs `enabled: true`, otherwise 400 `validation_failed`.'
        errorRate:
          type: number
          minimum: 0.0005
          maximum: 0.1
          default: 0.01
          description: 'Only with `countDistinct: approximate`.'
    TableStorageAccessMethod:
      type: string
      enum: [heap, columnar]
    ColumnarCompression:
      type: string
      enum: [none, pglz, lz4, zstd]
    TableStorageRequest:
      type: object
      description: Added in 0.17.0.
      required: [accessMethod]
      properties:
        accessMethod: { $ref: '#/components/schemas/TableStorageAccessMethod' }
        compression: { $ref: '#/components/schemas/ColumnarCompression' }
        compressionLevel: { type: integer, minimum: 1, maximum: 19 }
        stripeRowCount: { type: integer, minimum: 1000 }
        chunkRowCount: { type: integer, minimum: 100 }
    PartitionStorageRequest:
      description: Added in 0.17.0. The request of `setTableStorage`, plus a sort order.
      allOf:
        - $ref: '#/components/schemas/TableStorageRequest'
        - type: object
          properties:
            sortBy:
              type: array
              description: Columns that order the rows of a columnar partition.
              items: { type: string }
    TableStoragePreview:
      type: object
      description: Added in 0.17.0. The answer of a storage request with `dryRun=true`.
      required: [current, target, willConvert, blockers, notes]
      properties:
        current: { type: [string, 'null'], description: 'The access method of the table or partition now; null for a partitioned table.' }
        target: { $ref: '#/components/schemas/TableStorageAccessMethod' }
        tableOwner: { type: string, description: 'Added in 0.17.0, optional. The role that owns the table or partition.' }
        ownerTrusted: { type: boolean, description: 'Added in 0.17.0, optional. False when the owner is not a superuser and the cluster setting analytics.allowNonSuperuserOwners is off (the blocker owner_not_trusted).' }
        willConvert: { type: boolean, description: 'False when the request would be refused (`blockers` is not empty) or when there is nothing to do.' }
        blockers:
          type: array
          description: The reasons the request would be refused with 409 `conversion_refused`; the codes are `partitioned_table`, `partition`, `ledger_table`, `distributed_table`, `publication`, `foreign_keys`, `owner_not_trusted` and `other` (the text of the extension).
          items: { $ref: '#/components/schemas/TableBlocker' }
        notes:
          type: array
          description: What else the operator should know, as text, for example that the table is converted under an `ACCESS EXCLUSIVE` lock or that it has the format already.
          items: { type: string }
    ColumnarStats:
      type: object
      description: Added in 0.17.0. Totals of the columnar format over a table or over its partitions.
      required: [stripes, rows, bytesOnDisk, bytesUncompressed]
      properties:
        compression: { oneOf: [{ $ref: '#/components/schemas/ColumnarCompression' }, { type: 'null' }] }
        compressionLevel: { type: [integer, 'null'] }
        stripeRowCount: { type: [integer, 'null'] }
        chunkRowCount: { type: [integer, 'null'] }
        stripes: { type: integer, format: int64, minimum: 0 }
        rows: { type: integer, format: int64, minimum: 0 }
        bytesOnDisk: { type: integer, format: int64, minimum: 0 }
        bytesUncompressed: { type: integer, format: int64, minimum: 0 }
        compressionRatio: { type: [number, 'null'] }
    TableStorage:
      type: object
      description: Added in 0.17.0. The storage format of a table.
      required: [accessMethod]
      properties:
        accessMethod:
          type: [string, 'null']
          description: '`heap`, `columnar` or another access method; null for a partitioned table.'
        partitionFormats:
          type: [object, 'null']
          description: The number of partitions in each format; null for a table that is not partitioned.
          required: [heap, columnar, other]
          properties:
            heap: { type: integer, minimum: 0 }
            columnar: { type: integer, minimum: 0 }
            other: { type: integer, minimum: 0 }
        columnar:
          oneOf:
            - $ref: '#/components/schemas/ColumnarStats'
            - type: 'null'
    PartitionPolicyRequest:
      type: object
      description: Added in 0.17.0. Every duration is ISO 8601 (`P1D`, `P1M`, `PT6H`).
      required: [partitionEvery]
      properties:
        partitionEvery:
          type: string
          description: 'The size of a partition, in one unit: `PT1H`, `PT2H`, `PT3H`, `PT4H`, `PT6H`, `PT8H` or `PT12H` (hours that divide a day; only for a timestamp column), `P<n>D` for n from 1 to 3660 (`P7D` is the week, aligned on Monday), `P1M`, `P2M`, `P3M`, `P4M`, `P6M` (months that divide a year), or `P<n>Y` for n from 1 to 1000. Any other shape is 400 `validation_failed` on `/partitionEvery`. `columnarAfter` longer than `retention` is 400 on `/columnarAfter`.'
        createAhead: { type: string, default: P7D }
        retention: { type: [string, 'null'] }
        retentionAction: { type: string, enum: [drop, detach], default: drop }
        columnarAfter: { type: [string, 'null'] }
        columnarSortBy: { type: [array, 'null'], items: { type: string } }
        compression: { oneOf: [{ $ref: '#/components/schemas/ColumnarCompression' }, { type: 'null' }] }
        compressionLevel: { type: [integer, 'null'] }
        timezone: { type: string, default: UTC }
        runEvery: { type: string, default: PT1H }
        enabled: { type: boolean, default: true }
    PartitionRunState:
      type: string
      enum: [running, done, partial, failed]
    PartitionRunSummary:
      type: object
      description: Added in 0.17.0.
      required: [id, state, startedAt, finishedAt]
      properties:
        id: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/PartitionRunState' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    PartitionPolicyHealth:
      type: object
      description: Added in 0.17.0.
      required: [partitionsAhead, ok, problems]
      properties:
        partitionsAhead: { type: [string, 'null'], description: 'ISO 8601 duration from now to the end of the last partition.' }
        ok: { type: boolean }
        problems:
          type: array
          items: { type: string, enum: [aheadLow, lastRunFailed, defaultPartitionPresent, misaligned] }
    PartitionPolicy:
      description: Added in 0.17.0. The request, as stored, plus the state of the policy.
      allOf:
        - $ref: '#/components/schemas/PartitionPolicyRequest'
        - type: object
          required: [partitionColumn, partitionColumnType, nextRunAt, lastRun, health, createdBy, updatedAt]
          properties:
            tableOwner: { type: string, description: 'Added in 0.17.0, optional. The role that owns the table.' }
            ownerTrusted: { type: boolean, description: 'Added in 0.17.0, optional. Whether runs of the policy are allowed for this owner now: a superuser, or `ClusterSettings.analytics.allowNonSuperuserOwners` is on. When false the policy is not run and one alert says so.' }
            partitionColumn: { type: string }
            partitionColumnType: { type: string, enum: [date, timestamp, timestamptz] }
            nextRunAt: { type: [string, 'null'], format: date-time }
            lastRun:
              oneOf:
                - $ref: '#/components/schemas/PartitionRunSummary'
                - type: 'null'
            health: { $ref: '#/components/schemas/PartitionPolicyHealth' }
            createdBy: { type: string }
            updatedAt: { type: string, format: date-time }
    PartitionAction:
      type: object
      description: Added in 0.17.0. One action of a run or of a plan.
      required: [seq, kind, partition, state]
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [create, convert, drop, detach] }
        partition: { type: string }
        rangeFrom: { type: [string, 'null'], format: date-time }
        rangeTo: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [planned, running, done, failed, skipped], description: '`planned` appears only in a plan.' }
        detail: { type: [string, 'null'], description: 'For example `lock_timeout`, `retry_later`, `name_conflict`.' }
        bytesBefore: { type: [integer, 'null'], format: int64 }
        bytesAfter: { type: [integer, 'null'], format: int64 }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    PartitionRun:
      type: object
      description: Added in 0.17.0. A run of a policy, with its actions.
      required: [id, asOf, trigger, state, startedAt, finishedAt, startedBy, taskId, error, actions]
      properties:
        id: { type: integer, format: int64 }
        asOf: { type: string, format: date-time }
