  /rebalance:
    get:
      operationId: getRebalanceStatus
      summary: Get the current rebalance status
      description: |
        Whether a rebalance is needed, running, stopped or idle, with progress and the moves in flight.
        `progress` and `inFlightMoves` describe the current run and are null or empty while idle. A stopped run lists no move
        in flight and reports `movesInFlight` 0: a move that the loss of its source left unfinished is settled by the
        extension's recovery when the rebalance is started again. `lastReport` is the summary of the most recent finished or failed run other than the current one (the
        same object as the matching item of `GET /rebalance/reports`) and is null when no run has finished yet.

        **States (0.9.0).** `idle`: no run is unfinished and the last one did not fail. `running`: the task runs.
        `stopping`: an operator asked to stop; the run starts no new move, cancels the move in flight when it has
        not reached its switch and lets it finish when it has (a switch cannot be interrupted); the state ends
        when the move has. `stopped`: the task is `paused` (an operator stopped it, `stoppedBy` `operator`, or a
        condition of the cluster stopped it, `stoppedBy` `safetyRule`; `pausedReason` says why) and
        `POST /rebalance` goes on with it. `failed`: no run is unfinished and the most recent one ended failed
        (`lastReport.outcome`); it clears when a new run starts.

        `needed` and `reasons` are the same as `ClusterOverview.rebalance`: a server joined and holds no bucket, a
        server that should not hold shards still owns buckets, or buckets lack their replicas.
      tags: [Rebalance]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Rebalance status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebalanceStatus' }
              examples:
                running:
                  value:
                    state: running
                    needed: true
                    reasons: [serverAdded]
                    taskId: 118
                    startedAt: '2026-11-14T10:05:00Z'
                    options: { maxConcurrentMoves: 4 }
                    progress: { movesTotal: 340, movesDone: 120, movesInFlight: 4, movesFailed: 0, bytesMoved: 536870912, percent: 35.3 }
                    lastReport:
                      id: 101
                      outcome: completed
                      startedAt: '2026-11-10T08:00:00Z'
                      finishedAt: '2026-11-10T08:20:00Z'
                      options: { maxConcurrentMoves: 4 }
                      totals: { movesTotal: 64, movesDone: 64, movesFailed: 0, bytesMoved: 134217728, durationSeconds: 1200 }
                    inFlightMoves:
                      - { databaseName: shop, colocationId: 1, bucket: 17, fromShardGroupId: 1, toShardGroupId: 3, phase: copy, percent: 40, sizeBytes: 2097152 }
                idle:
                  value:
                    state: idle
                    needed: false
                    reasons: []
                    taskId: null
                    startedAt: null
                    options: null
                    progress: null
                    inFlightMoves: []
                    lastReport: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: startRebalance
      summary: Start (or resume) a rebalance
      description: |
        Starts a cluster-wide rebalance as a resumable task (kind `rebalance`, subject `cluster`/`cluster`), or
        starts a stopped one again (the same task: its moves so far stay in the report and the plan is computed again). Starting again
        is a new decision of a person: the attempts and the skips of the stopped round do not carry over (each move is checked again
        before it starts), and the options of the request replace the earlier ones (a request without databases means all
        databases). There is a
        single cluster-wide rebalance lock: returns 409 (`rebalance_in_progress`) when one is running. The strategy is
        "by bucket count": the extension's `kingres.rebalance_plan` is computed again before every move and the first
        move of it that is not backing off after a failure is made. **This version runs one move at a time**;
        `maxConcurrentMoves` is accepted and recorded and does not yet make moves run together.

        A move that fails is tried again up to three times, 30 s times the number of failures later, while the other
        buckets go on; a bucket that fails three times is given up, and the run then ends `failed` (its report lists
        every move). A run ends `completed` when no move is left; moves that were skipped (a group lost its lease or
        needs a synchronous standby it does not have, the target has little disk) are in the report and are not failures.

        **A start is refused, before any task exists, with the reason in the problem code (0.9.0):** 409
        `rebalance_in_progress` (a run is unfinished and not stopped); `operation_in_progress` (another task adds,
        removes or detaches a server, or a database import (`importDatabase`) is pending, running or paused); `failover_in_progress` (these two also when the other task is created at the same moment: the check and the creation are one step in the system database, so a rebalance and a server operation are never both created); `version_mismatch` (the servers do not run the same
        version of the sharding extension and the same PostgreSQL major); `cluster_inconsistent` (`kingres.check_cluster()`
        reports something that makes moving unsafe; the detail names it); `no_receiving_server` (no server should hold
        shards); `nothing_to_rebalance` (the plan is empty); `group_degraded` (0.27.0: a group has a standby that is behind its primary by more than `maxStandbyLagBytes`, or whose lag cannot be read; `force: true` overrides this and only this). The same conditions are checked again before every move; one
        that stops holding stops the run (`stopped`, `stoppedBy` `safetyRule`) instead of failing it. Returns 503
        (`map_group_unavailable`) while the map group is failing over.
      tags: [Rebalance]
      x-required-role: kingres_ops
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RebalanceOptions' }
            examples:
              default: { value: { maxConcurrentMoves: 4 } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
