      summary: Preview a rebalance plan
      description: |
        Computes (without changing anything) the bucket moves a rebalance would perform with the given
        options. Uses POST because the plan is computed on demand and may be expensive. At most `moveLimit`
        moves are listed; totals always cover the full plan.
