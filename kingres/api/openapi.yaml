            application/json:
              schema: { $ref: '#/components/schemas/ConfigChangePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/changes:
    get:
      operationId: listConfigChanges
      summary: List configuration changes
      description: |
        Added in 0.8.0. The history of changes made through `applyConfigChange` and `revertConfigChange`, newest first, with the
        old and the new value and the level. Keyset cursor over `changeId`.
      tags: [Configuration]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: name
          in: query
          description: Return only changes of this parameter.
          schema: { type: string, maxLength: 63 }
        - name: level
          in: query
          description: Return only changes at this level.
          schema: { $ref: '#/components/schemas/ConfigLevel' }
        - name: scopeId
          in: query
          description: Return only changes of this server group, server or database.
          schema: { type: string, maxLength: 253 }
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigChangeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: applyConfigChange
      summary: Change PostgreSQL parameters
      description: |
        Added in 0.8.0. Sets or removes the value of parameters at the cluster, server group, server or database level
        and starts the task `config.apply`: it checks the request again, records the change, then writes the
        override file of each server, checks it with PostgreSQL, reloads and reads the effective values back, one step
        per server. A parameter that needs a restart is reported `pendingRestart` per server; nothing is restarted
        (see `restartPendingInstances`). A server that is down is recorded as waiting and the task goes on and ends without it (changed in 0.16.0: before, the task waited for it and blocked every later change); the leader brings it up to date within a minute of its return
        (`listConfigServers` shows it as `waiting`). A server that fails does not stop the others: the task ends failed with `config_incomplete`, and the
        steps and `listConfigServers` say which servers applied, wait for a restart, failed or wait. Refused with 400
        `validation_failed` (a value that is not valid for its parameter; `errors[]` names the change) and 422
        `config_parameter_managed`, `config_parameter_refused`, `config_level_not_allowed` and `config_value_below_floor`;
        404 `not_found` for an unknown server group, server or database; 409 `config_change_superseded` when `expectedRevision` is older than a change of a value the request changes (0.16.0); 409 `operation_in_progress` while another
        configuration task runs. Nothing is written before every change has passed. A stored value can always be removed (`value: null`), also when its parameter has become managed or refused since it was set (0.16.0). The audit event has the checked changes with the old and the normalized new value, the servers and the task id; a refused request is audited with the names and levels only, never a value.
      tags: [Configuration]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigChangeRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/changes/{changeId}/revert:
    parameters:
      - $ref: '#/components/parameters/ConfigChangeId'
    post:
      operationId: revertConfigChange
      summary: Revert a configuration change
      description: |
        Added in 0.8.0. Makes a new change that puts the value at that change's level and scope back to what it was before
        (or removes it, when there was none), with the same checks and the same task as `applyConfigChange`. 404 for an
        unknown change; 409 `config_change_superseded` when a later change touched the same level, scope and
        parameter (revert the later one first); 400 `validation_failed` when the old value is no longer valid.
      tags: [Configuration]
      x-required-role: kingres_admin
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
