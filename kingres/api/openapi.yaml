openapi: 3.1.0
info:
  title: KingresDB Management API
  version: 0.33.0
  summary: REST API of the KingresDB management panel, CLI and manager.
  description: |
    The single REST API served by `kingresd` on every KingresDB server. The web panel
    (Vue/TypeScript) and `kingres-cli` are both clients of this API.

    Conventions (see `kingres/api/README.md` for the full text):

    * Base path `/api/v1`; plural kebab-case path segments; camelCase JSON properties.
    * Errors are RFC 9457 `application/problem+json` documents (`Problem`).
    * Long-running operations return `202 Accepted` with a `Task` and a `Location` header.
    * Large lists use cursor pagination (`limit`, `cursor`, `nextCursor`); every list response is an
      object with an `items` array.
    * `x-required-role` on every operation names the minimum built-in cluster role.
    * Shared responses are uniform: every authenticated operation lists 401, 403, 422 (`unsupported_operation`
      among others) and 503; every operation with a request body or query parameters lists 400; the
      unauthenticated operations (health, login, setup) list 429. Transport-level responses that apply to
      every path (405, unknown path 404, 500) are not repeated per operation.
    * Identity: an instance is identified by its `node_id`, a shard group by its `group_id` (the map group is
      group 0), a server by an opaque string (its host name or address as stored in `kingres.node.host`).
    * A response property that may legitimately be unknown to the server is nullable; `null` means
      "not available" and never stands for zero.
    * A mutating cluster operation received by a server that is not the manager leader is forwarded
      to the leader transparently; the response is the leader's response.
  contact:
    name: KingresDB maintainers
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://{host}:{port}/api/v1
    description: Any KingresDB server; the default targets the local server.
    variables:
      host:
        default: localhost
        description: Host name or address of the server.
      port:
        default: '8091'
        description: Panel and REST API port of the server (configurable).
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: Health
    description: Unauthenticated liveness and readiness probes.
  - name: Auth
    description: Sign in with a PostgreSQL role, sign out, inspect the current session.
  - name: Setup
    description: First-run wizard of an uninitialized server, guarded by the one-time setup token. The wizard reads the state and the setup task from `GET /setup/state`; it never needs a session.
  - name: This server
    description: Node-local pages. They keep working when the server is standalone or cut off from the cluster.
  - name: Cluster
    description: Cluster-wide overview used by the dashboard.
  - name: Servers
    description: Machines in the cluster (one machine is one distinct host of the catalog; its id is an opaque string), adding, draining, failover.
  - name: Server groups
    description: Racks or zones used to keep a shard group's primary and standbys apart.
  - name: Databases
    description: Create and manage databases with sharding, replication and ledger settings.
  - name: Tables
    description: Tables of a database and the distribute-table action.
  - name: Shards
    description: Bucket map, colocation groups and per-server bucket distribution.
  - name: Schemas
    description: Schemas of a database and the distributed schemas (a schema that lives in one shard group).
  - name: Replication
    description: Shard group topology, lag, replication slots, preferred primaries.
  - name: Rebalance
    description: Plan preview, start, stop, status and history reports.
  - name: Tasks
    description: Durable long-running operations.
  - name: Roles
    description: PostgreSQL roles, role membership and cluster-role assignment.
  - name: Grants
    description: Privileges on databases, schemas and tables, and grant templates.
  - name: Network access
    description: Client network rules (pg_hba style) applied on every server.
  - name: Audit
    description: Append-only audit log of sign-ins and administrative actions.
  - name: Settings
    description: Cluster-wide settings.
  - name: Ledger
    description: Tamper-evident ledger status, blocks, digests, verification and proofs.
  - name: Query
    description: SQL query workbench.
  - name: Alerts
    description: Cluster alerts.
  - name: Logs
    description: Cluster log search.
  - name: Metrics
    description: Time series for dashboard charts.
  - name: Configuration
    description: PostgreSQL parameters of the servers at the cluster, server group, server and database level, the clocks and time zones, and the restarts a change needs (0.8.0).

  - name: Data transfer
    description: Export a table to a CSV file and import a CSV file into a table (0.19.0). Files are staged on the manager leader, encrypted at rest and kept for a limited time; every operation needs `kingres_admin` and the cluster setting `dataTransfer.enabled`.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 as long as the `kingresd` process is running. No authentication.
      tags: [Health]
      security: []
      x-required-role: none
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              examples:
                ok: { value: { status: ok } }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 when this server can serve API requests for its current node state. An uninitialized
        server is ready (it serves the setup wizard). Returns 503 while the server is starting or stopping.
        No authentication.
      tags: [Health]
      security: []
      x-required-role: none
      responses:
        '200':
          description: The server is ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
              examples:
                ready:
                  value:
                    status: ready
                    nodeState: clustered
                    checks:
                      - { name: localPostgres, ok: true }
                      - { name: managerReachable, ok: true }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        Authenticates a PostgreSQL role by user name and password. The response sets the
        `kingres_session` cookie (HttpOnly, Secure, SameSite=Strict) and returns a CSRF token that
        browsers must send as `X-CSRF-Token` on every mutating request. With `issueToken` set to true the
        response also contains a bearer token for the CLI. The role must have `LOGIN` and be a member
        of at least one of the four cluster roles. The response also carries the cluster name and id so that
        every signed-in user (including one with only `kingres_stats`) can render the application shell.
        Rate limited (429).

        **A session belongs to the server that created it** (stated in 0.6.0; the server always behaved
        so). The cookie and the bearer token are random values that exist only in the memory of the server
        that answered `login`: the same value presented to another server of the cluster is answered
        401 `unauthenticated`, and a restart of the server ends its sessions. A client that talks to several
        servers (a load balancer, a failover to another address) signs in once per server and keeps one
        credential per address. Whichever server a request reaches, the cluster operations in it are run by
        the manager leader for the role of the session.
      tags: [Auth]
      security: []
      x-required-role: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              browser: { value: { username: alice, password: s3cret } }
              cli: { value: { username: alice, password: s3cret, issueToken: true } }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie `kingres_session`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                browser:
                  value:
                    username: alice
                    clusterRoles: [kingres_admin]
                    expiresAt: '2026-11-14T20:00:00Z'
                    csrfToken: 5b0d7c3e9a1f4e2c
                    serverId: 10.0.0.11
                    clusterId: 7d1f2c0e-3b2a-4d58-9c51-2f6f0a1b9e11
                    clusterName: prod
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Ends the current session or revokes the current bearer token and clears the cookie.
      tags: [Auth]
      x-required-role: kingres_stats
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/session:
    get:
      operationId: getSession
      summary: Get the current session
      description: |
        Returns the signed-in user, their cluster roles, the session expiry and the cluster name and id. The
        `csrfToken` in the response is the session's current token. This operation never rotates the token:
        the token changes only when a new session is created by `login`. For bearer authentication
        `csrfToken` is null.

        **Sessions belong to one server** (stated here from 0.6.0; the behaviour is older). A cookie or token
        issued by one server is unknown to every other server of the cluster (401 `unauthenticated` there); a
        client that talks to several servers signs in on each. `serverId` names the server that issued the session.

        **While the system database of this server is stopped** (`stopThisServerInstance`) this operation keeps
        working for a session this server has already checked since it started: it answers from memory with
        `degraded: true`, the roles of the last successful check (at most one hour old), the CSRF token and the
        cluster identity, so that a reloaded panel can learn which instance to start. A session this server never
        checked, a session of a role that was changed (`Changed` ends it), expired, or checked and refused, gets
        the same 503 `system_database_stopped` as every other operation.
      tags: [Auth]
      x-required-role: kingres_stats
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                browser:
                  value:
                    username: alice
                    clusterRoles: [kingres_stats]
                    expiresAt: '2026-11-14T20:00:00Z'
                    csrfToken: 5b0d7c3e9a1f4e2c
                    serverId: 10.0.0.11
                    clusterId: 7d1f2c0e-3b2a-4d58-9c51-2f6f0a1b9e11
                    clusterName: prod
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /setup/state:
    get:
      operationId: getNodeState
      summary: Get the setup state of this server
      description: |
        Returns whether this server is `uninitialized`, `standalone` or `clustered`. Needs no authentication
        so that the panel can decide between the wizard and the login page.

        This is also the only endpoint the setup wizard polls. While or after `initCluster` or
        `joinCluster` has been accepted, `setupTask` summarizes that task (id, kind, state, progress
        percent, error); it is null while no setup task exists. `setupTask` stays available after the task
        finished, and after the node left `uninitialized`, so the wizard needs neither the setup token (it is
        consumed on success) nor a session (`GET /tasks/{taskId}`) to learn the outcome. A failed setup task
        leaves the node `uninitialized` with the setup token still valid, so the wizard can retry.
      tags: [Setup]
      security: []
      x-required-role: none
      responses:
        '200':
          description: Node state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeStateInfo' }
              examples:
                fresh:
                  value:
                    state: uninitialized
                    address: 10.0.0.11:8091
                    hostname: db1
                    version: 1.0.0
                    postgresVersion: '18.1'
                    setupTokenRequired: true
                    localhostOnly: true
                    serverId: null
                    clusterId: null
                    setupTask: null
                initRunning:
                  summary: init-cluster accepted and running
                  value:
                    state: uninitialized
                    address: 10.0.0.11:8091
                    hostname: db1
                    version: 1.0.0
                    postgresVersion: '18.1'
                    setupTokenRequired: true
                    localhostOnly: true
                    serverId: null
                    clusterId: null
                    setupTask: { id: 1, kind: cluster.init, state: running, progressPercent: 40, steps: [{ name: Create instance, state: done }, { name: Create roles, state: running }], createdAt: '2026-11-14T10:00:00Z', updatedAt: '2026-11-14T10:00:20Z', error: null }
                initDone:
                  summary: init-cluster finished; the wizard can now show the login page
                  value:
                    state: clustered
                    address: 10.0.0.11:8091
                    hostname: db1
                    version: 1.0.0
                    postgresVersion: '18.1'
                    setupTokenRequired: false
                    localhostOnly: false
                    serverId: 10.0.0.11
                    clusterId: 7d1f2c0e-3b2a-4d58-9c51-2f6f0a1b9e11
                    setupTask: { id: 1, kind: cluster.init, state: done, progressPercent: 100, steps: [{ name: Create instance, state: done }, { name: Create roles, state: running }], createdAt: '2026-11-14T10:00:00Z', updatedAt: '2026-11-14T10:00:20Z', error: null }
                initFailed:
                  summary: init-cluster failed; the token is still valid, retry is possible
                  value:
                    state: uninitialized
                    address: 10.0.0.11:8091
                    hostname: db1
                    version: 1.0.0
                    postgresVersion: '18.1'
                    setupTokenRequired: true
                    localhostOnly: true
                    serverId: null
                    clusterId: null
                    setupTask: { id: 1, kind: cluster.init, state: failed, progressPercent: 55, steps: [{ name: Create instance, state: done }, { name: Initialize map group, state: failed }], createdAt: '2026-11-14T10:00:00Z', updatedAt: '2026-11-14T10:00:20Z', error: { code: step_failed, message: 'Cannot create the data directory /var/lib/kingresdb/data.', step: Initialize map group, retryable: true } }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /setup/init-cluster:
    post:
      operationId: initCluster
      summary: Create a new cluster on this server
      description: |
        Only valid while the node state is `uninitialized`. Creates the administrator account, initializes
        the map group primary and the first shard group primary, and starts a single-member etcd.
        Requires the one-time setup token in the `X-Setup-Token` header. The token is consumed on success.
        Rate limited (429). The 202 response carries the task as for every long-running operation, but the
        wizard must not poll it: it polls `GET /setup/state` and reads `setupTask` (no credentials needed,
        also after the token was consumed). `GET /tasks/{taskId}` needs a session and is usable only after
        sign-in.
      tags: [Setup]
      security:
        - setupToken: []
      x-required-role: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitClusterRequest' }
            examples:
              default:
                value:
                  clusterName: prod
                  admin: { username: kingres_root, password: change-me-please }
                  dataPaths: { dataDirectory: /var/lib/kingresdb/data }
                  memoryQuota: { totalMegabytes: 8192 }
                  features: { sharding: true, ledger: true }
                  defaultReplicaCount: 1
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /setup/join-cluster:
    post:
      operationId: joinCluster
      summary: Join an existing cluster
      description: |
        Only valid while the node state is `uninitialized`. Registers this server with the manager leader
        of the cluster reachable at `existingNodeAddress`, receives the cluster certificates and
        configuration, creates the primary of a new shard group and the standby of a neighboring group.
        The server then appears as `pendingRebalance`; no data moves until a rebalance is started.
        Requires the one-time setup token of THIS server in `X-Setup-Token`. Rate limited (429). As for
        `initCluster`, progress is reported by `setupTask` of `GET /setup/state`, not by `GET /tasks/{taskId}`.
      tags: [Setup]
      security:
        - setupToken: []
      x-required-role: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinClusterRequest' }
            examples:
              default:
                value:
                  existingNodeAddress: 10.0.0.11:8091
                  admin: { username: kingres_root, password: change-me-please }
                  dataPaths: { dataDirectory: /var/lib/kingresdb/data }
                  serverGroup: rack-b
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /setup/token-check:
    post:
      operationId: checkSetupToken
      summary: Check the setup token
      description: |
        Verifies the one-time setup token without changing anything, so the wizard can reject a wrong token
        before the user fills in the whole form. The token is not consumed. Valid only while the node state is
        `uninitialized` (otherwise 422 `node_state_invalid`). Rate limited (429): repeated wrong tokens are
        throttled like any other setup call.
      tags: [Setup]
      security:
        - setupToken: []
      x-required-role: none
      responses:
        '204': { description: The setup token is valid. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /this-server:
    get:
      operationId: getThisServer
      summary: Get this server
      description: Node-local summary served by the server that receives the request, including service status.
      tags: [This server]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Local server information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalServerInfo' }
              examples:
                clustered:
                  value:
                    serverId: 10.0.0.11
                    address: 10.0.0.11:8091
                    hostname: db1
                    version: 1.0.0
                    postgresVersion: '18.1'
                    nodeState: clustered
                    clusterId: 7d1f2c0e-3b2a-4d58-9c51-2f6f0a1b9e11
                    uptimeSeconds: 86400
                    isManagerLeader: true
                    services:
                      - { name: api, state: running, since: '2026-11-13T08:00:00Z' }
                      - { name: agent, state: running, since: '2026-11-13T08:00:00Z' }
                      - { name: etcd, state: running, since: '2026-11-13T08:00:01Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/resources:
    get:
      operationId: getThisServerResources
      summary: Get disk, memory and CPU of this server
      description: Current resource usage of the machine and its configured memory quota.
      tags: [This server]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Resource usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerResources' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/instances:
    get:
      operationId: listThisServerInstances
      summary: List local PostgreSQL instances
      description: |
        Instances running on this server with their roles (primary or standby of a shard group).

        While the system database of this server is stopped (`stopThisServerInstance`) this operation answers from
        the memory of this server, like `getSession`: the list of the last successful read, with `state` taken from
        the instance manager and `sizeBytes` and the replication lags null. If this server never read the list,
        or the session was never checked, it answers 503 `system_database_stopped`.
      tags: [This server]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Local instances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/instances/{instanceId}:
    parameters:
      - $ref: '#/components/parameters/InstanceId'
    get:
      operationId: getThisServerInstance
      summary: Get a local instance
      description: Details of one PostgreSQL instance on this server.
      tags: [This server]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/instances/{instanceId}/restart:
    parameters:
      - $ref: '#/components/parameters/InstanceId'
    post:
      operationId: restartThisServerInstance
      summary: Restart a local instance
      description: |
        Restarts one local PostgreSQL instance. Restarting a primary interrupts its writes. Answers 409
        `no_replica_available` when the instance is the only up-to-date copy of a shard group (replicas exist
        that are not caught up), unless `force` is true; 409 `operation_in_progress` when another start, stop
        or restart of this instance is running; 409 `instance_already_stopped` when the instance is stopped
        (use `startThisServerInstance`). Restarting the instance that hosts the system database is allowed
        (the task step that writes to it retries for 30 seconds).
      tags: [This server]
      x-required-role: kingres_ops
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceActionRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/instances/{instanceId}/stop:
    parameters:
      - $ref: '#/components/parameters/InstanceId'
    post:
      operationId: stopThisServerInstance
      summary: Stop a local instance
      description: |
        Stops one local PostgreSQL instance. The agent does not restart it until `startThisServerInstance`
        is called. Conflicts (409): `instance_already_stopped` (the instance is `stopped` or `stopping`),
        `operation_in_progress` (another start, stop or restart of this instance is running),
        `no_replica_available` (the instance is the only up-to-date copy of a shard group and replicas exist
        that are not caught up; `force: true` overrides this and only this).

        **The instance that hosts the system database** (the primary of the map group, on the server of the
        manager leader; it holds the tasks and answers the role checks of every request) **may be stopped
        like any other**; it needs no flag. The request is accepted with 202 and its task is recorded as
        `done` immediately before the shutdown is requested (no write is possible afterwards); the task is
        corrected to `failed` if the instance does not stop. The API keeps answering from this process
        while the instance is stopped, but every operation that needs the system database or a role check
        in PostgreSQL, that is `login` and every authenticated operation except the three listed here,
        answers **503 `system_database_stopped`** until the instance runs again. **The operations that work in this
        state** (from 0.6.0; an existing session whose roles this server checked before the stop is needed for all of
        them) are `startThisServerInstance`, `getSession` (answer marked `degraded`) and `listThisServerInstances`
        (answer from memory); no other operation, `getThisServerInstance` included. The state begins when the stop (or
        a restart) is accepted, not when PostgreSQL ends the connections, so `system_database_stopped` is the only
        503 a client sees in that window (an older revision could answer `service_unavailable` for about a second). `getHealth`,
        `getReadiness` and `getNodeState` keep answering. A server that forwards a mutating operation to
        this leader relays the same 503.
      tags: [This server]
      x-required-role: kingres_ops
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceActionRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/instances/{instanceId}/start:
    parameters:
      - $ref: '#/components/parameters/InstanceId'
    post:
      operationId: startThisServerInstance
      summary: Start a local instance
      description: |
        Starts a stopped local PostgreSQL instance. Conflicts (409): `instance_already_running` (the
        instance is `running`, `starting` or `restarting`) and `operation_in_progress` (another start, stop
        or restart of this instance is running).

        This operation **keeps working while the system database is stopped** (see
        `stopThisServerInstance`). For it (and, from 0.6.0, for `getSession` and `listThisServerInstances`) the session or bearer token is checked in memory and the
        cluster roles of the last successful role check are used instead of failing closed with 503. A
        sign-in that was valid before the stop therefore still works; a new sign-in is impossible until the
        instance runs (`login` answers 503 `system_database_stopped`), and when no valid session exists the
        operator has to start the instance on the machine. The task is written to the system database once
        it is back; until then it exists only in the memory and the log of this process and `getTask`
        answers 503.
      tags: [This server]
      x-required-role: kingres_ops
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/settings:
    get:
      operationId: getThisServerSettings
      summary: Get local settings
      description: |
        Data paths, memory quota, log level and client ports that apply to this server only. Answered from
        this server's own configuration, also when it is standalone. `restartRequired` is true from the
        moment a saved change needs a restart of this server's instances until they have been restarted
        (`restartThisServerInstance` on each); it is a persistent state, not a flag of one response.
      tags: [This server]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Local settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateThisServerSettings
      summary: Update local settings
      description: |
        Changes the memory quota, log level or log directory of this server (partial update: only the
        members present change; `logDirectory: null` selects the system default). Data paths and client
        ports cannot be changed: a request with any other member is refused with 400 `validation_failed`
        (`errors[].field` names it). The change is saved and applied at once where possible and the
        response is the whole `LocalSettings` after the change:

        * `logLevel` takes effect at once; it never sets `restartRequired`.
        * `memoryQuota` and `logDirectory` are written to the managed configuration and take effect when
          the instances of this server are restarted; the response has `restartRequired: true`. A value
          equal to the current one changes nothing.
        * A `memoryQuota` the machine cannot hold (more than its physical memory when that is known) and a
          `logDirectory` that is not an absolute path to an existing directory the server can write to are
          refused with 422 `unprocessable` (`errors[].field` names the member); nothing is changed.
        Changes are audited (`updateThisServerSettings`). The operation is local: it is never forwarded to
        the leader.
      tags: [This server]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalSettingsUpdate' }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/leave-cluster:
    post:
      operationId: leaveCluster
      summary: Leave the cluster
      description: |
        Detaches this server from the cluster and returns it to the `uninitialized` state: it deletes its instance,
        its key and its certificates, forgets the cluster and gets a new setup token, so that it can join or be
        added again (corrected in 0.5.0: 0.4.0 said `standalone`, which the server never did). Conflicts (409),
        checked in this order against this server's copy of the catalog:

        1. `last_server`: this is the only server of the cluster.
        2. `server_hosts_map_group`: this server hosts an instance of the map group (shard group 0), that is
           it is, or hosts the standby of, the manager leader's catalog. Move the map group first.
        3. `server_owns_buckets`: this server holds a copy (primary or replica) of any bucket of any
           database. Drain it first: `PATCH /servers/{serverId}` with `shouldHaveShards: false`, then
           `POST /rebalance`.
        4. `rebalance_in_progress` while a rebalance runs, and `operation_in_progress` when another task of
           this server (add, remove, leave) runs.

        `force: true` only lifts the requirement that the rest of the cluster is reachable: the three
        checks above are still made, from the local copy of the catalog, and a refusal is final. A server
        that left with `force` while the cluster was unreachable is still listed by the cluster until it
        is removed or failed over from there (`removeServer`).

        **Answer of a forced leave without a leader (0.5.0 wording of what 0.4.0 left unsaid).** With `force: true`
        and a manager leader that cannot be reached or is not known, or that refuses the certificate of this server
        because it was revoked (`revokeServerCertificates`), no task can exist anywhere, so the answer is `202`
        with a `Task` whose `kind` is `server.leave`, `state` is `done`, `id` is `0` and which has one step; its
        `Location` names a task that cannot be fetched (`GET /tasks/0` answers 404, here and on every server). The
        server resets itself about a second after the answer. Without `force` the same situation is 503
        `service_unavailable` and the server stays a member.
      tags: [This server]
      x-required-role: kingres_admin
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveClusterRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /this-server/logs:
    get:
      operationId: listThisServerLogs
      summary: List local logs
      description: |
        Log entries of this server (agent, manager, router, etcd, Patroni, PostgreSQL instances), newest first.
        Requires `kingres_ops`: PostgreSQL's log can contain data values (constraint violations, error details) of
        statements run by other roles. The text of statements is not written to the log of managed instances.
      tags: [This server]
      x-required-role: kingres_ops
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SearchText'
      responses:
        '200':
          description: A page of log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

