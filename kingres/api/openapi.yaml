    put:
      operationId: distributeTable
      summary: Distribute a table
      description: |
        Turns a plain table into a hash-distributed table (by a distribution column) or a reference table
        (copied to every shard group). Requires sharding to be enabled on the database. A hash-distributed
        table needs a primary key or unique key that includes the distribution column. The existing rows
        are moved to their buckets; the table can be a ledger table at the same time. Long-running: returns a task.
      tags: [Tables]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistributeTableRequest' }
            examples:
              hash: { value: { method: hash, distributionColumn: customer_id } }
              reference: { value: { method: reference } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
