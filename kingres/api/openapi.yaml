        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /server-groups/{serverGroupName}:
    parameters:
      - $ref: '#/components/parameters/ServerGroupName'
    delete:
      operationId: deleteServerGroup
      summary: Delete a server group
      description: |
        Deletes an empty server group and answers 204. Answers 404 for an unknown group and 409
        `server_group_not_empty` while any server is still assigned to it (including a server that is
        `draining` or `dead`); the problem `detail` lists the server ids. Move or unassign them first
        (`PATCH /servers/{serverId}` with `serverGroup`). Nothing is deleted when the answer is 409.
      tags: [Server groups]
      x-required-role: kingres_ops
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /database-create-options:
    get:
      operationId: getDatabaseCreateOptions
      summary: Get the options of the create-database dialog
      description: |
        Returns what the create-database dialog may offer: the valid encodings and collations, the default
        bucket count and its allowed range, the default durability and the cluster's replica count (a
        cluster setting, shown for information; see `PATCH /settings/cluster`). Static for a given
        server version except `replicaCount` and `defaultDurability`, which follow the cluster settings.
      tags: [Databases]
      x-required-role: kingres_readonly
      responses:
