      summary: Get a task
      description: |
        Current state and progress of a task. Needs a session or bearer token like every other operation.
        The tasks created by `initCluster` and `joinCluster` are readable here only after sign-in; before
        sign-in the setup wizard reads their `setupTask` summary from `GET /setup/state`. The mapping between
