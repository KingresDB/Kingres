  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts
      description: |
        Alerts of the whole cluster, newest first, from any server: each server keeps the alerts about itself,
        and the server that receives the request asks the others for theirs in parallel (see `partial` and
        `missingServers` of `AlertPage`). The alerts about the cluster as a whole (`versionMismatch`) are kept by
        the manager leader. An alert `id` is unique in the cluster and names the server that holds the alert (the
        high bits are that server's number), so `PUT /alerts/{alertId}/acknowledgement` can be sent to any
        server. Cursors are keyset cursors over one order (time raised, then id): a page boundary is the same
        whichever servers answered; a cursor of 0.4.0 is refused with 400 `validation_failed`.
      tags: [Alerts]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          description: Return only alerts in this state.
          schema: { $ref: '#/components/schemas/AlertState' }
        - name: severity
          in: query
          description: Return only alerts with this severity.
          schema: { $ref: '#/components/schemas/AlertSeverity' }
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
              examples:
                one:
                  value:
                    items:
                      - { id: 55, kind: replicationLagHigh, severity: warning, state: open, title: Replication lag is high, message: Standby on server 10.0.0.12 is 120 MB behind., serverId: 10.0.0.12, databaseName: null, raisedAt: '2026-11-14T09:50:00Z', acknowledgedAt: null, acknowledgedBy: null, resolvedAt: null }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /alerts/{alertId}/acknowledgement:
    parameters:
      - name: alertId
        in: path
        required: true
        description: Alert identifier.
        schema: { type: integer, format: int64 }
    put:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      description: Marks an open alert acknowledged by the caller. Idempotent for an already acknowledged alert; 409 for a resolved one.
      tags: [Alerts]
      x-required-role: kingres_ops
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /logs:
    get:
      operationId: listLogs
      summary: Search cluster logs
      description: |
        Log entries from every server, newest first, from any server: the server that receives the request asks the
        others for their part in parallel (each has a deadline; the servers that did not answer are named in
        `missingServers`, `partial` is then true). `level` keeps the entries at that level or more severe and `q`
        the entries whose message contains the text (case-insensitive). For one server only, filter by `serverId` or
        use `/this-server/logs`. Entries are ordered by time, then by server id, and the cursor is a position in
        that order, so paging is stable across servers. Requires `kingres_ops` (see `listThisServerLogs`); the role
        is checked again by every server that answers.
      tags: [Logs]
      x-required-role: kingres_ops
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SearchText'
        - name: serverId
          in: query
          description: Return only entries of this server.
          schema: { $ref: '#/components/schemas/ServerId' }
      responses:
        '200':
          description: A page of log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
              examples:
                one:
                  value:
                    items:
                      - { timestamp: '2026-11-14T09:59:58Z', level: warning, component: manager, serverId: 10.0.0.11, instanceId: null, message: heartbeat from server 10.0.0.12 is late }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /metrics/query:
    get:
      operationId: queryMetrics
      summary: Query a metric time series
      description: |
        Returns one or more series of a named metric for dashboard charts, resampled to `step` seconds.
        Without a filter the cluster aggregate is returned (sum for counters and sizes, average for
        percentages). With `serverId` or `databaseName` the series is restricted; with `groupBy` one series per
        server or database is returned. At most 5000 points per series (422 otherwise).
        The series are those of the whole cluster, from any server: each server answers with its own samples and the
        receiving server combines them (a database that several servers report is summed or averaged like the
        servers); a server that did not answer is named in `missingServers` (`partial` is then true).

        **A metric that nobody samples (0.9.0 states it).** The client entry point metrics (`client...`, `clientStandby...`)
        exist only while the entry point of a server is on; while it is off on every server, the metric is still a valid name
        and the answer is 200: without a filter the one cluster series whose points all have `value: null` ("not
        available", never zero), with `groupBy` or a filter that matches nothing `series: []`. It is not an error and not
        a series of zeros; a chart shows "no data".
      tags: [Metrics]
      x-required-role: kingres_stats
      parameters:
        - name: metric
          in: query
          required: true
          description: Metric name.
          schema: { $ref: '#/components/schemas/MetricName' }
        - name: from
          in: query
          required: true
          description: Start of the range (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the range (exclusive); must be after `from`.
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: true
          description: Resolution in seconds.
          schema: { type: integer, minimum: 1, maximum: 86400 }
        - name: serverId
          in: query
          description: Restrict to one server.
          schema: { $ref: '#/components/schemas/ServerId' }
        - name: databaseName
          in: query
          description: Restrict to one database (only database-scoped metrics).
          schema: { type: string }
        - name: groupBy
          in: query
          description: Return one series per server or per database.
          schema: { type: string, enum: [server, database] }
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricQueryResult' }
              examples:
                cpu:
                  value:
                    metric: cpuUsagePercent
                    unit: percent
                    from: '2026-11-14T09:00:00Z'
                    to: '2026-11-14T09:02:00Z'
                    step: 60
                    series:
                      - labels: { serverId: 10.0.0.11 }
                        points:
                          - { timestamp: '2026-11-14T09:00:00Z', value: 17.2 }
                          - { timestamp: '2026-11-14T09:01:00Z', value: 18.9 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /databases/{databaseName}/export:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    post:
      operationId: exportDatabase
      summary: Export a database to one archive
      description: |
        Added in 0.29.0 (data transfer, phase 14b). Starts the task `database.export` (subject type `database`, id the database name): the structure, the KingresDB
        catalog (how every table is distributed, its access method, ledger and time-partition policies, sequences) and the data of every table are written to one **zip archive**
        that is staged on the manager leader, sealed (encrypted at rest) and kept for `retentionHours`. The answer is the task; when it is `done` its `detail` is `transfer <id>` and
        `getDataExport` (kind `databaseExport`, format `archive/1`) says size, rows, SHA-256 and the consistency label of every table; `downloadDataExport` serves the file as `application/zip`.
        Nothing is imported by this version: the archive is for inspection (`validateDatabaseArchive`) and for loading by hand. Importing an archive is a later revision.

        The archive holds exactly these entries and no others: `manifest.json` (written last: versions, locale, extensions, the SHA-256 and the columns of every entry, warnings), `catalog.json`,
        `schema/pre-data.sql`, `schema/views.sql`, `schema/post-data.sql` and `data/NNNNN.csv`, one per table (a partition tree is one entry, its root; leaves are structure only). The structure is the
        schema-only output of `pg_dump` of the same PostgreSQL build, taken by the service role in a read-only transaction and rewritten by a closed set of rules; data is read as the signed-in role
        through `COPY (SELECT ...)` as UTF-8 CSV with a distinct null marker (an empty string and a null differ). **What the archive does not carry** is listed in the manifest's `warnings` and refused
        where it would make the archive misleading: large objects and `oid` or `reg*` columns (422 `large_objects_present`, unless `acknowledgeLargeObjectsLost` is true); roles, tablespaces,
        policies, rules, event triggers, functions, triggers, publications, foreign objects, extended statistics, collations and unlogged tables (422 `schema_unrecognised`, naming the kind).
        Ledger tables are carried as data and restart their chain when imported (ADR 0028); the history of an updatable ledger table is exported for the record.

        Needs `kingres_admin`, the cluster setting `dataTransfer.enabled` (403 `data_transfer_disabled`), a request over TLS (403 `insecure_transport`), and the PostgreSQL privileges `USAGE` on every
        schema and `SELECT` on every table (and column) of the database for the signed-in role: otherwise 422 `export_not_readable`, whose `reasons` name the first 20 objects the role cannot read (the detail says how many more), and nothing is written.
        404: the database does not exist. 409 `operation_in_progress`: a table task or another database export or import is unfinished in this database, or the transfer limit is reached;
        409 `transfer_quota_exceeded` and `insufficient_disk` as for `exportTable`. While the task runs, table tasks of the database are refused with 409 `operation_in_progress`.

        Consistency: when every table is local, reference or on the group of the connection, the data is read in one `REPEATABLE READ` read-only transaction (`archive-single-snapshot`); otherwise each table is one
        statement and the label of each table is as for `exportTable` (`single-snapshot` or `per-group`). **There is no global snapshot.** The structure is fingerprinted at the start and at the end: a table or a
        column that changed in between fails the task with the code `schema_changed` and no file is kept.
        Steps of the task: *Check the request*, *Take the structure*, *Normalise the schema*, *Write the data*, *Check the archive*, *Seal*.
        Task codes: `schema_changed`, `schema_unrecognised`, `export_too_large`, `insufficient_disk`, `transfer_quota_exceeded`, `transfer_timeout`, `transfer_leader_changed` (retryable), `transfer_session_lost` (retryable),
        `transfer_key_lost`, `copy_interrupted` (retryable), `forbidden`, `cancelled`. The error of a task never carries a value, a row or text of the server.
      tags: [Data transfer]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportDatabaseRequest' }
            examples:
              defaults: { summary: Everything, value: {} }
              structure: { summary: The structure and the catalog only, value: { dataMode: none, retentionHours: 48 } }
              leaveOut: { summary: One table without its rows, value: { excludeTables: [{ schema: public, table: audit_log }] } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedDatabaseExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/DataTransferConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /data-uploads:
    post:
      operationId: createDataUpload
      summary: Start a resumable upload
      description: |
        Added in 0.19.0 (data transfer, phase 14a). Creates an upload: a file that the console or a client sends in chunks (`uploadDataChunk`) and that an import then uses
        (`importTable`). The size is declared and the staging quota is reserved when the upload is created. `purpose` is `tableImport` (0.20.0 adds `databaseArchive`).
        `fileName` is for display only and is never used in a path. `sha256` is for command-line clients that hash the file first; a browser cannot hash a large file
        incrementally, so the server computes the SHA-256 itself when the last byte is in and compares it with the declared one (422 `upload_checksum_mismatch`, the upload is deleted).
        The answer says the chunk rules: `chunkBytesMax` (at most 256 MiB, 64 MiB offered) and `chunkAlign` (65536: every chunk but the last is a multiple of it).

        Needs `kingres_admin`, `dataTransfer.enabled` (403 `data_transfer_disabled`) and a request over TLS (403 `insecure_transport`). 409 `transfer_quota_exceeded`: the declared
        size does not fit into the quota. 400 `validation_failed` on `/sizeBytes` when the size is above `maxFileBytes`, and 409 `insufficient_disk`. Only the creator can read, continue or delete the upload.
        An upload that received nothing for 48 hours, or that was complete and was not used for 24 hours, is deleted; `getDataUpload` then answers 404.
      tags: [Data transfer]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDataUploadRequest' }
            examples:
              csv: { summary: A 3 GiB file, value: { purpose: tableImport, sizeBytes: 3221225472, fileName: orders-2026-11.csv } }
              hashed: { summary: A file whose SHA-256 is known, value: { purpose: tableImport, sizeBytes: 1048576, sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 } }
      responses:
        '201':
          description: The upload, at offset 0.
          headers:
            Location:
              description: URL of the upload, `/api/v1/data-uploads/{uploadId}`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataUpload' }
              examples:
                created:
                  value:
                    uploadId: '42'
                    state: receiving
                    sizeBytes: 3221225472
                    offset: 0
                    chunkBytesMax: 67108864
                    chunkAlign: 65536
                    sha256: null
                    expiresAt: '2026-11-24T09:58:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/DataTransferConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /data-uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      operationId: getDataUpload
      summary: Read an upload
      description: |
        Added in 0.19.0 (data transfer, phase 14a). The state of an upload and the **offset** at which the next chunk must start. The server reads the offset from the staged
        file (the whole sealed segments), never from the record, so it is right after a crash; a client that lost its place asks here and continues. `sha256` is set once the
        upload is complete. 404 for an upload that does not exist, that belongs to another role, or that was lost (the console starts a new one).
      tags: [Data transfer]
      x-required-role: kingres_admin
      responses:
        '200':
          description: The upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataUpload' }
              examples:
                receiving:
                  value:
                    uploadId: '42'
                    state: receiving
                    sizeBytes: 3221225472
                    offset: 134217728
                    chunkBytesMax: 67108864
                    chunkAlign: 65536
                    sha256: null
                    expiresAt: '2026-11-24T09:58:00Z'
                complete:
                  value:
                    uploadId: '43'
                    state: complete
                    sizeBytes: 1048576
                    offset: 1048576
                    chunkBytesMax: 67108864
                    chunkAlign: 65536
                    sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    expiresAt: '2026-11-23T10:15:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: uploadDataChunk
      summary: Send one chunk of an upload
      description: |
        Added in 0.19.0 (data transfer, phase 14a). Appends one chunk. `x-streams: upload`: the body is streamed to the manager leader without being held in memory by any server, the
        request is not subject to the 30 s request timeout and the 1 MiB body limit of the other operations (an idle limit of 60 s and a limit of 15 minutes per chunk apply), and a
        follower relays it to the leader. The header `Upload-Offset` must equal the server's offset (409 `upload_offset_mismatch`; the response header `Upload-Offset` has the right one).
        `Content-Length` is needed, is at most `chunkBytesMax` (413 `chunk_too_large`; also for a chunk that reaches past `sizeBytes`) and is a **multiple of 65536 unless the chunk is the last one**
        (400 `validation_failed` on `Content-Length`). A request that breaks off keeps the whole sealed segments it delivered and drops the rest; the client reads the offset with `getDataUpload` and
        continues. The answer is 204 with the new `Upload-Offset`; after the last chunk the server computes the SHA-256 of the file (422 `upload_checksum_mismatch` when it differs from the declared one;
        the upload is deleted) and the upload is `complete`. Two chunks at one offset: one wins, the other gets 409. Needs `kingres_admin`, `dataTransfer.enabled` and a request over TLS. A chunk is not an audit event.
      tags: [Data transfer]
      x-required-role: kingres_admin
      x-streams: upload
      parameters:
        - $ref: '#/components/parameters/UploadOffset'
      requestBody:
        required: true
        description: The bytes of the chunk. The example is the first chunk of an upload (a multiple of 65536 bytes).
        content:
          application/octet-stream:
            schema: { type: string, format: binary, description: The bytes of the chunk. }
            examples:
              firstChunk: { summary: "The first chunk of a file; the header is Upload-Offset 0", value: 'id,customer,total\n1,Ada,12.50\n' }
      responses:
        '204':
          description: The chunk was stored. `Upload-Offset` is the next offset (the size of the file when it is complete).
          headers:
            Upload-Offset:
              description: The offset at which the next chunk must start.
              schema: { type: integer, format: int64, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/UploadOffsetMismatch' }
        '413': { $ref: '#/components/responses/ChunkTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteDataUpload
      summary: Delete an upload
      description: |
        Added in 0.19.0 (data transfer, phase 14a). Deletes the staged file and frees the reservation. 404 for an upload that does not exist or belongs to another role; 409
        `operation_in_progress` while a task uses the upload.
      tags: [Data transfer]
      x-required-role: kingres_admin
      responses:
        '204': { description: The upload was deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/DataTransferConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /data-uploads/{uploadId}/validation:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: validateDatabaseArchive
      summary: Validate an uploaded database archive
      description: |
        Added in 0.29.0 (data transfer, phase 14b). Starts the task `archive.validate` (subject type `upload`, id the upload id) for a complete upload whose purpose is
        `databaseArchive`. It reads the archive once from end to end and **touches no database**: the shape of the zip file (the local headers against the central directory, the descriptors, that the extents
        account for every byte, the names, the sizes counted while reading), the SHA-256 and the CRC-32 of every entry against the manifest, the manifest and the catalog document (strict JSON, closed members, identifiers),
        that the columns of each data entry equal the columns of the schema, the versions (format, PostgreSQL major, extensions, locale) and, with the shape grammar in its validate-only mode, every statement of the three SQL files
        (`statements` of the report; nothing is run). The result is the **archive report** (`ArchiveReport`), stored with the upload (`getDataUpload` returns it as `report`, the state is `valid` or `invalid`)
        and cached by the SHA-256 of the file. An archive that is not valid is not an error of the request: the task is `done` and the report says `valid: false` with the `reasons`.
        The text of a statement of the archive is never shown: the report names the kind, the position and a fingerprint (the length and a hash prefix).

        Needs `kingres_admin`, `dataTransfer.enabled` and a request over TLS. 404: the upload does not exist or is another role's. 409 `upload_incomplete`: bytes are missing; 409 `operation_in_progress`: a task uses the upload or the
        transfer limit is reached. 422 `validation_failed`: the purpose of the upload is not `databaseArchive`.
        Steps: *Check the upload*, *Read the archive*, *Check the plan*, *Store the report*. The task cannot change the archive, so it is always safe to repeat.
      tags: [Data transfer]
      x-required-role: kingres_admin
      responses:
        '202': { $ref: '#/components/responses/AcceptedArchiveValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/DataTransferConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /database-imports:
    post:
      operationId: importDatabase
      summary: Import a database archive as a new database
      description: |
        Added in 0.30.0 (data transfer, phase 14c). Starts the task `database.import` (subject type `database`, id the name of the new database): the archive of a complete upload
        (purpose `databaseArchive`, made by `exportDatabase`) is loaded into a **new** database. The archive is **hostile input**: the task reads it again from its bytes (the whole validator and the shape grammar, then
        the SHA-256 against `expectedSha256`), whatever `validateDatabaseArchive` said before. The SQL of the archive is never run as it is: a **shape grammar** accepts only the statements `pg_dump` writes for
        schemas, tables, sequences, types, domains, indexes, constraints, views and comments, and **refuses** functions, triggers, policies, rules, `GRANT`, `SET`, `ALTER DATABASE`, `COPY`, `DO` and everything else
        (422 `archive_statement_refused`; `reasons` name the kind, the position and a fingerprint, never the text). There is no `allowCode` and no `privileges: restore`: every object is owned by the importing role.
        The statements run **as the signed-in role**, one per round trip, never as the service role, so PostgreSQL's privileges are the guarantee; a role with `SUPERUSER`, `REPLICATION` or `BYPASSRLS`, or with access to
        server files, programs or logs, is refused with 403 `forbidden` and must sign in as another role. The extensions of the archive are installed from a closed list.

        The import works in a database with a **private name** (`kingres_import_<task id>`) that only the task uses, and renames it to its final name as its last step; a failed or cancelled import drops the private database
        (unless `keepOnFailure`), and nothing of the final name exists. Order: the extensions, the tables, the distribution of the tables **while they are empty**, the views, the data (one transaction per table, the rows
        counted against the manifest), the indexes and constraints, the sequences, then the ledger and the time-partition policies. **Ledger tables are carried as data and start a new chain** (ADR 0028): the import
        enters their rows as the first entries of a new chain, `ledger_verify` must find nothing, and then the signature policy of the source is set again; it needs `acknowledgeLedgerRestart: true` (422
        `ledger_restart_not_acknowledged` otherwise). **Time-partition policies come back disabled**; the task's last detail lists them with the call that enables each.

        Needs `kingres_admin`, `dataTransfer.enabled` (403 `data_transfer_disabled`) and a request over TLS (403 `insecure_transport`). 404: the upload does not exist or is another role's. 409 `upload_incomplete`;
        409 `already_exists`: the database exists; 409 `operation_in_progress`: a task uses the upload, the transfer limit is reached, a rebalance (a drain is one) is pending or running, or the addition, the removal or the leaving of a server is unfinished (an import that is pending, running or paused refuses those in turn, and the change of `shouldHaveShards`; a rebalance that is paused does not refuse an import, but cannot be resumed until it has ended). 422 `archive_invalid`, `archive_incompatible` (the PostgreSQL major of the
        target must be at least the source's), `archive_statement_refused`, `import_too_large` (more than `maxImportBytes`, a statement or a count above its limit) and `ledger_restart_not_acknowledged`.
        Steps: *Check the archive*, *Create the private database* (and one step for each other server), *Install the extensions*, *Check the functions*, *Create the tables*, *Distribute the tables*, *Create the views*,
        *Load the data*, *Create the indexes and constraints*, *Set the sequences*, *Enable the ledger and the policies*, *Verify*, *Take the final name*. A task is cancellable until *Set the sequences* starts.
        Task codes: `archive_invalid`, `archive_incompatible`, `archive_statement_refused`, `foreign_key_violation` (the constraint's name and the count), `table_not_eligible`, `row_count_mismatch`, `verification_failed`,
        `transfer_leader_changed` (retryable), `transfer_session_lost` (retryable), `forbidden`, `cancelled`. The error of a task never carries a value, a row, the text of a statement or text of the server.
      tags: [Data transfer]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportDatabaseRequest' }
            examples:
              defaults: { summary: The archive under the name it was exported with, value: { uploadId: '43' } }
              renamed: { summary: Under a new name, with the checksum the operator got elsewhere, value: { uploadId: '43', database: shop_copy, expectedSha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b } }
              ledger: { summary: An archive with ledger tables, value: { uploadId: '44', acknowledgeLedgerRestart: true, onForeignKeyViolation: keepNotValid, keepOnFailure: true } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedDatabaseImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/DataTransferConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /data-exports:
    get:
      operationId: listDataExports
      summary: List the exports of the signed-in role
      description: |
        Added in 0.19.0 (data transfer, phase 14a). The staged export files of the caller, newest first. A file of another role is not listed and its existence is never revealed.
        Cursor pagination: `limit`, `cursor`, `nextCursor`.
      tags: [Data transfer]
      x-required-role: kingres_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of exports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExportPage' }
              examples:
                page:
                  value:
                    items:
                      - exportId: '57'
                        kind: tableExport
                        state: ready
                        database: shop
                        schema: public
                        table: orders
                        sizeBytes: 90211333
                        sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                        rows: 1200000
                        consistency: [{ table: public.orders, level: per-group, groups: 3 }]
                        rlsApplied: false
                        format: csv
                        taskId: 118
                        createdAt: '2026-11-22T09:30:00Z'
                        expiresAt: '2026-11-23T09:30:00Z'
                        downloadedAt: null
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /data-exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: getDataExport
      summary: Read an export
      description: |
        Added in 0.19.0 (data transfer, phase 14a). One staged export: state, size, SHA-256, rows, the consistency label of every table, expiry and the task that made it.
        404 for a file that does not exist or belongs to another role (the existence of a file is not leaked).
      tags: [Data transfer]
      x-required-role: kingres_admin
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
              examples:
                ready:
                  value:
                    exportId: '57'
                    kind: tableExport
                    state: ready
                    database: shop
                    schema: public
                    table: orders
                    sizeBytes: 90211333
                    sha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
                    rows: 1200000
                    consistency: [{ table: public.orders, level: per-group, groups: 3 }]
                    rlsApplied: false
                    format: csv
                    taskId: 118
                    createdAt: '2026-11-22T09:30:00Z'
                    expiresAt: '2026-11-23T09:30:00Z'
                    downloadedAt: null
                building:
                  value:
                    exportId: '58'
                    kind: tableExport
                    state: building
                    database: shop
                    schema: public
                    table: customers
                    sizeBytes: null
                    sha256: null
                    rows: null
                    consistency: null
                    rlsApplied: false
                    format: csv.gz
                    taskId: 119
                    createdAt: '2026-11-22T09:40:00Z'
                    expiresAt: '2026-11-23T09:40:00Z'
                    downloadedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteDataExport
      summary: Delete an export
      description: |
        Added in 0.19.0 (data transfer, phase 14a). Deletes the staged file and frees its reservation. The creator **or any `kingres_admin`** may delete (to free the disk of a colleague who left;
        deleting reveals nothing); the audit event names the creator when the actor is another role. 404 for a file that does not exist.
      tags: [Data transfer]
      x-required-role: kingres_admin
      responses:
        '204': { description: The export was deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /data-exports/{exportId}/content:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: downloadDataExport
      summary: Download an export file
      description: |
        Added in 0.19.0 (data transfer, phase 14a). The plaintext file. `x-streams: download`: streamed from the manager leader through whichever server received the request, with no
        buffering and without the 60 s write timeout of the other operations. `Range: bytes=a-b` (one range) answers 206 with `Content-Range`. Every answer has `Content-Length` of the bytes it
        carries (the whole file for 200), `Accept-Ranges: bytes`, `ETag` (the SHA-256), `Cache-Control: no-store`, `X-Content-Type-Options: nosniff` and `Content-Disposition: attachment; filename="..."`
        with a name the server builds from the database, the table and the UTC time (never from a client string). A stream that fails half way cannot change its status: the `Content-Length` makes a short file
        visible, and the SHA-256 of `getDataExport` lets the user check the file. The audit event `downloadDataExport` is written when the stream ends and says whether the last byte was served.
        Only the creator downloads (404 otherwise). 410: the file has expired. 416: the range cannot be served. Needs `kingres_admin`, `dataTransfer.enabled` and a request over TLS.
      tags: [Data transfer]
      x-required-role: kingres_admin
      x-streams: download
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: The whole file.
          headers:
            Content-Length: { description: Size of the file in bytes., schema: { type: integer, format: int64, minimum: 0 } }
            Accept-Ranges: { description: Always `bytes`., schema: { type: string, enum: [bytes] } }
            ETag: { description: The SHA-256 of the plaintext file in quotes., schema: { type: string } }
            Content-Disposition: { description: '`attachment` with a file name built by the server.', schema: { type: string } }
            Cache-Control: { description: Always `no-store`., schema: { type: string } }
            X-Content-Type-Options: { description: Always `nosniff`., schema: { type: string } }
          content:
            text/csv:
              schema: { type: string, format: binary, description: 'The CSV file (`format` `csv`); the `charset` parameter is the encoding of the export.' }
              examples:
                csv: { summary: The first bytes of an export, value: "id,customer,total\n1,Ada,12.50\n" }
            application/gzip:
              schema: { type: string, format: binary, description: The gzip-compressed CSV file (`format` `csv.gz`). }
              examples:
                gzip: { summary: The first bytes of a compressed export (binary), value: '' }
        '206':
          description: One range of the file.
          headers:
            Content-Length: { description: Size of the range in bytes., schema: { type: integer, format: int64, minimum: 0 } }
            Content-Range: { description: '`bytes first-last/size`.', schema: { type: string } }
            Accept-Ranges: { description: Always `bytes`., schema: { type: string, enum: [bytes] } }
            ETag: { description: The SHA-256 of the plaintext file in quotes., schema: { type: string } }
            Content-Disposition: { description: '`attachment` with a file name built by the server.', schema: { type: string } }
            Cache-Control: { description: Always `no-store`., schema: { type: string } }
            X-Content-Type-Options: { description: Always `nosniff`., schema: { type: string } }
          content:
            text/csv:
              schema: { type: string, format: binary, description: The bytes of the range. }
              examples:
                range: { summary: Bytes 0 to 16 of an export, value: 'id,customer,total' }
            application/gzip:
              schema: { type: string, format: binary, description: The bytes of the range of a compressed file. }
              examples:
                gzipRange: { summary: Bytes of a compressed export (binary), value: '' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DataTransferForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '410': { $ref: '#/components/responses/Gone' }
        '416': { $ref: '#/components/responses/RangeNotSatisfiable' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kingres_session
      description: |
        Session cookie set by `POST /auth/login` (HttpOnly, Secure, SameSite=Strict). Browsers must also send
        the `csrfToken` returned by login (and repeated unchanged by `GET /auth/session`) in the `X-CSRF-Token`
        header on every POST, PUT, PATCH and DELETE request. Requests that authenticate with a bearer token
        need no CSRF header. The cookie is valid only on the server that set it (see `login`).
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque bearer token for `kingres-cli` and scripts, obtained with `POST /auth/login` and
        `issueToken` set to true. Sent as `Authorization: Bearer <token>`. The token is valid only on the
        server that issued it (see `login`).
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: |
        One-time setup token written to a root-readable file at install time. Valid only while the node is
        `uninitialized`; consumed by a successful `init-cluster` or `join-cluster`. It can be verified without
        being consumed with `POST /setup/token-check`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor taken from `nextCursor` of the previous page. Omit for the first page.
      schema: { type: string, maxLength: 1024 }
    From:
      name: from
      in: query
      description: Return only entries at or after this time.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Return only entries before this time.
      schema: { type: string, format: date-time }
    SearchText:
      name: q
      in: query
      description: Case-insensitive substring to search for in the message.
      schema: { type: string, maxLength: 200 }
    LogLevel:
      name: level
      in: query
      description: Return only entries at this level or more severe.
      schema: { $ref: '#/components/schemas/LogLevel' }
    LogComponent:
      name: component
      in: query
      description: Return only entries of this component.
      schema: { $ref: '#/components/schemas/LogComponent' }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task identifier.
      schema: { type: integer, format: int64 }
    ServerId:
      name: serverId
      in: path
      required: true
      description: Server identifier, an opaque string (the host of the server's instances, see `ServerId`). Percent-encode it in the path, for example an IPv6 host.
      schema: { $ref: '#/components/schemas/ServerId' }
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: Instance identifier (the node id of the instance in the cluster catalog).
      schema: { type: integer, format: int32 }
    ConfigParameterName:
      name: name
      in: path
      required: true
      description: PostgreSQL parameter name (any letter case; the answer has the canonical spelling).
      schema: { type: string, minLength: 1, maxLength: 63 }
    ConfigChangeId:
      name: changeId
      in: path
      required: true
      description: Configuration change identifier.
      schema: { type: integer, format: int64 }
    ServerGroupName:
      name: serverGroupName
      in: path
      required: true
      description: Server group name.
      schema: { type: string }
    DatabaseName:
      name: databaseName
      in: path
      required: true
      description: Database name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    SchemaName:
      name: schemaName
      in: path
      required: true
      description: Schema name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    TableName:
      name: tableName
      in: path
      required: true
      description: Table name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    PartitionName:
      name: partitionName
      in: path
      required: true
      description: Name of a user partition (added in 0.14.0).
      schema: { type: string, minLength: 1, maxLength: 57 }
    DryRunStorage:
      name: dryRun
      in: query
      description: Added in 0.17.0. When true, only check the request and answer what it would do (200 `TableStoragePreview`); no task is started. Default false.
      schema: { type: boolean, default: false }
    PartitionRunId:
      name: runId
      in: path
      required: true
      description: Identifier of a run of a time-partitioning policy (added in 0.17.0).
      schema: { type: integer, format: int64 }
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Identifier of an upload (added in 0.19.0), a decimal string. An upload of another role is 404.
      schema: { type: string, minLength: 1, maxLength: 20, pattern: '^[0-9]+$' }
    ExportId:
      name: exportId
      in: path
      required: true
      description: Identifier of a staged export file (added in 0.19.0), a decimal string. A file of another role is 404.
      schema: { type: string, minLength: 1, maxLength: 20, pattern: '^[0-9]+$' }
    UploadOffset:
      name: Upload-Offset
      in: header
      required: true
      description: The offset of the first byte of the chunk; it must equal the offset the server holds (409 `upload_offset_mismatch` otherwise).
      schema: { type: integer, format: int64, minimum: 0 }
    RangeHeader:
      name: Range
      in: header
      required: false
      description: 'One byte range of the plaintext file, `bytes=first-last`, `bytes=first-` or `bytes=-suffix`. More than one range is answered with the whole file.'
      schema: { type: string, maxLength: 64 }
    ColocationId:
      name: colocationId
      in: path
      required: true
      description: Colocation group identifier.
      schema: { type: integer, format: int32 }
    BucketNumber:
      name: bucket
      in: path
      required: true
      description: Bucket number.
      schema: { type: integer, format: int32, minimum: 0 }
    RoleName:
      name: roleName
      in: path
      required: true
      description: Role name.
      schema: { type: string, minLength: 1, maxLength: 63 }

  responses:
    BadRequest:
      description: |
        The request is malformed (invalid JSON, wrong type, unknown parameter) or violates a schema constraint.
        `code` is `bad_request` for a body that is not valid JSON of the operation (syntax, wrong type, empty, a member
        that the request does not know) and `validation_failed`, with `errors[]`, for a value that is invalid or, for
        the requests the contract declares closed (`ServerUpdateRequest`, `LocalSettingsUpdate`,
        `InclusionProofRequest`), for a member that is not listed (`errors[].code` `unknown_property`; 0.5.0 corrected
        the server, which answered `bad_request` for the last of them).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validation:
              value:
                type: https://kingresdb.dev/problems/validation-failed
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: /api/v1/databases
                code: validation_failed
                errors:
                  - { field: /sharding/bucketCount, message: must be between 1 and 4096, code: out_of_range }
    Unauthorized:
      description: Not signed in, session expired, or wrong credentials (or a wrong setup token).
      headers:
        WWW-Authenticate:
          description: Authentication scheme hint.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthenticated:
              value:
                type: https://kingresdb.dev/problems/unauthenticated
                title: Authentication required
                status: 401
                detail: No valid session or token was presented.
                instance: /api/v1/cluster
                code: unauthenticated
    Forbidden:
      description: |
        The caller is authenticated but lacks the cluster role named by `x-required-role`, or the CSRF token is
        missing or wrong. For the setup-token operations: the request did not come from a permitted address.
        While `localhostOnly` is true (the server listens on loopback addresses only) the permitted addresses are the
        loopback addresses `127.0.0.0/8` and `::1`; otherwise every address is permitted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            role:
              value:
                type: https://kingresdb.dev/problems/forbidden
                title: Forbidden
                status: 403
                detail: This operation requires the kingres_admin cluster role.
                instance: /api/v1/roles
                code: forbidden
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            database:
              value:
                type: https://kingresdb.dev/problems/not-found
                title: Not found
                status: 404
                detail: Database "shop" does not exist.
                instance: /api/v1/databases/shop
                code: not_found
    Conflict:
      description: |
        The request conflicts with the current state. `code` says which: `already_exists`,
        `immutable_field`, `rebalance_in_progress`, `operation_in_progress`, `task_not_cancellable`,
        `last_admin`, `role_in_use`, `optimistic_lock_failed`, `no_replica_available`,
        `instance_already_running`, `instance_already_stopped`, `server_owns_buckets`,
        `server_hosts_map_group`, `last_server`, `server_group_not_empty`, `ledger_entry_pending`,
        `certificate_revoked` (each operation's description says which of them it can answer). Nothing was changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            serverOwnsBuckets:
              value:
                type: https://kingresdb.dev/problems/server-owns-buckets
                title: Server owns buckets
                status: 409
                detail: Server 10.0.0.13 holds 128 primary and 128 replica buckets of database shop; rebalance first.
                instance: /api/v1/servers/10.0.0.13
                code: server_owns_buckets
            instanceAlreadyStopped:
              value:
                type: https://kingresdb.dev/problems/instance-already-stopped
                title: Instance already stopped
                status: 409
                detail: Instance 2 is already stopped.
                instance: /api/v1/this-server/instances/2/stop
                code: instance_already_stopped
            rebalance:
              value:
                type: https://kingresdb.dev/problems/rebalance-in-progress
                title: Rebalance in progress
                status: 409
                detail: A rebalance is already running (task 118).
                instance: /api/v1/rebalance
                code: rebalance_in_progress
    UnprocessableEntity:
      description: |
        The request is well-formed but cannot be carried out: semantic validation (`unprocessable`), a
        precondition on the node or cluster state (`node_state_invalid`), a SQL error (`sql_error`), or the
        server version does not support the operation yet (`unsupported_operation`). Every authenticated
        operation can answer `unsupported_operation` once authentication, CSRF and role checks have passed;
        clients treat it as "not available in this version", not as a user error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            sql:
              value:
                type: https://kingresdb.dev/problems/sql-error
                title: SQL error
                status: 422
                detail: relation "accountz" does not exist
                instance: /api/v1/query
                code: sql_error
                sqlState: 42P01
            unsupported:
              value:
                type: https://kingresdb.dev/problems/unsupported-operation
                title: Operation not supported
                status: 422
                detail: Operation removeServer is not supported by this server version yet.
                instance: /api/v1/servers/10.0.0.13
                code: unsupported_operation
    ServiceUnavailable:
      description: |
        The server cannot serve the request now: the node is uninitialized, the map group is failing over
        (DDL and topology changes are paused), the manager leader is unreachable, quorum is lost, the
        server is shutting down, or the instance that hosts the system database was stopped with
        `stopThisServerInstance` (`system_database_stopped`; every authenticated operation except
        `startThisServerInstance`, `getSession` and `listThisServerInstances` answers it until that instance is
        started again).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            mapGroup:
              value:
                type: https://kingresdb.dev/problems/map-group-unavailable
                title: Map group unavailable
                status: 503
                detail: The map group is failing over. Topology changes are paused.
                instance: /api/v1/rebalance
                code: map_group_unavailable
            systemDatabaseStopped:
              value:
                type: https://kingresdb.dev/problems/system-database-stopped
                title: System database stopped
                status: 503
                detail: The instance that hosts the system database is stopped. Start it with POST /api/v1/this-server/instances/1/start.
                instance: /api/v1/databases
                code: system_database_stopped
    MethodNotAllowed:
      description: |
        The path exists but not for this HTTP method (for example `DELETE /servers`). A transport-level
        response that applies to every path and is answered before authentication, so it carries no
        authentication requirement. It is defined once here and listed on every operation only so that
        generated clients know it; it is not an outcome of the operation itself. `Allow` lists the methods
        the path supports.
      headers:
        Allow:
          description: Comma-separated methods the path supports, for example `GET, POST`.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            wrongMethod:
              value:
                type: https://kingresdb.dev/problems/method-not-allowed
                title: Method not allowed
                status: 405
                detail: DELETE is not supported on /api/v1/servers.
                instance: /api/v1/servers
                code: method_not_allowed
    TooManyRequests:
      description: Too many requests from this client to a rate-limited unauthenticated endpoint (health, login, setup).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
