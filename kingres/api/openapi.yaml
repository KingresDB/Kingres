    put:
      operationId: enableTableLedger
      summary: Put a table under ledger control
      description: |
        Calls `kingres.ledger_enable`: the table becomes a ledger table in the given mode. One-way: a ledger table
        cannot lose its ledger and the mode cannot be changed afterwards. Needs the `kingres_ledger` extension in the
        database (409 `conflict` if the database has no ledger). Rows already in the table are entered into the ledger.
        Synchronous: returns the table as it is afterwards.
      tags: [Tables]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableTableLedgerRequest' }
            examples:
              appendOnly: { value: { mode: appendOnly } }
              updatable: { value: { mode: updatable } }
      responses:
        '200':
          description: The table with its ledger properties.
