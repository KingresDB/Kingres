                        lastHeartbeatAt: '2026-11-14T10:00:00Z'
                        instances:
                          - { id: 1, serverId: 10.0.0.11, shardGroupId: 0, isMapGroup: true, role: primary, state: running, port: 5432, replicationLagBytes: null, replicationLagSeconds: null }
                          - { id: 2, serverId: 10.0.0.11, shardGroupId: 2, isMapGroup: false, role: standby, state: running, port: 5433, replicationLagBytes: 1024, replicationLagSeconds: 0.2 }
                        buckets: { primary: 128, replica: 128 }
                        sizeBytes: 5368709120
                        resources: { cpuUsagePercent: 18.5, memoryUsedBytes: 4294967296, memoryTotalBytes: 17179869184, diskUsedBytes: 21474836480, diskTotalBytes: 107374182400 }
        '400': { $ref: '#/components/responses/BadRequest' }
