  /databases/{databaseName}/ledger/inclusion-proofs:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    post:
      operationId: createInclusionProof
      summary: Create an inclusion proof for a row
      description: |
        Computes the inclusion proof of one version of a row (`kingres.ledger_inclusion_proof`). Uses POST
        because the primary key is a structured value and the proof is computed on demand; nothing is
        stored. The 200 body **is the proof document of the extension, byte for byte in meaning, in its
        own snake_case members** (see `InclusionProof`), plus one member `shard_group_id`; it is not
        wrapped and not renamed, so it can be saved and given to `kingres-verify proof` unchanged:

        ```
        curl -s -X POST .../ledger/inclusion-proofs -d '{"schema":"public","table":"accounts","primaryKey":{"id":42}}' > proof.json
        kingres-verify proof --proof proof.json --digest digest.json --table-id <table_id of the proof> --row-hash <row hash you recomputed>
        ```
        The digest must come from outside the database and be of the same chain at the proof's block height
        or later (`generateLedgerDigest` returns it as `chains[].document`). A proof carries the block
        headers up to the latest block at the time it was made and verifies against any digest of that
        range (see `kingres/verifier/README.md`).

        **How the row is found.** `schema`, `table` and all columns of the primary key (`primaryKey`, by
        column name; a bigint above 2^53, a uuid, a date or a timestamp is given as a string) identify the
        row. The server reads the row **as the signed-in PostgreSQL role** (so table privileges and row
        security apply; no privilege on the table gives 403 `forbidden`) and computes its row hash with
        `kingres.ledger_row_hash`, then asks the extension for the proof of the entry with that hash and
        operation. Which version and entry: `op: I` without `ledgerTxId` proves that the **current**
        version of the row was written; `ledgerTxId` (updatable tables only) names a **removed** version
        by the `ledger_txid` of its history row, i.e. the transaction that removed it, and is read from the
        history table, which only the owner of the ledger table can read (403 `forbidden` otherwise);
        `op: D` proves that removal and requires `ledgerTxId` (400 `validation_failed` otherwise). In a
        sharded database the row is looked up on the shard group that holds it, so the distribution
        column must be part of `primaryKey` (it is part of every unique key).

        Refusals: 404 when the database, the table or the row (or the removed version) does not exist;
        422 `unprocessable` when the table is not a ledger table or when `op: D` or `ledgerTxId` is used on
        an append-only table, and 422 `unsupported_operation` for those two when `kingres_ledger` is 0.1; 409 `ledger_entry_pending` when the row is not in a block yet (or the ledger has no
        block): generate a digest (`generateLedgerDigest`, which closes the open block) and ask again.
      tags: [Ledger]
      x-required-role: kingres_readonly
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InclusionProofRequest' }
            examples:
              account: { value: { schema: public, table: accounts, primaryKey: { id: 42 } } }
              removedVersion: { value: { schema: public, table: inventory, primaryKey: { id: 7 }, ledgerTxId: 1234, op: D } }
      responses:
        '200':
          description: The proof (the extension's own document; see `InclusionProof`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InclusionProof' }
              examples:
                insert:
                  value:
                    format: 1
                    chain_id: 17202ffe706c2492b94de2c0b2d5b17aabc8619befa91746fbf798ddd0905249
                    relation: app.accounts
                    shard_group_id: 0
                    table_id: 1
                    ledger_txid: 764
                    seq: 0
                    op: I
                    row_hash: 04ff29c1a13bef6365f25f2c74ceec34cb268bbc4204ee5f1211eed8333800fa
                    entry_index: 0
                    entry_count: 3
                    entry_path: [f1495ba0ec4f59306850f0ed1da53524963efb1f5b3e51572a31aa0c7e06cb58, 67235c6a1c6075a61b5e02d7cc6e520d743c5bbc422373d7dee2b6caa3be3a58]
                    tx_root: c47bf3ab291156b483c3262c962d87dc52f47a8567e8a9154962e526544cc350
                    user_name: kingres
                    tx_index: 0
                    tx_path: [a4e8c0b0d62c1ed640202095534ac232feede9e086b5770c72357c50f49fea1d]
                    block:
                      height: 0
                      hash_version: 1
                      prev_hash: 99409e4eb0ea41621b48e74c406c45b1e8b4c2f8fd9ba3b02b130415aa8695e2
                      tx_merkle_root: e456d946cd1306ac2790e7fc3ba294adff00bd03641d296d0bd8f92c575dc4ff
                      tx_count: 2
                      closed_at_us: 847992113708275
                      block_hash: ad2e6e51d27eb09d2dace2ffac33e7c3926742c872ef144ffff39172784b6da1
                    chain: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /query:
    post:
      operationId: executeQuery
      summary: Execute a SQL statement
      description: |
        Runs one SQL statement against a database as the signed-in PostgreSQL role (so PostgreSQL
        privileges apply) through the client router. The result is cut at `rowLimit` rows and aborted after
        `timeoutMs`. Statements that fail return 422 with code `sql_error` and the SQLSTATE in `sqlState`; that
        includes a statement that ran into `timeoutMs` (SQLSTATE `57014`), whatever `timeoutMs` is (0.6.0: the
        server's request timeout no longer ends a statement earlier, and an answer of `503` is no longer
        possible for a statement that merely ran long).
        Every execution is written to the audit log. Multiple statements per request are not allowed.

        **What a cut result means (0.6.0).** A plain read (a statement that starts with `SELECT`, `TABLE`,
        `VALUES` or `SHOW`) is stopped when its result passes `rowLimit` or the byte budget; it changed nothing
        and `truncated` is true. Any other statement (`INSERT`, `UPDATE`, `DELETE` with `RETURNING`, a `WITH` that
        changes data, ...) is **never cut short**: its remaining rows are read and dropped so that it completes
        and is committed, `truncated` is true, `commandTag` is PostgreSQL's real tag and `rowCount` is the number
        of rows it affected. A value larger than 1 MiB, or a row larger than 16 MiB, fails the statement with 422
        `unprocessable` (a statement that is not a plain read is rolled back in that case, as for any failure).
        A role can run at most two statements at a time on one server (the server runs four in all); further
        ones answer **429 `workbench_busy`** with `Retry-After` (0.7.0; before, 503 `service_unavailable`, which is
        a statement about the server's health and is no longer used for this). The statement was not started.

        **Cancelling (0.7.0).** A request may name its statement with `statementId` (1 to 64 characters of `A-Za-z0-9_-`; anything else is 400 `validation_failed` on `/statementId`); `cancelStatement` then ends it
        on the server that runs it. A cancelled statement ends the `executeQuery` request with 422 `sql_error` and
        SQLSTATE `57014`, exactly like a statement that ran into `timeoutMs`.
      tags: [Query]
      x-required-role: kingres_readonly
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
            examples:
              select: { value: { database: shop, sql: 'SELECT id, owner FROM accounts ORDER BY id', rowLimit: 100, timeoutMs: 5000 } }
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryResult' }
              examples:
                select:
                  value:
                    columns:
                      - { name: id, type: int8 }
                      - { name: owner, type: text }
                    rows: [[1, alice], [2, bob]]
                    rowCount: 2
                    truncated: false
                    commandTag: SELECT 2
                    durationMs: 3.4
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /query/statements/{statementId}/cancel:
    post:
      operationId: cancelStatement
      summary: Cancel a running statement
      description: |
        Added in 0.7.0. Asks PostgreSQL to cancel the statement that the signed-in role started with
        `executeQuery` under the given `statementId`, on this server. The server finds the statement among the ones
        it tracks and cancels the backend it opened for it; a client never names a backend or process id, and a role
        can cancel only its own statements. The answer is 204 as soon as the cancel was requested; the statement
        then ends the `executeQuery` request with 422 `sql_error`, SQLSTATE `57014`. A statement that does not
        react within two seconds is ended by the server by closing its connection.

        404 `not_found` means no running statement of the caller has that id on this server: it already ended, it
        never existed, it belongs to another role (which is not revealed), or it runs on another server (send the
        request to the server that received `executeQuery`; a statement is bound to the server it was started on, like
        a session). A malformed id is 404 too. A statement id is unique among the running statements of one role
        on one server (a second `executeQuery` with a running id answers 409 `conflict`).

        Not a task: the effect is immediate. It is written to the audit log as `cancelStatement` (details:
        `statementId`); the cancelled `executeQuery` is audited under its own id with outcome `failure`.
      tags: [Query]
      x-required-role: kingres_readonly
      parameters:
        - name: statementId
          in: path
          required: true
          description: The `statementId` of the `executeQuery` request.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        '204':
          description: The cancel was requested.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts
      description: |
        Alerts of the whole cluster, newest first, from any server: each server keeps the alerts about itself,
        and the server that receives the request asks the others for theirs in parallel (see `partial` and
        `missingServers` of `AlertPage`). The alerts about the cluster as a whole (`versionMismatch`) are kept by
        the manager leader. An alert `id` is unique in the cluster and names the server that holds the alert (the
        high bits are that server's number), so `PUT /alerts/{alertId}/acknowledgement` can be sent to any
        server. Cursors are keyset cursors over one order (time raised, then id): a page boundary is the same
        whichever servers answered; a cursor of 0.4.0 is refused with 400 `validation_failed`.
      tags: [Alerts]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          description: Return only alerts in this state.
          schema: { $ref: '#/components/schemas/AlertState' }
        - name: severity
          in: query
          description: Return only alerts with this severity.
          schema: { $ref: '#/components/schemas/AlertSeverity' }
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
              examples:
                one:
                  value:
                    items:
                      - { id: 55, kind: replicationLagHigh, severity: warning, state: open, title: Replication lag is high, message: Standby on server 10.0.0.12 is 120 MB behind., serverId: 10.0.0.12, databaseName: null, raisedAt: '2026-11-14T09:50:00Z', acknowledgedAt: null, acknowledgedBy: null, resolvedAt: null }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /alerts/{alertId}/acknowledgement:
    parameters:
      - name: alertId
        in: path
        required: true
        description: Alert identifier.
        schema: { type: integer, format: int64 }
    put:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      description: Marks an open alert acknowledged by the caller. Idempotent for an already acknowledged alert; 409 for a resolved one.
      tags: [Alerts]
      x-required-role: kingres_ops
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /logs:
    get:
      operationId: listLogs
      summary: Search cluster logs
      description: |
        Log entries from every server, newest first, from any server: the server that receives the request asks the
        others for their part in parallel (each has a deadline; the servers that did not answer are named in
        `missingServers`, `partial` is then true). `level` keeps the entries at that level or more severe and `q`
        the entries whose message contains the text (case-insensitive). For one server only, filter by `serverId` or
        use `/this-server/logs`. Entries are ordered by time, then by server id, and the cursor is a position in
        that order, so paging is stable across servers. Requires `kingres_ops` (see `listThisServerLogs`); the role
        is checked again by every server that answers.
      tags: [Logs]
      x-required-role: kingres_ops
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SearchText'
        - name: serverId
          in: query
          description: Return only entries of this server.
          schema: { $ref: '#/components/schemas/ServerId' }
      responses:
        '200':
          description: A page of log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
              examples:
                one:
                  value:
                    items:
                      - { timestamp: '2026-11-14T09:59:58Z', level: warning, component: manager, serverId: 10.0.0.11, instanceId: null, message: heartbeat from server 10.0.0.12 is late }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /metrics/query:
    get:
      operationId: queryMetrics
      summary: Query a metric time series
      description: |
        Returns one or more series of a named metric for dashboard charts, resampled to `step` seconds.
        Without a filter the cluster aggregate is returned (sum for counters and sizes, average for
        percentages). With `serverId` or `databaseName` the series is restricted; with `groupBy` one series per
        server or database is returned. At most 5000 points per series (422 otherwise).
        The series are those of the whole cluster, from any server: each server answers with its own samples and the
        receiving server combines them (a database that several servers report is summed or averaged like the
        servers); a server that did not answer is named in `missingServers` (`partial` is then true).

        **A metric that nobody samples (0.9.0 states it).** The client entry point metrics (`client...`, `clientStandby...`)
        exist only while the entry point of a server is on; while it is off on every server, the metric is still a valid name
        and the answer is 200: without a filter the one cluster series whose points all have `value: null` ("not
        available", never zero), with `groupBy` or a filter that matches nothing `series: []`. It is not an error and not
        a series of zeros; a chart shows "no data".
      tags: [Metrics]
      x-required-role: kingres_stats
      parameters:
        - name: metric
          in: query
          required: true
          description: Metric name.
          schema: { $ref: '#/components/schemas/MetricName' }
        - name: from
          in: query
          required: true
          description: Start of the range (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the range (exclusive); must be after `from`.
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: true
          description: Resolution in seconds.
          schema: { type: integer, minimum: 1, maximum: 86400 }
        - name: serverId
          in: query
          description: Restrict to one server.
          schema: { $ref: '#/components/schemas/ServerId' }
        - name: databaseName
          in: query
          description: Restrict to one database (only database-scoped metrics).
          schema: { type: string }
        - name: groupBy
          in: query
          description: Return one series per server or per database.
          schema: { type: string, enum: [server, database] }
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricQueryResult' }
              examples:
                cpu:
                  value:
                    metric: cpuUsagePercent
                    unit: percent
                    from: '2026-11-14T09:00:00Z'
                    to: '2026-11-14T09:02:00Z'
                    step: 60
                    series:
                      - labels: { serverId: 10.0.0.11 }
                        points:
                          - { timestamp: '2026-11-14T09:00:00Z', value: 17.2 }
                          - { timestamp: '2026-11-14T09:01:00Z', value: 18.9 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kingres_session
      description: |
        Session cookie set by `POST /auth/login` (HttpOnly, Secure, SameSite=Strict). Browsers must also send
        the `csrfToken` returned by login (and repeated unchanged by `GET /auth/session`) in the `X-CSRF-Token`
        header on every POST, PUT, PATCH and DELETE request. Requests that authenticate with a bearer token
        need no CSRF header. The cookie is valid only on the server that set it (see `login`).
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque bearer token for `kingres-cli` and scripts, obtained with `POST /auth/login` and
        `issueToken` set to true. Sent as `Authorization: Bearer <token>`. The token is valid only on the
        server that issued it (see `login`).
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: |
        One-time setup token written to a root-readable file at install time. Valid only while the node is
        `uninitialized`; consumed by a successful `init-cluster` or `join-cluster`. It can be verified without
        being consumed with `POST /setup/token-check`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor taken from `nextCursor` of the previous page. Omit for the first page.
      schema: { type: string, maxLength: 1024 }
    From:
      name: from
      in: query
      description: Return only entries at or after this time.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Return only entries before this time.
      schema: { type: string, format: date-time }
    SearchText:
      name: q
      in: query
      description: Case-insensitive substring to search for in the message.
      schema: { type: string, maxLength: 200 }
    LogLevel:
      name: level
      in: query
      description: Return only entries at this level or more severe.
      schema: { $ref: '#/components/schemas/LogLevel' }
    LogComponent:
      name: component
      in: query
      description: Return only entries of this component.
      schema: { $ref: '#/components/schemas/LogComponent' }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task identifier.
      schema: { type: integer, format: int64 }
    ServerId:
      name: serverId
      in: path
      required: true
      description: Server identifier, an opaque string (the host of the server's instances, see `ServerId`). Percent-encode it in the path, for example an IPv6 host.
      schema: { $ref: '#/components/schemas/ServerId' }
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: Instance identifier (the node id of the instance in the cluster catalog).
      schema: { type: integer, format: int32 }
    ConfigParameterName:
      name: name
      in: path
      required: true
      description: PostgreSQL parameter name (any letter case; the answer has the canonical spelling).
      schema: { type: string, minLength: 1, maxLength: 63 }
    ConfigChangeId:
      name: changeId
      in: path
      required: true
      description: Configuration change identifier.
      schema: { type: integer, format: int64 }
    ServerGroupName:
      name: serverGroupName
      in: path
      required: true
      description: Server group name.
      schema: { type: string }
    DatabaseName:
      name: databaseName
      in: path
      required: true
      description: Database name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    SchemaName:
      name: schemaName
      in: path
      required: true
      description: Schema name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    TableName:
      name: tableName
      in: path
      required: true
      description: Table name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    ColocationId:
      name: colocationId
      in: path
      required: true
      description: Colocation group identifier.
      schema: { type: integer, format: int32 }
    RoleName:
      name: roleName
      in: path
      required: true
      description: Role name.
      schema: { type: string, minLength: 1, maxLength: 63 }

  responses:
    BadRequest:
      description: |
        The request is malformed (invalid JSON, wrong type, unknown parameter) or violates a schema constraint.
        `code` is `bad_request` for a body that is not valid JSON of the operation (syntax, wrong type, empty, a member
        that the request does not know) and `validation_failed`, with `errors[]`, for a value that is invalid or, for
        the requests the contract declares closed (`ServerUpdateRequest`, `LocalSettingsUpdate`,
        `InclusionProofRequest`), for a member that is not listed (`errors[].code` `unknown_property`; 0.5.0 corrected
        the server, which answered `bad_request` for the last of them).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validation:
              value:
                type: https://kingresdb.dev/problems/validation-failed
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: /api/v1/databases
                code: validation_failed
                errors:
                  - { field: /sharding/bucketCount, message: must be between 1 and 4096, code: out_of_range }
    Unauthorized:
      description: Not signed in, session expired, or wrong credentials (or a wrong setup token).
      headers:
        WWW-Authenticate:
          description: Authentication scheme hint.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthenticated:
              value:
                type: https://kingresdb.dev/problems/unauthenticated
                title: Authentication required
                status: 401
                detail: No valid session or token was presented.
                instance: /api/v1/cluster
                code: unauthenticated
    Forbidden:
      description: |
        The caller is authenticated but lacks the cluster role named by `x-required-role`, or the CSRF token is
        missing or wrong. For the setup-token operations: the request did not come from a permitted address.
        While `localhostOnly` is true (the server listens on loopback addresses only) the permitted addresses are the
        loopback addresses `127.0.0.0/8` and `::1`; otherwise every address is permitted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            role:
              value:
                type: https://kingresdb.dev/problems/forbidden
                title: Forbidden
                status: 403
                detail: This operation requires the kingres_admin cluster role.
                instance: /api/v1/roles
                code: forbidden
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            database:
              value:
                type: https://kingresdb.dev/problems/not-found
                title: Not found
                status: 404
                detail: Database "shop" does not exist.
                instance: /api/v1/databases/shop
                code: not_found
    Conflict:
      description: |
        The request conflicts with the current state. `code` says which: `already_exists`,
        `immutable_field`, `rebalance_in_progress`, `operation_in_progress`, `task_not_cancellable`,
        `last_admin`, `role_in_use`, `optimistic_lock_failed`, `no_replica_available`,
        `instance_already_running`, `instance_already_stopped`, `server_owns_buckets`,
        `server_hosts_map_group`, `last_server`, `server_group_not_empty`, `ledger_entry_pending`,
        `certificate_revoked` (each operation's description says which of them it can answer). Nothing was changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            serverOwnsBuckets:
              value:
                type: https://kingresdb.dev/problems/server-owns-buckets
                title: Server owns buckets
                status: 409
                detail: Server 10.0.0.13 holds 128 primary and 128 replica buckets of database shop; rebalance first.
                instance: /api/v1/servers/10.0.0.13
                code: server_owns_buckets
            instanceAlreadyStopped:
              value:
                type: https://kingresdb.dev/problems/instance-already-stopped
                title: Instance already stopped
                status: 409
                detail: Instance 2 is already stopped.
                instance: /api/v1/this-server/instances/2/stop
                code: instance_already_stopped
            rebalance:
              value:
                type: https://kingresdb.dev/problems/rebalance-in-progress
                title: Rebalance in progress
                status: 409
                detail: A rebalance is already running (task 118).
                instance: /api/v1/rebalance
                code: rebalance_in_progress
    UnprocessableEntity:
      description: |
        The request is well-formed but cannot be carried out: semantic validation (`unprocessable`), a
        precondition on the node or cluster state (`node_state_invalid`), a SQL error (`sql_error`), or the
        server version does not support the operation yet (`unsupported_operation`). Every authenticated
        operation can answer `unsupported_operation` once authentication, CSRF and role checks have passed;
        clients treat it as "not available in this version", not as a user error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            sql:
              value:
                type: https://kingresdb.dev/problems/sql-error
                title: SQL error
                status: 422
                detail: relation "accountz" does not exist
                instance: /api/v1/query
                code: sql_error
                sqlState: 42P01
            unsupported:
              value:
                type: https://kingresdb.dev/problems/unsupported-operation
                title: Operation not supported
                status: 422
                detail: Operation removeServer is not supported by this server version yet.
                instance: /api/v1/servers/10.0.0.13
                code: unsupported_operation
    ServiceUnavailable:
      description: |
        The server cannot serve the request now: the node is uninitialized, the map group is failing over
        (DDL and topology changes are paused), the manager leader is unreachable, quorum is lost, the
        server is shutting down, or the instance that hosts the system database was stopped with
        `stopThisServerInstance` (`system_database_stopped`; every authenticated operation except
        `startThisServerInstance`, `getSession` and `listThisServerInstances` answers it until that instance is
        started again).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            mapGroup:
              value:
                type: https://kingresdb.dev/problems/map-group-unavailable
                title: Map group unavailable
                status: 503
                detail: The map group is failing over. Topology changes are paused.
                instance: /api/v1/rebalance
                code: map_group_unavailable
            systemDatabaseStopped:
              value:
                type: https://kingresdb.dev/problems/system-database-stopped
                title: System database stopped
                status: 503
                detail: The instance that hosts the system database is stopped. Start it with POST /api/v1/this-server/instances/1/start.
                instance: /api/v1/databases
                code: system_database_stopped
    MethodNotAllowed:
      description: |
        The path exists but not for this HTTP method (for example `DELETE /servers`). A transport-level
        response that applies to every path and is answered before authentication, so it carries no
        authentication requirement. It is defined once here and listed on every operation only so that
        generated clients know it; it is not an outcome of the operation itself. `Allow` lists the methods
        the path supports.
      headers:
        Allow:
          description: Comma-separated methods the path supports, for example `GET, POST`.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            wrongMethod:
              value:
                type: https://kingresdb.dev/problems/method-not-allowed
                title: Method not allowed
                status: 405
                detail: DELETE is not supported on /api/v1/servers.
                instance: /api/v1/servers
                code: method_not_allowed
    TooManyRequests:
      description: Too many requests from this client to a rate-limited unauthenticated endpoint (health, login, setup).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AcceptedTask:
      description: |
        The operation was accepted and runs as a durable task. Poll `GET /tasks/{taskId}` (the `Location`
        header) until `state` is `done` or `failed`. Exception: the setup operations (`initCluster`,
        `joinCluster`) are polled through `GET /setup/state` (`setupTask`), because the caller has no session yet.
      headers:
        Location:
          description: URL of the task, `/api/v1/tasks/{taskId}`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Task' }
          examples:
            createDatabase:
              value:
                id: 117
                kind: database.create
                state: running
                progress:
                  percent: 33.3
                  currentStep: Create database on group 2
                  steps:
                    - { name: Create database on group 1, state: done, detail: null, itemsDone: 1, itemsTotal: 1, startedAt: '2026-11-14T09:58:00Z', finishedAt: '2026-11-14T09:58:02Z' }
                    - { name: Create database on group 2, state: running, detail: null, itemsDone: 0, itemsTotal: 1, startedAt: '2026-11-14T09:58:02Z', finishedAt: null }
                    - { name: Install extensions, state: pending, detail: null, itemsDone: null, itemsTotal: null, startedAt: null, finishedAt: null }
                error: null
                subject: { type: database, id: shop }
                cancellable: true
                detail: null
                createdAt: '2026-11-14T09:58:00Z'
                updatedAt: '2026-11-14T09:58:02Z'
                createdBy: alice

  schemas:
    # ------------------------------------------------------------------ errors
    ProblemCode:
      type: string
      description: |
        Stable machine-readable error code. Clients branch on this, not on `title` or `detail`.

        409 (state conflict): `conflict` (generic), `already_exists`, `immutable_field`,
        `rebalance_in_progress`, `operation_in_progress`, `task_not_cancellable`, `last_admin`, `role_in_use`,
        `optimistic_lock_failed`, `no_replica_available` (the instance or server is the only up-to-date copy),
        `instance_already_running` (`startThisServerInstance`), `instance_already_stopped`
        (`stopThisServerInstance`, `restartThisServerInstance`), `server_owns_buckets`,
        `server_hosts_map_group`, `last_server` (`removeServer`, `leaveCluster`), `server_group_not_empty`
        (`deleteServerGroup`), `ledger_entry_pending` (`createInclusionProof`).

        Added in 0.9.0 (409, rebalancing): `nothing_to_rebalance` (`startRebalance`: the plan is empty),
        `rebalance_not_running` (`stopRebalance`), `cluster_inconsistent` (`kingres.check_cluster()` reports something that
        makes moving buckets unsafe), `version_mismatch` (the servers do not run the same version of the sharding
        extension and the same PostgreSQL major), `failover_in_progress`, `no_receiving_server` (no server should hold
        shards). `group_degraded` and `insufficient_disk` are reserved for later increments (a move that meets them is
        skipped and reported, not refused). `leader_unavailable` (503) names, in `serverIds`, servers that can be opened
        instead. Clients must tolerate codes they do not know.

        Added in 0.5.0: `certificate_revoked` (409: `renewServerCertificates`, `revokeServerCertificates`) and
        `certificate_authority_unavailable` (503: the operation needs the certificate authority key and the manager
        leader does not hold it; `renewServerCertificates`, `revokeServerCertificates`, `addServer`, `removeServer`,
        `leaveCluster`, `joinCluster`). Clients must tolerate codes they do not know.

        Added in 0.8.0: 404 `config_parameter_unknown` (`getConfigParameter`); 422 `config_parameter_managed` (`kingresd` needs the value), `config_parameter_refused` (runs a command, loads code, names a file or is unsafe), `config_level_not_allowed` (the value must be equal on every server, or PostgreSQL has no database level for it) and `config_value_below_floor` (below what `kingresd` needs); 409 `config_change_superseded` (`revertConfigChange`), `config_restart_order_conflict` and `nothing_pending` (`restartPendingInstances`). A value that is not valid for its parameter is 400 `validation_failed`.

        Added in 0.7.0: `workbench_busy` (429: the role already runs its two workbench statements on this server, or
        the server runs four in all; `executeQuery`; with `Retry-After`). `leader_unavailable` (503) is now also
        answered by a follower that has not heard from the manager leader for longer than the leader-loss bound
        (30 s by default) to a request that needs a session check; shorter interruptions change nothing.

        Added in 0.6.0: `internal_api_disabled` (409: the server was started without its internal API, so it cannot
        take part in a cluster; `addServer`, `removeServer`, `leaveCluster`, `renewServerCertificates`,
        `revokeServerCertificates`). It is a state of the server's configuration, not a missing feature: start
        `kingresd` with an internal listen address. Before 0.6.0 these operations answered 422
        `unsupported_operation`, which a client showed as "not implemented in this version".

        503 (cannot serve now): `node_uninitialized`, `map_group_unavailable`, `leader_unavailable`,
        `quorum_unavailable`, `service_unavailable`, `system_database_stopped` (the instance that hosts the
        system database was stopped on purpose; start it with `startThisServerInstance`).
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - invalid_credentials
        - session_expired
        - csrf_token_invalid
        - forbidden
        - setup_token_invalid
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - immutable_field
        - rebalance_in_progress
        - operation_in_progress
        - task_not_cancellable
        - last_admin
        - role_in_use
        - optimistic_lock_failed
        - no_replica_available
        - instance_already_running
        - instance_already_stopped
        - server_owns_buckets
        - server_hosts_map_group
        - last_server
        - server_group_not_empty
        - ledger_entry_pending
        - quorum_unavailable
        - system_database_stopped
        - unprocessable
        - sql_error
        - unsupported_operation
        - node_state_invalid
        - node_uninitialized
        - map_group_unavailable
        - leader_unavailable
        - rate_limited
        - service_unavailable
        - internal_error
        - certificate_revoked
        - certificate_authority_unavailable
        - internal_api_disabled
        - workbench_busy
        - config_parameter_unknown
        - config_parameter_managed
        - config_parameter_refused
        - config_level_not_allowed
        - config_value_below_floor
        - config_change_superseded
        - config_restart_order_conflict
        - nothing_pending
        - nothing_to_rebalance
        - rebalance_not_running
        - cluster_inconsistent
        - version_mismatch
        - failover_in_progress
        - group_degraded
        - insufficient_disk
        - no_receiving_server
    ValidationIssue:
      type: object
      description: One invalid field of a request.
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid property of the request body, or the name of the invalid query or path parameter.
        message:
          type: string
          description: Human-readable explanation.
        code:
          type: string
          description: Short machine-readable reason, for example `required`, `out_of_range`, `pattern`, `unknown_value`.
    Problem:
      type: object
      description: RFC 9457 problem details, served as `application/problem+json`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI that identifies the problem type. `about:blank` when no more specific type exists.
        title:
          type: string
          description: Short, human-readable summary that does not change between occurrences.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference of the request that caused the problem.
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
          description: Value of the `X-Request-Id` response header, for log correlation.
        errors:
          type: array
          description: Field-level problems; present for `validation_failed`.
          items: { $ref: '#/components/schemas/ValidationIssue' }
        sqlState:
          type: string
          pattern: '^[0-9A-Z]{5}$'
          description: PostgreSQL SQLSTATE; present when `code` is `sql_error`.
        sqlPosition:
          type: integer
          minimum: 1
          description: 1-based character position of the error in the statement; present for some `sql_error` problems.
        serverIds:
          type: array
          description: 'Added in 0.9.0, optional. Servers that can be opened instead; set for `leader_unavailable`: the manager leader first when this server knows it, then the other servers of the cluster as this server knows them. Empty or absent when it knows none.'
          items: { $ref: '#/components/schemas/ServerId' }

    # ------------------------------------------------------------------ health and auth
    HealthStatus:
      type: object
      description: Liveness result.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`.
    ReadinessStatus:
      type: object
      description: Readiness result.
      required: [status, nodeState, checks]
      properties:
        status:
          type: string
          enum: [ready]
          description: Always `ready`; a server that is not ready answers 503 instead.
        nodeState:
          $ref: '#/components/schemas/NodeState'
        checks:
          type: array
          description: Individual readiness checks.
          items:
            type: object
            description: One readiness check.
            required: [name, ok]
            properties:
              name:
                type: string
                description: Check name, for example `localPostgres` or `managerReachable`.
              ok:
                type: boolean
                description: Whether the check passed.
              detail:
                type: string
                description: Explanation when the check failed.
    ClusterRoleName:
      type: string
      description: A built-in cluster role.
      enum: [kingres_admin, kingres_ops, kingres_readonly, kingres_stats]
    LoginRequest:
      type: object
      description: Credentials of a PostgreSQL role.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 63
          description: PostgreSQL role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: Role password.
        issueToken:
          type: boolean
          default: false
          description: Also return a bearer token in the response (for the CLI).
    Session:
      type: object
      description: The signed-in user, the session and the identity of the cluster.
      required: [username, clusterRoles, expiresAt, clusterId, clusterName]
      properties:
        username:
          type: string
          description: Signed-in PostgreSQL role.
        clusterRoles:
          type: array
          description: Built-in cluster roles the user is a member of.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
        expiresAt:
          type: string
          format: date-time
          description: When the session or token expires (absolute).
        csrfToken:
          type:
            - string
            - 'null'
          description: |
            CSRF token to send as `X-CSRF-Token` with cookie authentication; null for bearer authentication.
            It is fixed for the lifetime of the session: `login` issues it and `GET /auth/session` returns the
            same value; nothing rotates it.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server that issued the session; null when that server is not part of a cluster.
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Identifier of the cluster; null when the server is not part of a cluster. Present for every role, so the shell can render for an account that only has `kingres_stats`.
        clusterName:
          type:
            - string
            - 'null'
          description: Display name of the cluster; null when the server is not part of a cluster.
        token:
          type:
            - string
            - 'null'
          description: Bearer token; only present in the login response when `issueToken` was true.
        clientAddress:
          type: string
          description: |
            Added in 0.6.0, optional. The network address (IP, no port) this server saw the request come from, in
            `login` and `getSession`. It is the address of the TCP peer: behind a reverse proxy it is the proxy's.
        degraded:
          type: boolean
          description: |
            Added in 0.6.0, optional (absent means false). True when the answer was given from the memory of this
            server because the instance that hosts its system database is stopped (see `stopThisServerInstance`):
            `clusterRoles` are those of the last successful role check of this server, `serverId` may be null
            although the server is in a cluster, and nothing was read from the database. Only `getSession` can answer
            like this, and only for a session this server has checked before the stop.
        degradedReason:
          type: string
          description: Added in 0.6.0, optional. A sentence that says why `degraded` is true; present only then.

    # ------------------------------------------------------------------ setup
    NodeState:
      type: string
      description: Lifecycle state of a server.
      enum: [uninitialized, standalone, clustered]
    ServerId:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Identifier of a server. A server is a machine, defined as one distinct `host` value of the
        `kingres.node` catalog table; its id is that host string exactly as stored there (a DNS name or an
        IPv4/IPv6 address, IPv6 without brackets). The id is opaque to clients: compare it for equality, never
        parse or sort it numerically. It is a string so that the backend can later switch to a registered
        server id without changing the contract. Percent-encode it when it is used in a URL path.
      examples: ['10.0.0.11', db1.example.com]
    SetupTaskSummary:
      type: object
      description: |
        Summary of the task started by `initCluster` or `joinCluster`, served by `GET /setup/state` so that the
        wizard needs neither the setup token nor a session to follow it. It is the same task that
        `GET /tasks/{taskId}` returns after sign-in.
      required: [id, kind, state, progressPercent, steps, createdAt, updatedAt, error]
      properties:
        id:
          type: integer
          format: int64
          description: Task identifier.
        steps:
          type: array
          description: The ordered steps of the task with their state, so that the wizard can show where a failure happened.
          items:
            type: object
            description: One step.
            required: [name, state]
            properties:
              name:
                type: string
                description: Human-readable step name (English).
              state:
                type: string
                enum: [pending, running, done, failed]
                description: State of the step.
        createdAt:
          type: string
          format: date-time
          description: When the setup request was accepted.
        updatedAt:
          type: string
          format: date-time
          description: When the task last changed state or progress.
        kind:
          type: string
          enum: [cluster.init, cluster.join]
          description: Which setup operation started the task.
        state:
          $ref: '#/components/schemas/TaskState'
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress (`Task.progress.percent`).
        error:
          oneOf:
            - $ref: '#/components/schemas/TaskError'
            - type: 'null'
          description: Failure information; null unless `state` is `failed`.
        detail:
          type:
            - string
            - 'null'
          description: |
            Added in 0.6.0, optional (absent from a server of an older revision). The same text as `Task.detail`:
            for `cluster.join` the fingerprint of the existing server's certificate that was checked ("pinned") or
            only seen ("first use, not verified"), so that the wizard can show it. Null when the running step
            recorded none.
    NodeStateInfo:
      type: object
      description: Setup state of a server.
      required: [state, address, hostname, version, postgresVersion, setupTokenRequired, localhostOnly, setupTask]
      properties:
        state:
          $ref: '#/components/schemas/NodeState'
        address:
          type: string
          description: Address (host:port) of this server's panel and REST API.
        hostname:
          type: string
          description: Host name of the machine.
        version:
          type: string
          description: KingresDB version.
        commit:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{7,64}$'
          description: Added in 0.8.0 (optional; absent from a server of an older revision). The source commit this server was built from, as 7 to 64 lower-case hexadecimal characters; null when the build does not know it. The panel links the source of the running version to it (the licence, AGPL-3.0-only section 13, asks that users of a network service can get the source). A client must check the pattern before it builds a link.
        postgresVersion:
          type: string
          description: Version of the bundled PostgreSQL.
        setupTokenRequired:
          type: boolean
          description: True while the node is uninitialized and `X-Setup-Token` is needed for setup calls.
        localhostOnly:
          type: boolean
          description: True while the panel listens only on localhost (until the setup token is used).
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server identifier once the server belongs to a cluster; null before.
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier once the server belongs to a cluster; null before.
        setupTask:
          oneOf:
            - $ref: '#/components/schemas/SetupTaskSummary'
            - type: 'null'
          description: |
            Summary of the setup task. Null while no `initCluster` or `joinCluster` request was accepted; set
            from acceptance on, and kept after the task finished and after the node left `uninitialized`.
        internalFingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: |
            Added in 0.6.0, optional. SHA-256 fingerprint of the certificate this server's internal API presents to
            a server that adds it (`addServer`) while it is `uninitialized`: what an administrator pins as
            `AddServerRequest.expectedFingerprint`. It is not a secret (every machine that reaches the internal
            port sees the certificate), but the pin only protects when it comes by another way than the channel
            it protects, so the server answers it only to a request from the machine itself, which is where the
            setup wizard runs (`localhostOnly`); for every other caller, and once the server belongs to a cluster
            (then see `LocalServerInfo.internalFingerprint`), it is null.
    NodeAddress:
      type: string
      description: Address of a server's panel and REST API as host:port, host being a DNS name, IPv4 or bracketed IPv6 address and port a number from 1 to 65535.
      pattern: '^(\[[0-9a-fA-F:]+\]|[A-Za-z0-9.-]+):([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
      examples: ['10.0.0.11:8091']
    DataPaths:
      type: object
      description: Directories used by this server.
      required: [dataDirectory]
      properties:
        dataDirectory:
          type: string
          description: Absolute path under which instance data directories are created. Immutable after initialization.
        walDirectory:
          type:
            - string
            - 'null'
          description: Absolute path for WAL files; null means inside the data directory.
        logDirectory:
          type:
            - string
            - 'null'
          description: Absolute path for log files; null means the system default.
    MemoryQuota:
      type: object
      description: Memory budget of this server.
      required: [totalMegabytes]
      properties:
        totalMegabytes:
          type: integer
          minimum: 512
          description: Total memory in MiB that KingresDB may use on this server; divided among its instances.
    FeatureFlags:
      type: object
      description: Optional engine features. Each can be turned on, never off again.
      required: [sharding, ledger]
      properties:
        sharding:
          type: boolean
          description: The `kingres_shard` extension is enabled.
        ledger:
          type: boolean
          description: The `kingres_ledger` extension is enabled.
    AdminAccount:
      type: object
      description: The first administrator account (a PostgreSQL role in `kingres_admin`).
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: Password, at least 12 characters.
    AdminCredentials:
      type: object
      description: Credentials of an existing cluster administrator.
      required: [username, password]
      properties:
        username:
          type: string
          description: Role name in `kingres_admin`.
        password:
          type: string
          format: password
          writeOnly: true
          description: Role password.
    InitClusterRequest:
      type: object
      description: Settings for creating a new cluster on this server.
      required: [clusterName, admin, dataPaths, memoryQuota]
      properties:
        clusterName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'
          description: Display name of the cluster.
        admin:
          $ref: '#/components/schemas/AdminAccount'
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        features:
          $ref: '#/components/schemas/FeatureFlags'
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          default: 1
          description: Default number of standby copies of every shard group.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
    JoinClusterRequest:
      type: object
      description: Settings for joining this server to an existing cluster.
      required: [existingNodeAddress, admin, dataPaths]
      properties:
        existingNodeAddress:
          $ref: '#/components/schemas/NodeAddress'
        admin:
          $ref: '#/components/schemas/AdminCredentials'
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group (rack or zone) to place this server in.
        advertiseAddress:
          oneOf:
            - $ref: '#/components/schemas/NodeAddress'
            - type: 'null'
          description: Address other servers use to reach this one, if different from its listen address.
        expectedFingerprint:
          type:
            - string
            - 'null'
          description: |
            SHA-256 fingerprint (hex, colons allowed) that the internal certificate of the existing server must
            have. With it, a different certificate is refused before the administrator's password is sent. From
            0.6.0 one of `expectedFingerprint` and `allowUnpinned: true` is required (see there); a malformed
            value is 400 `validation_failed`. Replaces the header `X-Kingres-Pin-Sha256` of 0.3.0, which is
            still accepted; both must agree if both are given. The internal API of a server is at its REST host
            and the port above its REST port. An administrator reads the value on the existing server's panel
            (`internalFingerprint` of `GET /this-server`).
        allowUnpinned:
          type: boolean
          default: false
          description: |
            Added in 0.6.0. Without an `expectedFingerprint` the administrator's user name and password are sent
            to whatever certificate answers at `existingNodeAddress` (trust on first use), where a machine on the
            path receives them. Since 0.6.0 such a request is refused with 400 `validation_failed`
            (`errors[].field` `/expectedFingerprint`, code `required`) unless `allowUnpinned` is true, which is
            the administrator's explicit acceptance of that risk. Ignored when a fingerprint is given.

    # ------------------------------------------------------------------ this server
    ServiceName:
      type: string
      description: A process role inside `kingresd` or a bundled component.
      enum: [api, agent, manager, router, etcd, patroni, metrics]
    ServiceStatus:
      type: object
      description: Status of one service of this server.
      required: [name, state]
      properties:
        name:
          $ref: '#/components/schemas/ServiceName'
        state:
          type: string
          enum: [running, stopped, degraded, disabled]
          description: Service state.
        since:
          type: string
          format: date-time
          description: When the service entered this state.
        detail:
          type: string
          description: Explanation for `degraded` or `stopped`.
    LocalServerInfo:
      type: object
      description: Node-local summary of the server that served the request.
      required: [serverId, address, hostname, version, postgresVersion, nodeState, clusterId, uptimeSeconds, isManagerLeader, services]
      properties:
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server identifier; null unless clustered.
        address:
          type: string
          description: Address (host:port) of this server's REST API.
        hostname:
          type: string
          description: Host name.
        version:
          type: string
          description: KingresDB version.
        postgresVersion:
          type:
            - string
            - 'null'
          description: PostgreSQL version of the managed instance; null when no instance is running.
        nodeState:
          $ref: '#/components/schemas/NodeState'
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null unless clustered.
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds since `kingresd` started.
        isManagerLeader:
          type: boolean
          description: Whether this server currently runs the active manager.
        services:
          type: array
          description: Status of the local services.
          items: { $ref: '#/components/schemas/ServiceStatus' }
        internalFingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: |
            Added in 0.6.0, optional. SHA-256 fingerprint of the certificate this server's internal API presents
            now (its cluster certificate); what an administrator pins as `JoinClusterRequest.expectedFingerprint`
            when another server joins through this one. Null when the server has no certificate. It follows a
            certificate renewal.
    CpuUsage:
      type: object
      description: CPU usage. A value the server cannot measure is null ("not available"), never 0.
      required: [cores, usagePercent]
      properties:
        cores:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Number of logical CPUs; null when not available.
        usagePercent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: Average utilization over the last sampling interval; null when not available.
        loadAverage1m:
          type:
            - number
            - 'null'
          minimum: 0
          description: One-minute load average; null when not available.
    MemoryUsage:
      type: object
      description: Memory usage. A value the server cannot measure is null ("not available"), never 0.
      required: [totalBytes, usedBytes]
      properties:
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Physical memory; null when not available.
        usedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Memory in use; null when not available.
        quotaBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Configured memory quota for KingresDB; null when not available.
    DiskUsage:
      type: object
      description: Usage of one filesystem. A value the server cannot measure is null ("not available"), never 0.
      required: [path, purpose, totalBytes, usedBytes]
      properties:
        path:
          type: string
          description: Mount point or directory.
        purpose:
          type: string
          enum: [data, wal, log, other]
          description: What KingresDB stores there.
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Capacity; null when not available.
        usedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Used space; null when not available.
    ServerResources:
      type: object
      description: Disk, memory and CPU of a server.
      required: [cpu, memory, disks, sampledAt]
      properties:
        cpu:
          $ref: '#/components/schemas/CpuUsage'
        memory:
          $ref: '#/components/schemas/MemoryUsage'
        disks:
          type: array
          description: Filesystems used by KingresDB.
          items: { $ref: '#/components/schemas/DiskUsage' }
        sampledAt:
          type: string
          format: date-time
          description: When the values were sampled.
    InstanceRole:
      type: string
      description: Role of an instance in its shard group.
      enum: [primary, standby]
    Instance:
      type: object
      description: One PostgreSQL instance on a server. It is the primary or a standby of exactly one shard group.
      required: [id, serverId, shardGroupId, isMapGroup, role, state, port]
      properties:
        id:
          type: integer
          format: int32
          description: Instance identifier, equal to `node_id` in `kingres.node`.
        serverId:
          $ref: '#/components/schemas/ServerId'
        shardGroupId:
          type: integer
          format: int32
          minimum: 0
          description: Shard group the instance belongs to, equal to `group_id` in `kingres.node`. The map group has id 0.
        isMapGroup:
          type: boolean
          description: Whether the shard group is the map group (holds the cluster catalog).
        role:
          $ref: '#/components/schemas/InstanceRole'
        state:
          type: string
          enum: [running, starting, stopping, stopped, restarting, failed]
          description: Process state.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: PostgreSQL port of the instance.
        dataDirectory:
          type: string
          description: Data directory of the instance.
        version:
          type: string
          description: PostgreSQL version.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Size of the data directory; null when not available.
        upstreamInstanceId:
          type:
            - integer
            - 'null'
          format: int32
          description: For a standby, the instance it replicates from.
        replicationLagBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: For a standby, WAL bytes behind the primary; null for a primary.
        replicationLagSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: For a standby, replay lag in seconds; null for a primary.
    InstanceList:
      type: object
      description: Instances of a server.
      required: [items]
      properties:
        items:
          type: array
          description: The instances.
          items: { $ref: '#/components/schemas/Instance' }
    InstanceActionRequest:
      type: object
      description: Options of an instance stop or restart.
      properties:
        force:
          type: boolean
          default: false
          description: Proceed even when the instance holds the only up-to-date copy of a shard group.
    LogLevel:
      type: string
      description: Log severity.
      enum: [debug, info, warning, error]
    LogComponent:
      type: string
      description: Source of a log entry.
      enum: [api, agent, manager, router, etcd, patroni, postgres, metrics]
    LocalSettings:
      type: object
      description: Settings of this server only.
      required: [dataPaths, memoryQuota, logLevel, clientPorts, restartRequired]
      properties:
        dataPaths:
          description: |
            The directories of this server. In this answer `walDirectory` and `logDirectory` are always
            present (0.6.0 states it; 0.5.0 left them out when they were not set): `null` means the default
            named in `DataPaths`, otherwise the absolute path. They stay optional in `DataPaths` because
            the setup requests may leave them out.
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        clientPorts:
          type: object
          description: Client ports of the router on this server.
          required: [readWritePort]
          properties:
            readWritePort:
              type: integer
              minimum: 1
              maximum: 65535
              description: Read-write client port.
            readOnlyPort:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 65535
              description: Optional read-only client port; null when disabled.
        restartRequired:
          type: boolean
          description: True when a saved change needs a restart of this server's instances to take effect.
    LocalSettingsUpdate:
      type: object
      description: |
        Partial update of local settings. Only the three members below exist; any other member (for
        example `dataPaths` or `clientPorts`) is refused with 400 `validation_failed`. `memoryQuota` and
        `logDirectory` need a restart of this server's instances (`LocalSettings.restartRequired`),
        `logLevel` does not.
      minProperties: 1
      additionalProperties: false
      properties:
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        logDirectory:
          type:
            - string
            - 'null'
          description: Absolute log directory; null for the system default.
    LeaveClusterRequest:
      type: object
      description: Options of leaving the cluster.
      properties:
        force:
          type: boolean
          default: false
          description: Leave even if the rest of the cluster cannot be reached.
    LogEntry:
      type: object
      description: One log line.
      required: [timestamp, level, component, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the entry was written.
        level:
          $ref: '#/components/schemas/LogLevel'
        component:
          $ref: '#/components/schemas/LogComponent'
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server that wrote the entry.
        instanceId:
          type:
            - integer
            - 'null'
          format: int32
          description: Instance that wrote the entry, for `postgres` and `patroni`.
        message:
          type: string
          description: Log message.
    MissingServer:
      type: object
      description: |
        Added in 0.5.0. A server that did not take part in a cluster-wide answer (`listLogs`, `listAlerts`,
        `queryMetrics`): the receiving server asks every other server for its part in parallel, each with its own
        deadline, and says here which ones it could not use.
      required: [serverId, reason]
      properties:
        serverId:
          $ref: '#/components/schemas/ServerId'
        reason:
          type: string
          description: |
            Why: `timeout` (no answer within the deadline), `unreachable` (the connection failed), `refused` (the
            server answered with an error, for example because it no longer accepts the caller's role) or
            `invalidAnswer` (the answer was too large or not well formed). Clients must tolerate other values.
          enum: [timeout, unreachable, refused, invalidAnswer]
    LogPage:
      type: object
      description: A page of log entries.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Entries, newest first.
          items: { $ref: '#/components/schemas/LogEntry' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        partial:
          type: boolean
          description: Added in 0.5.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.5.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }
    NextCursor:
      type:
        - string
        - 'null'
      description: Cursor for the next page; null when this is the last page.

    # ------------------------------------------------------------------ cluster
    ClusterHealth:
      type: string
      description: Overall health.
      enum: [healthy, degraded, critical]
    ServerStatus:
      type: string
      description: |
        `live` healthy; `suspect` heartbeats are late; `draining` (0.9.0 states what decides it): the server should not hold
        shards (`shouldHaveShards` false) and still runs the primary of at least one shard group that owns buckets, so a
        rebalance has buckets to move away from it; it is `live` again when none is left (the standbys it hosts for other
        groups do not count: a rebalance does not move them); `decommissioning` (0.9.0, it was never set before): its
        removal task (`server.remove`) is running; `dead` no liveness for the failure timeout;

        **Liveness (0.7.0).** Servers send each other a heartbeat every second. A server from which the answering
        server has heard nothing for the suspect timeout (5 s by default) is `suspect`, after the failure timeout
        (10 s by default) `dead`; it comes back to the status the catalog gives it as soon as it is heard again
        (nothing is stored). `suspect` and `dead` therefore depend on **the answering server's own view**: two
        servers can differ for a moment, and a server cut off from the others shows them all as dead. The counts
        of `ClusterOverview` and the list of `listServers` come from the same snapshot on the answering server and
        always agree.
        `pendingRebalance` joined but holds no data yet.

        `pendingRebalance` (0.6.0 states what decides it): the server should hold shards, it is the primary of no
        bucket, and buckets exist in the cluster. The replicas of a neighbouring group's buckets that a joining
        server gets a standby for do not count as data; the same server was `live` in one answer and
        `pendingRebalance` in the next while that copy was still running. Every server answers the same for the
        same catalog, except for `suspect` and `dead` (see liveness).
      enum: [live, suspect, draining, decommissioning, dead, pendingRebalance]
    ServerCounts:
      type: object
      description: Number of servers per status.
      required: [total, live, suspect, draining, decommissioning, dead, pendingRebalance]
      properties:
        total:
          type: integer
          minimum: 0
          description: All servers.
        live:
          type: integer
          minimum: 0
          description: Servers with status `live`.
        suspect:
          type: integer
          minimum: 0
          description: Servers with status `suspect`.
        draining:
          type: integer
          minimum: 0
          description: Servers with status `draining`.
        decommissioning:
          type: integer
          minimum: 0
          description: Servers with status `decommissioning`.
        dead:
          type: integer
          minimum: 0
          description: Servers with status `dead`.
        pendingRebalance:
          type: integer
          minimum: 0
          description: Servers with status `pendingRebalance`.
    BucketCounts:
      type: object
      description: Bucket totals over all colocation groups.
      required: [total, underReplicated, unavailable, moving, orphan]
      properties:
        total:
          type: integer
          minimum: 0
          description: All buckets.
        underReplicated:
          type: integer
          minimum: 0
          description: Buckets with fewer live copies than the replica count.
        unavailable:
          type: integer
          minimum: 0
          description: Buckets with no live primary.
        moving:
          type: integer
          minimum: 0
          description: Buckets in state `moving`.
        orphan:
          type: integer
          minimum: 0
          description: Buckets in state `orphan` (left-over shards awaiting cleanup).
    RebalanceReason:
      type: string
      description: Why a rebalance is needed.
      enum: [serverAdded, serverRemoved, replicaCountChanged, replicasMissing, skewed, serverGroupChanged]
    ClusterSummary:
      type: object
      description: Short cluster summary for statistics-only accounts. Null means "not available".
      required: [clusterId, name, health, serverCount, databaseCount, openAlerts]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null when the node state carries no cluster identity.
        name:
          type:
            - string
            - 'null'
          description: Cluster name; null when the node state carries no cluster identity.
        health:
          $ref: '#/components/schemas/ClusterHealth'
        serverCount:
          type: integer
          minimum: 0
          description: Number of servers.
        databaseCount:
          type: integer
          minimum: 0
          description: Number of user databases.
        openAlerts:
          type: integer
          minimum: 0
          description: Number of open alerts; 0 when the alert system is not available.
    ClusterOverview:
      type: object
      description: Cluster-wide health summary.
      required: [clusterId, name, health, version, mapVersion, mapGroupAvailable, managerLeader, servers, buckets, databaseCount, rebalance, autoFailover, openAlerts, features, updatedAt]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null when the node state carries no cluster identity.
        name:
          type:
            - string
            - 'null'
          description: Cluster name; null when the node state carries no cluster identity.
        health:
          $ref: '#/components/schemas/ClusterHealth'
        version:
          type: string
          description: KingresDB version of the cluster.
        mapVersion:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic version of the bucket map.
        mapGroupAvailable:
          type: boolean
          description: False while the map group is failing over; topology changes are paused.
        managerLeader:
          oneOf:
            - type: object
              description: The elected manager.
              required: [serverId, address]
              properties:
                serverId:
                  $ref: '#/components/schemas/ServerId'
                address:
                  type: string
                  description: Address of that server.
                since:
                  type: string
                  format: date-time
                  description: When it became leader.
            - type: 'null'
          description: The manager leader; null while an election is in progress.
        servers:
          $ref: '#/components/schemas/ServerCounts'
        buckets:
          $ref: '#/components/schemas/BucketCounts'
        databaseCount:
          type: integer
          minimum: 0
          description: Number of user databases.
        rebalance:
          type: object
          description: Rebalance summary.
          required: [needed, reasons, running, taskId]
          properties:
            needed:
              type: boolean
              description: Whether the current placement differs from the target placement.
            reasons:
              type: array
              description: Reasons a rebalance is needed.
              items: { $ref: '#/components/schemas/RebalanceReason' }
            running:
              type: boolean
              description: Whether a rebalance is running.
            taskId:
              type:
                - integer
                - 'null'
              format: int64
              description: Task of the running rebalance.
        autoFailover:
          type: object
          description: Auto-failover summary.
          required: [enabled, eventsSinceReset, maxCount]
          properties:
            enabled:
              type: boolean
              description: Whether auto-failover is enabled.
            eventsSinceReset:
              type: integer
              minimum: 0
              description: Automatic failovers since the last reset (a rebalance resets it).
            maxCount:
              type: integer
              minimum: 1
              description: Maximum automatic failovers before manual intervention is required.
        openAlerts:
          type: object
          description: Number of open alerts per severity.
          required: [critical, warning, info]
          properties:
            critical:
              type: integer
              minimum: 0
              description: Open critical alerts.
            warning:
              type: integer
              minimum: 0
              description: Open warning alerts.
            info:
              type: integer
              minimum: 0
              description: Open info alerts.
        features:
          $ref: '#/components/schemas/FeatureFlags'
        updatedAt:
          type: string
          format: date-time
          description: When this summary was computed.

    # ------------------------------------------------------------------ servers
    ServerResourceSummary:
      type: object
      description: Compact resource usage of a server. A value the server cannot measure is null ("not available"), never 0.
      required: [cpuUsagePercent, memoryUsedBytes, memoryTotalBytes, diskUsedBytes, diskTotalBytes]
      properties:
        cpuUsagePercent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: CPU utilization; null when not available.
        memoryUsedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Memory in use; null when not available.
        memoryTotalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Physical memory; null when not available.
        diskUsedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Used space on the data filesystem; null when not available.
        diskTotalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Capacity of the data filesystem; null when not available.
    BucketHolding:
      type: object
      description: Number of buckets held as primary and as replica.
      required: [primary, replica]
      properties:
        primary:
          type: integer
          minimum: 0
          description: Buckets for which this server hosts the primary copy.
        replica:
          type: integer
          minimum: 0
          description: Buckets for which this server hosts a replica copy.
    Server:
      type: object
      description: A machine in the cluster, defined as one distinct host of the `kingres.node` catalog. Values the backend does not know yet are null ("not available"), never invented zeros.
      required: [id, address, hostname, status, serverGroup, shouldHaveShards, isManagerLeader, version, uptimeSeconds, joinedAt, lastHeartbeatAt, certificateExpiresAt, seenFingerprint, fingerprintPinned, instances, buckets, sizeBytes, resources]
      properties:
        certificateRevokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Added in 0.5.0, optional. When the certificates of this server were revoked (`revokeServerCertificates`); absent or null when they were not. A server with revoked certificates cannot take part in the cluster until it is removed and joined again.
        id:
          $ref: '#/components/schemas/ServerId'
        address:
          type: string
          description: Address (host:port) of the server's REST API.
        hostname:
          type: string
          description: Host name.
        status:
          $ref: '#/components/schemas/ServerStatus'
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group (rack or zone) name.
        shouldHaveShards:
          type: boolean
          description: Whether rebalance may place buckets on this server; false drains it.
        isManagerLeader:
          type: boolean
          description: Whether the active manager runs here.
        version:
          type:
            - string
            - 'null'
          description: KingresDB version of that server; null when the server cannot know it (a remote server whose version has not been reported).
        uptimeSeconds:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Seconds since `kingresd` started; null when not available (the server's agent is not reachable). Since 0.6.0 every server that answers the manager's question has one, not only the server that served the request.
        joinedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the server joined the cluster (the manager leader's record); null when not available. Set for every server of a cluster since 0.6.0 (it was always null before).
        lastHeartbeatAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Last heartbeat the answering server heard from this server (0.7.0 and later; the heartbeats go between all servers, not to the manager); null when it has heard none, and for the answering server itself.
        certificateExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            `notAfter` of the server certificate the cluster issued to this server (the one its internal API
            presents); null when not available (the certificate has not been read, for example the server is
            unreachable and the leader holds no copy). The alert kind `certificateExpiring` is raised from it.
        seenFingerprint:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: |
            SHA-256 fingerprint of the bootstrap certificate this server presented when it was added or joined
            (the value recorded on first contact, 64 lower-case hex characters, no colons; the same value
            as in `Task.detail` of `server.add`). Null when no first contact was recorded: the server that
            created the cluster, and servers added before this property existed.
        fingerprintPinned:
          type: boolean
          description: |
            True when the fingerprint was checked against an expected one given by the operator
            (`expectedFingerprint` or the `X-Kingres-Pin-Sha256` header) before the server was trusted; false
            for trust on first use and whenever `seenFingerprint` is null.
        instances:
          type: array
          description: Instances on this server with role, shard group, port and lag.
          items: { $ref: '#/components/schemas/Instance' }
        buckets:
          $ref: '#/components/schemas/BucketHolding'
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Data size on this server; null when not available.
        replicationLagMaxSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: Largest replay lag of any standby on this server.
        resources:
          $ref: '#/components/schemas/ServerResourceSummary'
    DatabaseBucketCount:
      type: object
      description: Buckets of one database held by a server.
      required: [databaseName, primaryBuckets, replicaBuckets, primarySizeBytes, replicaSizeBytes]
      properties:
        databaseName:
          type: string
          description: Database name.
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets with their primary copy on the server.
        replicaBuckets:
          type: integer
          minimum: 0
          description: Buckets with a replica copy on the server.
        primarySizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of primary copies; null when bucket sizes are not available.
        replicaSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of replica copies; null when bucket sizes are not available.
    ServerDetail:
      description: A server with its bucket counts per database.
      allOf:
        - $ref: '#/components/schemas/Server'
        - type: object
          required: [bucketsByDatabase]
          properties:
            bucketsByDatabase:
              type: array
              description: Bucket counts per database.
              items: { $ref: '#/components/schemas/DatabaseBucketCount' }
    ServerList:
      type: object
      description: All servers.
      required: [items]
      properties:
        items:
          type: array
          description: The servers.
          items: { $ref: '#/components/schemas/Server' }
    AddServerRequest:
      type: object
      description: A server to add.
      required: [address, setupToken]
      properties:
        address:
          $ref: '#/components/schemas/NodeAddress'
        setupToken:
          type: string
          writeOnly: true
          minLength: 1
          description: The new server's one-time setup token.
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group to place the server in.
        expectedFingerprint:
          type:
            - string
            - 'null'
          description: |
            SHA-256 fingerprint (hex, colons allowed) that the bootstrap certificate of the new server must have
            (the server logs it at start). With it, a different certificate is refused before the setup token is
            sent. From 0.6.0 one of `expectedFingerprint` and `allowUnpinned: true` is required (see there). A
            malformed value is 400 `validation_failed` on every server, also when the request is sent to a server
            that is not the manager leader, and the pin is kept on the way to the leader. Replaces the header
            `X-Kingres-Pin-Sha256` of 0.3.0, which is still accepted; both must agree if both are given. The
            internal API of the new server is at its REST host and the port above its REST port. The new server
            shows the value in `GET /node` (`internalFingerprint`) on its own panel.
        allowUnpinned:
          type: boolean
          default: false
          description: |
            Added in 0.6.0. Without an `expectedFingerprint` the first contact trusts whatever certificate answers
            at `address` (trust on first use): a machine on the path then receives the setup token and a
            certificate of the cluster. Since 0.6.0 such a request is refused with 400 `validation_failed`
            (`errors[].field` `/expectedFingerprint`, code `required`) unless `allowUnpinned` is true, which
            is the administrator's explicit acceptance of that risk. Ignored when a fingerprint is given.
    ServerUpdateRequest:
      type: object
      description: |
        Partial update of a server. Only these two members exist; every other property of `Server` is
        read-only and is refused with 400 `validation_failed`.
      minProperties: 1
      additionalProperties: false
      properties:
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group name; null removes the server from its group. The group must exist (422 `unprocessable` otherwise).
        shouldHaveShards:
          type: boolean
          description: False excludes the server from bucket placement at the next rebalance.
    FailoverRequest:
      type: object
      description: Failover options.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [hard, graceful]
          description: '`graceful` waits for standbys to catch up (server must be live); `hard` promotes immediately and can lose async writes.'
    ServerGroup:
      type: object
      description: A rack or zone.
      required: [name, serverIds]
      properties:
        name:
          type: string
          description: Group name.
        description:
          type: string
          description: Free text.
        serverIds:
          type: array
          description: Member servers.
          items: { $ref: '#/components/schemas/ServerId' }
    ServerGroupCreateRequest:
      type: object
      description: A new server group.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'
          description: Unique name (exact, case-sensitive comparison); an existing name is 409 `already_exists`, a name that does not match the pattern is 400 `validation_failed`.
        description:
          type: string
          maxLength: 200
          description: Free text.
    ServerGroupList:
      type: object
      description: All server groups.
      required: [items]
      properties:
        items:
          type: array
          description: The groups.
          items: { $ref: '#/components/schemas/ServerGroup' }

    # ------------------------------------------------------------------ databases
    Durability:
      type: string
      description: |
        Commit durability. `async` maps to `synchronous_commit = local` (a commit waits only for the
        local flush), `sync` to `on` (it waits until a quorum of synchronous standbys has flushed the
        commit to disk), and `syncApply` to `remote_apply` (it also waits until those standbys have
        applied it, so a read on them sees the commit).
      enum: [async, sync, syncApply]
      default: sync
    LedgerMode:
      type: string
      description: |
        `off` no ledger; `optIn` tables choose ledger individually; `appendOnly` or `updatable` make every
        new table a ledger table of that type.
      enum: [off, optIn, appendOnly, updatable]
    DatabaseStatus:
      type: string
      description: Lifecycle status of a database.
      enum: [creating, ready, dropping, failed]
    DatabaseGeneral:
      type: object
      description: General settings as read back. Per-database settings the backend cannot determine yet are null ("not available").
      required: [owner, encoding, lcCollate, lcCtype, connectionLimit]
      properties:
        owner:
          type:
            - string
            - 'null'
          description: Owner role. Can be changed later. Null when not available.
        encoding:
          type:
            - string
            - 'null'
          description: Character set encoding, for example `UTF8`. Immutable after creation. Null when not available.
          x-immutable: true
        lcCollate:
          type:
            - string
            - 'null'
          description: Collation locale. Immutable after creation. Null when not available.
          x-immutable: true
        lcCtype:
          type:
            - string
            - 'null'
          description: Character classification locale. Immutable after creation. Null when not available.
          x-immutable: true
        connectionLimit:
          type:
            - integer
            - 'null'
          minimum: -1
          description: Maximum concurrent connections; -1 is unlimited. Can be changed later. Null when not available.
    DatabaseGeneralCreate:
      type: object
      description: General settings for a new database; omitted fields take server defaults.
      properties:
        owner:
          type: string
          description: Owner role; defaults to the caller.
        encoding:
          type: string
          default: UTF8
          description: Character set encoding.
        lcCollate:
          type: string
          description: Collation locale; defaults to the cluster default.
        lcCtype:
          type: string
          description: Character classification locale; defaults to the cluster default.
        connectionLimit:
          type: integer
          minimum: -1
          default: -1
          description: Maximum concurrent connections; -1 is unlimited.
    ShardingSettings:
      type: object
      description: Sharding settings as read back (response only; the create request uses `ShardingCreateSettings`).
      required: [enabled, bucketCount]
      properties:
        enabled:
          type: boolean
          description: Whether tables of this database can be distributed. Can be turned on later, never off.
        bucketCount:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 4096
          description: Number of hash buckets per colocation group. Fixed at creation (immutable). Null when not available.
          x-immutable: true
    ShardingCreateSettings:
      type: object
      description: Sharding settings of a create request. A group that is present must be complete.
      required: [enabled, bucketCount]
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether tables of this database can be distributed. Can be turned on later, never off.
        bucketCount:
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
          description: Number of hash buckets per colocation group, 1 to 4096, default 128. Fixed at creation (immutable).
          x-immutable: true
    ReplicationSettings:
      type: object
      description: Replication settings as read back (response only; the create request uses `ReplicationCreateSettings`).
      required: [durability, replicaCount]
      properties:
        durability:
          oneOf:
            - $ref: '#/components/schemas/Durability'
            - type: 'null'
          description: Commit durability of the database; null when not available.
        replicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Current cluster-wide replica count, shown for information. It is a cluster setting (physical
            replication copies whole instances); change it with PATCH /settings/cluster. It does not exist
            in any request schema.
    ReplicationCreateSettings:
      type: object
      description: Replication settings of a create request. The replica count is a cluster setting and cannot be given here.
      required: [durability]
      properties:
        durability:
          $ref: '#/components/schemas/Durability'
    LedgerSettings:
      type: object
      description: Ledger settings as read back (response only; the create request uses `LedgerCreateSettings`).
      required: [mode, digestIntervalSeconds]
      properties:
        mode:
          oneOf:
            - $ref: '#/components/schemas/LedgerMode'
            - type: 'null'
          description: Ledger mode; null when not available.
        digestIntervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 60
          maximum: 86400
          description: How often a block is closed and a digest generated automatically; null when not available.
    LedgerCreateSettings:
      type: object
      description: Ledger settings of a create request. A group that is present must be complete.
      required: [mode, digestIntervalSeconds]
      properties:
        mode:
          $ref: '#/components/schemas/LedgerMode'
        digestIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: How often a block is closed and a digest generated automatically.
    DatabaseStats:
      type: object
      description: Live statistics of a database. A statistic the backend cannot measure is null ("not available"), never 0.
      required: [sizeBytes, tableCount, activeConnections, transactionsPerSecond]
      properties:
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Total size over all shard groups (primary copies); null when not available.
        tableCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of user tables; null when not available.
        activeConnections:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Current connections; null when not available.
        transactionsPerSecond:
          type:
            - number
            - 'null'
          minimum: 0
          description: Committed transactions per second (recent average); null when not available.
    DatabaseHealth:
      type: object
      description: Replication health of a database. Null counters mean "not available" (no bucket map yet), never 0.
      required: [underReplicatedBuckets, unavailableBuckets]
      properties:
        underReplicatedBuckets:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Buckets with fewer live copies than the replica count; null when not available.
        unavailableBuckets:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Buckets with no live primary; null when not available.
    LedgerVerificationState:
      type: string
      description: '`never` not verified yet; `running` a verification is in progress; `passed` the last verification found nothing; `failed` the last verification found inconsistencies.'
      enum: [never, running, passed, failed]
    Database:
      type: object
      description: A database with its four settings groups and live statistics.
      required: [name, status, general, sharding, replication, ledger, stats, health, ledgerSummary, rebalanceRequired, createdBy, createdAt]
      properties:
        name:
          type: string
          description: Database name. Immutable.
          x-immutable: true
        status:
          $ref: '#/components/schemas/DatabaseStatus'
        general:
          $ref: '#/components/schemas/DatabaseGeneral'
        sharding:
          $ref: '#/components/schemas/ShardingSettings'
        replication:
          $ref: '#/components/schemas/ReplicationSettings'
        ledger:
          $ref: '#/components/schemas/LedgerSettings'
        stats:
          $ref: '#/components/schemas/DatabaseStats'
        health:
          $ref: '#/components/schemas/DatabaseHealth'
        ledgerSummary:
          type: object
          description: Ledger status summary.
          required: [verificationState, lastVerifiedBlockHeight]
          properties:
            verificationState:
              oneOf:
                - $ref: '#/components/schemas/LedgerVerificationState'
                - type: 'null'
              description: Verification state; null when not available (as opposed to `never`, which means the database was never verified).
            lastVerifiedBlockHeight:
              type:
                - integer
                - 'null'
              format: int64
              description: Highest verified block height (minimum over chains); null if never verified.
            complete:
              type: boolean
              description: 'Added in 0.9.0, optional. The coverage of the summary, with the meaning of `LedgerStatus.complete`: true when the summary covers the chains of every shard group of the database, false when the answering server knows only the chains of its own group; then `uncoveredShardGroupIds` lists the others.'
            uncoveredShardGroupIds:
              type: array
              description: Added in 0.9.0, optional. The shard groups whose chains the summary does not cover (empty when `complete`).
              items: { type: integer, format: int32, minimum: 0 }
        rebalanceRequired:
          type: boolean
          description: Whether this database's buckets need rebalancing.
        createdBy:
          type:
            - string
            - 'null'
          description: Role that created the database; null when not recorded (databases created outside the control plane).
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Creation time; null when not recorded (databases created outside the control plane).
    DatabaseList:
      type: object
      description: All databases.
      required: [items]
      properties:
        items:
          type: array
          description: The databases.
          items: { $ref: '#/components/schemas/Database' }
    DatabaseCreateRequest:
      type: object
      description: A new database. A settings group that is present must be complete; an omitted group takes cluster defaults.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Database name; lower-case letters, digits and underscore.
        general:
          $ref: '#/components/schemas/DatabaseGeneralCreate'
        sharding:
          $ref: '#/components/schemas/ShardingCreateSettings'
        replication:
          $ref: '#/components/schemas/ReplicationCreateSettings'
        ledger:
          $ref: '#/components/schemas/LedgerCreateSettings'
    DatabaseUpdateRequest:
      type: object
      description: Partial update of the mutable settings. Immutable fields are not accepted.
      minProperties: 1
      properties:
        general:
          type: object
          description: Mutable general settings.
          minProperties: 1
          properties:
            owner:
              type: string
              description: New owner role.
            connectionLimit:
              type: integer
              minimum: -1
              description: New connection limit; -1 is unlimited.
        sharding:
          type: object
          description: Sharding changes.
          required: [enabled]
          properties:
            enabled:
              type: boolean
              enum: [true]
              description: Turn sharding on. Turning it off is not possible.
        replication:
          type: object
          description: Replication changes.
          required: [durability]
          properties:
            durability:
              $ref: '#/components/schemas/Durability'
        ledger:
          type: object
          description: Ledger changes. The mode can be raised from `off` and switched between `appendOnly` and `updatable` for new tables, but never set back to `off`.
          minProperties: 1
          properties:
            mode:
              $ref: '#/components/schemas/LedgerMode'
            digestIntervalSeconds:
              type: integer
              minimum: 60
              maximum: 86400
              description: New digest interval.
    IntegerRange:
      type: object
      description: A default value and its allowed range.
      required: [default, minimum, maximum]
      properties:
        default:
          type: integer
          description: Default value.
        minimum:
          type: integer
          description: Smallest allowed value.
        maximum:
          type: integer
          description: Largest allowed value.
    DatabaseCreateOptions:
      type: object
      description: What the create-database dialog offers.
      required: [encodings, collations, bucketCount, replicaCount, defaultDurability, ledgerDigestIntervalSeconds]
      properties:
        encodings:
          type: array
          description: Valid values of `general.encoding`.
          items:
            type: object
            description: One encoding.
            required: [name, isDefault]
            properties:
              name:
                type: string
                description: Encoding name as accepted by `general.encoding`, for example `UTF8`.
              isDefault:
                type: boolean
                description: Whether it is used when `general.encoding` is omitted.
        collations:
          type: array
          description: Valid values of `general.lcCollate` and `general.lcCtype` (the same list serves both).
          items:
            type: object
            description: One locale.
            required: [name, encodings, isDefault]
            properties:
              name:
                type: string
                description: Locale name, for example `en_US.UTF-8` or `C`.
              encodings:
                type:
                  - array
                  - 'null'
                description: Encodings the locale can be combined with. `null` means every encoding; an empty array means none (the locale is listed but cannot be combined with any encoding the server offers).
                items: { type: string }
              isDefault:
                type: boolean
                description: Whether it is used when the field is omitted.
        bucketCount:
          description: Bucket count of a sharded database; default 128, range 1 to 4096.
          $ref: '#/components/schemas/IntegerRange'
        replicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: Current cluster-wide replica count (cluster setting, shown for information).
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        ledgerDigestIntervalSeconds:
          description: Automatic digest interval of the ledger; default 3600, range 60 to 86400.
          $ref: '#/components/schemas/IntegerRange'

    # ------------------------------------------------------------------ tables
    TableClass:
      type: string
      description: |
        A table has one or more classes. `plain` is a normal table on its home shard group; `distributed` is
        hash-distributed over buckets; `reference` is copied to every shard group; `ledger` has a tamper-evident
        ledger. A table can be `distributed` and `ledger` (or `reference` and `ledger`) at the same time.
        **`plain` is never combined with another class**: a plain table with a ledger is `[ledger]`, not
        `[plain, ledger]`.
      enum: [plain, distributed, reference, ledger]
    TableDistribution:
      type: object
      description: How a distributed or reference table is spread over shard groups.
      required: [method, column, colocationId, bucketCount]
      properties:
        method:
          type: string
          enum: [hash, reference]
          description: '`hash` distributes rows by hash of the column; `reference` copies the table to every group.'
        column:
          type:
            - string
            - 'null'
          description: Distribution column; null for reference tables.
        colocationId:
          type:
            - integer
            - 'null'
          format: int32
          description: Colocation group of the table; null for a reference table, which is in none (0.9.0; a reference table could not be made before).
        bucketCount:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Bucket count of the colocation group; null for a reference table.
    TableLedger:
      type: object
      description: Ledger properties of a table.
      required: [mode, historyTable]
      properties:
        mode:
          type: string
          enum: [appendOnly, updatable]
          description: '`appendOnly` allows INSERT only; `updatable` keeps a history table of changed rows.'
        historyTable:
          type:
            - string
            - 'null'
          description: Name of the history table in the same schema; null for `appendOnly`.
    Table:
      type: object
      description: A table with its distribution and ledger properties.
      required: [schema, name, classes, distribution, ledger, homeShardGroupId, estimatedRows, sizeBytes]
      properties:
        schema:
          type: string
          description: Schema name.
        name:
          type: string
          description: Table name.
        classes:
          type: array
          description: Classes of the table (see `TableClass`).
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/TableClass' }
        distribution:
          oneOf:
            - $ref: '#/components/schemas/TableDistribution'
            - type: 'null'
          description: Distribution; null for a plain table.
        ledger:
          oneOf:
            - $ref: '#/components/schemas/TableLedger'
            - type: 'null'
          description: Ledger properties; null when the table is not a ledger table. Cannot be removed once set.
        homeShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Shard group (`group_id`; 0 is the map group, the default home) holding a plain table; null for distributed and reference tables.
        estimatedRows:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Estimated row count over all shards; null when not available.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Table size over all shards (primary copies); null when not available.
    DistributionBlockedReason:
      type: string
      description: |
        Why a column cannot be the distribution column. When several reasons apply the first of this list wins:
        `shardingDisabled` sharding is not enabled on the database; `tableNotPlain` the table is already
        distributed or a reference table; `unsupportedType` the column type cannot be hashed by the engine;
        `notInUniqueKey` the table has at least one primary or unique key that does not contain this column
        (PostgreSQL requires the partition key in every unique index; the keys are listed in
        `TableColumn.blockingKeys`). A table without any unique key never has this reason.
      enum: [shardingDisabled, tableNotPlain, unsupportedType, notInUniqueKey]
    TableColumn:
      type: object
      description: One column of a table.
      required: [name, type, nullable, canBeDistributionColumn, distributionBlockedReason, blockingKeys]
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          description: The text of PostgreSQL `format_type(atttypid, atttypmod)`, for example `bigint`, `character varying(20)` or `numeric(12,2)`. For display only; clients must not parse it.
        blockingKeys:
          type: array
          description: Names of the primary and unique keys (index names) that do not contain this column. Non-empty exactly when `distributionBlockedReason` is `notInUniqueKey`.
          items: { type: string }
        nullable:
          type: boolean
          description: True when the column has no NOT NULL constraint.
        canBeDistributionColumn:
          type: boolean
          description: Whether `PUT .../distribution` accepts this column as `distributionColumn` now.
        distributionBlockedReason:
          oneOf:
            - $ref: '#/components/schemas/DistributionBlockedReason'
            - type: 'null'
          description: Why the column cannot be the distribution column; null when `canBeDistributionColumn` is true.
    TableDetail:
      description: A table with its columns.
      allOf:
        - $ref: '#/components/schemas/Table'
        - type: object
          required: [columns]
          properties:
            columns:
              type: array
              description: Columns in ordinal position order.
              items: { $ref: '#/components/schemas/TableColumn' }
    TablePage:
      type: object
      description: A page of tables.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The tables.
          items: { $ref: '#/components/schemas/Table' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    TableRef:
      type: object
      description: A table reference.
      required: [schema, table]
      properties:
        schema:
          type: string
          description: Schema name.
        table:
          type: string
          description: Table name.
    EnableTableLedgerRequest:
      type: object
      description: How to put a table under ledger control.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [appendOnly, updatable]
          description: '`appendOnly` allows INSERT only; `updatable` also allows UPDATE and DELETE and keeps a history table.'
    DistributeTableRequest:
      type: object
      description: How to distribute a plain table.
      required: [method]
      properties:
        method:
          type: string
          enum: [hash, reference]
          description: Distribution method.
        distributionColumn:
          type: string
          description: Column to hash; required for `hash`, forbidden for `reference`.
        colocateWith:
          oneOf:
            - $ref: '#/components/schemas/TableRef'
            - type: 'null'
          description: Existing distributed table whose colocation group to join; null creates or reuses a group by column type.

    # ------------------------------------------------------------------ shards
    BucketState:
      type: string
      description: '`active` normal; `moving` being copied to another group; `orphan` left-over shard awaiting deferred cleanup.'
      enum: [active, moving, orphan]
    ColocationGroup:
      type: object
      description: Tables that share one bucket map.
      required: [colocationId, bucketCount, distributionColumnType, tableCount, sizeBytes]
      properties:
        colocationId:
          type: integer
          format: int32
          description: Colocation group identifier.
        bucketCount:
          type: integer
          minimum: 1
          description: Number of buckets.
        distributionColumnType:
          type: string
          description: PostgreSQL type of the distribution column.
        tableCount:
          type: integer
          minimum: 0
          description: Tables in the group.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Size of the group's data (primary copies); null when not available.
    ColocationGroupList:
      type: object
      description: Colocation groups of a database.
      required: [items]
      properties:
        items:
          type: array
          description: The groups.
          items: { $ref: '#/components/schemas/ColocationGroup' }
    Bucket:
      type: object
      description: One hash bucket of a colocation group.
      required: [bucket, shardGroupId, state, primaryServerId, replicaServerIds, sizeBytes, movingToShardGroupId]
      properties:
        bucket:
          type: integer
          minimum: 0
          description: 'Bucket number: `hash(key)` reduced to the number of buckets of the colocation group (`ColocationGroup.bucketCount`) by the sharding extension''s own hash function, which is not PostgreSQL''s `hashtext` followed by a modulo; use `kingres.bucket_for` to find the bucket of a value.'
        shardGroupId:
          type: integer
          format: int32
          description: Shard group that owns the bucket.
        state:
          $ref: '#/components/schemas/BucketState'
        primaryServerId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server currently hosting the owning group's primary; null if the group has no primary.
        replicaServerIds:
          type: array
          description: Servers hosting the owning group's standbys.
          items: { $ref: '#/components/schemas/ServerId' }
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of the bucket over all tables of the group; null when not available.
        movingToShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Destination group while `state` is `moving`.
    BucketPage:
      type: object
      description: A page of the bucket map.
      required: [mapVersion, items, nextCursor]
      properties:
        mapVersion:
          type: integer
          format: int64
          description: Version of the bucket map the page was read from.
        items:
          type: array
          description: The buckets, ordered by number.
          items: { $ref: '#/components/schemas/Bucket' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    ServerBucketCount:
      type: object
      description: Buckets held by one server.
      required: [serverId, primaryBuckets, replicaBuckets, primarySizeBytes, replicaSizeBytes]
      properties:
        serverId:
          $ref: '#/components/schemas/ServerId'
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets with their primary copy here.
        replicaBuckets:
          type: integer
          minimum: 0
          description: Buckets with a replica copy here.
        primarySizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of primary copies; null when bucket sizes are not available.
        replicaSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of replica copies; null when bucket sizes are not available.
    BucketDistribution:
      type: object
      description: Bucket counts and sizes per server.
      required: [mapVersion, servers]
      properties:
        mapVersion:
          type: integer
          format: int64
          description: Version of the bucket map.
        servers:
          type: array
          description: One entry per server.
          items: { $ref: '#/components/schemas/ServerBucketCount' }

    # ------------------------------------------------------------------ replication
    ReplicationSyncState:
      type: string
      description: Synchronous state of a standby as in `pg_stat_replication.sync_state`.
      enum: [async, potential, sync, quorum]
    ReplicationMember:
      type: object
      description: One instance of a shard group in the replication topology.
      required: [instanceId, serverId, role, state, port, timeline, syncState, lagBytes, lagSeconds, isOnPreferredServer]
      properties:
        instanceId:
          type: integer
          format: int32
          description: Instance identifier. For a standby that kingresd manages and that is not in the sharding catalog yet (until the extension supports standby nodes) it is 1048576 plus the standby's own id, outside the range of the catalog's node ids; clients treat it as opaque.
        serverId:
          $ref: '#/components/schemas/ServerId'
        role:
          $ref: '#/components/schemas/InstanceRole'
        state:
          type: string
          enum: [running, starting, stopping, stopped, restarting, failed]
          description: Process state.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: PostgreSQL port.
        timeline:
          type: integer
          minimum: 1
          description: PostgreSQL timeline id.
        syncState:
          oneOf:
            - $ref: '#/components/schemas/ReplicationSyncState'
            - type: 'null'
          description: Synchronous state; null for a primary.
        lagBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: WAL bytes behind the primary; null for a primary.
        lagSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: Replay lag in seconds; null for a primary.
        isOnPreferredServer:
          type: boolean
          description: For a primary, whether it runs on the group's preferred (home) server.
    ReplicationSlot:
      type: object
      description: A replication slot on a primary.
      required: [name, type, active, instanceId, retainedWalBytes]
      properties:
        name:
          type: string
          description: Slot name.
        type:
          type: string
          enum: [physical, logical]
          description: Slot type; logical slots are used by bucket moves.
        active:
          type: boolean
          description: Whether a consumer is connected.
        instanceId:
          type: integer
          format: int32
          description: Instance that owns the slot.
        retainedWalBytes:
          type: integer
          format: int64
          minimum: 0
          description: WAL retained for the slot.
    ShardGroup:
      type: object
      description: A shard group (or the map group) with its replication state.
      required: [id, isMapGroup, preferredPrimaryServerId, health, primary, standbys, slots]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
          description: Shard group identifier, equal to `group_id` in `kingres.node`. The map group is group 0.
        isMapGroup:
          type: boolean
          description: Whether this is the map group (`group_id` 0).
        preferredPrimaryServerId:
          $ref: '#/components/schemas/ServerId'
        health:
          type: string
          enum: [healthy, degraded, unavailable]
          description: '`healthy` all standbys in sync; `degraded` a standby missing or lagging; `unavailable` no primary.'
        primary:
          oneOf:
            - $ref: '#/components/schemas/ReplicationMember'
            - type: 'null'
          description: Current primary; null while the group has none.
        standbys:
          type: array
          description: Standbys of the group.
          items: { $ref: '#/components/schemas/ReplicationMember' }
        slots:
          type: array
          description: Replication slots on the primary.
          items: { $ref: '#/components/schemas/ReplicationSlot' }
        lease:
          $ref: '#/components/schemas/GroupLease'
    GroupLease:
      type: object
      description: |
        Added in 0.7.0, optional (absent when the answering server knows nothing about the group's lease). The lease
        that keeps two primaries from running for one shard group: the server that runs the primary renews it from a
        majority of the servers every two seconds, and stops its instance when it cannot (a group with a standby) or
        raises the alert `leaseLost` (a group without one). The state is **the answering server's knowledge**, not a
        cluster-wide agreement: `held`/`lost` for a group whose primary the answering server runs, `granted` for
        a group it granted to another server.
      required: [holder, state, enforced]
      properties:
        holder:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server that holds the lease as far as the answering server knows; **null when `state` is `none`** (0.9.0; the property stays required, its value can now be null).
        state:
          type: string
          enum: [held, lost, granted, none]
          description: '`held` valid now; `lost` the primary of this group runs here and the lease was not renewed; `granted` granted by the answering server to `holder`; `none`.'
        remainingMillis:
          type: integer
          format: int64
          minimum: 0
          description: Time left on the answering server's monotonic clock; absent when not meaningful.
        enforced:
          type: boolean
          description: Whether losing the lease stops the instance (the group has a standby).
    ReplicationTopology:
      type: object
      description: Replication state of the whole cluster.
      required: [generatedAt, groups]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the topology was read.
        groups:
          type: array
          description: All shard groups including the map group.
          items: { $ref: '#/components/schemas/ShardGroup' }

    # ------------------------------------------------------------------ rebalance
    RebalanceOptions:
      type: object
      description: Options of a rebalance.
      properties:
        databases:
          type: array
          description: Restrict to these databases; omitted or empty means all.
          items: { type: string }
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          description: Concurrent bucket moves; defaults to the cluster setting (4 unless changed). **This version runs one move at a time** and records the value (0.9.0).
    RebalancePlanRequest:
      description: Options of a plan preview.
      allOf:
        - $ref: '#/components/schemas/RebalanceOptions'
        - type: object
          properties:
            moveLimit:
              type: integer
              minimum: 1
              maximum: 5000
              default: 200
              description: Maximum number of moves listed in the response.
    PlannedMove:
      type: object
      description: One bucket move of a plan.
      required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, estimatedSizeBytes, rank]
      properties:
        databaseName:
          type: string
          description: Database.
        colocationId:
          type: integer
          format: int32
          description: Colocation group.
        bucket:
          type: integer
          minimum: 0
          description: Bucket number.
        fromShardGroupId:
          type: integer
          format: int32
          description: Source shard group.
        toShardGroupId:
          type: integer
          format: int32
          description: Destination shard group.
        fromServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the source group when the plan was made; the page shows servers, not group numbers.
        toServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the destination group.
        estimatedSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Estimated bytes to copy; null when bucket sizes are not available.
        rank:
          type: integer
          minimum: 0
          maximum: 1000
          description: Priority from 0 to 1000; higher moves run earlier.
    RebalancePlan:
      type: object
      description: A rebalance plan preview.
      required: [needed, totals, truncated, moves, serverImpacts, warnings]
      properties:
        needed:
          type: boolean
          description: False when nothing would move.
        totals:
          type: object
          description: Totals over the full plan.
          required: [moveCount, totalBytes, estimatedDurationSeconds]
          properties:
            moveCount:
              type: integer
              minimum: 0
              description: Number of bucket moves.
            totalBytes:
              type:
                - integer
                - 'null'
              format: int64
              minimum: 0
              description: Bytes to copy; null when bucket sizes are not available.
            estimatedDurationSeconds:
              type:
                - integer
                - 'null'
              minimum: 0
              description: Rough duration estimate; null when not available.
        truncated:
          type: boolean
          description: True when `moves` is shorter than `totals.moveCount`.
        moves:
          type: array
          description: The first moves of the plan.
          items: { $ref: '#/components/schemas/PlannedMove' }
        serverImpacts:
          type: array
          description: Primary bucket count per server before and after the plan.
          items:
            type: object
            description: Effect of the plan on one server.
            required: [serverId, primaryBucketsBefore, primaryBucketsAfter]
            properties:
              serverId:
                $ref: '#/components/schemas/ServerId'
              primaryBucketsBefore:
                type: integer
                minimum: 0
                description: Primary buckets now.
              primaryBucketsAfter:
                type: integer
                minimum: 0
                description: Primary buckets after the plan.
        warnings:
          type: array
          description: Conditions the operator should know about, for example tables without a replica identity.
          items: { type: string }
    BucketMove:
      type: object
      description: A bucket move in flight.
      required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, phase, percent, sizeBytes]
      properties:
        databaseName:
          type: string
          description: Database.
        colocationId:
          type: integer
          format: int32
          description: Colocation group.
        bucket:
          type: integer
          minimum: 0
          description: Bucket number.
        fromShardGroupId:
          type: integer
          format: int32
          description: Source shard group.
        toShardGroupId:
          type: integer
          format: int32
          description: Destination shard group.
        fromServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the source group.
        toServerId:
          type: string
          description: Added in 0.9.0, optional. The server that runs the primary of the destination group.
        phase:
          type: string
          enum: [prepare, copy, catchUp, switch, cleanup]
          description: |
            Current phase of the move: the extension's `preparing`, `copying`, `catching_up`, `switching` and
            `cleaning`. `percent` is an estimate by phase (5, 30, 85, 95, 100): the extension does not report how much of
            the copy is done.
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Progress of the move.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes to move; null when bucket sizes are not available.
    RebalanceProgress:
      type: object
      description: Progress counters of a rebalance.
      required: [movesTotal, movesDone, movesInFlight, movesFailed, bytesMoved, percent]
      properties:
        movesTotal:
          type: integer
          minimum: 0
          description: Moves planned.
        movesDone:
          type: integer
          minimum: 0
          description: Moves completed.
        movesInFlight:
          type: integer
          minimum: 0
          description: Moves running now.
        movesFailed:
          type: integer
          minimum: 0
          description: Moves that failed.
        movesSkipped:
          type: integer
          minimum: 0
          description: Added in 0.9.0, optional. Moves not made in this run (skipped by a condition, or cancelled by a stop).
        bytesMoved:
          type: integer
          format: int64
          minimum: 0
          description: Bytes copied so far (the planned size of the moves that are done).
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress.
    RebalanceStatus:
      type: object
      description: Current rebalance state.
      required: [state, needed, reasons, lastReport]
      properties:
        state:
          type: string
          enum: [idle, running, stopping, stopped, failed]
          description: '`idle` no unfinished run; `running`; `stopping` a stop was asked and the move in flight has not ended; `stopped` a paused run that `POST /rebalance` goes on with; `failed` no unfinished run and the last one ended failed (see `getRebalanceStatus`).'
        needed:
          type: boolean
          description: Whether the placement differs from the target placement.
        reasons:
          type: array
          description: Why a rebalance is needed.
          items: { $ref: '#/components/schemas/RebalanceReason' }
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Task of the current or stopped run.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current run started.
        options:
          oneOf:
            - $ref: '#/components/schemas/RebalanceOptions'
            - type: 'null'
          description: Options of the current run.
        progress:
          oneOf:
            - $ref: '#/components/schemas/RebalanceProgress'
            - type: 'null'
          description: Progress of the current run; null while no run is active.
        inFlightMoves:
          type: array
          description: Moves running now.
          items: { $ref: '#/components/schemas/BucketMove' }
        stoppedBy:
          type:
            - string
            - 'null'
          description: 'Added in 0.9.0, optional. Who stopped the run, while it is `stopping` or `stopped`: `operator` or `safetyRule`. Clients must tolerate other values. Null otherwise.'
        pausedReason:
          type:
            - string
            - 'null'
          description: Added in 0.9.0, optional. The text the run recorded when it paused (what stopped it, and that `POST /rebalance` goes on). Null while it is not stopped.
        lastReport:
          oneOf:
            - $ref: '#/components/schemas/RebalanceReportSummary'
            - type: 'null'
          description: Summary of the most recent finished or failed run other than the current one, so the page can show what happened last while `progress` is null; null when no run has finished yet.
    RebalanceReportSummary:
      type: object
      description: Summary of one rebalance run.
      required: [id, outcome, startedAt, finishedAt, totals]
      properties:
        id:
          type: integer
          format: int64
          description: Report identifier; equals the identifier of the rebalance task.
        outcome:
          type: string
          enum: [completed, stopped, failed]
          description: How the run ended.
        startedAt:
          type: string
          format: date-time
          description: Start time.
        finishedAt:
          type: string
          format: date-time
          description: End time.
        options:
          $ref: '#/components/schemas/RebalanceOptions'
        stoppedBy:
          type:
            - string
            - 'null'
          description: 'Added in 0.9.0, optional. For outcome `stopped`: `operator` or `safetyRule`.'
        error:
          type:
            - string
            - 'null'
          description: Added in 0.9.0, optional. Why the run failed or was stopped by a safety rule; null otherwise.
        totals:
          type: object
          description: Totals of the run.
          required: [movesTotal, movesDone, movesFailed, bytesMoved, durationSeconds]
          properties:
            movesSkipped:
              type: integer
              minimum: 0
              description: Added in 0.9.0, optional. Moves not made (skipped by a condition, or cancelled by a stop).
            movesTotal:
              type: integer
              minimum: 0
              description: Moves planned (at least the moves of the report).
            movesDone:
              type: integer
              minimum: 0
              description: Moves completed.
            movesFailed:
              type: integer
              minimum: 0
              description: Moves failed.
            bytesMoved:
              type: integer
              format: int64
              minimum: 0
              description: Bytes copied.
            durationSeconds:
              type: integer
              minimum: 0
              description: Wall-clock duration.
    RebalanceReport:
      description: Full report of a rebalance run.
      allOf:
        - $ref: '#/components/schemas/RebalanceReportSummary'
        - type: object
          required: [moves]
          properties:
            placementBefore:
              type: array
              description: Added in 0.9.0, optional. Primary buckets per database and server when the run started.
              items: { $ref: '#/components/schemas/PlacementEntry' }
            placementAfter:
              type: array
              description: Added in 0.9.0, optional. The same when the run ended; empty for a run that has not ended.
              items: { $ref: '#/components/schemas/PlacementEntry' }
            moves:
              type: array
              description: Every move of the run.
              items:
                type: object
                description: Result of one move.
                required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, outcome]
                properties:
                  databaseName:
                    type: string
                    description: Database.
                  colocationId:
                    type: integer
                    format: int32
                    description: Colocation group.
                  bucket:
                    type: integer
                    minimum: 0
                    description: Bucket number.
                  fromShardGroupId:
                    type: integer
                    format: int32
                    description: Source shard group.
                  toShardGroupId:
                    type: integer
                    format: int32
                    description: Destination shard group.
                  fromServerId:
                    type: string
                    description: Added in 0.9.0, optional. The server that ran the primary of the source group.
                  toServerId:
                    type: string
                    description: Added in 0.9.0, optional. The server that ran the primary of the destination group.
                  attempts:
                    type: integer
                    minimum: 0
                    description: Added in 0.9.0, optional. How many times the move was tried.
                  skipReason:
                    type:
                      - string
                      - 'null'
                    description: 'Added in 0.9.0, optional. For outcome `skipped`: `stopped` (cancelled by a stop), `targetDiskLow`, `groupDegraded` or `groupLeaseLost`. Clients must tolerate other values.'
                  sizeBytes:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Bytes copied (the size the plan estimated).
                  outcome:
                    type: string
                    enum: [done, failed, skipped]
                    description: Result of the move.
                  durationSeconds:
                    type: number
                    minimum: 0
                    description: Duration of the move.
                  error:
                    type:
                      - string
                      - 'null'
                    description: Error message for a failed move.
    PlacementEntry:
      type: object
      description: Added in 0.9.0. The primary buckets one server holds in one database.
      required: [databaseName, serverId, primaryBuckets]
      properties:
        databaseName:
          type: string
          description: Database.
        serverId:
          $ref: '#/components/schemas/ServerId'
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets of the groups whose primary the server runs, over all colocation groups of the database.
    RebalanceReportPage:
      type: object
      description: A page of rebalance report summaries.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Summaries, newest first.
          items: { $ref: '#/components/schemas/RebalanceReportSummary' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ tasks
    TaskState:
      type: string
      description: Task state machine state.
      enum: [pending, running, paused, failed, done]
    TaskKind:
      type: string
      description: |
        Kind of task. Each kind has one fixed `subject.type`; the table is in the README
        (section "Task kinds and subjects"). `standby.reconcile` is added in 0.7.0.
      enum:
        - cluster.init
        - cluster.join
        - server.add
        - server.remove
        - server.failover
        - server.leave
        - instance.start
        - instance.stop
        - instance.restart
        - database.create
        - database.update
        - database.drop
        - table.distribute
        - rebalance
        - replication.restorePreferredPrimaries
        - ledger.verify
        - networkAccess.apply
        - replicate.apply
        - certificate.renew
        - certificate.revoke
        - standby.reconcile
        - config.apply
        - config.restart
    TaskStep:
      type: object
      description: One step of a task.
      required: [name, state]
      properties:
        name:
          type: string
          description: Step name.
        state:
          type: string
          enum: [pending, running, done, failed, skipped]
          description: 'Step state. `skipped` (set by `kingresd` since 0.9.0; before, it recorded `done`): the step decided on purpose that it has nothing to do, and `detail` says why; the task goes on with the next step and counts the step as over. A paused task shows the step it will go on with as `pending`.'
        detail:
          type:
            - string
            - 'null'
          description: 'Extra information about the step, for example `Waiting for server db3, which cannot be reached`. Set while the step runs, and for a step that was `skipped` (the reason, for example `skipped: needs kingres_shard 0.5`); null otherwise.'
        itemsDone:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Items completed, for example buckets moved.
        itemsTotal:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Items in total.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the step started.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the step ended.
    TaskProgress:
      type: object
      description: Progress of a task.
      required: [percent, steps]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress.
        currentStep:
          type:
            - string
            - 'null'
          description: Name of the running step.
        steps:
          type: array
          description: Per-step detail in execution order.
          items: { $ref: '#/components/schemas/TaskStep' }
    TaskError:
      type: object
      description: Why a task failed.
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable reason, for example `cancelled`, `step_failed`, `timeout`.
        message:
          type: string
          description: Human-readable explanation.
        step:
          type:
            - string
            - 'null'
          description: Step that failed.
        retryable:
          type: boolean
          description: Whether starting the same operation again may succeed.
    TaskSubject:
      type: object
      description: The resource a task works on.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [cluster, server, instance, database, table, rebalance, replication, ledgerVerification, networkAccess, config]
          description: Resource type.
        id:
          type: string
          description: |
            Resource identifier: database name; server id (`ServerId`); instance id (`node_id`) as a decimal
            string; `database/schema.table` for a table; the verification id; the task id for a rebalance;
            the literal `cluster`, `preferred-primaries` or `network-access` for the singleton subjects.
            See the README table "Task kinds and subjects".
    Task:
      type: object
      description: A durable long-running operation.
      required: [id, kind, state, progress, error, subject, detail, cancellable, createdAt, updatedAt, createdBy]
      properties:
        id:
          type: integer
          format: int64
          description: Task identifier (`task_id` in `kingres.task`).
        detail:
          type:
            - string
            - 'null'
          description: |
            Free text the running step recorded for the operator: the server a step is waiting for, or the
            certificate fingerprint seen when a server was added. Null when there is none. The text of the
            running step is repeated in `TaskStep.detail`.
        kind:
          $ref: '#/components/schemas/TaskKind'
        state:
          $ref: '#/components/schemas/TaskState'
        progress:
          $ref: '#/components/schemas/TaskProgress'
        error:
          oneOf:
            - $ref: '#/components/schemas/TaskError'
            - type: 'null'
          description: Failure information; null unless `state` is `failed`.
        subject:
          oneOf:
            - $ref: '#/components/schemas/TaskSubject'
            - type: 'null'
          description: Resource the task works on.
        cancellable:
          type: boolean
          description: Whether `POST /tasks/{taskId}/cancel` is accepted now.
        createdAt:
          type: string
          format: date-time
          description: Creation time.
        updatedAt:
          type: string
          format: date-time
          description: Last state or progress change.
        createdBy:
          type: string
          description: Role that started the task, or `system` for automatic tasks such as auto-failover.
    TaskPage:
      type: object
      description: A page of tasks.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Tasks, newest first.
          items: { $ref: '#/components/schemas/Task' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ security
    ClusterRoleInfo:
      type: object
      description: A built-in cluster role.
      required: [name, description]
      properties:
        name:
          $ref: '#/components/schemas/ClusterRoleName'
        description:
          type: string
          description: What the role allows.
    ClusterRoleInfoList:
      type: object
      description: The built-in cluster roles.
      required: [items]
      properties:
        items:
          type: array
          description: The four roles.
          items: { $ref: '#/components/schemas/ClusterRoleInfo' }
    Role:
      type: object
      description: A PostgreSQL role.
      required: [name, canLogin, isSuperuser, canCreateDatabase, canCreateRole, connectionLimit, validUntil, memberOf, clusterRoles]
      properties:
        name:
          type: string
          description: Role name.
        canLogin:
          type: boolean
          description: LOGIN attribute; false means the account is disabled.
        isSuperuser:
          type: boolean
          description: SUPERUSER attribute (read-only; not changeable through the API).
        canCreateDatabase:
          type: boolean
          description: CREATEDB attribute.
        canCreateRole:
          type: boolean
          description: CREATEROLE attribute.
        connectionLimit:
          type: integer
          minimum: -1
          description: Connection limit; -1 is unlimited.
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: Password expiry; null for none.
        memberOf:
          type: array
          description: Ordinary roles this role is a member of (cluster roles excluded).
          items: { type: string }
        clusterRoles:
          type: array
          description: Built-in cluster roles this role is a member of.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
    RolePage:
      type: object
      description: A page of roles.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Roles ordered by name.
          items: { $ref: '#/components/schemas/Role' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    RoleCreateRequest:
      type: object
      description: A new role.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: Initial password; required when `canLogin` is true.
        canLogin:
          type: boolean
          default: true
          description: LOGIN attribute.
        canCreateDatabase:
          type: boolean
          default: false
          description: CREATEDB attribute.
        canCreateRole:
          type: boolean
          default: false
          description: CREATEROLE attribute.
        connectionLimit:
          type: integer
          minimum: -1
          default: -1
          description: Connection limit; -1 is unlimited.
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: Password expiry.
        memberOf:
          type: array
          description: Ordinary roles to join.
          items: { type: string }
        clusterRoles:
          type: array
          description: Built-in cluster roles to join.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
    RoleUpdateRequest:
      type: object
      description: Partial update of a role.
      minProperties: 1
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: New password.
        canLogin:
          type: boolean
          description: LOGIN attribute; false disables the account.
        canCreateDatabase:
          type: boolean
          description: CREATEDB attribute.
        canCreateRole:
          type: boolean
          description: CREATEROLE attribute.
        connectionLimit:
          type: integer
          minimum: -1
          description: Connection limit.
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: Password expiry; null removes it.
    RoleMembershipsRequest:
      type: object
      description: The complete ordinary-role membership of a role.
      required: [memberOf]
      properties:
        memberOf:
          type: array
          description: Roles to be a member of; others are revoked.
          uniqueItems: true
          items: { type: string }
    RoleClusterRolesRequest:
      type: object
      description: The complete cluster-role membership of a role.
      required: [clusterRoles]
      properties:
        clusterRoles:
          type: array
          description: Cluster roles to be a member of; others are revoked.
          uniqueItems: true
          items: { $ref: '#/components/schemas/ClusterRoleName' }
    GrantLevel:
      type: string
      description: Object level of a grant.
      enum: [database, schema, table]
    Privilege:
      type: string
      description: |
        PostgreSQL privilege. Valid per level: database `connect`, `create`, `temporary`;
        schema `usage`, `create`; table `select`, `insert`, `update`, `delete`, `truncate`, `references`, `trigger`.
      enum: [connect, create, temporary, usage, select, insert, update, delete, truncate, references, trigger]
    Grant:
      type: object
      description: Privileges of a role on one object.
      required: [grantee, level, database, schema, table, privileges]
      properties:
        grantee:
          type: string
          description: Role holding the privileges.
        level:
          $ref: '#/components/schemas/GrantLevel'
        database:
          type: string
          description: Database.
        schema:
          type:
            - string
            - 'null'
          description: Schema; null at database level.
        table:
          type:
            - string
            - 'null'
          description: Table; null at database and schema level.
        privileges:
          type: array
          description: Privileges held.
          items: { $ref: '#/components/schemas/Privilege' }
    GrantPage:
      type: object
      description: A page of grants.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The grants.
          items: { $ref: '#/components/schemas/Grant' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    GrantRequest:
      type: object
      description: Privileges to grant or revoke.
      required: [grantee, level, database, privileges]
      properties:
        grantee:
          type: string
          description: Role.
        level:
          $ref: '#/components/schemas/GrantLevel'
        database:
          type: string
          description: Database.
        schema:
          type: string
          description: Schema; required for levels `schema` and `table`.
        table:
          type: string
          description: Table; required for level `table`.
        privileges:
          type: array
          description: Privileges; must be valid for the level.
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Privilege' }
    GrantTemplateRequest:
      type: object
      description: A grant template to apply.
      required: [template, grantee, database]
      properties:
        template:
          type: string
          enum: [readOnly, readWrite, owner]
          description: Template name.
        grantee:
          type: string
          description: Role.
        database:
          type: string
          description: Database.
    NetworkAccessRule:
      type: object
      description: One pg_hba-style rule. Rules are evaluated in list order, first match wins.
      required: [type, databases, users, address, method]
      properties:
        type:
          type: string
          enum: [host, hostssl, hostnossl]
          description: Connection type.
        databases:
          type: array
          description: Database names, or `all`.
          minItems: 1
          items: { type: string }
        users:
          type: array
          description: Role names, or `all`.
          minItems: 1
          items: { type: string }
        address:
          type: string
          description: Client network in CIDR notation, or `all`.
        method:
          type: string
          enum: [scram-sha-256, cert, reject]
          description: Authentication method; `cert` requires a client certificate.
        comment:
          type:
            - string
            - 'null'
          description: Free text.
    NetworkAccess:
      type: object
      description: Network access configuration.
      required: [revision, tlsRequired, rules, applyStatus]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Revision of the rule set; incremented by every change.
        tlsRequired:
          type: boolean
          description: When true only `hostssl` and `cert` rules are accepted.
        rules:
          type: array
          description: Ordered rules.
          items: { $ref: '#/components/schemas/NetworkAccessRule' }
        applyStatus:
          type: array
          description: Per-server application of the current revision.
          items:
            type: object
            description: Application state on one server.
            required: [serverId, appliedRevision, error]
            properties:
              serverId:
                $ref: '#/components/schemas/ServerId'
              appliedRevision:
                type: integer
                format: int64
                description: Revision applied on that server.
              error:
                type:
                  - string
                  - 'null'
                description: Error from the last attempt, if any.
    NetworkAccessCheck:
      type: object
      description: "Added in 0.6.0. The answer of a dry run of `replaceNetworkAccess`. A change that would be refused is answered with a problem, never with `valid` false."
      required: [valid, revision]
      properties:
        valid:
          type: boolean
          description: Always true.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The current revision of the rule set, which the request matched.
    NetworkAccessUpdateRequest:
      type: object
      description: The complete new rule set.
      required: [revision, tlsRequired, rules]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Revision the client based its change on.
        tlsRequired:
          type: boolean
          description: Require TLS for client connections.
        rules:
          type: array
          description: The complete ordered rule list.
          maxItems: 1000
          items: { $ref: '#/components/schemas/NetworkAccessRule' }
    AuditOutcome:
      type: string
      description: Result of an audited action.
      enum: [success, failure, denied]
    AuditAction:
      type: string
      description: |
        What happened. Either the `operationId` of the audited operation of this contract (for example
        `createDatabase`, `dropDatabase`, `login`, `executeQuery`), or one of the events that are not an
        operation: `loginFailed` (a sign-in attempt that was rejected, also for an unknown user), `setupTokenRejected`
        (a wrong setup token), `autoFailover` (a failover started by the manager, actor `system`). From 0.5.0 also `certificateRenewed` and `certificateRenewalFailed` (a server renewed its certificates by itself, or failed to; actor `system`). From 0.7.0 also `leaseLost`, `leaseFenced` and `leaseAcquired` (the lease of a shard group, actor `system`, resource type `shardGroup`, resource id the group id) and the operation `cancelStatement`; and the standby events `standbyCreated`, `standbyRemoved`, `standbyRebuilt` (resource type `standby`, by the leader), `standbyInstanceStarted`, `standbyInstanceRemoved`, `standbyInstanceRebuilt` (by the server that runs the instance), `synchronousStandbyNamesChanged` and `replicationSlotDropped` (by the server that runs the primary), all with actor `system` unless an administrator started the task. A denied
        or failed call of an operation is recorded under that operation's id with `outcome` `denied` or
        `failure`. Read-only operations are not audited except `executeQuery`.
      enum:
        - login
        - logout
        - loginFailed
        - setupTokenRejected
        - initCluster
        - joinCluster
        - updateThisServerSettings
        - restartThisServerInstance
        - stopThisServerInstance
        - startThisServerInstance
        - leaveCluster
        - addServer
        - updateServer
        - removeServer
        - failoverServer
        - autoFailover
        - createServerGroup
        - deleteServerGroup
        - createDatabase
        - updateDatabase
        - dropDatabase
        - distributeTable
        - enableTableLedger
        - restorePreferredPrimaries
        - startRebalance
        - stopRebalance
        - cancelTask
        - createRole
        - updateRole
        - deleteRole
        - setRoleMemberships
        - setRoleClusterRoles
        - createGrant
        - revokeGrants
        - applyGrantTemplate
        - replaceNetworkAccess
        - updateClusterSettings
        - generateLedgerDigest
        - startLedgerVerification
        - executeQuery
        - acknowledgeAlert
        - renewServerCertificates
        - revokeServerCertificates
        - certificateRenewed
        - certificateRenewalFailed
        - cancelStatement
        - leaseLost
        - leaseFenced
        - leaseAcquired
        - standbyCreated
        - standbyRemoved
        - standbyRebuilt
        - standbyInstanceStarted
        - standbyInstanceRemoved
        - standbyInstanceRebuilt
        - synchronousStandbyNamesChanged
        - replicationSlotDropped
        - applyConfigChange
        - revertConfigChange
        - restartPendingInstances
    AuditEvent:
      type: object
      description: One audit log entry.
      required: [id, timestamp, actor, source, action, outcome]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Event identifier, unique in the cluster. From 0.6.0 the high bits are the ordinal of the server
            whose log holds the event (as for `Alert.id`) and the low 32 bits count that server's events, so
            the ids of one server increase but those of the cluster do not form a sequence. A client must treat
            the id as an opaque number below 2^53.
        timestamp:
          type: string
          format: date-time
          description: When the action happened.
        actor:
          type: string
          description: Role that performed it, or `system`.
        actorAddress:
          type: string
          description: Client IP address.
        source:
          type: string
          enum: [panel, cli, rest, system]
          description: Client type.
        action:
          $ref: '#/components/schemas/AuditAction'
        resourceType:
          type: string
          description: Type of the affected resource.
        resourceId:
          type: string
          description: Identifier of the affected resource.
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Task started by the action.
        requestId:
          type: string
          description: Request identifier for log correlation.
        details:
          type: object
          description: Action-specific data. Secrets are never recorded.
          additionalProperties: true
        serverId:
          type: string
          description: Added in 0.6.0, optional. The server whose audit log holds the event (the one that wrote it); absent when the server has no cluster identity yet.
    AuditPage:
      type: object
      description: A page of audit events.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Events, newest first.
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        partial:
          type: boolean
          description: Added in 0.6.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.6.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }

    # ------------------------------------------------------------------ settings
    ClusterSettings:
      type: object
      description: Cluster-wide settings.
      required: [defaultReplicaCount, defaultDurability, autoFailover, rebalance, features, restart]
      properties:
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: 'Standby copies of every shard group. A change starts the task `standby.reconcile` (adds or removes standby instances, 0.7.0); it does not make a rebalance necessary: standbys own no buckets.'
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        autoFailover:
          type: object
          description: Automatic failover.
          required: [enabled, timeoutSeconds, maxCount, eventsSinceReset]
          properties:
            enabled:
              type: boolean
              description: Whether failed servers are failed over automatically.
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 3600
              description: Seconds without heartbeat before auto-failover.
            maxCount:
              type: integer
              minimum: 1
              maximum: 100
              description: Maximum automatic failovers before an operator must intervene; reset by a rebalance.
            eventsSinceReset:
              type: integer
              minimum: 0
              readOnly: true
              description: Automatic failovers since the last reset.
        rebalance:
          $ref: '#/components/schemas/RebalanceSettings'
        features:
          $ref: '#/components/schemas/FeatureFlags'
        clock:
          type: object
          description: Added in 0.8.0 (optional; absent from a server of an older revision). The clocks of the servers.
          required: [maxDifferenceMs]
          properties:
            maxDifferenceMs:
              type: integer
              minimum: 10
              maximum: 600000
              default: 1000
              description: A server whose clock differs from the manager leader's by more than this (less the uncertainty of the measurement) raises the alert `clockDifference` (`warning`; `critical` at ten times it).
        restart:
          type: object
          description: Pending restart caused by enabling a feature.
          required: [required, serverIds]
          properties:
            required:
              type: boolean
              description: True while some server must restart to load an enabled extension.
            serverIds:
              type: array
              description: Servers that still need a restart.
              items: { $ref: '#/components/schemas/ServerId' }
    RebalanceSettings:
      type: object
      description: Rebalance defaults.
      required: [maxConcurrentMoves]
      properties:
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
          description: Default number of concurrent bucket moves.
    ClusterSettingsUpdateRequest:
      type: object
      description: Partial update of cluster settings.
      minProperties: 1
      properties:
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: New default replica count.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        autoFailover:
          type: object
          description: Auto-failover changes.
          minProperties: 1
          properties:
            enabled:
              type: boolean
              description: Enable or disable auto-failover.
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 3600
              description: Seconds without heartbeat before auto-failover.
            maxCount:
              type: integer
              minimum: 1
              maximum: 100
              description: Maximum automatic failovers.
        rebalance:
          $ref: '#/components/schemas/RebalanceSettings'
        clock:
          type: object
          description: Added in 0.8.0. Clock settings.
          minProperties: 1
          properties:
            maxDifferenceMs:
              type: integer
              minimum: 10
              maximum: 600000
              description: New threshold of the alert `clockDifference`.
        features:
          type: object
          description: Features to turn on. `false` is rejected for a feature that is already on.
          minProperties: 1
          properties:
            sharding:
              type: boolean
              description: Turn the sharding extension on.
            ledger:
              type: boolean
              description: Turn the ledger extension on.

    # ------------------------------------------------------------------ configuration (0.8.0)
    ConfigLevel:
      type: string
      description: |
        Where a value is set. `cluster`: every server. `serverGroup`: the servers of one server group (rack or zone;
        not a shard group). `server`: one server. `database`: `ALTER DATABASE ... SET` on every server. A narrower
        level overrides a wider one; the database level applies to sessions of that database.
      enum: [cluster, serverGroup, server, database]
    ConfigServerState:
      type: string
      description: |
        `applied`: the server runs the wanted value. `pendingRestart`: the file holds the wanted value and the
        running instance still has the old one. `failed`: PostgreSQL did not take the value (see `error`).
        `waiting`: the server could not be reached or its instance is not running; it gets the change when it
        returns. `unknown`: the server could not be read for this answer.
      enum: [applied, pendingRestart, failed, waiting, unknown]
    ConfigParameterKind:
      type: string
      description: |
        `settable`: may be set at the levels in `allowedLevels`. `managed`: `kingresd` needs its value (ports,
        listen addresses, TLS files, preloaded libraries, replication settings, ...); shown read-only. `refused`: runs
        a command, loads code or names a file as the operating system user of the database (`archive_command`,
        `ssl_passphrase_command`, `*_preload_libraries`, ...), or is unsafe for the cluster; the console never sets it,
        its administrator does on the server.
      enum: [settable, managed, refused]
    ConfigValueSource:
      type: string
      description: |
        Where the effective value on a server comes from: `default` (PostgreSQL's), `initdb` (written by `initdb` into
        `postgresql.conf`), `derived` (chosen by `kingresd` from the server's memory quota or connection count),
        `cluster`, `serverGroup`, `server` (an override of that level), `managed` (written by `kingresd`), `other`
        (the command line, the environment or `postgresql.conf`, not explained by an override). Clients must
        tolerate other values.
      enum: [default, initdb, derived, cluster, serverGroup, server, managed, other]
    ConfigOverride:
      type: object
      description: A value set at one level.
      required: [level, scopeId, value, revision, updatedBy, updatedAt]
      properties:
        level: { $ref: '#/components/schemas/ConfigLevel' }
        scopeId:
          type: [string, 'null']
          description: The server group, server id or database name; null for the cluster.
        value:
          type: string
          description: The value as stored, in the form PostgreSQL accepts.
        revision:
          type: integer
          format: int64
          description: The configuration revision that wrote it.
        updatedBy:
          type: string
          description: The role that made the change.
        updatedAt:
          type: string
          format: date-time
          description: When it was made.
    ConfigServerValue:
      type: object
      description: One parameter on one server.
      required: [serverId, value, source, level, state, pendingValue, error]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        value:
          type: [string, 'null']
          description: The effective value now, as PostgreSQL shows it (`pg_settings.setting` with its unit); null when unknown or hidden.
        source: { $ref: '#/components/schemas/ConfigValueSource' }
        level:
          oneOf:
            - $ref: '#/components/schemas/ConfigLevel'
            - type: 'null'
          description: The level of the override that is meant to give this value; null when none does.
        state: { $ref: '#/components/schemas/ConfigServerState' }
        pendingValue:
          type: [string, 'null']
          description: The value that waits for a restart (`state` `pendingRestart`); null otherwise.
        error:
          type: [string, 'null']
          description: 'PostgreSQL''s text when `state` is `failed`; null otherwise. Server-supplied text: show it as text.'
    ConfigParameter:
      type: object
      description: |
        A PostgreSQL parameter with its metadata from `pg_settings`, the overrides stored for it and its value on
        every server. All text comes from PostgreSQL or from an extension and must be shown as text.
      required: [name, category, description, type, unit, min, max, enumValues, context, restartRequired, defaultValue, kind, reason, hidden, allowedLevels, clusterOnly, overrides, servers, differs, differsInGroup]
      properties:
        name:
          type: string
          description: Canonical name (PostgreSQL's spelling, for example `TimeZone`, `work_mem`, `kingres_shard.node_timeout`).
        category:
          type: string
          description: PostgreSQL's category, for example `Resource Usage / Memory`.
        description:
          type: string
          description: PostgreSQL's short description.
        type:
          type: string
          enum: [bool, integer, real, string, enum]
          description: PostgreSQL's `vartype`.
        unit:
          type: [string, 'null']
          description: The unit of the number as `pg_settings.unit` gives it (`kB`, `8kB`, `ms`, `s`, `min`, `B`); null when none.
        min:
          type: [string, 'null']
          description: Smallest value in the unit; null when there is none.
        max:
          type: [string, 'null']
          description: Largest value in the unit; null when there is none.
        enumValues:
          type: [array, 'null']
          description: The values of an enum parameter; null for other types.
          items: { type: string }
        context:
          type: string
          enum: [internal, postmaster, sighup, superuser-backend, backend, superuser, user]
          description: When a change takes effect (PostgreSQL's `context`).
        restartRequired:
          type: boolean
          description: 'True for `context` `postmaster`: a change waits for a restart.'
        defaultValue:
          type: [string, 'null']
          description: PostgreSQL's built-in default (`boot_val`), null when hidden.
        kind: { $ref: '#/components/schemas/ConfigParameterKind' }
        reason:
          type: [string, 'null']
          description: Why a `managed` or `refused` parameter is not settable; null for `settable`.
        hidden:
          type: boolean
          description: True when PostgreSQL hides the value from an ordinary database user. No role is ever shown such a value.
        allowedLevels:
          type: array
          description: The levels a value may be set at; empty for `managed` and `refused`.
          items: { $ref: '#/components/schemas/ConfigLevel' }
        clusterOnly:
          type: [string, 'null']
          description: Why the value must be equal on every server (it can be set at cluster and database level only); null otherwise.
        overrides:
          type: array
          description: The values set for this parameter, at every level.
          items: { $ref: '#/components/schemas/ConfigOverride' }
        servers:
          type: array
          description: The parameter on every server.
          items: { $ref: '#/components/schemas/ConfigServerValue' }
        differs:
          type: boolean
          description: The effective value differs between servers.
        differsInGroup:
          type: boolean
          description: The effective value differs between servers of one server group although no server-level override explains it.
    ConfigParameterList:
      type: object
      description: A page of parameters.
      required: [items, nextCursor, revision]
      properties:
        items:
          type: array
          description: Parameters ordered by name.
          items: { $ref: '#/components/schemas/ConfigParameter' }
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
        revision:
          type: integer
          format: int64
          description: The configuration revision (grows with every accepted change; 0 before the first).
        partial:
          type: boolean
          description: True when a server could not be read.
        missingServers:
          type: array
          description: The servers that could not be read.
          items: { $ref: '#/components/schemas/MissingServer' }
    ConfigChangeItem:
      type: object
      description: One value to set or remove.
      required: [name, level, value]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: The parameter, in any letter case.
        level: { $ref: '#/components/schemas/ConfigLevel' }
        scopeId:
          type: [string, 'null']
          maxLength: 253
          description: The server group, server id or database name; absent or null for `cluster`, required for the other levels.
        value:
          type: [string, 'null']
          maxLength: 4096
          description: The new value, as PostgreSQL's text form (`64MB`, `on`, `Asia/Tehran`). null removes the value at this level.
    ConfigChangeRequest:
      type: object
      description: One or more changes applied together as one revision.
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ConfigChangeItem' }
    ConfigProblem:
      type: object
      description: Why one change of a request is not valid.
      required: [index, pointer, code, message]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in `changes`.
        pointer:
          type: string
          description: JSON pointer into the request, for example `/changes/0/value`.
        code:
          type: string
          description: |
            `config_parameter_unknown`, `config_parameter_managed`, `config_parameter_refused`, `config_level_not_allowed`,
            `config_value_invalid`, `config_value_below_floor`, `not_found` (the scope). Clients must tolerate other values.
        message:
          type: string
          description: A sentence, with PostgreSQL's own text for an invalid value.
    ConfigEffect:
      type: object
      description: What a change does to one parameter on one server.
      required: [serverId, name, before, after, takesEffect]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        name:
          type: string
          description: The parameter.
        before:
          type: [string, 'null']
          description: The effective value now; null when not known.
        after:
          type: [string, 'null']
          description: The effective value the change gives; null when it falls back to a value that is not known here.
        takesEffect:
          type: string
          enum: [unchanged, reload, restart, waits]
          description: '`unchanged`: no difference on this server. `reload`: takes effect at the reload. `restart`: waits for a restart of the instance. `waits`: the server cannot be reached now and gets the change when it returns.'
    ConfigRestartStep:
      type: object
      description: One instance in the order a restart would follow.
      required: [serverId, instanceId, role]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        instanceId:
          type: integer
          format: int32
          description: The instance on its server (the node id).
        role:
          type: string
          enum: [primary, standby]
          description: Whether the instance is the primary of its shard group or a standby.
    ConfigChangePreview:
      type: object
      description: The result of `previewConfigChange`.
      required: [valid, problems, effects, restartServerIds, restartOrder, restartOrderConflict]
      properties:
        valid:
          type: boolean
          description: True when `applyConfigChange` would accept the request.
        problems:
          type: array
          items: { $ref: '#/components/schemas/ConfigProblem' }
        effects:
          type: array
          description: One entry per server and parameter that the change touches.
          items: { $ref: '#/components/schemas/ConfigEffect' }
        restartServerIds:
          type: array
          description: The servers where at least one parameter would wait for a restart.
          items: { $ref: '#/components/schemas/ServerId' }
        restartOrder:
          type: array
          description: The order `restartPendingInstances` would restart the instances in, standbys before their primary when a value goes up.
          items: { $ref: '#/components/schemas/ConfigRestartStep' }
        restartOrderConflict:
          type: [string, 'null']
          description: When no safe order exists (one pair has a value going up and another going down), what to do; null otherwise.
    ConfigChange:
      type: object
      description: One recorded change of a value.
      required: [changeId, revision, name, level, scopeId, oldValue, newValue, changedBy, changedAt, taskId, reverts, revertible, taskState]
      properties:
        changeId:
          type: integer
          format: int64
          description: Identifier.
        revision:
          type: integer
          format: int64
          description: The configuration revision.
        name:
          type: string
          description: The parameter.
        level: { $ref: '#/components/schemas/ConfigLevel' }
        scopeId:
          type: [string, 'null']
          description: The server group, server id or database name; null for the cluster.
        oldValue:
          type: [string, 'null']
          description: The value at this level before; null when there was none.
        newValue:
          type: [string, 'null']
          description: The value at this level after; null when it was removed.
        changedBy:
          type: string
          description: The role that made the change.
        changedAt:
          type: string
          format: date-time
          description: When.
        taskId:
          type: [integer, 'null']
          format: int64
          description: The `config.apply` task.
        reverts:
          type: [integer, 'null']
          format: int64
          description: The change this one reverts.
        revertible:
          type: boolean
          description: True when `revertConfigChange` would accept it (it is the latest change of its level, scope and parameter).
        taskState:
          type: [string, 'null']
          description: State of the task (`running`, `done`, `failed`); null when the task is gone.
    ConfigChangeList:
      type: object
      description: A page of changes.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Newest first.
          items: { $ref: '#/components/schemas/ConfigChange' }
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    ConfigServerFailure:
      type: object
      description: A parameter that failed on a server.
      required: [name, error]
      properties:
        name:
          type: string
          description: The parameter.
        error:
          type: string
          description: PostgreSQL's text.
    ConfigServerStatus:
      type: object
      description: The configuration state of one server.
      required: [serverId, serverGroup, appliedRevision, state, pendingRestart, failed, overrideCount, detail]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        serverGroup:
          type: [string, 'null']
          description: The server group; null when none.
        appliedRevision:
          type: integer
          format: int64
          description: The revision the server's override file holds.
        state: { $ref: '#/components/schemas/ConfigServerState' }
        pendingRestart:
          type: array
          description: Parameters that wait for a restart.
          items: { type: string }
        failed:
          type: array
          items: { $ref: '#/components/schemas/ConfigServerFailure' }
        overrideCount:
          type: integer
          minimum: 0
          description: Overrides that apply to this server (cluster, its server group, itself).
        detail:
          type: [string, 'null']
          description: A sentence for `waiting`, for example that the instance is not running; null otherwise.
    ConfigServerList:
      type: object
      description: The servers' configuration state.
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigServerStatus' }
        revision:
          type: integer
          format: int64
          description: The configuration revision.
    ConfigSummary:
      type: object
      description: The numbers of the dashboard card.
      required: [revision, serversPendingRestart, differingInGroup, failedServerIds, waitingServerIds, largestClockDifference, maxDifferenceMs]
      properties:
        revision:
          type: integer
          format: int64
          description: The configuration revision.
        serversPendingRestart:
          type: array
          description: Servers with a parameter that waits for a restart.
          items: { $ref: '#/components/schemas/ServerId' }
        differingInGroup:
          type: array
          description: Names of parameters that differ inside a server group without a server-level override (at most 50).
          items: { type: string }
        failedServerIds:
          type: array
          items: { $ref: '#/components/schemas/ServerId' }
        waitingServerIds:
          type: array
          items: { $ref: '#/components/schemas/ServerId' }
        largestClockDifference:
          type: object
          description: The server whose clock differs most from the manager leader's, by the absolute value of the difference. Both members are null when no other server could be measured.
          required: [serverId, differenceMs]
          properties:
            serverId:
              oneOf:
                - $ref: '#/components/schemas/ServerId'
                - type: 'null'
            differenceMs:
              type: [number, 'null']
              description: Milliseconds, signed (positive means that server is ahead).
        maxDifferenceMs:
          type: integer
          description: The cluster's threshold (`ClusterSettings.clock.maxDifferenceMs`).
    ServerTime:
      type: object
      description: The clock and the time zones of one server.
      required: [serverId, reachable, clock, differenceMs, uncertaintyMs, roundTripMs, osTimeZone, timeZone, logTimeZone]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        reachable:
          type: boolean
          description: False when the server did not answer; its measured values are null.
        clock:
          type: [string, 'null']
          format: date-time
          description: The server's clock when it answered (UTC, millisecond resolution).
        differenceMs:
          type: [number, 'null']
          description: Its clock minus the reference server's (the manager leader's), in milliseconds (positive means ahead); 0 for the reference server.
        uncertaintyMs:
          type: [number, 'null']
          description: The measurement is within this many milliseconds of the real difference.
        roundTripMs:
          type: [number, 'null']
          description: Round trip of the best probe, from the monotonic clock.
        osTimeZone:
          type: [string, 'null']
          description: The operating system's time zone (name), null when it cannot be read.
        timeZone:
          type: [string, 'null']
          description: PostgreSQL's `TimeZone` on this server.
        logTimeZone:
          type: [string, 'null']
          description: PostgreSQL's `log_timezone` on this server.
    DatabaseTimeZone:
      type: object
      description: The time zone set for one database.
      required: [name, timeZone]
      properties:
        name:
          type: string
          description: The database.
        timeZone:
          type: [string, 'null']
          description: The value of `ALTER DATABASE ... SET TimeZone`; null when the database follows the cluster.
    ClusterTime:
      type: object
      description: Clocks and time zones.
      required: [measuredAt, referenceServerId, maxDifferenceMs, servers, databases]
      properties:
        measuredAt:
          type: string
          format: date-time
          description: When the probes ran.
        referenceServerId: { $ref: '#/components/schemas/ServerId' }
        maxDifferenceMs:
          type: integer
          description: The cluster's threshold.
        servers:
          type: array
          items: { $ref: '#/components/schemas/ServerTime' }
        databases:
          type: array
          items: { $ref: '#/components/schemas/DatabaseTimeZone' }
    TimeZoneInfo:
      type: object
      description: A time zone name PostgreSQL accepts.
      required: [name, utcOffset, isDaylightSaving]
      properties:
        name:
          type: string
          description: The name, for example `Asia/Tehran`.
        utcOffset:
          type: string
          description: 'Current offset from UTC as `+HH:MM` or `-HH:MM`.'
        isDaylightSaving:
          type: boolean
          description: Whether daylight saving time is in effect now.
    TimeZoneList:
      type: object
      description: The time zones.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimeZoneInfo' }
    RestartPendingRequest:
      type: object
      description: Restart the instances that wait for a restart.
      required: [acknowledgeDowntime]
      additionalProperties: false
      properties:
        acknowledgeDowntime:
          type: boolean
          description: Must be true. A primary that restarts is downtime for its shard group, and failover does not exist yet.
        serverIds:
          type: array
          description: Restart only the instances of these servers; default every server that waits.
          items: { $ref: '#/components/schemas/ServerId' }

    # ------------------------------------------------------------------ ledger
    Sha256Hex:
      type: string
      description: SHA-256 value as 64 lower-case hexadecimal characters.
      pattern: '^[0-9a-f]{64}$'
    LedgerChainStatus:
      type: object
      description: Status of the ledger chain of one shard group.
      required: [shardGroupId, latestBlockHeight, latestBlockHash, latestBlockAt, lastVerifiedBlockHeight, verificationState]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Shard group owning the chain.
        latestBlockHeight:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Height of the latest closed block; null before the first block.
        latestBlockHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Hash of the latest block.
        latestBlockAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Time of the latest block.
        lastVerifiedBlockHeight:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Highest block height covered by a passed verification; null when not available or never verified.
        verificationState:
          oneOf:
            - $ref: '#/components/schemas/LedgerVerificationState'
            - type: 'null'
          description: Verification state of the chain; null when not available.
    LedgerStatus:
      type: object
      description: Ledger status of a database.
      required: [databaseName, mode, digestIntervalSeconds, verificationState, lastVerifiedAt, ledgerTableCount, chains]
      properties:
        databaseName:
          type: string
          description: Database.
        mode:
          oneOf:
            - $ref: '#/components/schemas/LedgerMode'
            - type: 'null'
          description: Ledger mode of the database; null when not available (no catalog stores it).
        digestIntervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 60
          description: Automatic digest interval; null when not available.
        verificationState:
          oneOf:
            - $ref: '#/components/schemas/LedgerVerificationState'
            - type: 'null'
          description: Verification state of the database; null when not available.
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the last verification finished; null when never verified or not available.
        ledgerTableCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of ledger tables; null when not available.
        chains:
          type: array
          description: The chains this answer covers. Since 0.6.0 that is the chain of the shard group of the answering server only; `complete` and `uncoveredShardGroupIds` say what is not in it.
          items: { $ref: '#/components/schemas/LedgerChainStatus' }
        complete:
          type: boolean
          description: Added in 0.7.0, optional (absent from a server of an older revision). True when `chains` covers every shard group of the database (always true for a database that is not sharded or lives in one group); the database summary must not call the ledger healthy for a part it did not read when this is false. Same meaning as `LedgerDigest.complete`.
        uncoveredShardGroupIds:
          type: array
          description: Added in 0.7.0, optional. The shard groups whose chains are not in `chains`; empty when `complete`.
          items: { type: integer, format: int32, minimum: 0 }
    LedgerStatusList:
      type: object
      description: Ledger status of all ledger-enabled databases.
      required: [items]
      properties:
        items:
          type: array
          description: The statuses.
          items: { $ref: '#/components/schemas/LedgerStatus' }
    LedgerBlock:
      type: object
      description: A ledger block header (`kingres.ledger_blocks`).
      required: [shardGroupId, height, prevHash, txMerkleRoot, blockHash, timestamp, hashVersion, transactionCount, signed]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Chain the block belongs to.
        height:
          type: integer
          format: int64
          minimum: 0
          description: Block height.
        prevHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Hash of the previous block; null for the first block.
        txMerkleRoot:
          $ref: '#/components/schemas/Sha256Hex'
        blockHash:
          $ref: '#/components/schemas/Sha256Hex'
        timestamp:
          type: string
          format: date-time
          description: Time the block was closed.
        hashVersion:
          type: integer
          minimum: 1
          description: Version of the canonical hash format.
        transactionCount:
          type: integer
          minimum: 0
          description: Transactions in the block.
        signed:
          type: boolean
          description: Whether the block carries a server signature.
    LedgerBlockPage:
      type: object
      description: A page of blocks.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Blocks, highest first.
          items: { $ref: '#/components/schemas/LedgerBlock' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    DigestAnchor:
      type: object
      description: An external destination a digest is anchored to.
      required: [target, status]
      properties:
        target:
          type: string
          enum: [worm, openTimestamps, tsa, ethereum]
          description: Anchoring destination type.
        status:
          type: string
          enum: [pending, anchored, failed]
          description: Anchoring state.
        anchoredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When anchoring completed.
        reference:
          type:
            - string
            - 'null'
          description: Destination-specific reference, for example an object URL or transaction id.
    LedgerDigest:
      type: object
      description: |
        A database digest, the latest block hash of every chain at one moment.

        **Which chains it holds (0.6.0).** A digest is made by one server and holds the chain of that server's
        shard group. `complete` says whether that is every shard group of the database; when it is not,
        `uncoveredShardGroupIds` names the groups whose chains are **not** in this digest (and so are not
        anchored by it) and `aggregateHash` is null. A client or auditor must not read a digest with
        `complete: false` as a statement about the whole database. The groups are those of the database at the time
        of the answer, also for a digest that was made earlier.
      required: [id, databaseName, generatedAt, generatedBy, hashVersion, chains, aggregateHash, anchors]
      properties:
        id:
          type: integer
          format: int64
          description: Digest identifier.
        databaseName:
          type: string
          description: Database.
        generatedAt:
          type: string
          format: date-time
          description: Generation time.
        generatedBy:
          type:
            - string
            - 'null'
          description: Role that requested it, or `system` for scheduled digests; null when not available.
        hashVersion:
          type: integer
          minimum: 1
          description: Hash format version.
        chains:
          type: array
          description: Head of every chain.
          items:
            type: object
            description: Head block of one chain.
            required: [shardGroupId, blockHeight, blockHash, document]
            properties:
              document:
                type: object
                description: |
                  The digest of this chain exactly as `kingres.ledger_generate_digest()` returned it
                  (snake_case members `database`, `chain_id`, `hash_version`, `height`, `block_hash`,
                  `block_closed_at`, `generated_at`). Store it outside the database and give it unchanged to
                  `kingres-verify --digest`. `blockHeight` and `blockHash` repeat `height` and `block_hash`.
                  **Clients must keep the bytes of this member exactly as received** (the verifier checks the
                  document the extension wrote; a client that parses and re-serializes it, for example to reorder
                  keys, change white space or number formats, may produce a document that no longer verifies):
                  copy the member's text out of the response, or keep the response, instead of re-encoding the
                  parsed object.
                additionalProperties: true
              shardGroupId:
                type: integer
                format: int32
                description: Shard group.
              blockHeight:
                type: integer
                format: int64
                minimum: 0
                description: Head block height.
              blockHash:
                $ref: '#/components/schemas/Sha256Hex'
        aggregateHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Merkle root over the chain heads for a sharded database; null otherwise.
        anchors:
          type: array
          description: Anchoring destinations; empty until anchoring is configured.
          items: { $ref: '#/components/schemas/DigestAnchor' }
        complete:
          type: boolean
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it). True when `chains` holds the chain of every shard group of the database; false when `uncoveredShardGroupIds` is not empty.
        uncoveredShardGroupIds:
          type: array
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it, empty when `complete`). Shard groups of the database whose chains this digest does not contain.
          items:
            type: integer
            format: int32
            description: Shard group.
    LedgerDigestPage:
      type: object
      description: A page of digests.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Digests, newest first.
          items: { $ref: '#/components/schemas/LedgerDigest' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    LedgerVerifyRequest:
      type: object
      description: Options of a verification.
      properties:
        scope:
          type: string
          enum: [full, sinceLastVerified]
          default: sinceLastVerified
          description: Verify the whole chain or only blocks after the last passed verification.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest to verify against; null uses the latest digest.
    LedgerInconsistency:
      type: object
      description: A discrepancy found by a verification.
      required: [shardGroupId, kind, detail]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Affected chain.
        blockHeight:
          type:
            - integer
            - 'null'
          format: int64
          description: Affected block.
        kind:
          type: string
          enum: [blockHashMismatch, prevHashMismatch, merkleRootMismatch, rowHashMismatch, digestMismatch, missingBlock, other]
          description: Kind of discrepancy. `other` is a check of the extension that has no kind of its own (for example a defect of a table, trigger or privilege); `detail` then starts with the extension's check name.
        table:
          type:
            - string
            - 'null'
          description: Affected table as `schema.table`, for row-level findings.
        detail:
          type: string
          description: Explanation with expected and actual values.
    LedgerVerification:
      type: object
      description: |
        One finished verification run. The id is allocated by the control plane (it is not the extension's
        `verification_id`: a sharded database has one run per chain and the id has to cover all of them);
        `inconsistencies[].shardGroupId` says which chain a finding belongs to. Mapping from the
        extension's record: `clean` is `passed`; `problems` is `failed` with `inconsistencies` filled
        (at most the first 100); the extension's `failed` (the run itself aborted) is `failed` with
        `inconsistencies` empty, the cause being in the error of the task `taskId`. `scope` is `full` when
        the run started at height 0 and `sinceLastVerified` otherwise; `digestId` is null (a run against
        a given digest is not supported yet).

        **What it covered (0.6.0).** A run checks one chain, that of the shard group of the server that ran it.
        `state: passed` means that chain was checked and is clean. `complete` says whether that chain is the
        whole database; when it is not, `uncoveredShardGroupIds` names the shard groups that were **not**
        checked, and `passed` must not be read as a statement about them. A task of the verification that ends
        `done` always leaves a record: when nothing is new since the last clean run, the head block is checked
        again (and an empty ledger fails the task).
      required: [id, databaseName, state, scope, digestId, taskId, startedAt, finishedAt, startedBy, blocksChecked, rowsChecked, inconsistencies]
      properties:
        id:
          type: integer
          format: int64
          description: Verification identifier.
        databaseName:
          type: string
          description: Database.
        state:
          $ref: '#/components/schemas/LedgerVerificationState'
        scope:
          type: string
          enum: [full, sinceLastVerified]
          description: Scope used.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest verified against.
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            Task that ran the verification: the `ledger.verify` task that called `ledger_verify_recorded`, the
            control plane remembering the pairing of its task and the extension's record. Null for a run the
            extension recorded without a task (started in SQL or by the ledger worker); such runs are
            listed too. Never null for a run started by `startLedgerVerification`.
        startedAt:
          type: string
          format: date-time
          description: Start time.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: End time; null while running.
        startedBy:
          type:
            - string
            - 'null'
          description: Role that started it, or `system`; null when not available.
        blocksChecked:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Blocks recomputed so far; null when not available (never 0 for "unknown").
        rowsChecked:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Rows recomputed so far; null when not available (never 0 for "unknown").
        inconsistencies:
          type: array
          description: Findings; empty when the state is `passed`.
          items: { $ref: '#/components/schemas/LedgerInconsistency' }
        complete:
          type: boolean
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it). True when the checked chain is every shard group of the database.
        uncoveredShardGroupIds:
          type: array
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it, empty when `complete`). Shard groups of the database that this run did not check.
          items:
            type: integer
            format: int32
            description: Shard group.
    LedgerVerificationPage:
      type: object
      description: A page of verification runs.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Runs, newest first.
          items: { $ref: '#/components/schemas/LedgerVerification' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    InclusionProofRequest:
      type: object
      description: |
        The row version to prove. The row is identified by schema, table and the complete primary key; see
        `createInclusionProof` for how it is found and which version and entry are proven.
      required: [schema, table, primaryKey]
      additionalProperties: false
      properties:
        schema:
          type: string
          minLength: 1
          maxLength: 63
          description: Schema of the ledger table.
        table:
          type: string
          minLength: 1
          maxLength: 63
          description: Ledger table.
        primaryKey:
          type: object
          description: |
            Every column of the table's primary key with the value of the row, by column name (no column
            may be missing or extra; a table without a primary key cannot be addressed and answers 422
            `unprocessable`). A value of a type that JSON cannot carry exactly (bigint above 2^53, numeric,
            uuid, date, timestamp, bytea as `\x` hex) is given as a string and converted by PostgreSQL to the
            column type. The row must exist now, unless `ledgerTxId` names a removed version.
          minProperties: 1
          additionalProperties:
            type: [string, number, boolean]
        ledgerTxId:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: |
            Updatable tables only. The `ledger_txid` of the history row of a **removed** version of the row,
            that is the ledger transaction that removed (updated or deleted) it; several removed versions
            of one primary key are told apart by it. Null selects the current version of the row. Required
            when `op` is `D`. An append-only table answers 422 `unprocessable` when it is not null.
        op:
          type: string
          enum: [I, D]
          default: I
          description: |
            Which ledger entry to prove (`kingres.ledger_inclusion_proof` argument `op`). `I` proves that the
            version was written; `D` proves that it was removed (updatable tables only, with `ledgerTxId`).
    LedgerProofBlockHeader:
      type: object
      description: |
        Header of a ledger block as the extension writes it into a proof (`kingres.ledger_blocks`, with the
        time as `closed_at_us`). The block hash is
        `SHA256(0x13 || u16 hash_version || u64 height || prev_hash || tx_merkle_root || u32 tx_count || i64 closed_at_us)`.
      required: [height, hash_version, prev_hash, tx_merkle_root, tx_count, closed_at_us]
      properties:
        height:
          type: integer
          format: int64
          minimum: 0
          description: Block height (0 to 9223372036854775807).
        hash_version:
          type: integer
          const: 1
          description: Hash format version; must be 1.
        prev_hash:
          $ref: '#/components/schemas/Sha256Hex'
        tx_merkle_root:
          $ref: '#/components/schemas/Sha256Hex'
        tx_count:
          type: integer
          format: int32
          minimum: 0
          description: Transactions in the block.
        closed_at_us:
          type: integer
          format: int64
          description: Time the block was closed, in microseconds since 2000-01-01 00:00:00 UTC.
        block_hash:
          $ref: '#/components/schemas/Sha256Hex'
    LedgerProofBlock:
      description: |
        The block that holds the transaction of an inclusion proof: a `LedgerProofBlockHeader` whose
        `block_hash` is required. (0.6.0: a named schema instead of an inline `allOf` whose second branch had
        no properties, which code generators turned into an unusable type; the JSON is unchanged.)
      allOf:
        - $ref: '#/components/schemas/LedgerProofBlockHeader'
        - type: object
          required: [block_hash]
          properties:
            block_hash:
              $ref: '#/components/schemas/Sha256Hex'
    InclusionProof:
      type: object
      description: |
        The inclusion proof of one row version, **exactly the JSON document that
        `kingres.ledger_inclusion_proof` returns, plus the member `shard_group_id`**. It is the only
        response of the API that keeps the snake_case member names of the extension (an exception to the
        camelCase convention) so that it can be saved and handed to `kingres-verify proof --proof` and to
        `kingres.ledger_verify_proof` unchanged. Key order and white space are not significant. The verifier
        ignores members it does not know, which is why `shard_group_id` does not disturb it. The proof
        has no left/right positions: every Merkle path is a list of sibling hashes, and the side is derived
        from the index (`entry_index` in a tree of `entry_count` leaves, `tx_index` in a tree of
        `block.tx_count` leaves; RFC 6962 trees and RFC 9162 audit paths).

        The proof says that **an entry with this `row_hash` and `table_id` is in the ledger**; it cannot
        know the row. A client that holds the row recomputes its row hash itself
        (`kingres-verify row-hash`) and gives it with `--table-id` and `--row-hash`.

        The leaf is `leaf_hash(0x11 || u32 seq || u32 table_id || u8 op || row_hash)` (entry leaf, `op` is
        the byte of `"I"` or `"D"`). `entry_path` leads from it, at `entry_index`, to `tx_root`. The
        transaction leaf is `leaf_hash(0x12 || u64 ledger_txid || u32 entry_count || tx_root || u16 n || user_name)`
        and `tx_path` leads from it, at `tx_index`, to `block.tx_merkle_root`. The block hash is recomputed from
        `block` and must equal the digest's `block_hash` at the digest's `height`: if `block.height` is
        smaller than the digest's height, `chain` lists the headers of the blocks after `block` (up to the
        latest block when the proof was made) and each must link by `prev_hash`. Headers of `chain` above the
        digest's height are not used. `format` and every `hash_version` are 1. All hashes are 64 lower-case
        hex characters. Integers are plain JSON integers: `table_id`, `seq`, `entry_index`, `entry_count`,
        `tx_index` and `tx_count` are 0 to 2147483647 (`entry_count` at least 1, `entry_index` below
        `entry_count`, `tx_index` below `block.tx_count`); `ledger_txid` and `height` are 0 to
        9223372036854775807; paths have at most 64 hashes. `user_name` is at most 255 bytes of UTF-8.
        The full rules are in `contrib/kingres_ledger/README.md` ("Inclusion proof") and
        `kingres/verifier/README.md`.
      required: [format, chain_id, table_id, ledger_txid, seq, op, row_hash, entry_index, entry_count, entry_path, tx_root, user_name, tx_index, tx_path, block, chain, shard_group_id]
      additionalProperties: true
      properties:
        format:
          type: integer
          const: 1
          description: Proof format version; must be 1.
        chain_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Identity of the ledger chain (32 bytes, hex); a digest of another chain is not accepted.
        relation:
          type: string
          description: '`schema.table` of the proof; informational and not authenticated (optional).'
        shard_group_id:
          type: integer
          format: int32
          minimum: 0
          description: The only member that is not the extension's. The shard group (chain) the proof was made on; the map group, 0, for a database that is not sharded. Use it to pick the digest in `LedgerDigest.chains[]`.
        table_id:
          type: integer
          format: int32
          minimum: 0
          description: Local number of the table in the ledger (`kingres.ledger_table.table_id`); part of the row encoding, so a proof does not verify for the same bytes in another table.
        ledger_txid:
          type: integer
          format: int64
          minimum: 0
          description: Ledger transaction of the entry.
        seq:
          type: integer
          format: int32
          minimum: 0
          description: Sequence number of the entry within its transaction (may have gaps; the position is `entry_index`).
        op:
          type: string
          enum: [I, D]
          description: 'The entry this proof is for: `I` the row version was written in the transaction, `D` it was removed in the transaction.'
        row_hash:
          $ref: '#/components/schemas/Sha256Hex'
        entry_index:
          type: integer
          format: int32
          minimum: 0
          description: Position of the entry among the entries of its transaction, in `seq` order.
        entry_count:
          type: integer
          format: int32
          minimum: 1
          description: Entries of the transaction (the size of the entry tree).
        entry_path:
          type: array
          maxItems: 64
          description: Sibling hashes from the entry leaf to `tx_root`.
          items: { $ref: '#/components/schemas/Sha256Hex' }
        tx_root:
          $ref: '#/components/schemas/Sha256Hex'
        user_name:
          type: string
          maxLength: 255
          description: Role that ran the transaction (UTF-8); part of the transaction leaf.
        tx_index:
          type: integer
          format: int32
          minimum: 0
          description: Position of the transaction in its block.
        tx_path:
          type: array
          maxItems: 64
          description: Sibling hashes from the transaction leaf to `block.tx_merkle_root`.
          items: { $ref: '#/components/schemas/Sha256Hex' }
        block:
          $ref: '#/components/schemas/LedgerProofBlock'
        chain:
          type: array
          description: Headers of the blocks after `block`, up to the latest block when the proof was made (empty when `block` was the latest). `block_hash` is optional here; when present it is checked.
          items: { $ref: '#/components/schemas/LedgerProofBlockHeader' }

    # ------------------------------------------------------------------ query
    QueryRequest:
      type: object
      description: A SQL statement to run.
      required: [database, sql]
      properties:
        database:
          type: string
          description: Database to connect to.
        sql:
          type: string
          minLength: 1
          maxLength: 1000000
          description: Exactly one SQL statement.
        rowLimit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
          description: Maximum rows returned; extra rows are dropped and `truncated` is set.
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 300000
          default: 30000
          description: Statement timeout.
        statementId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: 'Added in 0.7.0, optional. Names the statement so that `cancelStatement` can end it. Unique among the running statements of the signed-in role on this server (409 `conflict` otherwise); chosen by the client (a random string). Format (0.9.0 states it): 1 to 64 characters of A-Z, a-z, 0-9, underscore and hyphen. A value that does not match is 400 `validation_failed` with `errors[].field` `/statementId` and nothing is run.'
    QueryColumn:
      type: object
      description: A result column.
      required: [name, type]
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          description: PostgreSQL type name.
    QueryResult:
      type: object
      description: Result of a statement.
      required: [columns, rows, rowCount, truncated, commandTag, durationMs]
      properties:
        columns:
          type: array
          description: Result columns; empty for statements without a result set.
          items: { $ref: '#/components/schemas/QueryColumn' }
        rows:
          type: array
          description: Rows as arrays of values in column order. bigint and numeric values larger than 2^53 are returned as strings; bytea as hex strings; SQL NULL as JSON null.
          items:
            type: array
            description: One row.
            items: {}
        rowCount:
          type: integer
          minimum: 0
          description: Rows returned in `rows`, or rows affected by a data-changing statement.
        truncated:
          type: boolean
          description: "True when the result was cut at `rowLimit` or at the byte budget of the result (16 MiB). A single value larger than 1 MiB is not cut and fails the statement with 422."
        commandTag:
          type: string
          description: PostgreSQL command tag, for example `SELECT 2` or `INSERT 0 1`.
        durationMs:
          type: number
          minimum: 0
          description: Execution time.

    # ------------------------------------------------------------------ alerts
    AlertSeverity:
      type: string
      description: Alert severity.
      enum: [info, warning, critical]
    AlertState:
      type: string
      description: Alert state.
      enum: [open, acknowledged, resolved]
    AlertKind:
      type: string
      description: |
        Alert type. Clients must tolerate kinds they do not know. Added in 0.8.0: `clockDifference` (a server's clock differs from the manager leader's by more than `ClusterSettings.clock.maxDifferenceMs`, less the uncertainty of the measurement; `warning`, `critical` at ten times the threshold; `kingresd` does not set the system clock, run NTP or chrony). Added in 0.7.0: `leaseLost` (the `kingresd` that
        runs the primary of a shard group could not renew the group's lease in time; for a group with a standby the
        instance was stopped (fenced), for a group without one it keeps running and this alert is the only effect;
        `critical`), `groupWithoutSynchronousStandby` (the group's standby has been unreachable for longer than the
        grace period and the primary no longer waits for it: acknowledged commits exist on one server only; `critical`),
        `groupUnderReplicated` (fewer standbys run than the cluster's replica count; `warning`). From 0.7.0
        `serverSuspect` and `serverDown` are raised by the manager leader for another server whose heartbeats stop
        (`suspect` after the suspect timeout, `down` after the failure timeout, both cleared when it is heard again);
        before, `serverDown` meant only that the server's instance did not run. Each kind's subject members are listed at `AlertSubject`. Added in 0.6.0: `replicationPending` (the manager
        leader keeps a change to roles, grants or settings waiting for a server that could not be reached; until the
        change arrives, a role that was disabled, changed or dropped may still work on that server. `subject` is
        `server:<leader>|behind:<server>`, `warning` after a minute, `critical` after ten).
      enum:
        - serverDown
        - serverSuspect
        - underReplicatedBuckets
        - unavailableBuckets
        - replicationLagHigh
        - diskSpaceLow
        - memoryPressure
        - rebalanceNeeded
        - autoFailoverTriggered
        - autoFailoverLimitReached
        - mapGroupUnavailable
        - ledgerVerificationFailed
        - ledgerPendingTooOld
        - versionMismatch
        - certificateExpiring
        - certificateRenewalFailed
        - replicationPending
        - taskFailed
        - leaseLost
        - groupWithoutSynchronousStandby
        - groupUnderReplicated
        - clockDifference
    Alert:
      type: object
      description: An alert.
      required: [id, kind, severity, state, title, message, raisedAt]
      properties:
        id:
          type: integer
          format: int64
          description: Alert identifier. Unique in the cluster; from 0.5.0 the high bits are the number of the server that holds the alert, which is how an acknowledgement finds it.
        kind:
          $ref: '#/components/schemas/AlertKind'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        state:
          $ref: '#/components/schemas/AlertState'
        title:
          type: string
          description: Short title.
        message:
          type: string
          description: Explanation.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Related server. It equals `subject.serverId`.
        databaseName:
          type:
            - string
            - 'null'
          description: Related database. It equals `subject.databaseName`.
        subject:
          $ref: '#/components/schemas/AlertSubject'
        raisedAt:
          type: string
          format: date-time
          description: When the alert was raised.
        acknowledgedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was acknowledged.
        acknowledgedBy:
          type:
            - string
            - 'null'
          description: Who acknowledged it.
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the condition cleared.
    AlertSubject:
      type: object
      description: |
        Added in 0.7.0, optional (absent from a server of an older revision). What an alert is about, in typed
        members; a client never parses a string. Every member is null when the alert has nothing to say about it.
        Which members an alert kind sets: `serverDown`, `serverSuspect`, `diskSpaceLow`, `memoryPressure`,
        `replicationLagHigh`, `certificateExpiring` (`aspect` `ca` for the cluster certificate authority),
        `certificateRenewalFailed`: `serverId` is the server concerned. `ledgerPendingTooOld`: `serverId` and
        `databaseName`. `replicationPending`: `serverId` is the manager leader that keeps the change waiting and
        `behindServerId` the server that is behind (the one the panel must name). `leaseLost`,
        `groupWithoutSynchronousStandby`, `groupUnderReplicated`: `shardGroupId`, and `serverId` the server that
        runs the group's primary. `clockDifference` (0.8.0): `serverId` is the server whose clock differs. `versionMismatch`: all null.
        `taskId` (0.9.0, optional) names a task the alert is about, so that a client can link to it; `kingresd` sets it for
        `taskFailed` alerts (the only kind about a task; `kingresd` raises it for a rebalance that ended failed, subject `task:<id>`), and no other kind sets it.
      required: [serverId, behindServerId, shardGroupId, databaseName, aspect]
      properties:
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server the alert is about; null when it is about the cluster.
        behindServerId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server that is behind (`replicationPending`); null for other kinds.
        shardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          description: The shard group the alert is about; null when it is not about one.
        databaseName:
          type:
            - string
            - 'null'
          description: The database the alert is about; null when it is not about one.
        aspect:
          type:
            - string
            - 'null'
          description: A qualifier of the subject for kinds that have several, for example `ca`; null otherwise. Clients must tolerate values they do not know.
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Added in 0.9.0, optional (absent from a server of an older revision, null when the alert is not about a task). The task the alert is about; open it with `GET /tasks/{taskId}`.
    AlertPage:
      type: object
      description: A page of alerts.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Alerts, newest first.
          items: { $ref: '#/components/schemas/Alert' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        partial:
          type: boolean
          description: Added in 0.5.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.5.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }

    # ------------------------------------------------------------------ metrics
    MetricName:
      type: string
      description: |
        Metric names. Server-scoped: cpuUsagePercent, memoryUsedBytes, diskUsedBytes, connections,
        replicationLagBytes, replicationLagSeconds. Database-scoped: databaseSizeBytes, transactionsPerSecond,
        queriesPerSecond. Both scopes accept connections. Cluster-scoped: bucketsUnderReplicated. Added in 0.7.0,
        server-scoped, only on a server whose client entry point is on (totals since the start of `kingresd`, except
        the `Active` ones): `clientConnectionsAccepted`, `clientConnectionsActive`, `clientConnectionsRefused` (over the
        cap), `clientConnectFailures`, `clientConnectionsMoved` (closed because the destination changed),
        `clientConnectionsIdleClosed`, `clientBytesIn`, `clientBytesOut`, and the same with `clientStandby` for the
        standby entry point.
      enum:
        - cpuUsagePercent
        - memoryUsedBytes
        - diskUsedBytes
        - connections
        - replicationLagBytes
        - replicationLagSeconds
        - databaseSizeBytes
        - transactionsPerSecond
        - queriesPerSecond
        - bucketsUnderReplicated
        - clientConnectionsAccepted
        - clientConnectionsActive
        - clientConnectionsRefused
        - clientConnectFailures
        - clientConnectionsMoved
        - clientConnectionsIdleClosed
        - clientBytesIn
        - clientBytesOut
        - clientStandbyConnectionsAccepted
        - clientStandbyConnectionsActive
        - clientStandbyConnectionsRefused
        - clientStandbyConnectFailures
        - clientStandbyConnectionsMoved
        - clientStandbyConnectionsIdleClosed
        - clientStandbyBytesIn
        - clientStandbyBytesOut
    MetricPoint:
      type: object
      description: One sample.
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Sample time (start of the step).
        value:
          type:
            - number
            - 'null'
          description: Value; null when there is no data for the step.
    MetricSeries:
      type: object
      description: One time series.
      required: [labels, points]
      properties:
        labels:
          type: object
          description: What the series is for.
          properties:
            serverId:
              $ref: '#/components/schemas/ServerId'
            databaseName:
              type: string
              description: Database of the series.
        points:
          type: array
          description: Samples in time order.
          items: { $ref: '#/components/schemas/MetricPoint' }
    MetricQueryResult:
      type: object
      description: Result of a metric query.
      required: [metric, unit, from, to, step, series]
      properties:
        metric:
          $ref: '#/components/schemas/MetricName'
        unit:
          type: string
          enum: [percent, bytes, count, countPerSecond, seconds]
          description: Unit of the values.
        from:
          type: string
          format: date-time
          description: Start of the range.
        to:
          type: string
          format: date-time
          description: End of the range.
        step:
          type: integer
          minimum: 1
          description: Resolution in seconds.
        series:
          type: array
          description: The series; a single series unless `groupBy` was used.
          items: { $ref: '#/components/schemas/MetricSeries' }
        partial:
          type: boolean
          description: Added in 0.5.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.5.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }
