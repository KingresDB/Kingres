    CaEscrowStatus:
      type: object
      description: The escrow of the key of the cluster certificate authority (0.26.0).
      required: [enabled, holdsKey, generation, recipients, complete, message]
      properties:
        enabled: { type: boolean, description: Whether the leader keeps sealed copies of the CA key on the servers that can become leader. }
        holdsKey: { type: boolean, description: Whether the server that answers holds the CA key (the manager leader does). }
        generation: { type: integer, format: int64, description: Rises when the escrow is switched on again and at every rotation. }
        recipients:
          type: array
          description: The servers that hold, or should hold, a copy.
          items: { $ref: '#/components/schemas/CaEscrowRecipient' }
        complete: { type: boolean, description: Whether at least one recipient exists and every recipient holds the newest copy. }
        message: { type: string, description: What the state means for the operator. }
    CaEscrowRecipient:
      type: object
      description: One server of the escrow.
      required: [serverId, state, keyId, generation, sealedAt, error]
      properties:
        serverId: { type: string }
        state:
          type: string
          enum: [current, pending, refused, dropPending]
          description: '`current`: the copy is the newest. `pending`: not delivered yet or out of date (the leader sends again). `refused`: the server answered the last send with an error, see `error`. `dropPending`: the server no longer qualifies (or the escrow is off) and its copy has not been deleted yet; the leader asks again every minute, and until it succeeds the server must be treated as knowing the CA key.'
        keyId: { type: [string, 'null'], description: Identifier of the escrow public key the copy is sealed to. }
        generation: { type: [integer, 'null'], format: int64 }
        sealedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'], description: The last error of a send. }
    CaEscrowUpdate:
      type: object
      description: Request of setCaEscrow.
      required: [enabled]
      properties:
        enabled: { type: boolean }
    AuditEvent:
      type: object
      description: One audit log entry.
      required: [id, timestamp, actor, source, action, outcome]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Event identifier, unique in the cluster. From 0.6.0 the high bits are the ordinal of the server
            whose log holds the event (as for `Alert.id`) and the low 32 bits count that server's events, so
            the ids of one server increase but those of the cluster do not form a sequence. A client must treat
            the id as an opaque number below 2^53.
        timestamp:
          type: string
          format: date-time
          description: When the action happened.
        actor:
          type: string
          description: Role that performed it, or `system`.
        actorAddress:
          type: string
          description: Client IP address.
        source:
          type: string
          enum: [panel, cli, rest, system]
          description: Client type.
        action:
          $ref: '#/components/schemas/AuditAction'
        resourceType:
          type: string
          description: Type of the affected resource.
        resourceId:
          type: string
          description: Identifier of the affected resource.
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Task started by the action.
        requestId:
          type: string
          description: Request identifier for log correlation.
        details:
          type: object
          description: Action-specific data. Secrets are never recorded.
          additionalProperties: true
        serverId:
          type: string
          description: Added in 0.6.0, optional. The server whose audit log holds the event (the one that wrote it); absent when the server has no cluster identity yet.
    AuditPage:
      type: object
      description: A page of audit events.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Events, newest first.
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        partial:
          type: boolean
          description: Added in 0.6.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.6.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }

    # ------------------------------------------------------------------ settings
    ClusterSettings:
      type: object
      description: Cluster-wide settings.
      required: [defaultReplicaCount, defaultDurability, autoFailover, rebalance, features, restart]
      properties:
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: 'Standby copies of every shard group. A change starts the task `standby.reconcile` (adds or removes standby instances, 0.7.0); it does not make a rebalance necessary: standbys own no buckets.'
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        autoFailover:
          type: object
          description: Automatic failover.
          required: [enabled, timeoutSeconds, maxCount, eventsSinceReset]
          properties:
            enabled:
              type: boolean
              description: Whether failed servers are failed over automatically.
            timeoutSeconds:
              type: integer
              minimum: 30
              maximum: 3600
              description: 'Seconds without heartbeat before auto-failover. The minimum is 30 since 0.10.0 (it was 1: a shorter time cannot tell a failure from a pause).'
            maxCount:
              type: integer
              minimum: 1
              maximum: 100
              description: Maximum automatic failovers before an operator must intervene; reset by a rebalance and by `resetAutoFailoverCounter`.
            eventsSinceReset:
              type: integer
              minimum: 0
              readOnly: true
              description: Automatic failovers since the last reset.
            lastEventAt:
              type:
                - string
                - 'null'
              format: date-time
              readOnly: true
              description: Added in 0.10.0, optional. When the last automatic failover was made; null when none was.
        rebalance:
          $ref: '#/components/schemas/RebalanceSettings'
        features:
          $ref: '#/components/schemas/FeatureFlags'
        clock:
          type: object
          description: Added in 0.8.0 (optional; absent from a server of an older revision). The clocks of the servers.
          required: [maxDifferenceMs]
          properties:
            maxDifferenceMs:
              type: integer
              minimum: 10
              maximum: 600000
              default: 1000
              description: A server whose clock differs from the manager leader's by more than this (less the uncertainty of the measurement) raises the alert `clockDifference` (`warning`; `critical` at ten times it).
        analytics:
          type: object
          description: Added in 0.17.0, optional. Settings of the analytics.
          required: [allowNonSuperuserOwners]
          properties:
            allowNonSuperuserOwners:
              type: boolean
              default: false
              description: 'When true, a table whose owner is not a superuser may be converted between heap and columnar and may have a time-partitioning policy that runs (the code of the owner then runs in the session of the service role, see `setTableStorage`). Default false.'
        dataTransfer:
          $ref: '#/components/schemas/DataTransferSettings'
        restart:
          type: object
          description: Pending restart caused by enabling a feature.
          required: [required, serverIds]
          properties:
            required:
              type: boolean
              description: True while some server must restart to load an enabled extension.
            serverIds:
              type: array
              description: Servers that still need a restart.
              items: { $ref: '#/components/schemas/ServerId' }
    RebalanceSettings:
      type: object
      description: Rebalance defaults. The members after `maxConcurrentMoves` were added in 0.15.0 and are optional (an older server omits them).
      required: [maxConcurrentMoves]
      properties:
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
          description: Default number of concurrent bucket moves.
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: Default threshold; null takes the strategy's own (0, or 0.1 by `byDiskSize`).
        maxMovesPerServer:
          type: integer
          minimum: 1
          maximum: 16
          default: 2
          description: Moves that may involve one server at once.
        maxMoveAttempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: How often a failed move is tried in one run; then the run fails with the move reported.
        maxDiskUsedFraction:
          type: number
          minimum: 0.5
          maximum: 0.99
          default: 0.85
          description: A move is not started when the data volume of the target, or of a server that hosts a standby of the target, would be fuller than this.
        maxStandbyLagBytes:
          type: integer
          format: int64
          minimum: 0
          default: 67108864
          description: A standby that lags by more than this makes its group degraded for the safety rules.
        automatic:
          $ref: '#/components/schemas/RebalanceAutomaticSettings'
    RebalanceWindow:
      type: object
      description: Added in 0.15.0. A time of day; `from` later than `to` wraps over midnight.
      required: [from, to, timeZone]
      properties:
        from:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Start, HH:MM.
        to:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: End, HH:MM.
        timeZone:
          type: string
          description: IANA time zone name.
    RebalanceAutomaticSettings:
      type: object
      description: Added in 0.15.0. The automatic mode (role `kingres_admin` to change). It runs on the manager leader, is off by default and never starts while a safety rule fails (a failover, a group without a healthy standby or a primary, a server that is not live, a failed earlier move, an inconsistent cluster).
      required: [enabled, strategy, threshold, checkIntervalSeconds, settleSeconds, settleAfterTopologySeconds, minIntervalSeconds, failoverSettleSeconds, window]
      properties:
        enabled:
          type: boolean
          description: Whether the manager starts a rebalance by itself. Off by default.
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 0.15
          description: The deviation from the ideal load that is worth a run (larger than the manual default so that the mode does not churn).
        checkIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 86400
          default: 60
          description: How often the manager looks.
        settleSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 300
          description: The imbalance must have held this long before a run starts.
        settleAfterTopologySeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 600
          description: Seconds to wait after the last change of the servers (a server added or removed, a flag or a weight changed, a failover).
        minIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 3600
          description: Seconds between the end of one automatic run and the start of the next, except for a new server that waits for a rebalance and a drain flag.
        failoverSettleSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 600
          description: Seconds after a change of a primary during which no run starts.
        window:
          oneOf:
            - $ref: '#/components/schemas/RebalanceWindow'
            - type: 'null'
          description: The time of day in which a run may start; null means any time.

    RebalanceAutomaticSettingsUpdate:
      type: object
      description: Added in 0.15.0. Partial update of the automatic mode; `window` null removes the window.
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether the manager starts a rebalance by itself. Off by default.
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 0.15
          description: The deviation from the ideal load that is worth a run (larger than the manual default so that the mode does not churn).
        checkIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 86400
          default: 60
          description: How often the manager looks.
        settleSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 300
          description: The imbalance must have held this long before a run starts.
        settleAfterTopologySeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 600
          description: Seconds to wait after the last change of the servers (a server added or removed, a flag or a weight changed, a failover).
        minIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 3600
          description: Seconds between the end of one automatic run and the start of the next, except for a new server that waits for a rebalance and a drain flag.
        failoverSettleSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 600
          description: Seconds after a change of a primary during which no run starts.
        window:
          oneOf:
            - $ref: '#/components/schemas/RebalanceWindow'
            - type: 'null'
          description: The time of day in which a run may start; null means any time.

    RebalanceAutomaticStatus:
      type: object
      description: Added in 0.15.0. What the automatic mode did last.
      required: [enabled, nextCheckAt, lastEvaluation]
      properties:
        enabled:
          type: boolean
          description: Whether the mode is on.
        nextCheckAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the manager looks next; null while the mode is off or has not looked yet.
        lastEvaluation:
          oneOf:
            - type: object
              description: The last look.
              required: [at, outcome, blockedBy]
              properties:
                at:
                  type: string
                  format: date-time
                  description: When.
                outcome:
                  type: string
                  description: '`started` a run was started; `nothingToDo` the placement is balanced or a run is under way; `blocked` a rule stopped it (see `blockedBy`); `settling` the imbalance is too young or too soon after a change. Clients must tolerate other values.'
                blockedBy:
                  type: array
                  description: 'The rules that held it back: `window`, `failover`, `groupDegraded` (a group has fewer healthy standbys than the replica count, or a standby is behind its primary by more than `maxStandbyLagBytes` when a run is started or resumed, and by more than twice that on three evaluations in a row inside a run, 0.27.0), `groupUnavailable`, `servers`, `moveFailed`, `consistency`, `operatorStopped`, `running`.'
                  items: { type: string }
            - type: 'null'
          description: The last look; null before the first one.
    RebalanceSettingsUpdate:
      type: object
      description: 'Added in 0.15.0. Partial update of the rebalance settings; every member is optional but one is needed. `threshold` null takes the strategy default again.'
      minProperties: 1
      additionalProperties: false
      properties:
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          description: Default number of concurrent bucket moves.
        strategy:
          $ref: '#/components/schemas/RebalanceStrategy'
        threshold:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: Default threshold.
        maxMovesPerServer:
          type: integer
          minimum: 1
          maximum: 16
          description: Moves that may involve one server at once.
        maxMoveAttempts:
          type: integer
          minimum: 1
          maximum: 20
          description: Attempts per move.
        maxDiskUsedFraction:
          type: number
          minimum: 0.5
          maximum: 0.99
          description: Disk limit of a move.
        maxStandbyLagBytes:
          type: integer
          format: int64
          minimum: 0
          description: Standby lag limit.
        automatic:
          $ref: '#/components/schemas/RebalanceAutomaticSettingsUpdate'
    ClusterSettingsUpdateRequest:
      type: object
      description: Partial update of cluster settings.
      minProperties: 1
      properties:
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: New default replica count.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        autoFailover:
          type: object
          description: Auto-failover changes.
          minProperties: 1
          properties:
            enabled:
              type: boolean
              description: Enable or disable auto-failover.
            timeoutSeconds:
              type: integer
              minimum: 30
              maximum: 3600
              description: 'Seconds without heartbeat before auto-failover. The minimum is 30 since 0.10.0 (it was 1: a shorter time cannot tell a failure from a pause).'
            maxCount:
              type: integer
              minimum: 1
              maximum: 100
              description: Maximum automatic failovers.
        rebalance:
          $ref: '#/components/schemas/RebalanceSettingsUpdate'
        clock:
          type: object
          description: Added in 0.8.0. Clock settings.
          minProperties: 1
          properties:
            maxDifferenceMs:
              type: integer
              minimum: 10
              maximum: 600000
              description: New threshold of the alert `clockDifference`.
        analytics:
          type: object
          description: Added in 0.17.0. Analytics settings.
          minProperties: 1
          properties:
            allowNonSuperuserOwners:
              type: boolean
              description: See `ClusterSettings.analytics`. Turning it on is a decision about the trust in the owners of the tables; it can be turned off again, and a policy that is refused then raises one alert.
        dataTransfer:
          $ref: '#/components/schemas/DataTransferSettingsUpdate'
        features:
          type: object
          description: Features to turn on. `false` is rejected for a feature that is already on.
          minProperties: 1
          properties:
            sharding:
              type: boolean
              description: Turn the sharding extension on.
            ledger:
              type: boolean
              description: Turn the ledger extension on.

    # ------------------------------------------------------------------ configuration (0.8.0)
    ConfigLevel:
      type: string
      description: |
        Where a value is set. `cluster`: every server. `serverGroup`: the servers of one server group (rack or zone;
        not a shard group). `server`: one server. `database`: `ALTER DATABASE ... SET` on every server. A narrower
        level overrides a wider one; the database level applies to sessions of that database.
      enum: [cluster, serverGroup, server, database]
    ConfigServerState:
      type: string
      description: |
        `applied`: the server runs the wanted value. `pendingRestart`: the file holds the wanted value and the
        running instance still has the old one. `failed`: PostgreSQL did not take the value (see `error`).
        `waiting`: the server could not be reached or its instance is not running; it gets the change when it
        returns. `unknown`: the server could not be read for this answer.
      enum: [applied, pendingRestart, failed, waiting, unknown]
    ConfigParameterKind:
      type: string
      description: |
        `settable`: may be set at the levels in `allowedLevels`. `managed`: `kingresd` needs its value (ports,
        listen addresses, TLS files, preloaded libraries, replication settings, ...); shown read-only. `refused`: runs
        a command, loads code or names a file as the operating system user of the database (`archive_command`,
        `ssl_passphrase_command`, `*_preload_libraries`, ...), or is unsafe for the cluster; the console never sets it,
        its administrator does on the server.
      enum: [settable, managed, refused]
    ConfigValueSource:
      type: string
      description: |
        Where the effective value on a server comes from: `default` (PostgreSQL's), `initdb` (written by `initdb` into
        `postgresql.conf`), `derived` (chosen by `kingresd` from the server's memory quota or connection count),
        `cluster`, `serverGroup`, `server` (an override of that level), `managed` (written by `kingresd`), `other`
        (the command line, the environment or `postgresql.conf`, not explained by an override). Clients must
        tolerate other values.
      enum: [default, initdb, derived, cluster, serverGroup, server, managed, other]
    ConfigOverride:
      type: object
      description: A value set at one level.
      required: [level, scopeId, value, revision, updatedBy, updatedAt]
      properties:
        level: { $ref: '#/components/schemas/ConfigLevel' }
        scopeId:
          type: [string, 'null']
          description: The server group, server id or database name; null for the cluster.
        value:
          type: string
          description: The value as stored, in the form PostgreSQL accepts.
        revision:
          type: integer
          format: int64
          description: The configuration revision that wrote it.
        updatedBy:
          type: string
          description: The role that made the change.
        updatedAt:
          type: string
          format: date-time
          description: When it was made.
    ConfigServerValue:
      type: object
      description: One parameter on one server.
      required: [serverId, value, source, level, state, pendingValue, error]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        value:
          type: [string, 'null']
          description: The effective value now, as PostgreSQL shows it (`pg_settings.setting` with its unit); null when unknown or hidden.
        source: { $ref: '#/components/schemas/ConfigValueSource' }
        level:
          oneOf:
            - $ref: '#/components/schemas/ConfigLevel'
            - type: 'null'
          description: The level of the override that is meant to give this value; null when none does.
        state: { $ref: '#/components/schemas/ConfigServerState' }
        pendingValue:
          type: [string, 'null']
          description: The value that waits for a restart (`state` `pendingRestart`); null otherwise.
        error:
          type: [string, 'null']
          description: 'PostgreSQL''s text when `state` is `failed`; null otherwise. Server-supplied text: show it as text.'
    ConfigParameter:
      type: object
      description: |
        A PostgreSQL parameter with its metadata from `pg_settings`, the overrides stored for it and its value on
        every server. All text comes from PostgreSQL or from an extension and must be shown as text.
      required: [name, category, description, type, unit, min, max, enumValues, context, restartRequired, defaultValue, kind, reason, hidden, allowedLevels, clusterOnly, overrides, servers, differs, differsInGroup]
      properties:
        name:
          type: string
          description: Canonical name (PostgreSQL's spelling, for example `TimeZone`, `work_mem`, `kingres_shard.node_timeout`).
        category:
          type: string
          description: PostgreSQL's category, for example `Resource Usage / Memory`.
        description:
          type: string
          description: PostgreSQL's short description.
        type:
          type: string
          enum: [bool, integer, real, string, enum]
          description: PostgreSQL's `vartype`.
        unit:
          type: [string, 'null']
          description: The unit of the number as `pg_settings.unit` gives it (`kB`, `8kB`, `ms`, `s`, `min`, `B`); null when none.
        min:
          type: [string, 'null']
          description: Smallest value in the unit; null when there is none.
        max:
          type: [string, 'null']
          description: Largest value in the unit; null when there is none.
        enumValues:
          type: [array, 'null']
          description: The values of an enum parameter; null for other types.
          items: { type: string }
        context:
          type: string
          enum: [internal, postmaster, sighup, superuser-backend, backend, superuser, user]
          description: When a change takes effect (PostgreSQL's `context`).
        restartRequired:
          type: boolean
          description: 'True for `context` `postmaster`: a change waits for a restart.'
        defaultValue:
          type: [string, 'null']
          description: PostgreSQL's built-in default (`boot_val`), null when hidden.
        kind: { $ref: '#/components/schemas/ConfigParameterKind' }
        reason:
          type: [string, 'null']
          description: Why a `managed` or `refused` parameter is not settable; null for `settable`.
        hidden:
          type: boolean
          description: True when PostgreSQL hides the value from an ordinary database user. No role is ever shown such a value.
        allowedLevels:
          type: array
          description: The levels a value may be set at; empty for `managed` and `refused`.
          items: { $ref: '#/components/schemas/ConfigLevel' }
        clusterOnly:
          type: [string, 'null']
          description: Why the value must be equal on every server (it can be set at cluster and database level only); null otherwise.
        overrides:
          type: array
          description: The values set for this parameter, at every level.
          items: { $ref: '#/components/schemas/ConfigOverride' }
        servers:
          type: array
          description: The parameter on every server.
          items: { $ref: '#/components/schemas/ConfigServerValue' }
        differs:
          type: boolean
          description: The effective value differs between servers.
        differsInGroup:
          type: boolean
          description: The effective value differs between servers of one server group although no server-level override explains it.
    ConfigParameterList:
      type: object
      description: A page of parameters.
      required: [items, nextCursor, revision]
      properties:
        items:
          type: array
          description: Parameters ordered by name.
          items: { $ref: '#/components/schemas/ConfigParameter' }
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
        revision:
          type: integer
          format: int64
          description: The configuration revision (grows with every accepted change; 0 before the first).
        partial:
          type: boolean
          description: True when a server could not be read.
        missingServers:
          type: array
          description: The servers that could not be read.
          items: { $ref: '#/components/schemas/MissingServer' }
    ConfigChangeItem:
      type: object
      description: One value to set or remove.
      required: [name, level, value]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: The parameter, in any letter case.
        level: { $ref: '#/components/schemas/ConfigLevel' }
        scopeId:
          type: [string, 'null']
          maxLength: 253
          description: The server group, server id or database name; absent or null for `cluster`, required for the other levels.
        value:
          type: [string, 'null']
          maxLength: 4096
          description: The new value, as PostgreSQL's text form (`64MB`, `on`, `Asia/Tehran`). null removes the value at this level.
    ConfigChangeRequest:
      type: object
      description: One or more changes applied together as one revision.
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ConfigChangeItem' }
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: |
            Added in 0.16.0, optional. The configuration revision the client saw (`ConfigParameter.overrides[].revision`, or
            `ConfigParameterList.revision`; 0 when it saw no stored value). `applyConfigChange` answers 409
            `config_change_superseded` when a value the request changes was changed by a later revision, unless it already holds the
            wanted value (so the repeat of a request whose change was recorded passes). Without it nothing is compared and the
            last request wins, as before. `previewConfigChange` ignores it.
    ConfigProblem:
      type: object
      description: Why one change of a request is not valid.
      required: [index, pointer, code, message]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in `changes`.
        pointer:
          type: string
          description: JSON pointer into the request, for example `/changes/0/value`.
        code:
          type: string
          description: |
            `config_parameter_unknown`, `config_parameter_managed`, `config_parameter_refused`, `config_level_not_allowed`,
            `config_value_invalid`, `config_value_below_floor`, `not_found` (the scope). Clients must tolerate other values.
        message:
          type: string
          description: A sentence, with PostgreSQL's own text for an invalid value.
    ConfigWarning:
      type: object
      description: Why one change of a valid request deserves a second look.
      required: [index, pointer, code, message]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in `changes`.
        pointer:
          type: string
          description: JSON pointer into the request, for example `/changes/0/value`.
        code:
          type: string
          description: |
            `config_value_unusual` (a memory value more than ten times the parameter's default or below a tenth of it; exactly ten times and exactly a tenth
            are not flagged) and `config_reserved_connections` (on some server `max_connections` would not exceed
            `superuser_reserved_connections + reserved_connections`, so PostgreSQL would not start; the warning names the server). Clients must tolerate other values.
        message:
          type: string
          description: A sentence.
    ConfigEffect:
      type: object
      description: What a change does to one parameter on one server.
      required: [serverId, name, before, after, takesEffect]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        name:
          type: string
          description: The parameter.
        before:
          type: [string, 'null']
          description: The effective value now; null when not known.
        after:
          type: [string, 'null']
          description: The effective value the change gives; null when it falls back to a value that is not known here.
        takesEffect:
          type: string
          enum: [unchanged, reload, restart, waits]
          description: '`unchanged`: no difference on this server. `reload`: takes effect at the reload. `restart`: waits for a restart of the instance. `waits`: the server cannot be reached now and gets the change when it returns.'
    ConfigRestartStep:
      type: object
      description: One instance in the order a restart would follow.
      required: [serverId, instanceId, role]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        instanceId:
          type: integer
          format: int32
          description: The instance on its server (the node id).
        role:
          type: string
          enum: [primary, standby]
          description: Whether the instance is the primary of its shard group or a standby.
    ConfigChangePreview:
      type: object
      description: The result of `previewConfigChange`.
      required: [valid, problems, effects, restartServerIds, restartOrder, restartOrderConflict]
      properties:
        valid:
          type: boolean
          description: True when `applyConfigChange` would accept the request.
        problems:
          type: array
          items: { $ref: '#/components/schemas/ConfigProblem' }
        warnings:
          type: array
          description: |
            Things a valid change does that deserve a second look. A warning never makes the request invalid (`valid` depends on `problems` only) and
            never stops `applyConfigChange`. Omitted by servers older than 0.16.0, so a client treats a missing property as an empty list.
          items: { $ref: '#/components/schemas/ConfigWarning' }
        effects:
          type: array
          description: One entry per server and parameter that the change touches.
          items: { $ref: '#/components/schemas/ConfigEffect' }
        restartServerIds:
          type: array
          description: The servers where at least one parameter would wait for a restart.
          items: { $ref: '#/components/schemas/ServerId' }
        restartOrder:
          type: array
          description: The order `restartPendingInstances` would restart the instances in, standbys before their primary when a value goes up.
          items: { $ref: '#/components/schemas/ConfigRestartStep' }
        restartOrderConflict:
          type: [string, 'null']
          description: When no safe order exists (one pair has a value going up and another going down), what to do; null otherwise.
    ConfigChange:
      type: object
      description: One recorded change of a value.
      required: [changeId, revision, name, level, scopeId, oldValue, newValue, changedBy, changedAt, taskId, reverts, revertible, taskState]
      properties:
        changeId:
          type: integer
          format: int64
          description: Identifier.
        revision:
          type: integer
          format: int64
          description: The configuration revision.
        name:
          type: string
          description: The parameter.
        level: { $ref: '#/components/schemas/ConfigLevel' }
        scopeId:
          type: [string, 'null']
          description: The server group, server id or database name; null for the cluster.
        oldValue:
          type: [string, 'null']
          description: The value at this level before; null when there was none.
        newValue:
          type: [string, 'null']
          description: The value at this level after; null when it was removed.
        changedBy:
          type: string
          description: The role that made the change.
        changedAt:
          type: string
          format: date-time
          description: When.
        taskId:
          type: [integer, 'null']
          format: int64
          description: The `config.apply` task.
        reverts:
          type: [integer, 'null']
          format: int64
          description: The change this one reverts.
        revertible:
          type: boolean
          description: True when `revertConfigChange` would accept it (it is the latest change of its level, scope and parameter).
        taskState:
          type: [string, 'null']
          description: State of the task (`running`, `done`, `failed`); null when the task is gone.
    ConfigChangeList:
      type: object
      description: A page of changes.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Newest first.
          items: { $ref: '#/components/schemas/ConfigChange' }
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    ConfigServerFailure:
      type: object
      description: A parameter that failed on a server.
      required: [name, error]
      properties:
        name:
          type: string
          description: The parameter.
        error:
          type: string
          description: PostgreSQL's text.
    ConfigServerStatus:
      type: object
      description: The configuration state of one server.
      required: [serverId, serverGroup, appliedRevision, state, pendingRestart, failed, overrideCount, detail]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        serverGroup:
          type: [string, 'null']
          description: The server group; null when none.
        appliedRevision:
          type: integer
          format: int64
          description: The revision the server's override file holds.
        state: { $ref: '#/components/schemas/ConfigServerState' }
        pendingRestart:
          type: array
          description: Parameters that wait for a restart.
          items: { type: string }
        failed:
          type: array
          items: { $ref: '#/components/schemas/ConfigServerFailure' }
        overrideCount:
          type: integer
          minimum: 0
          description: Overrides that apply to this server (cluster, its server group, itself).
        detail:
          type: [string, 'null']
          description: A sentence for `waiting`, for example that the instance is not running; null otherwise.
    ConfigServerList:
      type: object
      description: The servers' configuration state.
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigServerStatus' }
        revision:
          type: integer
          format: int64
          description: The configuration revision.
    ConfigSummary:
      type: object
      description: The numbers of the dashboard card.
      required: [revision, serversPendingRestart, differingInGroup, failedServerIds, waitingServerIds, largestClockDifference, maxDifferenceMs]
      properties:
        revision:
          type: integer
          format: int64
          description: The configuration revision.
        serversPendingRestart:
          type: array
          description: Servers with a parameter that waits for a restart.
          items: { $ref: '#/components/schemas/ServerId' }
        differingInGroup:
          type: array
          description: Names of parameters that differ inside a server group without a server-level override (at most 50).
          items: { type: string }
        failedServerIds:
          type: array
          items: { $ref: '#/components/schemas/ServerId' }
        waitingServerIds:
          type: array
          items: { $ref: '#/components/schemas/ServerId' }
        largestClockDifference:
          type: object
          description: The server whose clock differs most from the manager leader's, by the absolute value of the difference. Both members are null when no other server could be measured.
          required: [serverId, differenceMs]
          properties:
            serverId:
              oneOf:
                - $ref: '#/components/schemas/ServerId'
                - type: 'null'
            differenceMs:
              type: [number, 'null']
              description: Milliseconds, signed (positive means that server is ahead).
        maxDifferenceMs:
          type: integer
          description: The cluster's threshold (`ClusterSettings.clock.maxDifferenceMs`).
    ServerTime:
      type: object
      description: The clock and the time zones of one server.
      required: [serverId, reachable, clock, differenceMs, uncertaintyMs, roundTripMs, osTimeZone, timeZone, logTimeZone]
      properties:
        serverId: { $ref: '#/components/schemas/ServerId' }
        reachable:
          type: boolean
          description: False when the server did not answer; its measured values are null.
        clock:
          type: [string, 'null']
          format: date-time
          description: The server's clock when it answered (UTC, millisecond resolution).
        differenceMs:
          type: [number, 'null']
          description: Its clock minus the reference server's (the manager leader's), in milliseconds (positive means ahead); 0 for the reference server.
        uncertaintyMs:
          type: [number, 'null']
          description: The measurement is within this many milliseconds of the real difference.
        roundTripMs:
          type: [number, 'null']
          description: Round trip of the best probe, from the monotonic clock.
        osTimeZone:
          type: [string, 'null']
          description: The operating system's time zone (name), null when it cannot be read.
        timeZone:
          type: [string, 'null']
          description: PostgreSQL's `TimeZone` on this server.
        logTimeZone:
          type: [string, 'null']
          description: PostgreSQL's `log_timezone` on this server.
    DatabaseTimeZone:
      type: object
      description: The time zone set for one database.
      required: [name, timeZone]
      properties:
        name:
          type: string
          description: The database.
        timeZone:
          type: [string, 'null']
          description: The value of `ALTER DATABASE ... SET TimeZone`; null when the database follows the cluster.
    ClusterTime:
      type: object
      description: Clocks and time zones.
      required: [measuredAt, referenceServerId, maxDifferenceMs, servers, databases]
      properties:
        measuredAt:
          type: string
          format: date-time
          description: When the probes ran.
        referenceServerId: { $ref: '#/components/schemas/ServerId' }
        maxDifferenceMs:
          type: integer
          description: The cluster's threshold.
        servers:
          type: array
          items: { $ref: '#/components/schemas/ServerTime' }
        databases:
          type: array
          items: { $ref: '#/components/schemas/DatabaseTimeZone' }
    TimeZoneInfo:
      type: object
      description: A time zone name PostgreSQL accepts.
      required: [name, utcOffset, isDaylightSaving]
      properties:
        name:
          type: string
          description: The name, for example `Asia/Tehran`.
        utcOffset:
          type: string
          description: 'Current offset from UTC as `+HH:MM` or `-HH:MM`.'
        isDaylightSaving:
          type: boolean
          description: Whether daylight saving time is in effect now.
    TimeZoneList:
      type: object
      description: The time zones.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimeZoneInfo' }
    RestartPendingRequest:
      type: object
      description: Restart the instances that wait for a restart.
      required: [acknowledgeDowntime]
      additionalProperties: false
      properties:
        acknowledgeDowntime:
          type: boolean
          description: Must be true. A primary that restarts is downtime for its shard group, and failover does not exist yet.
        serverIds:
          type: array
          description: Restart only the instances of these servers; default every server that waits.
          items: { $ref: '#/components/schemas/ServerId' }

    # ------------------------------------------------------------------ ledger
    Sha256Hex:
      type: string
      description: SHA-256 value as 64 lower-case hexadecimal characters.
      pattern: '^[0-9a-f]{64}$'
    LedgerChainStatus:
      type: object
      description: Status of the ledger chain of one shard group.
      required: [shardGroupId, latestBlockHeight, latestBlockHash, latestBlockAt, lastVerifiedBlockHeight, verificationState]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Shard group owning the chain.
        latestBlockHeight:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Height of the latest closed block; null before the first block.
        latestBlockHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Hash of the latest block.
        latestBlockAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Time of the latest block.
        lastVerifiedBlockHeight:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Highest block height covered by a passed verification; null when not available or never verified.
        verificationState:
          oneOf:
            - $ref: '#/components/schemas/LedgerVerificationState'
            - type: 'null'
          description: Verification state of the chain; null when not available.
    LedgerStatus:
      type: object
      description: Ledger status of a database.
      required: [databaseName, mode, digestIntervalSeconds, verificationState, lastVerifiedAt, ledgerTableCount, chains]
      properties:
        databaseName:
          type: string
          description: Database.
        mode:
          oneOf:
            - $ref: '#/components/schemas/LedgerMode'
            - type: 'null'
          description: Ledger mode of the database; null when not available (no catalog stores it).
        digestIntervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 60
          description: Automatic digest interval; null when not available.
        verificationState:
          oneOf:
            - $ref: '#/components/schemas/LedgerVerificationState'
            - type: 'null'
          description: Verification state of the database; null when not available.
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the last verification finished; null when never verified or not available.
        ledgerTableCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of ledger tables; null when not available.
        chains:
          type: array
          description: The chains this answer covers. Since 0.6.0 that is the chain of the shard group of the answering server only; `complete` and `uncoveredShardGroupIds` say what is not in it.
          items: { $ref: '#/components/schemas/LedgerChainStatus' }
        complete:
          type: boolean
          description: Added in 0.7.0, optional (absent from a server of an older revision). True when `chains` covers every shard group of the database (always true for a database that is not sharded or lives in one group); the database summary must not call the ledger healthy for a part it did not read when this is false. Same meaning as `LedgerDigest.complete`.
        uncoveredShardGroupIds:
          type: array
          description: Added in 0.7.0, optional. The shard groups whose chains are not in `chains`; empty when `complete`.
          items: { type: integer, format: int32, minimum: 0 }
        publication:
          type: object
          description: Added in 0.11.0, optional. Publication of this database's logs.
          required: [enabled, lastCheckpointAt, state]
          properties:
            enabled: { type: boolean, description: Whether publication is enabled. }
            lastCheckpointAt: { type: [string, 'null'], format: date-time, description: When the newest checkpoint was signed. }
            state: { type: string, description: 'One of `off`, `ok`, `behind`, `diverged`. Clients must tolerate values they do not know.' }
        anchoring:
          type: object
          description: Added in 0.11.0, optional. Anchoring of this database's aggregate.
          required: [targets, newestAnchoredAt, state]
          properties:
            targets: { type: integer, minimum: 0, description: Enabled targets. }
            newestAnchoredAt: { type: [string, 'null'], format: date-time, description: Evidence time of the newest anchored aggregate. }
            state: { type: string, enum: [none, ok, behind, failed], description: State of the anchoring. }
    LedgerStatusList:
      type: object
      description: Ledger status of all ledger-enabled databases.
      required: [items]
      properties:
        items:
          type: array
          description: The statuses.
          items: { $ref: '#/components/schemas/LedgerStatus' }
    LedgerBlock:
      type: object
      description: A ledger block header (`kingres.ledger_blocks`).
      required: [shardGroupId, height, prevHash, txMerkleRoot, blockHash, timestamp, hashVersion, transactionCount, signed]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Chain the block belongs to.
        height:
          type: integer
          format: int64
          minimum: 0
          description: Block height.
        prevHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Hash of the previous block; null for the first block.
        txMerkleRoot:
          $ref: '#/components/schemas/Sha256Hex'
        blockHash:
          $ref: '#/components/schemas/Sha256Hex'
        timestamp:
          type: string
          format: date-time
          description: Time the block was closed.
        hashVersion:
          type: integer
          minimum: 1
          description: Version of the canonical hash format.
        transactionCount:
          type: integer
          minimum: 0
          description: Transactions in the block.
        signed:
          type: boolean
          description: Redefined in 0.11.0. True when the block is covered by a signed checkpoint of its chain log, that is when the size of the newest signed checkpoint is greater than the height. Before 0.11.0 it was always false (no server signature existed). A block is not signed by itself; a checkpoint signs a size and a root.
    LedgerBlockPage:
      type: object
      description: A page of blocks.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Blocks, highest first.
          items: { $ref: '#/components/schemas/LedgerBlock' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    DigestAnchor:
      type: object
      description: An external destination a digest is anchored to.
      required: [target, status]
      properties:
        target:
          type: string
          enum: [worm, openTimestamps, tsa, ethereum]
          description: Anchoring destination type.
        status:
          type: string
          enum: [pending, anchored, failed]
          description: Anchoring state.
        anchoredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When anchoring completed.
        reference:
          type:
            - string
            - 'null'
          description: Destination-specific reference, for example an object URL or transaction id.
    LedgerDigest:
      type: object
      description: |
        A database digest, the latest block hash of every chain at one moment.

        **Which chains it holds (0.6.0).** A digest is made by one server and holds the chain of that server's
        shard group. `complete` says whether that is every shard group of the database; when it is not,
        `uncoveredShardGroupIds` names the groups whose chains are **not** in this digest (and so are not
        anchored by it) and `aggregateHash` is null. A client or auditor must not read a digest with
        `complete: false` as a statement about the whole database. The groups are those of the database at the time
        of the answer, also for a digest that was made earlier.
      required: [id, databaseName, generatedAt, generatedBy, hashVersion, chains, aggregateHash, anchors]
      properties:
        id:
          type: integer
          format: int64
          description: Digest identifier.
        databaseName:
          type: string
          description: Database.
        generatedAt:
          type: string
          format: date-time
          description: Generation time.
        generatedBy:
          type:
            - string
            - 'null'
          description: Role that requested it, or `system` for scheduled digests; null when not available.
        hashVersion:
          type: integer
          minimum: 1
          description: Hash format version.
        chains:
          type: array
          description: Head of every chain.
          items:
            type: object
            description: Head block of one chain.
            required: [shardGroupId, blockHeight, blockHash, document]
            properties:
              document:
                type: object
                description: |
                  The digest of this chain exactly as `kingres.ledger_generate_digest()` returned it
                  (snake_case members `database`, `chain_id`, `hash_version`, `height`, `block_hash`,
                  `block_closed_at`, `generated_at`). Store it outside the database and give it unchanged to
                  `kingres-verify --digest`. `blockHeight` and `blockHash` repeat `height` and `block_hash`.
                  **Clients must keep the bytes of this member exactly as received** (the verifier checks the
                  document the extension wrote; a client that parses and re-serializes it, for example to reorder
                  keys, change white space or number formats, may produce a document that no longer verifies):
                  copy the member's text out of the response, or keep the response, instead of re-encoding the
                  parsed object.
                additionalProperties: true
              shardGroupId:
                type: integer
                format: int32
                description: Shard group.
              blockHeight:
                type: integer
                format: int64
                minimum: 0
                description: Head block height.
              blockHash:
                $ref: '#/components/schemas/Sha256Hex'
        aggregateHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Merkle root over the chain heads for a sharded database; null otherwise.
        aggregateSize:
          type:
            - integer
            - 'null'
          format: int64
          description: Added in 0.11.0, optional. The size of the aggregate log this digest belongs to; null until the aggregate exists.
        anchors:
          type: array
          description: Anchoring destinations; empty until anchoring is configured.
          items: { $ref: '#/components/schemas/DigestAnchor' }
        complete:
          type: boolean
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it). True when `chains` holds the chain of every shard group of the database; false when `uncoveredShardGroupIds` is not empty.
        uncoveredShardGroupIds:
          type: array
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it, empty when `complete`). Shard groups of the database whose chains this digest does not contain.
          items:
            type: integer
            format: int32
            description: Shard group.
    LedgerDigestPage:
      type: object
      description: A page of digests.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Digests, newest first.
          items: { $ref: '#/components/schemas/LedgerDigest' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    LedgerVerifyRequest:
      type: object
      description: Options of a verification.
      properties:
        scope:
          type: string
          enum: [full, sinceLastVerified]
          default: sinceLastVerified
          description: Verify the whole chain or only blocks after the last passed verification.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest to verify against; null uses the latest digest.
        checks:
          type: array
          description: 'Added in 0.11.0, optional. What to check: `chain` (the chain itself, the default), `publication` (re-read the chains from block 0, compare with the published leaves and verify the stored checkpoints) and `anchors`. A server that does not implement a check answers 422 `unsupported_operation` for it.'
          items: { type: string, enum: [chain, publication, anchors], description: A check. }
          uniqueItems: true
    LedgerInconsistency:
      type: object
      description: A discrepancy found by a verification.
      required: [shardGroupId, kind, detail]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Affected chain.
        blockHeight:
          type:
            - integer
            - 'null'
          format: int64
          description: Affected block.
        kind:
          type: string
          enum: [blockHashMismatch, prevHashMismatch, merkleRootMismatch, rowHashMismatch, digestMismatch, missingBlock, other]
          description: Kind of discrepancy. `other` is a check of the extension that has no kind of its own (for example a defect of a table, trigger or privilege); `detail` then starts with the extension's check name.
        table:
          type:
            - string
            - 'null'
          description: Affected table as `schema.table`, for row-level findings.
        detail:
          type: string
          description: Explanation with expected and actual values.
    LedgerVerification:
      type: object
      description: |
        One finished verification run. The id is allocated by the control plane (it is not the extension's
        `verification_id`: a sharded database has one run per chain and the id has to cover all of them);
        `inconsistencies[].shardGroupId` says which chain a finding belongs to. Mapping from the
        extension's record: `clean` is `passed`; `problems` is `failed` with `inconsistencies` filled
        (at most the first 100); the extension's `failed` (the run itself aborted) is `failed` with
        `inconsistencies` empty, the cause being in the error of the task `taskId`. `scope` is `full` when
        the run started at height 0 and `sinceLastVerified` otherwise; `digestId` is null (a run against
        a given digest is not supported yet).

        **What it covered (0.6.0).** A run checks one chain, that of the shard group of the server that ran it.
        `state: passed` means that chain was checked and is clean. `complete` says whether that chain is the
        whole database; when it is not, `uncoveredShardGroupIds` names the shard groups that were **not**
        checked, and `passed` must not be read as a statement about them. A task of the verification that ends
        `done` always leaves a record: when nothing is new since the last clean run, the head block is checked
        again (and an empty ledger fails the task).
      required: [id, databaseName, state, scope, digestId, taskId, startedAt, finishedAt, startedBy, blocksChecked, rowsChecked, inconsistencies]
      properties:
        id:
          type: integer
          format: int64
          description: Verification identifier.
        databaseName:
          type: string
          description: Database.
        state:
          $ref: '#/components/schemas/LedgerVerificationState'
        scope:
          type: string
          enum: [full, sinceLastVerified]
          description: Scope used.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest verified against.
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: |
            Task that ran the verification: the `ledger.verify` task that called `ledger_verify_recorded`, the
            control plane remembering the pairing of its task and the extension's record. Null for a run the
            extension recorded without a task (started in SQL or by the ledger worker); such runs are
            listed too. Never null for a run started by `startLedgerVerification`.
        startedAt:
          type: string
          format: date-time
          description: Start time.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: End time; null while running.
        startedBy:
          type:
            - string
            - 'null'
          description: Role that started it, or `system`; null when not available.
        blocksChecked:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Blocks recomputed so far; null when not available (never 0 for "unknown").
        rowsChecked:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Rows recomputed so far; null when not available (never 0 for "unknown").
        inconsistencies:
          type: array
          description: Findings; empty when the state is `passed`.
          items: { $ref: '#/components/schemas/LedgerInconsistency' }
        complete:
          type: boolean
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it). True when the checked chain is every shard group of the database.
        uncoveredShardGroupIds:
          type: array
          description: Added in 0.6.0, optional (a 0.6.0 server always sends it, empty when `complete`). Shard groups of the database that this run did not check.
          items:
            type: integer
            format: int32
            description: Shard group.
    LedgerVerificationPage:
      type: object
      description: A page of verification runs.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Runs, newest first.
          items: { $ref: '#/components/schemas/LedgerVerification' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    InclusionProofRequest:
      type: object
      description: |
        The row version to prove. The row is identified by schema, table and the complete primary key; see
        `createInclusionProof` for how it is found and which version and entry are proven.
      required: [schema, table, primaryKey]
      additionalProperties: false
      properties:
        schema:
          type: string
          minLength: 1
          maxLength: 63
          description: Schema of the ledger table.
        table:
          type: string
          minLength: 1
          maxLength: 63
          description: Ledger table.
        primaryKey:
          type: object
          description: |
            Every column of the table's primary key with the value of the row, by column name (no column
            may be missing or extra; a table without a primary key cannot be addressed and answers 422
            `unprocessable`). A value of a type that JSON cannot carry exactly (bigint above 2^53, numeric,
            uuid, date, timestamp, bytea as `\x` hex) is given as a string and converted by PostgreSQL to the
            column type. The row must exist now, unless `ledgerTxId` names a removed version.
          minProperties: 1
          additionalProperties:
            type: [string, number, boolean]
        ledgerTxId:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: |
            Updatable tables only. The `ledger_txid` of the history row of a **removed** version of the row,
            that is the ledger transaction that removed (updated or deleted) it; several removed versions
            of one primary key are told apart by it. Null selects the current version of the row. Required
            when `op` is `D`. An append-only table answers 422 `unprocessable` when it is not null.
        op:
          type: string
          enum: [I, D]
          default: I
          description: |
            Which ledger entry to prove (`kingres.ledger_inclusion_proof` argument `op`). `I` proves that the
            version was written; `D` proves that it was removed (updatable tables only, with `ledgerTxId`).
    LedgerProofBlockHeader:
      type: object
      description: |
        Header of a ledger block as the extension writes it into a proof (`kingres.ledger_blocks`, with the
        time as `closed_at_us`). The block hash is
        `SHA256(0x13 || u16 hash_version || u64 height || prev_hash || tx_merkle_root || u32 tx_count || i64 closed_at_us)`.
      required: [height, hash_version, prev_hash, tx_merkle_root, tx_count, closed_at_us]
      properties:
        height:
          type: integer
          format: int64
          minimum: 0
          description: Block height (0 to 9223372036854775807).
        hash_version:
          type: integer
          const: 1
          description: Hash format version; must be 1.
        prev_hash:
          $ref: '#/components/schemas/Sha256Hex'
        tx_merkle_root:
          $ref: '#/components/schemas/Sha256Hex'
        tx_count:
          type: integer
          format: int32
          minimum: 0
          description: Transactions in the block.
        closed_at_us:
          type: integer
          format: int64
          description: Time the block was closed, in microseconds since 2000-01-01 00:00:00 UTC.
        block_hash:
          $ref: '#/components/schemas/Sha256Hex'
    LedgerProofBlock:
      description: |
        The block that holds the transaction of an inclusion proof: a `LedgerProofBlockHeader` whose
        `block_hash` is required. (0.6.0: a named schema instead of an inline `allOf` whose second branch had
        no properties, which code generators turned into an unusable type; the JSON is unchanged.)
      allOf:
        - $ref: '#/components/schemas/LedgerProofBlockHeader'
        - type: object
          required: [block_hash]
          properties:
            block_hash:
              $ref: '#/components/schemas/Sha256Hex'
    InclusionProof:
      type: object
      description: |
        The inclusion proof of one row version, **exactly the JSON document that
        `kingres.ledger_inclusion_proof` returns, plus the member `shard_group_id`**. It is the only
        response of the API that keeps the snake_case member names of the extension (an exception to the
        camelCase convention) so that it can be saved and handed to `kingres-verify proof --proof` and to
        `kingres.ledger_verify_proof` unchanged. Key order and white space are not significant. The verifier
        ignores members it does not know, which is why `shard_group_id` does not disturb it. The proof
        has no left/right positions: every Merkle path is a list of sibling hashes, and the side is derived
        from the index (`entry_index` in a tree of `entry_count` leaves, `tx_index` in a tree of
        `block.tx_count` leaves; RFC 6962 trees and RFC 9162 audit paths).

        The proof says that **an entry with this `row_hash` and `table_id` is in the ledger**; it cannot
        know the row. A client that holds the row recomputes its row hash itself
        (`kingres-verify row-hash`) and gives it with `--table-id` and `--row-hash`.

        The leaf is `leaf_hash(0x11 || u32 seq || u32 table_id || u8 op || row_hash)` (entry leaf, `op` is
        the byte of `"I"` or `"D"`). `entry_path` leads from it, at `entry_index`, to `tx_root`. The
        transaction leaf is `leaf_hash(0x12 || u64 ledger_txid || u32 entry_count || tx_root || u16 n || user_name)`
        and `tx_path` leads from it, at `tx_index`, to `block.tx_merkle_root`. The block hash is recomputed from
        `block` and must equal the digest's `block_hash` at the digest's `height`: if `block.height` is
        smaller than the digest's height, `chain` lists the headers of the blocks after `block` (up to the
        latest block when the proof was made) and each must link by `prev_hash`. Headers of `chain` above the
        digest's height are not used. `format` and every `hash_version` are 1. All hashes are 64 lower-case
        hex characters. Integers are plain JSON integers: `table_id`, `seq`, `entry_index`, `entry_count`,
        `tx_index` and `tx_count` are 0 to 2147483647 (`entry_count` at least 1, `entry_index` below
        `entry_count`, `tx_index` below `block.tx_count`); `ledger_txid` and `height` are 0 to
        9223372036854775807; paths have at most 64 hashes. `user_name` is at most 255 bytes of UTF-8.
        The full rules are in `contrib/kingres_ledger/README.md` ("Inclusion proof") and
        `kingres/verifier/README.md`.
      required: [format, chain_id, table_id, ledger_txid, seq, op, row_hash, entry_index, entry_count, entry_path, tx_root, user_name, tx_index, tx_path, block, chain, shard_group_id]
      additionalProperties: true
      properties:
        format:
          type: integer
          const: 1
          description: Proof format version; must be 1.
        chain_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Identity of the ledger chain (32 bytes, hex); a digest of another chain is not accepted.
        relation:
          type: string
          description: '`schema.table` of the proof; informational and not authenticated (optional).'
        shard_group_id:
          type: integer
          format: int32
          minimum: 0
          description: The only member that is not the extension's. The shard group (chain) the proof was made on; the map group, 0, for a database that is not sharded. Use it to pick the digest in `LedgerDigest.chains[]`.
        table_id:
          type: integer
          format: int32
          minimum: 0
          description: Local number of the table in the ledger (`kingres.ledger_table.table_id`); part of the row encoding, so a proof does not verify for the same bytes in another table.
        ledger_txid:
          type: integer
          format: int64
          minimum: 0
          description: Ledger transaction of the entry.
        seq:
          type: integer
          format: int32
          minimum: 0
          description: Sequence number of the entry within its transaction (may have gaps; the position is `entry_index`).
        op:
          type: string
          enum: [I, D]
          description: 'The entry this proof is for: `I` the row version was written in the transaction, `D` it was removed in the transaction.'
        row_hash:
          $ref: '#/components/schemas/Sha256Hex'
        entry_index:
          type: integer
          format: int32
          minimum: 0
          description: Position of the entry among the entries of its transaction, in `seq` order.
        entry_count:
          type: integer
          format: int32
          minimum: 1
          description: Entries of the transaction (the size of the entry tree).
        entry_path:
          type: array
          maxItems: 64
          description: Sibling hashes from the entry leaf to `tx_root`.
          items: { $ref: '#/components/schemas/Sha256Hex' }
        tx_root:
          $ref: '#/components/schemas/Sha256Hex'
        user_name:
          type: string
          maxLength: 255
          description: Role that ran the transaction (UTF-8); part of the transaction leaf.
        tx_index:
          type: integer
          format: int32
          minimum: 0
          description: Position of the transaction in its block.
        tx_path:
          type: array
          maxItems: 64
          description: Sibling hashes from the transaction leaf to `block.tx_merkle_root`.
          items: { $ref: '#/components/schemas/Sha256Hex' }
        block:
          $ref: '#/components/schemas/LedgerProofBlock'
        chain:
          type: array
          description: Headers of the blocks after `block`, up to the latest block when the proof was made (empty when `block` was the latest). `block_hash` is optional here; when present it is checked.
          items: { $ref: '#/components/schemas/LedgerProofBlockHeader' }

    # ------------------------------------------------------------------ query
    QueryRequest:
      type: object
      description: A SQL statement to run.
      required: [database, sql]
      properties:
        database:
          type: string
          description: Database to connect to.
        sql:
          type: string
          minLength: 1
          maxLength: 1000000
          description: Exactly one SQL statement.
        rowLimit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
          description: Maximum rows returned; extra rows are dropped and `truncated` is set.
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 300000
          default: 30000
          description: Statement timeout.
        statementId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: 'Added in 0.7.0, optional. Names the statement so that `cancelStatement` can end it. Unique among the running statements of the signed-in role on this server (409 `conflict` otherwise); chosen by the client (a random string). Format (0.9.0 states it): 1 to 64 characters of A-Z, a-z, 0-9, underscore and hyphen. A value that does not match is 400 `validation_failed` with `errors[].field` `/statementId` and nothing is run.'
    QueryColumn:
      type: object
      description: A result column.
      required: [name, type]
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          description: PostgreSQL type name.
    QueryResult:
      type: object
      description: Result of a statement.
      required: [columns, rows, rowCount, truncated, commandTag, durationMs]
      properties:
        columns:
          type: array
          description: Result columns; empty for statements without a result set.
          items: { $ref: '#/components/schemas/QueryColumn' }
        rows:
          type: array
          description: Rows as arrays of values in column order. bigint and numeric values larger than 2^53 are returned as strings; bytea as hex strings; SQL NULL as JSON null.
          items:
            type: array
            description: One row.
            items: {}
        rowCount:
          type: integer
          minimum: 0
          description: Rows returned in `rows`, or rows affected by a data-changing statement.
        truncated:
          type: boolean
          description: "True when the result was cut at `rowLimit` or at the byte budget of the result (16 MiB). A single value larger than 1 MiB is not cut and fails the statement with 422."
        commandTag:
          type: string
          description: PostgreSQL command tag, for example `SELECT 2` or `INSERT 0 1`.
        durationMs:
          type: number
          minimum: 0
          description: Execution time.

    # ------------------------------------------------------------------ alerts
    AlertSeverity:
      type: string
      description: Alert severity.
      enum: [info, warning, critical]
    AlertState:
      type: string
      description: Alert state.
      enum: [open, acknowledged, resolved]
    # ------------------------------------------------------------------ ledger phase 7 (0.11.0)
    LedgerEmptyRequest:
      type: object
      description: Added in 0.11.0. The body of an operation that takes no input. An empty object or no body at all is accepted.
      additionalProperties: false
      properties: {}
    LedgerSettingsCluster:
      type: object
      description: Added in 0.11.0. The cluster settings of ledger publication and anchoring (design of phase 7, section 8.4).
      required: [publication, anchor]
      properties:
        publication:
          type: object
          description: Publication of the signed logs.
          required: [enabled, originPrefix, publicUrl, intervalSeconds, originPrefixLocked]
          properties:
            enabled:
              type: boolean
              description: Whether the logs are published. Off by default.
            originPrefix:
              type: string
              description: The name under which every signature of the cluster is made (no scheme, no trailing slash, at most 160 bytes). The default is chosen by `kingresd` and should be confirmed by the operator.
            publicUrl:
              type:
                - string
                - 'null'
              description: Where the publication is reachable from outside, for the links the console shows; null when not set.
            intervalSeconds:
              type: integer
              minimum: 10
              maximum: 3600
              description: How often the logs are extended and checkpoints are signed.
            originPrefixLocked:
              type: boolean
              description: True once a checkpoint was signed; the prefix cannot change then.
        anchor:
          type: object
          description: Anchoring of aggregate checkpoints.
          required: [intervalSeconds, minimumAnchored, required]
          properties:
            intervalSeconds:
              type: integer
              minimum: 60
              maximum: 86400
              description: How often the newest aggregate checkpoint is submitted to the targets.
            minimumAnchored:
              type: integer
              minimum: 1
              maximum: 8
              description: How many targets must have anchored a checkpoint before it counts as anchored.
            required:
              type: boolean
              description: When true, the absence of anchors raises the alert `ledgerNotAnchored` as a warning instead of info. Nothing is blocked either way.
    LedgerSettingsUpdate:
      type: object
      description: Added in 0.11.0. The same shape as `LedgerSettingsCluster`; every member is optional and a member that is absent is left as it is. `originPrefixLocked` is read-only and ignored.
      properties:
        publication:
          type: object
          description: Publication settings to change.
          properties:
            enabled: { type: boolean, description: Whether the logs are published. }
            originPrefix: { type: string, minLength: 1, maxLength: 160, description: The origin prefix; refused with 409 `origin_prefix_locked` once a checkpoint exists. }
            publicUrl:
              type:
                - string
                - 'null'
              maxLength: 1024
              description: The public URL; null clears it.
            intervalSeconds: { type: integer, minimum: 10, maximum: 3600, description: Publication interval in seconds. }
        anchor:
          type: object
          description: Anchoring settings to change.
          properties:
            intervalSeconds: { type: integer, minimum: 60, maximum: 86400, description: Anchoring interval in seconds. }
            minimumAnchored: { type: integer, minimum: 1, maximum: 8, description: Minimum number of anchored targets. }
            required: { type: boolean, description: Whether the absence of anchors is a warning. }
    LedgerSigningKeyState:
      type: string
      description: Added in 0.11.0. State of a signing key. `next` was generated and does not sign yet, `active` signs (two keys are active during the overlap of a rotation), `retired` signs nothing more and its old signatures stay valid, `revoked` is compromised.
      enum: [next, active, retired, revoked]
    LedgerSigningKey:
      type: object
      description: Added in 0.11.0. A signing key. Only public information; the private key never leaves the servers that hold it.
      required: [fingerprint, publicKey, state, createdAt, activatedAt, retiredAt, revokedAt, compromisedSince]
      properties:
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the public key, lower-case hexadecimal. The console shows it in groups of four characters; an auditor compares it with the value obtained out of band.
        publicKey:
          type: string
          description: The 32-byte Ed25519 public key, standard base64 with padding.
        state:
          $ref: '#/components/schemas/LedgerSigningKeyState'
        createdAt:
          type: string
          format: date-time
          description: When the key was created.
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key came (or comes) into force; null while `next`.
        retiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key was retired; null otherwise.
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key was revoked; null otherwise.
        compromisedSince:
          type:
            - string
            - 'null'
          format: date-time
          description: The time since which a revoked key is considered compromised, as the operator stated it; null otherwise.
        maxTreeSize:
          type:
            - integer
            - 'null'
          format: int64
          description: Optional. For a retired key, the largest tree size it may still sign (the `max_tree_size` of the trust file); null when unbounded or not retired.
    LedgerSigningEvent:
      type: object
      description: Added in 0.11.0. One signed event of the key history, in the order of `seq` (numbered from 0 without gaps).
      required: [seq, type, time]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: Sequence number of the event.
        type:
          type: string
          description: '`key-added`, `key-retired` or `key-revoked` (later steps add `epoch-closed`, `chain-retired` and `group-removed`). Clients must tolerate values they do not know.'
        time:
          type: string
          format: date-time
          description: When the event was made, whole seconds.
    LedgerSigning:
      type: object
      description: |
        Added in 0.11.0. The signing state of the ledger. It holds no secret: no seed, no private key and no
        passphrase is ever part of it.
      required: [clusterId, mode, passphraseProtected, holders, keys, events]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-f]{64}$'
          description: The public cluster identifier (32 random bytes, hexadecimal), created with the first key; null before.
        mode:
          type: string
          enum: [file, command]
          description: Where the private key lives. `file` is the key file on the holders; `command` is an external signer (a later step).
        passphraseProtected:
          type: boolean
          description: Whether this server's key files are sealed with a passphrase. When false the key is clear text on disk, as `ca.key` is, and the console says so.
        holders:
          type: array
          description: The servers that hold a copy of the private key (the manager leader and the candidates of the leader). A server that is not a holder never has the file.
          items: { $ref: '#/components/schemas/ServerId' }
        keys:
          type: array
          description: Every key of the set, oldest first.
          items: { $ref: '#/components/schemas/LedgerSigningKey' }
        events:
          type: array
          description: The signed events of the key history, oldest first.
          items: { $ref: '#/components/schemas/LedgerSigningEvent' }
        backupAdvised:
          type: boolean
          description: Optional. True from the creation, rotation or revocation of a key until the operator confirms that a backup of the key directory was made. A reminder, not a proof.
        discontinuity:
          type: boolean
          description: Optional. True when the key ring was replaced after the loss of every key (auditors then need a new trust file out of band).
        signerAlarm:
          type:
            - string
            - 'null'
          description: Optional. Why this server does not sign, in words, when the stored key set is damaged or not in force; null when it can sign. Never contains a secret.
    CreateLedgerSigningKeyRequest:
      type: object
      description: Added in 0.11.0. Options of the creation or rotation of a signing key.
      additionalProperties: false
      properties:
        overlapDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: For a rotation, how many days both keys sign.
        publicKey:
          type: string
          description: The public key of an external signer, standard base64 of 32 bytes. Only for the signing mode `command`; refused with 422 `unsupported_operation` in mode `file`.
        backupMade:
          type: boolean
          description: Optional. The operator states that a backup of the key directory was made; clears `backupAdvised`. Not a proof.
    RevokeLedgerSigningKeyRequest:
      type: object
      description: Added in 0.11.0. What the operator states when a signing key is revoked.
      required: [compromisedSince, reason, confirm]
      additionalProperties: false
      properties:
        compromisedSince:
          type: string
          format: date-time
          description: The time since which the key is considered compromised. An earlier time is the safe direction. Never later than now.
        reason:
          type: string
          maxLength: 200
          description: Free text of at most 200 bytes of printable ASCII, published in the event.
        confirm:
          type: string
          description: Must equal the fingerprint of the key; any other value is 400 `validation_failed`.
    LedgerTrustFile:
      type: object
      description: |
        Added in 0.11.0. The public parts of the trust file of `kingres-verify` (design of phase 7, section 7.2), the
        same bytes the verifier reads. The file is not a source of first trust: an auditor compares the fingerprint
        with one obtained out of band.
      required: [format, origin_prefix, keys, tsa_roots, client_keys, witnesses]
      properties:
        format: { type: integer, description: Format of the file; 1. }
        origin_prefix: { type: string, description: The origin prefix of the cluster. }
        keys:
          type: array
          description: The public keys with their standing.
          items:
            type: object
            description: One key of the trust file.
            required: [name, public_key, fingerprint, not_before, not_after, revoked, max_tree_size]
            properties:
              name: { type: string, description: A label only. }
              public_key: { type: string, description: Standard base64 of the 32-byte key. }
              fingerprint: { type: string, description: SHA-256 of the key, hexadecimal. }
              not_before: { type: [string, 'null'], format: date-time, description: When the key may start to sign. }
              not_after: { type: [string, 'null'], format: date-time, description: Never set by `kingresd` (a retired key's old checkpoints stay valid). }
              revoked: { type: boolean, description: True for a revoked key. }
              max_tree_size: { type: [integer, 'null'], format: int64, description: The largest tree size a retired key may sign; null when unbounded. }
        tsa_roots:
          type: array
          description: Roots of time-stamp authorities (a later step).
          items: { type: string, description: A PEM certificate. }
        client_keys:
          type: array
          description: Client keys (a later step).
          items: { type: object, description: A client key entry., additionalProperties: true }
        witnesses:
          type: array
          description: Witnesses (none yet).
          items: { type: object, description: A witness entry., additionalProperties: true }
    LedgerPublicationLog:
      type: object
      description: Added in 0.11.0. One published log.
      required: [kind, origin, size, lastCheckpointAt, state]
      properties:
        kind: { type: string, enum: [chain, aggregate], description: A chain log (one per shard group and epoch) or an aggregate log (one per database). }
        origin: { type: string, description: The origin of the log. }
        size: { type: integer, format: int64, minimum: 0, description: Size of the log. }
        lastCheckpointAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the newest checkpoint was signed; null when none was.
        state: { type: string, enum: [active, diverged, closed], description: State of the log. }
    LedgerPublication:
      type: object
      description: Added in 0.11.0. The state of the ledger publication.
      required: [enabled, listener, logs, lastCheckpointAt, checks]
      properties:
        enabled: { type: boolean, description: Whether publication is enabled. }
        listener:
          type: object
          description: The HTTP listener that serves the publication.
          required: [address, tls, running]
          properties:
            address: { type: [string, 'null'], description: Listen address; null when no listener is configured. }
            tls: { type: boolean, description: Whether the listener uses TLS (plain HTTP is a warning). }
            running: { type: boolean, description: Whether it runs. }
        logs:
          type: array
          description: The published logs.
          items: { $ref: '#/components/schemas/LedgerPublicationLog' }
        lastCheckpointAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the newest checkpoint of any log was signed.
        checks:
          type: object
          description: The last checks of the publication (what the audit job found); members are added by later steps.
          additionalProperties: true
    LedgerAnchorKind:
      type: string
      description: Added in 0.11.0. Kind of an anchor target. `worm` is an S3 Object Lock store, `tsa` an RFC 3161 time-stamp authority, `ots` OpenTimestamps.
      enum: [worm, tsa, ots]
    LedgerAnchorState:
      type: string
      description: Added in 0.11.0. State of an anchor record. `pending` waits to be submitted, `submitted` was accepted and is not final, `anchored` is final, `failed` needs a person, `superseded` was replaced by a newer checkpoint, `expired` was never confirmed in time.
      enum: [pending, submitted, anchored, failed, superseded, expired]
    LedgerAnchorTarget:
      type: object
      description: Added in 0.11.0. An anchor target. Credentials are write-only and never part of it.
      required: [id, kind, name, enabled, config, credentialsSet, lastTest, newestAnchoredAt, state]
      properties:
        id: { type: integer, format: int64, minimum: 1, description: Identifier. }
        kind: { $ref: '#/components/schemas/LedgerAnchorKind' }
        name: { type: string, minLength: 1, maxLength: 63, description: A unique name. }
        enabled: { type: boolean, description: Whether the target is used. }
        config: { type: object, additionalProperties: true, description: The non-secret configuration; its shape depends on `kind`. }
        credentialsSet: { type: boolean, description: Whether credentials are stored. Their value is never returned. }
        lastTest:
          oneOf:
            - $ref: '#/components/schemas/LedgerAnchorTest'
            - type: 'null'
          description: The result of the last test; null when never tested.
        newestAnchoredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Evidence time of the newest anchor of this target; null when none.
        state: { type: string, enum: [none, ok, behind, failed], description: The state of the target as the alerts see it. }
    LedgerAnchorTargetList:
      type: object
      description: Added in 0.11.0. The anchor targets.
      required: [items]
      properties:
        items:
          type: array
          description: The targets.
          items: { $ref: '#/components/schemas/LedgerAnchorTarget' }
    LedgerAnchorTargetCreate:
      type: object
      description: Added in 0.11.0. A new anchor target.
      required: [kind, name, config]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/LedgerAnchorKind' }
        name: { type: string, minLength: 1, maxLength: 63, description: A unique name. }
        enabled: { type: boolean, default: false, description: Whether the target is used. }
        config: { type: object, additionalProperties: true, description: The non-secret configuration; its shape depends on `kind`. }
        credentials: { type: object, additionalProperties: true, description: Write-only credentials; stored in a sealed file and never returned or logged. }
    LedgerAnchorTargetUpdate:
      type: object
      description: Added in 0.11.0. Changes to an anchor target; every member is optional. `kind` cannot change (409 `immutable_field`).
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/LedgerAnchorKind' }
        name: { type: string, minLength: 1, maxLength: 63, description: The new name. }
        enabled: { type: boolean, description: Whether the target is used. }
        config: { type: object, additionalProperties: true, description: The new non-secret configuration. }
        credentials: { type: object, additionalProperties: true, description: New credentials, which replace the stored ones. Write-only. }
    LedgerAnchorTest:
      type: object
      description: Added in 0.11.0. The result of the test of an anchor target.
      required: [checks, ok]
      properties:
        checks:
          type: array
          description: The named checks.
          items:
            type: object
            description: One check.
            required: [name, status, detail]
            properties:
              name: { type: string, description: Name of the check. }
              status: { type: string, enum: [ok, warning, failed], description: Result. }
              detail: { type: string, description: What was found; never contains a credential. }
        ok: { type: boolean, description: True when no check failed. }
        testedAt:
          type: string
          format: date-time
          description: Optional. When the test ran.
    LedgerAggregateMember:
      type: object
      description: Added in 0.11.0. One chain in an aggregate.
      required: [shardGroupId, chainId, epoch, height, blockHash, logRoot, flags]
      properties:
        shardGroupId: { type: integer, format: int32, minimum: 0, description: Shard group. }
        chainId: { type: string, description: Public chain identifier, 64 hexadecimal characters. }
        epoch: { type: integer, minimum: 1, description: Epoch of the chain log. }
        height: { type: integer, format: int64, minimum: 0, description: Head block height. }
        blockHash: { $ref: '#/components/schemas/Sha256Hex' }
        logRoot: { type: string, description: Root of the chain log, hexadecimal. }
        flags: { type: array, items: { type: string, description: 'stale, diverged or retired.' }, description: Flags of the member. }
    LedgerAggregateSummary:
      type: object
      description: Added in 0.11.0. An aggregate checkpoint without its members.
      required: [size, root, checkpoint, generatedAt, complete, uncoveredShardGroupIds]
      properties:
        size: { type: integer, format: int64, minimum: 1, description: Size of the aggregate log. }
        root: { type: string, description: Root of the aggregate log, hexadecimal. }
        checkpoint: { type: string, description: The signed checkpoint (a signed note). }
        generatedAt: { type: string, format: date-time, description: When the aggregate entry was made. }
        complete: { type: boolean, description: True when every shard group of the database is covered. }
        uncoveredShardGroupIds: { type: array, items: { type: integer, format: int32, minimum: 0 }, description: Shard groups that are not covered. }
    LedgerAggregate:
      description: Added in 0.11.0. An aggregate checkpoint with its members, its anchors and the statement of what it proves.
      allOf:
        - $ref: '#/components/schemas/LedgerAggregateSummary'
        - type: object
          description: The members and the anchors.
          required: [members, anchors, statement]
          properties:
            members:
              type: array
              description: The chains covered.
              items: { $ref: '#/components/schemas/LedgerAggregateMember' }
            anchors:
              type: array
              description: The anchor records of this checkpoint.
              items: { $ref: '#/components/schemas/LedgerAnchor' }
            statement: { type: string, description: The text of what the aggregate proves and does not prove. }
    LedgerAggregatePage:
      type: object
      description: Added in 0.11.0. A page of aggregates, newest first.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The aggregates without members.
          items: { $ref: '#/components/schemas/LedgerAggregateSummary' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    LedgerAnchor:
      type: object
      description: Added in 0.11.0. An anchor record of an aggregate checkpoint at one target.
      required: [id, targetId, targetName, kind, aggregateSize, state, attempts, nextAttemptAt, anchoredAt, evidenceTime, lastError]
      properties:
        id: { type: integer, format: int64, minimum: 1, description: Identifier. }
        targetId:
          type:
            - integer
            - 'null'
          format: int64
          description: The target; null after the target was deleted.
        targetName: { type: string, description: Name of the target (kept after it is deleted). }
        kind: { $ref: '#/components/schemas/LedgerAnchorKind' }
        aggregateSize: { type: integer, format: int64, minimum: 1, description: Size of the anchored aggregate checkpoint. }
        state: { $ref: '#/components/schemas/LedgerAnchorState' }
        attempts: { type: integer, minimum: 0, description: Attempts so far. }
        nextAttemptAt: { type: [string, 'null'], format: date-time, description: When the next attempt is due. }
        anchoredAt: { type: [string, 'null'], format: date-time, description: When the record became anchored. }
        evidenceTime: { type: [string, 'null'], format: date-time, description: The time the target vouches for, when known. }
        lastError: { type: [string, 'null'], description: The last error in words; never contains a credential. }
    LedgerAnchorPage:
      type: object
      description: Added in 0.11.0. A page of anchor records.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Records, newest first.
          items: { $ref: '#/components/schemas/LedgerAnchor' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    LedgerAnchorList:
      type: object
      description: Added in 0.11.0. Anchor records.
      required: [items]
      properties:
        items:
          type: array
          description: The records.
          items: { $ref: '#/components/schemas/LedgerAnchor' }
    LedgerBundleRequest:
      type: object
      description: Added in 0.11.0. What a bundle holds.
      required: [includeAnchors]
      additionalProperties: false
      properties:
        logs: { type: array, items: { type: string, description: An origin. }, description: The logs to include; all when absent. }
        sinceSize: { type: integer, format: int64, minimum: 0, description: Only the part of each log after this size. }
        includeAnchors: { type: boolean, description: Whether to include the anchor evidence. }
        proofs: { type: array, items: { $ref: '#/components/schemas/InclusionProofRequest' }, description: Inclusion proofs to include (the bundle then reveals those rows' hashes to whoever holds it). }
    LedgerClientKey:
      type: object
      description: Added in 0.11.0. A registered client key.
      required: [keyId, publicKey, roleName, label, registeredBy, registeredAt, revokedAt, revocationReason]
      properties:
        keyId: { type: string, description: Key id, 8 hexadecimal characters. }
        publicKey: { type: string, description: The 32-byte public key, standard base64. }
        roleName: { type: [string, 'null'], description: The role the key is bound to; null when unbound. }
        label: { type: string, description: Label. }
        registeredBy: { type: string, description: Who registered it. }
        registeredAt: { type: string, format: date-time, description: When. }
        revokedAt: { type: [string, 'null'], format: date-time, description: When it was revoked. }
        revocationReason: { type: [string, 'null'], description: Why it was revoked. }
    LedgerClientKeyList:
      type: object
      description: Added in 0.11.0. Registered client keys.
      required: [items]
      properties:
        items:
          type: array
          description: The keys.
          items: { $ref: '#/components/schemas/LedgerClientKey' }
    RegisterLedgerClientKeyRequest:
      type: object
      description: Added in 0.11.0. A client key to register.
      required: [publicKey, label]
      additionalProperties: false
      properties:
        publicKey: { type: string, description: The 32-byte Ed25519 public key, standard base64. }
        roleName: { type: string, description: Optional role the key is bound to. }
        label: { type: string, minLength: 1, maxLength: 100, description: Label. }
    RevokeLedgerClientKeyRequest:
      type: object
      description: Added in 0.11.0. Why a client key is revoked.
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 200, description: Reason. }
    SignaturePolicyRequest:
      type: object
      description: Added in 0.11.0. The signature policy of a ledger table.
      required: [policy]
      additionalProperties: false
      properties:
        policy: { type: string, enum: [required], description: The only value; the policy cannot go back. }
    AcknowledgeLedgerDivergenceRequest:
      type: object
      description: Added in 0.11.0. What the operator states about a diverged chain.
      required: [kind, reason, confirm]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [restore, failoverLoss, other], description: What happened. }
        reason: { type: string, minLength: 1, maxLength: 200, description: Free text. }
        confirm: { type: string, description: Must equal the database name. }
    AlertKind:
      type: string
      description: |
        Alert type. Clients must tolerate kinds they do not know. Added in 0.30.0: `extensionSkipped` (an extension of a database was not installed on a server because a role of the tenant made a schema of the extension its own, so its owner there differs from the owner on the leader; the operation that found it, adding a server among them, went on without that extension; `kingresd` raises it when it applies the database to the server, and clears it when a later apply of that extension on that server succeeds or when the database is dropped; the message names the extension, the schema and the two owners; one alert for each skipped extension; subject `server` and `database`, and `aspect` is `extension:<name>`; `warning`). Added in 0.24.0: `extensionSchemaUntrusted` (the schema of a KingresDB extension in a database is not owned by a superuser, or an object in it is not a member of an extension, or a role that is not a superuser can create objects in it, so the service role does not read or call anything in it; the monitor raises it for the database and the readings of that database that depend on the extension are not available; subject `server` and `database`; `critical`). Added in 0.19.0: `transferStagingLow` (the reservations of the staged files of the data transfer hold 90 percent of `dataTransfer.stagingQuotaBytes`, `critical` at 98 percent; subject `server`; raised by the server that holds the files, the manager leader). Added in 0.15.0: `rebalanceFailed` (the last automatic rebalance failed and the mode is suspended until an operator starts a rebalance; subject `cluster`; `warning`). Added in 0.13.0: `certificateAuthorityUnavailable` (the map group was failed over and the new manager leader holds no key of the certificate authority, so no certificate can be issued, renewed or revoked until the operator restores `pki/ca.key` and `pki/revoked.json` from the backup of the old leader; subject `cluster`; `critical`). Added in 0.11.0 (ledger phase 7; subjects at `AlertSubject`): `ledgerNotAnchored` (a database has ledger tables and no anchor target is enabled; `info`, `warning` when the setting `anchor.required` is on), `ledgerAnchorBehind` (`warning`, `critical`), `ledgerAnchorFailed` (an anchor record is `failed` or `expired`; `critical`), `ledgerAnchorConflict` (the store holds a different object under the name of an anchor; `critical`), `ledgerChainDiverged` (a chain no longer extends its published log; `critical`), `ledgerGroupUnread` (a shard group's chain could not be read; `warning`, `critical`), `ledgerPublicationBehind` (the newest signed checkpoint of a chain is older than five publication intervals while its head advanced; `warning`), `ledgerSignerUnavailable` (no checkpoint could be signed for two rounds, or the key set is damaged, or the key file is missing on the leader; `critical`) and `ledgerDigestOverdue` (no digest within twice `digestIntervalSeconds`; `warning`). Added in 0.8.0: `clockDifference` (a server's clock differs from the manager leader's by more than `ClusterSettings.clock.maxDifferenceMs`, less the uncertainty of the measurement; `warning`, `critical` at ten times the threshold; `kingresd` does not set the system clock, run NTP or chrony). Added in 0.7.0: `leaseLost` (the `kingresd` that
        runs the primary of a shard group could not renew the group's lease in time; for a group with a standby the
        instance was stopped (fenced), for a group without one it keeps running and this alert is the only effect;
        `critical`), `groupWithoutSynchronousStandby` (the group's standby has been unreachable for longer than the
        grace period and the primary no longer waits for it: acknowledged commits exist on one server only; `critical`),
        `groupUnderReplicated` (fewer standbys run than the cluster's replica count; `warning`). From 0.7.0
        `serverSuspect` and `serverDown` are raised by the manager leader for another server whose heartbeats stop
        (`suspect` after the suspect timeout, `down` after the failure timeout, both cleared when it is heard again);
        before, `serverDown` meant only that the server's instance did not run. Each kind's subject members are listed at `AlertSubject`. Added in 0.6.0: `replicationPending` (the manager
        leader keeps a change to roles, grants or settings waiting for a server that could not be reached; until the
        change arrives, a role that was disabled, changed or dropped may still work on that server. `subject` is
        `server:<leader>|behind:<server>`, `warning` after a minute, `critical` after ten).
      enum:
        - serverDown
        - serverSuspect
        - underReplicatedBuckets
        - unavailableBuckets
        - replicationLagHigh
        - diskSpaceLow
        - memoryPressure
        - rebalanceNeeded
        - autoFailoverTriggered
        - autoFailoverLimitReached
        - mapGroupUnavailable
        - ledgerVerificationFailed
        - ledgerPendingTooOld
        - versionMismatch
        - certificateExpiring
        - certificateRenewalFailed
        - replicationPending
        - taskFailed
        - rebalanceFailed
        - leaseLost
        - groupWithoutSynchronousStandby
        - groupUnderReplicated
        - clockDifference
        - failoverNeedsDecision
        - failoverBlocked
        - failoverDataLoss
        - splitPromotion
        - oldPrimaryRunning
        - oldPrimaryNotStopped
        - oldPrimaryNotRebuilt
        - ledgerNotAnchored
        - ledgerAnchorBehind
        - ledgerAnchorFailed
        - ledgerAnchorConflict
        - ledgerChainDiverged
        - ledgerGroupUnread
        - ledgerPublicationBehind
        - ledgerSignerUnavailable
        - ledgerDigestOverdue
        - certificateAuthorityUnavailable
        - partitionsAheadLow
        - partitionPolicyFailed
        - transferStagingLow
        - extensionSchemaUntrusted
        - extensionSkipped
    Alert:
      type: object
      description: An alert.
      required: [id, kind, severity, state, title, message, raisedAt]
      properties:
        id:
          type: integer
          format: int64
          description: Alert identifier. Unique in the cluster; from 0.5.0 the high bits are the number of the server that holds the alert, which is how an acknowledgement finds it.
        kind:
          $ref: '#/components/schemas/AlertKind'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        state:
          $ref: '#/components/schemas/AlertState'
        title:
          type: string
          description: Short title.
        message:
          type: string
          description: Explanation.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Related server. It equals `subject.serverId`.
        databaseName:
          type:
            - string
            - 'null'
          description: Related database. It equals `subject.databaseName`.
        subject:
          $ref: '#/components/schemas/AlertSubject'
        raisedAt:
          type: string
          format: date-time
          description: When the alert was raised.
        acknowledgedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was acknowledged.
        acknowledgedBy:
          type:
            - string
            - 'null'
          description: Who acknowledged it.
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the condition cleared.
    AlertSubject:
      type: object
      description: |
        Added in 0.7.0, optional (absent from a server of an older revision). What an alert is about, in typed
        members; a client never parses a string. Every member is null when the alert has nothing to say about it.
        Which members an alert kind sets: `serverDown`, `serverSuspect`, `diskSpaceLow`, `memoryPressure`,
        `replicationLagHigh`, `certificateExpiring` (`aspect` `ca` for the cluster certificate authority),
        `certificateRenewalFailed`: `serverId` is the server concerned. `ledgerPendingTooOld`: `serverId` and
        `databaseName`. `replicationPending`: `serverId` is the manager leader that keeps the change waiting and
        `behindServerId` the server that is behind (the one the panel must name). `leaseLost`,
        `groupWithoutSynchronousStandby`, `groupUnderReplicated`: `shardGroupId`, and `serverId` the server that
        runs the group's primary. `clockDifference` (0.8.0): `serverId` is the server whose clock differs. `versionMismatch`: all null.
        Added in 0.11.0: `ledgerNotAnchored`, `ledgerDigestOverdue`: `databaseName`. `ledgerAnchorBehind`, `ledgerAnchorFailed`: `aspect` is `target:<id>`. `ledgerAnchorConflict`: `databaseName` and `aspect` `target:<id>`. `ledgerChainDiverged`, `ledgerGroupUnread`, `ledgerPublicationBehind`: `databaseName` and `shardGroupId`. `ledgerSignerUnavailable`: all null.
        Added in 0.17.0: `partitionsAheadLow` and `partitionPolicyFailed` set `databaseName`, `tableSchema` and `tableName` (the table), and leave `aspect` null. `taskId` (0.9.0, optional) names a task the alert is about, so that a client can link to it; `kingresd` sets it for
        `taskFailed` alerts (the only kind about a task; `kingresd` raises it for a rebalance that ended failed, subject `task:<id>`), and no other kind sets it.
      required: [serverId, behindServerId, shardGroupId, databaseName, aspect]
      properties:
        tableSchema:
          type: [string, 'null']
          description: 'Added in 0.17.0, optional. The schema of the table the alert is about (`partitionsAheadLow`, `partitionPolicyFailed`); null or absent otherwise. With `tableName` it needs no parsing: use these, not `aspect`.'
        tableName:
          type: [string, 'null']
          description: 'Added in 0.17.0, optional. The name of the table the alert is about; null or absent otherwise.'
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server the alert is about; null when it is about the cluster.
        behindServerId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: The server that is behind (`replicationPending`); null for other kinds.
        shardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 0
          description: The shard group the alert is about; null when it is not about one.
        databaseName:
          type:
            - string
            - 'null'
          description: The database the alert is about; null when it is not about one.
        aspect:
          type:
            - string
            - 'null'
          description: A qualifier of the subject for kinds that have several, for example `ca`; null otherwise. Clients must tolerate values they do not know.
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Added in 0.9.0, optional (absent from a server of an older revision, null when the alert is not about a task). The task the alert is about; open it with `GET /tasks/{taskId}`.
    AlertPage:
      type: object
      description: A page of alerts.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Alerts, newest first.
          items: { $ref: '#/components/schemas/Alert' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
        partial:
          type: boolean
          description: Added in 0.5.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.5.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }

    # ------------------------------------------------------------------ metrics
    MetricName:
      type: string
      description: |
        Metric names. Server-scoped: cpuUsagePercent, memoryUsedBytes, diskUsedBytes, connections,
        replicationLagBytes, replicationLagSeconds. Database-scoped: databaseSizeBytes, transactionsPerSecond,
        queriesPerSecond. Both scopes accept connections. Cluster-scoped: bucketsUnderReplicated. Added in 0.7.0,
        server-scoped, only on a server whose client entry point is on (totals since the start of `kingresd`, except
        the `Active` ones): `clientConnectionsAccepted`, `clientConnectionsActive`, `clientConnectionsRefused` (over the
        cap), `clientConnectFailures`, `clientConnectionsMoved` (closed because the destination changed),
        `clientConnectionsIdleClosed`, `clientBytesIn`, `clientBytesOut`, and the same with `clientStandby` for the
        standby entry point. Added in 0.19.0, server-scoped, only on a server that holds staged files of the data transfer (the manager leader):
        `transferStagingUsedBytes` (the room the reservations hold), `transferStagingFreeBytes` (free on the file system of the staging directory),
        `transfersRunning` (uploads being received and exports being written) and `transfersStaged` (ready files that are kept).
      enum:
        - cpuUsagePercent
        - memoryUsedBytes
        - diskUsedBytes
        - connections
        - replicationLagBytes
        - replicationLagSeconds
        - databaseSizeBytes
        - transactionsPerSecond
        - queriesPerSecond
        - bucketsUnderReplicated
        - clientConnectionsAccepted
        - clientConnectionsActive
        - clientConnectionsRefused
        - clientConnectFailures
        - clientConnectionsMoved
        - clientConnectionsIdleClosed
        - clientBytesIn
        - clientBytesOut
        - clientStandbyConnectionsAccepted
        - clientStandbyConnectionsActive
        - clientStandbyConnectionsRefused
        - clientStandbyConnectFailures
        - clientStandbyConnectionsMoved
        - clientStandbyConnectionsIdleClosed
        - clientStandbyBytesIn
        - clientStandbyBytesOut
        - transferStagingUsedBytes
        - transferStagingFreeBytes
        - transfersRunning
        - transfersStaged
    MetricPoint:
      type: object
      description: One sample.
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Sample time (start of the step).
        value:
          type:
            - number
            - 'null'
          description: Value; null when there is no data for the step.
    MetricSeries:
      type: object
      description: One time series.
      required: [labels, points]
      properties:
        labels:
          type: object
          description: What the series is for.
          properties:
            serverId:
              $ref: '#/components/schemas/ServerId'
            databaseName:
              type: string
              description: Database of the series.
        points:
          type: array
          description: Samples in time order.
          items: { $ref: '#/components/schemas/MetricPoint' }
    MetricQueryResult:
      type: object
      description: Result of a metric query.
      required: [metric, unit, from, to, step, series]
      properties:
        metric:
          $ref: '#/components/schemas/MetricName'
        unit:
          type: string
          enum: [percent, bytes, count, countPerSecond, seconds]
          description: Unit of the values.
        from:
          type: string
          format: date-time
          description: Start of the range.
        to:
          type: string
          format: date-time
          description: End of the range.
        step:
          type: integer
          minimum: 1
          description: Resolution in seconds.
        series:
          type: array
          description: The series; a single series unless `groupBy` was used.
          items: { $ref: '#/components/schemas/MetricSeries' }
        partial:
          type: boolean
          description: Added in 0.5.0, optional. True when at least one other server did not answer (see `MissingServer`); the page holds what the servers that answered know.
        missingServers:
          type: array
          description: Added in 0.5.0, optional. The servers that did not answer, sorted by id; absent when `partial` is false.
          items: { $ref: '#/components/schemas/MissingServer' }

    # ------------------------------------------------------------------ data transfer (0.19.0)
    CsvDelimiter:
      type: string
      description: Added in 0.19.0. The field delimiter of a CSV file.
      enum: [',', ';', "\t", '|', ':']
      default: ','
    CsvEncoding:
      type: string
      description: Added in 0.19.0. The character encoding of a CSV file, by the name PostgreSQL gives it. `SJIS`, `BIG5` and `GBK` are client-only encodings.
      enum: [UTF8, LATIN1, LATIN2, LATIN9, WIN1250, WIN1251, WIN1252, WIN1256, ISO_8859_6, SJIS, EUC_JP, GBK, BIG5, KOI8R]
      default: UTF8
    ExportTableRequest:
      type: object
      description: |
        Added in 0.19.0. Options of a table export. Every member is optional; the server never accepts a `WHERE`, an order or SQL of any kind.
      properties:
        columns:
          type: array
          description: Column names to export, in this order; validated against the catalog. Default all columns in table order. Generated columns are exported (they are values).
          maxItems: 1600
          items: { type: string, minLength: 1, maxLength: 63 }
        delimiter:
          $ref: '#/components/schemas/CsvDelimiter'
        nullString:
          type: string
          maxLength: 32
          default: ''
          description: The text of a null. The default, an empty string, writes a null as an unquoted empty field. It must not contain a quote, the delimiter, a carriage return or a line feed.
        quote:
          type: string
          minLength: 1
          maxLength: 1
          default: '"'
          description: The quote character, one byte. The escape character is the quote.
        header:
          type: boolean
          default: true
          description: Whether the first record holds the column names.
        encoding:
          $ref: '#/components/schemas/CsvEncoding'
        utf8Bom:
          type: boolean
          default: false
          description: Write a UTF-8 byte order mark (some spreadsheets need one). Only with `encoding` `UTF8`.
        compression:
          type: string
          enum: [none, gzip]
          default: none
          description: '`gzip` compresses the file; its `format` is then `csv.gz`.'
        spreadsheetSafe:
          type: boolean
          default: true
          description: |
            Write a text cell that begins with `=`, `+`, `-`, `@`, `|`, `%`, a tab, a carriage return, the full-width forms of `=`, `+`, `-` and `@`, or a no-break space or spaces before such a character, with an apostrophe in front.
            Numeric, date and boolean columns are not changed. **It is lossy** (importing the file puts the apostrophe in) and **not a security feature**.
        acknowledgeOtherRolesCode:
          type: boolean
          default: false
          description: Accept that the read runs code of another role (a virtual generated column or a row-level-security expression of a table that another role owns). Recorded in the audit event.
        retentionHours:
          type: integer
          minimum: 1
          maximum: 168
          description: How long the file is kept. Default the cluster setting `dataTransfer.retentionHours`.
    ImportTableRequest:
      type: object
      description: |
        Added in 0.19.0. Options of a table import. The schema is closed: members for batches can be added later without changing the meaning of these. There is no `onError`, no `batchRows`
        and no `skipRows`: the import is all or nothing.
      required: [uploadId]
      additionalProperties: false
      properties:
        uploadId:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[0-9]+$'
          description: A complete upload of the caller.
        header:
          type: string
          enum: [none, skip, match]
          default: skip
          description: '`none`: the file has no header. `skip`: it has one, which is ignored. `match`: it has one and its names must equal `columns` (422 `import_header_mismatch` names the first difference).'
        columns:
          type: array
          description: The columns, in the file's order. Default the non-generated columns of the table in table order. A generated column is refused (400 `validation_failed`).
          maxItems: 1600
          items: { type: string, minLength: 1, maxLength: 63 }
        delimiter:
          $ref: '#/components/schemas/CsvDelimiter'
        nullString:
          type: string
          maxLength: 32
          default: ''
          description: The text of a null, as in `ExportTableRequest`.
        quote:
          type: string
          minLength: 1
          maxLength: 1
          default: '"'
          description: The quote character, one byte. With the client-only encodings `SJIS`, `BIG5` and `GBK` it must be an ASCII byte below 0x40.
        encoding:
          $ref: '#/components/schemas/CsvEncoding'
        compression:
          type: string
          enum: [none, gzip]
          description: Default detected from the upload. The expansion is counted against the 2 GiB limit.
        forceNotNull:
          type: array
          description: Columns in which an empty unquoted field is an empty string, not a null.
          maxItems: 1600
          items: { type: string, minLength: 1, maxLength: 63 }
        forceNull:
          type: array
          description: Columns in which a quoted `nullString` is a null.
          maxItems: 1600
          items: { type: string, minLength: 1, maxLength: 63 }
        skipBom:
          type: boolean
          default: true
          description: Remove a UTF-8 byte order mark at the start of the decompressed stream.
        keepUpload:
          type: boolean
          default: false
          description: Keep the upload after a successful import (until its retention time).
    CreateDataUploadRequest:
      type: object
      description: Added in 0.19.0. A new resumable upload.
      required: [purpose, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [tableImport, databaseArchive]
          description: What the file is for. `databaseArchive` (0.29.0) is a zip archive made by `exportDatabase`; it is used by `validateDatabaseArchive`.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: The size of the file in bytes; at most `dataTransfer.maxFileBytes`. The staging quota for this size is reserved.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The SHA-256 of the file in lower-case hexadecimal; for clients that can hash the file first. The server checks it when the last byte is in.
        fileName:
          type: string
          maxLength: 255
          description: For display only. It is never used in a path and never appears in an audit event.
    DataUpload:
      type: object
      description: Added in 0.19.0. A resumable upload.
      required: [uploadId, state, sizeBytes, offset, chunkBytesMax, chunkAlign, expiresAt]
      properties:
        uploadId:
          type: string
          description: Identifier, a decimal string.
        state:
          type: string
          enum: [receiving, complete, validating, valid, invalid, lost, deleted]
          description: '`receiving`: bytes are missing. `complete`: all bytes are in and the SHA-256 is known. `validating`: an `archive.validate` task reads it (0.29.0). `valid`, `invalid`: the result of the validation of an archive (0.29.0); the report is in `report`. `lost`: the staged file is gone (404 is the usual answer).'
        sizeBytes:
          type: integer
          format: int64
          description: The declared size.
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Where the next chunk must start; read from the staged file.
        chunkBytesMax:
          type: integer
          format: int64
          description: The largest chunk the server accepts (256 MiB). The console sends 64 MiB.
        chunkAlign:
          type: integer
          enum: [65536]
          description: Every chunk except the last is a multiple of this many bytes.
        sha256:
          type:
            - string
            - 'null'
          description: The SHA-256 of the file in lower-case hexadecimal, once the upload is complete; null before.
        expiresAt:
          type: string
          format: date-time
          description: When the server deletes the upload if nothing happens (48 hours without data, 24 hours when complete and unused).
        report:
          description: The archive report of the last validation (0.29.0); null before one and for an upload whose purpose is not `databaseArchive`.
          oneOf:
            - $ref: '#/components/schemas/ArchiveReport'
            - type: 'null'
    TableConsistency:
      type: object
      description: |
        Added in 0.19.0. What the file guarantees for one table. Every row in a file was committed. `single-snapshot`: one snapshot (a local table, a reference table, or a distributed table whose buckets are all on one
        group). `per-group`: each group's rows come from one snapshot of that group and the groups' snapshots are **not** one instant. `per-group-and-partition`: as `per-group`, and the partitions of one group may be
        different snapshots. **There is no global snapshot** (phase 8, future).
      required: [table, level, groups]
      properties:
        table:
          type: string
          description: '`schema.table`.'
        level:
          type: string
          enum: [single-snapshot, per-group, per-group-and-partition, archive-single-snapshot]
        groups:
          type: integer
          minimum: 1
          description: Number of groups that hold buckets of the table.
    ExportDatabaseRequest:
      type: object
      description: Added in 0.29.0. Options of a database export. Every member is optional; the server never accepts SQL of any kind.
      additionalProperties: false
      properties:
        excludeTables:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/TableRef' }
          description: Tables whose rows are left out of the archive (their structure stays). A name that is not a table of the database is 400 `validation_failed`.
        dataMode:
          type: string
          enum: [all, none]
          default: all
          description: '`none` writes the structure and the catalog without any data entry.'
        acknowledgeLargeObjectsLost:
          type: boolean
          default: false
          description: Accept that large objects and `oid` or `reg*` columns are not carried (422 `large_objects_present` otherwise); the archive's warnings say it.
        retentionHours:
          type: integer
          minimum: 1
          maximum: 168
          description: How long the archive is kept; default the cluster setting.
    ImportDatabaseRequest:
      type: object
      description: |
        Added in 0.30.0. The request of `importDatabase`. A closed schema: there is no `privileges`, no `allowCode` and no `bucketCount` (owners and grants are not restored, functions and triggers are always refused, the
        bucket counts of the archive are kept), so that a later revision can add them without changing what a request means.
      required: [uploadId]
      additionalProperties: false
      properties:
        uploadId:
          type: string
          description: "A complete upload of the caller whose purpose is `databaseArchive`. It need not have been validated: the import reads the archive again."
        database:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: The name of the new database; default the name in the manifest. 409 `already_exists` when it exists at the request, and the task fails when it exists when the final name is taken.
        expectedSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Binds the import to a checksum the operator got elsewhere (the export's SHA-256 as the console shows it); a different file is 422 `archive_invalid`.
        acknowledgeLedgerRestart:
          type: boolean
          default: false
          description: Required `true` when the archive has a ledger table; the imported table is a new chain (ADR 0028). 422 `ledger_restart_not_acknowledged` otherwise.
        onForeignKeyViolation:
          type: string
          enum: [fail, keepNotValid]
          default: fail
          description: '`fail`: a foreign key that the loaded rows violate fails the task (the code `foreign_key_violation` names the constraint and the count) and the database is removed. `keepNotValid`: the constraint stays `NOT VALID`, the database is kept and the violations are reported by constraint name and count.'
        keepOnFailure:
          type: boolean
          default: false
          description: Keep the private database if the import fails, to look at it. It stays under its private name until it is dropped.
    ArchiveReport:
      type: object
      description: |
        Added in 0.29.0. The result of the validation of a database archive (`validateDatabaseArchive`, stored with the upload). Nothing in it is a value of the data or the text of a statement.
      required: [valid, format, versions, tables, reasons]
      properties:
        valid:
          type: boolean
        format:
          type: string
          description: The `format` of the manifest, for example `kingres-export/1`; empty when the manifest could not be read.
        sha256:
          type: string
          description: The SHA-256 of the archive file.
        versions:
          type: object
          required: [postgresMajor, kingresVersion, extensions, encoding, lcCollate, lcCtype]
          properties:
            postgresMajor: { type: integer }
            kingresVersion: { type: string }
            extensions:
              type: array
              items:
                type: object
                required: [name, version, schema]
                properties:
                  name: { type: string }
                  version: { type: string }
                  schema: { type: string }
                  installed:
                    type:
                      - string
                      - 'null'
                    description: The version installed on this cluster, or null when it is not installed.
            encoding: { type: string }
            lcCollate: { type: string }
            lcCtype: { type: string }
        tables:
          type: object
          required: [local, hash, reference, ledger, columnar, rows, bytes]
          properties:
            local: { type: integer }
            hash: { type: integer }
            reference: { type: integer }
            ledger: { type: integer }
            columnar: { type: integer }
            rows: { type: integer, format: int64 }
            bytes: { type: integer, format: int64 }
        statements:
          type: object
          description: What the shape grammar found in the three SQL files; nothing was run.
          required: [byKind, refused]
          properties:
            byKind:
              type: object
              additionalProperties: { type: integer }
            refused:
              type: array
              items:
                type: object
                required: [kind, position, fingerprint, reason]
                properties:
                  kind: { type: string }
                  position: { type: string, description: 'The file and the statement number, for example `schema/pre-data.sql#12`.' }
                  fingerprint: { type: string, description: 'The length and a hash prefix of the statement; never its text.' }
                  reason: { type: string }
        needs:
          type: object
          required: [ledgerRestart, largeObjectsLost]
          properties:
            ledgerRestart: { type: boolean, description: "The archive has ledger tables; an import restarts their chain." }
            largeObjectsLost: { type: boolean, description: "The source had large objects that the archive does not carry (acknowledged at export)." }
        warnings:
          type: array
          items: { type: string }
        reasons:
          type: array
          description: Why the archive is not valid or not importable here, in the shape of the blockers of `table_not_eligible`; empty when valid.
          items: { $ref: '#/components/schemas/TableBlocker' }
    DataExport:
      type: object
      description: Added in 0.19.0. A staged export file and what is known about it.
      required: [exportId, kind, state, createdAt, expiresAt]
      properties:
        exportId:
          type: string
          description: Identifier, a decimal string.
        kind:
          type: string
          enum: [tableExport, databaseExport]
          description: '`databaseExport` (0.29.0) is a zip archive of a database; `table` is then null and `consistency` has one entry per table.'
        state:
          type: string
          enum: [building, ready, failed, expired, lost, deleted]
          description: '`building`: the task writes it. `ready`: it can be downloaded. `failed`: the task failed and the partial file was removed. `expired`: its time has passed. `lost`: the file or the key is gone.'
        database:
          type:
            - string
            - 'null'
        schema:
          type:
            - string
            - 'null'
        table:
          type:
            - string
            - 'null'
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          description: Size of the plaintext file; null while it is built.
        sha256:
          type:
            - string
            - 'null'
          description: SHA-256 of the plaintext file; null while it is built. Two exports with the same value saw the same data.
        rows:
          type:
            - integer
            - 'null'
          format: int64
          description: Rows in the file; null while it is built.
        consistency:
          type:
            - array
            - 'null'
          items: { $ref: '#/components/schemas/TableConsistency' }
          description: One entry for the table (one per table for a database archive; `archive-single-snapshot` when all were read in one transaction); null while it is built.
        spreadsheetSafe:
          type:
            - boolean
            - 'null'
          description: Whether the file was written with the spreadsheet guard (`spreadsheetSafe` of the request); null while it is built. Added to 0.19.0 before its release.
        rlsApplied:
          type: boolean
          description: "Whether row-level security shortened the file. Always false: a table with row-level security is exported only with `row_security = off`, so a policy that hides rows fails the export."
        format:
          type: string
          enum: [csv, csv.gz, archive/1]
          description: '`archive/1` (0.29.0): the zip archive of `exportDatabase`, served as `application/zip`.'
        taskId:
          type: integer
          format: int64
          description: The task that builds the file.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The retention time; the file is deleted after it.
        downloadedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the last byte was served; null when no download has finished.
        warnings:
          type: array
          items: { type: string }
          description: What the file does not carry or how it was read (0.29.0; the warnings of the manifest of a database archive). Absent for a table export.
    DataExportPage:
      type: object
      description: Added in 0.19.0. A page of the caller's exports, newest first.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DataExport' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    DataTransferSettings:
      type: object
      description: Added in 0.19.0. The cluster settings of table export and import.
      required: [enabled, retentionHours, maxFileBytes, stagingQuotaBytes, maxConcurrent]
      properties:
        enabled:
          type: boolean
          default: false
          description: While false every data transfer operation answers 403 `data_transfer_disabled`.
        retentionHours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
          description: How long an export file is kept by default.
        maxFileBytes:
          type: integer
          format: int64
          minimum: 1048576
          default: 21474836480
          description: The largest staged file (20 GiB).
        stagingQuotaBytes:
          type: integer
          format: int64
          minimum: 1048576
          description: The sum of the reservations of the staging area; the default is the smaller of 100 GiB and 25 percent of the file system.
        maxConcurrent:
          type: integer
          minimum: 1
          maximum: 16
          default: 2
          description: Transfers running at once in the cluster (one per role).
        maxAtomicBytes:
          type: integer
          format: int64
          readOnly: true
          description: The largest decompressed file that one import accepts on the server that answers (a flag of the server, 256 MiB for a reference table whatever the flag). Not part of the update; added to 0.19.0 before its release.
    DataTransferSettingsUpdate:
      type: object
      description: Added in 0.19.0. A partial update of `DataTransferSettings`.
      minProperties: 1
      properties:
        enabled: { type: boolean, description: Turn the data transfer operations on or off. }
        retentionHours: { type: integer, minimum: 1, maximum: 168, description: New default retention. }
        maxFileBytes: { type: integer, format: int64, minimum: 1048576, description: New largest staged file. }
        stagingQuotaBytes: { type: integer, format: int64, minimum: 1048576, description: New staging quota. }
        maxConcurrent: { type: integer, minimum: 1, maximum: 16, description: New limit of running transfers. }
