            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cluster-roles:
    get:
      operationId: listClusterRoles
      summary: List built-in cluster roles
      description: The four built-in cluster roles and what each allows. Static, not paginated.
      tags: [Roles]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Cluster roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterRoleInfoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /roles:
    get:
      operationId: listRoles
      summary: List roles
      description: PostgreSQL roles (users and groups) with their membership and cluster roles, ordered by name.
      tags: [Roles]
      x-required-role: kingres_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: canLogin
          in: query
          description: Return only roles with (true) or without (false) the LOGIN attribute.
          schema: { type: boolean }
        - name: search
          in: query
          description: Case-insensitive substring of the role name.
          schema: { type: string, maxLength: 63 }
      responses:
        '200':
          description: A page of roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePage' }
              examples:
                one:
                  value:
                    items:
                      - { name: alice, canLogin: true, isSuperuser: false, canCreateDatabase: false, canCreateRole: false, connectionLimit: -1, validUntil: null, memberOf: [app_readers], clusterRoles: [kingres_admin] }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createRole
      summary: Create a role
      description: |
        Creates a PostgreSQL role on every shard group. The password is propagated as a verifier, never as plaintext.
        Optional `memberOf` and `clusterRoles` are applied in the same operation.
      tags: [Roles]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreateRequest' }
            examples:
              user: { value: { name: bob, password: correct-horse-battery, canLogin: true, clusterRoles: [kingres_readonly] } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /roles/{roleName}:
    parameters:
      - $ref: '#/components/parameters/RoleName'
    get:
      operationId: getRole
      summary: Get a role
      description: One role with its membership and cluster roles.
      tags: [Roles]
      x-required-role: kingres_admin
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateRole
      summary: Update a role
      description: |
        Changes password, expiry, LOGIN attribute (disable or enable), connection limit and creation
        privileges. A role cannot disable itself, and the last `kingres_admin` cannot be disabled (409).
      tags: [Roles]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdateRequest' }
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteRole
      summary: Drop a role
      description: |
        Drops the role on every shard group. Returns 409 when the role owns objects, or is the last
        `kingres_admin`, or is the caller.
      tags: [Roles]
      x-required-role: kingres_admin
      responses:
        '204': { description: Dropped. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /roles/{roleName}/memberships:
    parameters:
      - $ref: '#/components/parameters/RoleName'
    put:
      operationId: setRoleMemberships
      summary: Replace the role membership
      description: |
        Sets the complete list of ordinary roles this role is a member of (`GRANT parent TO role`,
        `REVOKE` for the others). Built-in cluster roles are not set here; use `PUT /roles/{roleName}/cluster-roles`.
      tags: [Roles]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleMembershipsRequest' }
            examples:
              two: { value: { memberOf: [app_readers, app_writers] } }
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /roles/{roleName}/cluster-roles:
    parameters:
      - $ref: '#/components/parameters/RoleName'
    put:
      operationId: setRoleClusterRoles
      summary: Replace the cluster roles of a role
      description: |
        Sets the complete list of built-in cluster roles (`kingres_admin`, `kingres_ops`,
        `kingres_readonly`, `kingres_stats`) the role is a member of. An empty list removes panel access.
        The last `kingres_admin` cannot be removed (409).
      tags: [Roles]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleClusterRolesRequest' }
            examples:
              ops: { value: { clusterRoles: [kingres_ops] } }
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /grants:
    get:
      operationId: listGrants
      summary: List grants
      description: Privileges granted at database, schema or table level, filtered by grantee and object.
      tags: [Grants]
      x-required-role: kingres_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: grantee
          in: query
          description: Return only grants to this role.
          schema: { type: string }
        - name: database
          in: query
          description: Return only grants in this database.
          schema: { type: string }
        - name: level
          in: query
          description: Return only grants at this level.
          schema: { $ref: '#/components/schemas/GrantLevel' }
        - name: schema
          in: query
          description: Return only grants on this schema or on tables in it.
          schema: { type: string }
        - name: table
          in: query
          description: Return only grants on this table (requires `schema`).
          schema: { type: string }
      responses:
        '200':
          description: A page of grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantPage' }
              examples:
                one:
                  value:
                    items:
                      - { grantee: bob, level: table, database: shop, schema: public, table: orders, privileges: [select] }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createGrant
      summary: Grant privileges
      description: |
        Issues `GRANT` on every shard group for the object named by `level`. Privileges must be valid for the
        level (see `Privilege`). `update`, `delete` and `truncate` on an append-only ledger table are rejected
        with 422. Returns the resulting grant entry.
      tags: [Grants]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantRequest' }
            examples:
              table-select: { value: { grantee: bob, level: table, database: shop, schema: public, table: orders, privileges: [select] } }
      responses:
        '200':
          description: The grant after the operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /grants/revocations:
    post:
      operationId: revokeGrants
      summary: Revoke privileges
      description: Issues `REVOKE` on every shard group for the object named by `level`. Revoking a privilege that is not held is not an error.
      tags: [Grants]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantRequest' }
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /grants/template-applications:
    post:
      operationId: applyGrantTemplate
      summary: Apply a grant template
      description: |
        Applies one of three templates to a role on a database. `readOnly` grants CONNECT, USAGE on all
        schemas and SELECT on all current and future tables. `readWrite` adds INSERT, UPDATE and DELETE
        (not on append-only ledger tables). `owner` makes the role the database owner.
      tags: [Grants]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantTemplateRequest' }
            examples:
              readonly: { value: { template: readOnly, grantee: bob, database: shop } }
      responses:
        '204': { description: Template applied. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /settings/network-access:
    get:
      operationId: getNetworkAccess
      summary: Get network access rules
      description: The ordered client network rules (pg_hba style) and whether each server has applied the current revision.
      tags: [Network access]
      x-required-role: kingres_admin
      responses:
        '200':
          description: Network access configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAccess' }
              examples:
                default:
                  value:
                    revision: 7
                    tlsRequired: true
                    rules:
                      - { type: hostssl, databases: [all], users: [all], address: 10.0.0.0/24, method: scram-sha-256, comment: Internal clients }
                    applyStatus:
                      - { serverId: 10.0.0.11, appliedRevision: 7, error: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: replaceNetworkAccess
      summary: Replace network access rules
      description: |
        Replaces the complete ordered rule list and applies it on every server (a reload of `pg_hba.conf`).
        `revision` must equal the current revision, otherwise 409 (optimistic concurrency). Node-to-node
        rules for cluster members are added by the system and cannot be removed. A rule set that would lock
        out the caller's own address is rejected with 422. Returns a task that finishes when all servers applied it.
      tags: [Network access]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkAccessUpdateRequest' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /audit:
    get:
      operationId: listAuditEvents
      summary: List audit events
      description: Append-only log of sign-ins and every administrative action through the panel, CLI or REST API, newest first.
      tags: [Audit]
      x-required-role: kingres_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: actor
          in: query
          description: Return only events by this role name.
          schema: { type: string }
        - name: action
          in: query
          description: Return only events with this action (the `operationId` of the audited operation or one of the non-operation events, see `AuditAction`), for example `createDatabase`.
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: outcome
          in: query
          description: Return only events with this outcome.
          schema: { $ref: '#/components/schemas/AuditOutcome' }
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
              examples:
                one:
                  value:
                    items:
                      - id: 90412
                        timestamp: '2026-11-14T09:58:00Z'
                        actor: alice
                        actorAddress: 10.0.0.50
                        source: panel
                        action: createDatabase
                        resourceType: database
                        resourceId: shop
                        outcome: success
                        taskId: 117
                        requestId: 0b6c1a2e
                        details: { sharding: true }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /settings/cluster:
    get:
      operationId: getClusterSettings
      summary: Get cluster settings
      description: Auto-failover, default replica count and durability, rebalance concurrency and feature flags.
      tags: [Settings]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Cluster settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterSettings' }
              examples:
                defaults:
                  value:
                    defaultReplicaCount: 1
                    defaultDurability: sync
                    autoFailover: { enabled: true, timeoutSeconds: 120, maxCount: 1, eventsSinceReset: 0 }
                    rebalance: { maxConcurrentMoves: 4 }
                    features: { sharding: true, ledger: true }
                    restart: { required: false, serverIds: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateClusterSettings
      summary: Update cluster settings
      description: |
        Partial update; omitted properties are unchanged and nested objects are merged. Changing
        `defaultReplicaCount` makes a rebalance necessary (shown in `GET /cluster`). Feature flags can be
        turned on but never off; the first enable of a feature needs a restart of every server (reported in
        `restart`), because the extensions load through `shared_preload_libraries`.
      tags: [Settings]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterSettingsUpdateRequest' }
            examples:
              failover: { value: { autoFailover: { enabled: true, timeoutSeconds: 60, maxCount: 2 } } }
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ledger/status:
    get:
      operationId: listLedgerStatus
      summary: List ledger status of all databases
      description: Ledger status of every database whose ledger mode is not `off`. Not paginated.
      tags: [Ledger]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Ledger status per database.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerStatusList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}/ledger:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    get:
      operationId: getLedgerStatus
      summary: Get ledger status of a database
      description: |
        Latest block height and hash, last verified block and verification state, per chain. A sharded
        database has one chain per shard group; a non-sharded database has one chain.
      tags: [Ledger]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Ledger status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerStatus' }
              examples:
                sharded:
                  value:
                    databaseName: shop
                    mode: optIn
                    digestIntervalSeconds: 3600
                    verificationState: passed
                    lastVerifiedAt: '2026-11-14T06:00:00Z'
                    ledgerTableCount: 3
                    chains:
                      - { shardGroupId: 1, latestBlockHeight: 4210, latestBlockHash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, latestBlockAt: '2026-11-14T09:59:00Z', lastVerifiedBlockHeight: 4200, verificationState: passed }
                      - { shardGroupId: 2, latestBlockHeight: 3980, latestBlockHash: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752, latestBlockAt: '2026-11-14T09:59:30Z', lastVerifiedBlockHeight: 3980, verificationState: passed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}/ledger/blocks:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    get:
      operationId: listLedgerBlocks
      summary: List ledger blocks
      description: Block headers of one chain, newest first (highest height first).
      tags: [Ledger]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: shardGroupId
          in: query
          description: Chain to list. Required for a sharded database; defaults to the only chain otherwise.
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: A page of blocks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerBlockPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}/ledger/digests:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    get:
      operationId: listLedgerDigests
      summary: List digests
      description: Generated digests with the anchoring state of each, newest first.
      tags: [Ledger]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of digests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerDigestPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: generateLedgerDigest
      summary: Generate a digest
      description: |
        Closes the open block on every chain of the database (`kingres.ledger_generate_digest()`) and
        returns the new digest, which is the hash of the latest block of each chain. Synchronous.
      tags: [Ledger]
      x-required-role: kingres_ops
      responses:
        '201':
          description: The new digest.
          headers:
            Location:
              description: URL of the digest list; the new digest is the first item.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerDigest' }
              examples:
                single:
                  value:
                    id: 311
                    databaseName: shop
                    generatedAt: '2026-11-14T10:00:00Z'
                    generatedBy: alice
                    hashVersion: 1
                    chains:
                      - { shardGroupId: 1, blockHeight: 4211, blockHash: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae }
                    aggregateHash: null
                    anchors: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}/ledger/verifications:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    get:
      operationId: listLedgerVerifications
      summary: List verification runs
      description: Past and running ledger verifications, newest first.
      tags: [Ledger]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of verification runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerVerificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: startLedgerVerification
      summary: Start a ledger verification
      description: |
        Starts `kingres.ledger_verify` as a task: recomputes block, Merkle and row hashes and compares
        them with a digest. The task's `subject` is the verification (`type` is `ledgerVerification`).
        Returns 409 when a verification of this database is already running.
      tags: [Ledger]
      x-required-role: kingres_ops
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LedgerVerifyRequest' }
            examples:
              incremental: { value: { scope: sinceLastVerified } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}/ledger/verifications/{verificationId}:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - name: verificationId
        in: path
        required: true
        description: Verification run identifier.
        schema: { type: integer, format: int64 }
    get:
      operationId: getLedgerVerification
      summary: Get a verification run
      description: Result of one verification including every inconsistency found.
      tags: [Ledger]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The verification run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerVerification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}/ledger/inclusion-proofs:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    post:
      operationId: createInclusionProof
      summary: Create an inclusion proof for a row
      description: |
        Computes (`kingres.ledger_inclusion_proof`) the Merkle path from a row to its block header and, for
        a sharded database, from that header to the aggregate digest. Uses POST because the primary key is
        a structured value and the proof is computed on demand; nothing is stored.
      tags: [Ledger]
      x-required-role: kingres_readonly
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InclusionProofRequest' }
            examples:
              account: { value: { schema: public, table: accounts, primaryKey: { id: 42 } } }
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InclusionProof' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /query:
    post:
      operationId: executeQuery
      summary: Execute a SQL statement
      description: |
        Runs one SQL statement against a database as the signed-in PostgreSQL role (so PostgreSQL
        privileges apply) through the client router. The result is cut at `rowLimit` rows and aborted after
        `timeoutMs`. Statements that fail return 422 with code `sql_error` and the SQLSTATE in `sqlState`.
        Every execution is written to the audit log. Multiple statements per request are not allowed.
      tags: [Query]
      x-required-role: kingres_readonly
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
            examples:
              select: { value: { database: shop, sql: 'SELECT id, owner FROM accounts ORDER BY id', rowLimit: 100, timeoutMs: 5000 } }
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryResult' }
              examples:
                select:
                  value:
                    columns:
                      - { name: id, type: int8 }
                      - { name: owner, type: text }
                    rows: [[1, alice], [2, bob]]
                    rowCount: 2
                    truncated: false
                    commandTag: SELECT 2
                    durationMs: 3.4
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts
      description: Alerts raised by the manager, newest first.
      tags: [Alerts]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          description: Return only alerts in this state.
          schema: { $ref: '#/components/schemas/AlertState' }
        - name: severity
          in: query
          description: Return only alerts with this severity.
          schema: { $ref: '#/components/schemas/AlertSeverity' }
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
              examples:
                one:
                  value:
                    items:
                      - { id: 55, kind: replicationLagHigh, severity: warning, state: open, title: Replication lag is high, message: Standby on server 10.0.0.12 is 120 MB behind., serverId: 10.0.0.12, databaseName: null, raisedAt: '2026-11-14T09:50:00Z', acknowledgedAt: null, acknowledgedBy: null, resolvedAt: null }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /alerts/{alertId}/acknowledgement:
    parameters:
      - name: alertId
        in: path
        required: true
        description: Alert identifier.
        schema: { type: integer, format: int64 }
    put:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      description: Marks an open alert acknowledged by the caller. Idempotent for an already acknowledged alert; 409 for a resolved one.
      tags: [Alerts]
      x-required-role: kingres_ops
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /logs:
    get:
      operationId: listLogs
      summary: Search cluster logs
      description: Log entries from every server, newest first. For one server only, filter by `serverId` or use `/this-server/logs`.
      tags: [Logs]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/SearchText'
        - name: serverId
          in: query
          description: Return only entries of this server.
          schema: { $ref: '#/components/schemas/ServerId' }
      responses:
        '200':
          description: A page of log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
              examples:
                one:
                  value:
                    items:
                      - { timestamp: '2026-11-14T09:59:58Z', level: warning, component: manager, serverId: 10.0.0.11, instanceId: null, message: heartbeat from server 10.0.0.12 is late }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /metrics/query:
    get:
      operationId: queryMetrics
      summary: Query a metric time series
      description: |
        Returns one or more series of a named metric for dashboard charts, resampled to `step` seconds.
        Without a filter the cluster aggregate is returned (sum for counters and sizes, average for
        percentages). With `serverId` or `databaseName` the series is restricted; with `groupBy` one series per
        server or database is returned. At most 5000 points per series (422 otherwise).
      tags: [Metrics]
      x-required-role: kingres_stats
      parameters:
        - name: metric
          in: query
          required: true
          description: Metric name.
          schema: { $ref: '#/components/schemas/MetricName' }
        - name: from
          in: query
          required: true
          description: Start of the range (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the range (exclusive); must be after `from`.
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: true
          description: Resolution in seconds.
          schema: { type: integer, minimum: 1, maximum: 86400 }
        - name: serverId
          in: query
          description: Restrict to one server.
          schema: { $ref: '#/components/schemas/ServerId' }
        - name: databaseName
          in: query
          description: Restrict to one database (only database-scoped metrics).
          schema: { type: string }
        - name: groupBy
          in: query
          description: Return one series per server or per database.
          schema: { type: string, enum: [server, database] }
      responses:
        '200':
          description: The series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricQueryResult' }
              examples:
                cpu:
                  value:
                    metric: cpuUsagePercent
                    unit: percent
                    from: '2026-11-14T09:00:00Z'
                    to: '2026-11-14T09:02:00Z'
                    step: 60
                    series:
                      - labels: { serverId: 10.0.0.11 }
                        points:
                          - { timestamp: '2026-11-14T09:00:00Z', value: 17.2 }
                          - { timestamp: '2026-11-14T09:01:00Z', value: 18.9 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kingres_session
      description: |
        Session cookie set by `POST /auth/login` (HttpOnly, Secure, SameSite=Strict). Browsers must also send
        the `csrfToken` returned by login (and repeated unchanged by `GET /auth/session`) in the `X-CSRF-Token`
        header on every POST, PUT, PATCH and DELETE request. Requests that authenticate with a bearer token
        need no CSRF header.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque bearer token for `kingres-cli` and scripts, obtained with `POST /auth/login` and
        `issueToken` set to true. Sent as `Authorization: Bearer <token>`.
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: |
        One-time setup token written to a root-readable file at install time. Valid only while the node is
        `uninitialized`; consumed by a successful `init-cluster` or `join-cluster`. It can be verified without
        being consumed with `POST /setup/token-check`.

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor taken from `nextCursor` of the previous page. Omit for the first page.
      schema: { type: string, maxLength: 1024 }
    From:
      name: from
      in: query
      description: Return only entries at or after this time.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Return only entries before this time.
      schema: { type: string, format: date-time }
    SearchText:
      name: q
      in: query
      description: Case-insensitive substring to search for in the message.
      schema: { type: string, maxLength: 200 }
    LogLevel:
      name: level
      in: query
      description: Return only entries at this level or more severe.
      schema: { $ref: '#/components/schemas/LogLevel' }
    LogComponent:
      name: component
      in: query
      description: Return only entries of this component.
      schema: { $ref: '#/components/schemas/LogComponent' }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task identifier.
      schema: { type: integer, format: int64 }
    ServerId:
      name: serverId
      in: path
      required: true
      description: Server identifier, an opaque string (the host of the server's instances, see `ServerId`). Percent-encode it in the path, for example an IPv6 host.
      schema: { $ref: '#/components/schemas/ServerId' }
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: Instance identifier (the node id of the instance in the cluster catalog).
      schema: { type: integer, format: int32 }
    ServerGroupName:
      name: serverGroupName
      in: path
      required: true
      description: Server group name.
      schema: { type: string }
    DatabaseName:
      name: databaseName
      in: path
      required: true
      description: Database name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    SchemaName:
      name: schemaName
      in: path
      required: true
      description: Schema name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    TableName:
      name: tableName
      in: path
      required: true
      description: Table name.
      schema: { type: string, minLength: 1, maxLength: 63 }
    ColocationId:
      name: colocationId
      in: path
      required: true
      description: Colocation group identifier.
      schema: { type: integer, format: int32 }
    RoleName:
      name: roleName
      in: path
      required: true
      description: Role name.
      schema: { type: string, minLength: 1, maxLength: 63 }

  responses:
    BadRequest:
      description: The request is malformed (invalid JSON, wrong type, unknown parameter) or violates a schema constraint.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validation:
              value:
                type: https://kingresdb.dev/problems/validation-failed
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: /api/v1/databases
                code: validation_failed
                errors:
                  - { field: /sharding/bucketCount, message: must be between 1 and 4096, code: out_of_range }
    Unauthorized:
      description: Not signed in, session expired, or wrong credentials (or a wrong setup token).
      headers:
        WWW-Authenticate:
          description: Authentication scheme hint.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthenticated:
              value:
                type: https://kingresdb.dev/problems/unauthenticated
                title: Authentication required
                status: 401
                detail: No valid session or token was presented.
                instance: /api/v1/cluster
                code: unauthenticated
    Forbidden:
      description: |
        The caller is authenticated but lacks the cluster role named by `x-required-role`, or the CSRF token is
        missing or wrong. For the setup-token operations: the request did not come from a permitted address.
        While `localhostOnly` is true (the server listens on loopback addresses only) the permitted addresses are the
        loopback addresses `127.0.0.0/8` and `::1`; otherwise every address is permitted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            role:
              value:
                type: https://kingresdb.dev/problems/forbidden
                title: Forbidden
                status: 403
                detail: This operation requires the kingres_admin cluster role.
                instance: /api/v1/roles
                code: forbidden
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            database:
              value:
                type: https://kingresdb.dev/problems/not-found
                title: Not found
                status: 404
                detail: Database "shop" does not exist.
                instance: /api/v1/databases/shop
                code: not_found
    Conflict:
      description: The request conflicts with the current state (already exists, operation in progress, immutable field, optimistic lock failure).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            rebalance:
              value:
                type: https://kingresdb.dev/problems/rebalance-in-progress
                title: Rebalance in progress
                status: 409
                detail: A rebalance is already running (task 118).
                instance: /api/v1/rebalance
                code: rebalance_in_progress
    UnprocessableEntity:
      description: |
        The request is well-formed but cannot be carried out: semantic validation (`unprocessable`), a
        precondition on the node or cluster state (`node_state_invalid`), a SQL error (`sql_error`), or the
        server version does not support the operation yet (`unsupported_operation`). Every authenticated
        operation can answer `unsupported_operation` once authentication, CSRF and role checks have passed;
        clients treat it as "not available in this version", not as a user error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            sql:
              value:
                type: https://kingresdb.dev/problems/sql-error
                title: SQL error
                status: 422
                detail: relation "accountz" does not exist
                instance: /api/v1/query
                code: sql_error
                sqlState: 42P01
            unsupported:
              value:
                type: https://kingresdb.dev/problems/unsupported-operation
                title: Operation not supported
                status: 422
                detail: Operation removeServer is not supported by this server version yet.
                instance: /api/v1/servers/10.0.0.13
                code: unsupported_operation
    ServiceUnavailable:
      description: |
        The server cannot serve the request now: the node is uninitialized, the map group is failing over
        (DDL and topology changes are paused), the manager leader is unreachable, quorum is lost, or the
        server is shutting down.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            mapGroup:
              value:
                type: https://kingresdb.dev/problems/map-group-unavailable
                title: Map group unavailable
                status: 503
                detail: The map group is failing over. Topology changes are paused.
                instance: /api/v1/rebalance
                code: map_group_unavailable
    MethodNotAllowed:
      description: |
        The path exists but not for this HTTP method (for example `DELETE /servers`). A transport-level
        response that applies to every path and is answered before authentication, so it carries no
        authentication requirement. It is defined once here and listed on every operation only so that
        generated clients know it; it is not an outcome of the operation itself. `Allow` lists the methods
        the path supports.
      headers:
        Allow:
          description: Comma-separated methods the path supports, for example `GET, POST`.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            wrongMethod:
              value:
                type: https://kingresdb.dev/problems/method-not-allowed
                title: Method not allowed
                status: 405
                detail: DELETE is not supported on /api/v1/servers.
                instance: /api/v1/servers
                code: method_not_allowed
    TooManyRequests:
      description: Too many requests from this client to a rate-limited unauthenticated endpoint (health, login, setup).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AcceptedTask:
      description: |
        The operation was accepted and runs as a durable task. Poll `GET /tasks/{taskId}` (the `Location`
        header) until `state` is `done` or `failed`. Exception: the setup operations (`initCluster`,
        `joinCluster`) are polled through `GET /setup/state` (`setupTask`), because the caller has no session yet.
      headers:
        Location:
          description: URL of the task, `/api/v1/tasks/{taskId}`.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Task' }
          examples:
            createDatabase:
              value:
                id: 117
                kind: database.create
                state: running
                progress:
                  percent: 33.3
                  currentStep: Create database on group 2
                  steps:
                    - { name: Create database on group 1, state: done, detail: null, itemsDone: 1, itemsTotal: 1, startedAt: '2026-11-14T09:58:00Z', finishedAt: '2026-11-14T09:58:02Z' }
                    - { name: Create database on group 2, state: running, detail: null, itemsDone: 0, itemsTotal: 1, startedAt: '2026-11-14T09:58:02Z', finishedAt: null }
                    - { name: Install extensions, state: pending, detail: null, itemsDone: null, itemsTotal: null, startedAt: null, finishedAt: null }
                error: null
                subject: { type: database, id: shop }
                cancellable: true
                createdAt: '2026-11-14T09:58:00Z'
                updatedAt: '2026-11-14T09:58:02Z'
                createdBy: alice

  schemas:
    # ------------------------------------------------------------------ errors
    ProblemCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, not on `title` or `detail`.
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - invalid_credentials
        - session_expired
        - csrf_token_invalid
        - forbidden
        - setup_token_invalid
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - immutable_field
        - rebalance_in_progress
        - operation_in_progress
        - task_not_cancellable
        - last_admin
        - role_in_use
        - optimistic_lock_failed
        - no_replica_available
        - quorum_unavailable
        - unprocessable
        - sql_error
        - unsupported_operation
        - node_state_invalid
        - node_uninitialized
        - map_group_unavailable
        - leader_unavailable
        - rate_limited
        - service_unavailable
        - internal_error
    ValidationIssue:
      type: object
      description: One invalid field of a request.
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid property of the request body, or the name of the invalid query or path parameter.
        message:
          type: string
          description: Human-readable explanation.
        code:
          type: string
          description: Short machine-readable reason, for example `required`, `out_of_range`, `pattern`, `unknown_value`.
    Problem:
      type: object
      description: RFC 9457 problem details, served as `application/problem+json`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI that identifies the problem type. `about:blank` when no more specific type exists.
        title:
          type: string
          description: Short, human-readable summary that does not change between occurrences.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference of the request that caused the problem.
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
          description: Value of the `X-Request-Id` response header, for log correlation.
        errors:
          type: array
          description: Field-level problems; present for `validation_failed`.
          items: { $ref: '#/components/schemas/ValidationIssue' }
        sqlState:
          type: string
          pattern: '^[0-9A-Z]{5}$'
          description: PostgreSQL SQLSTATE; present when `code` is `sql_error`.
        sqlPosition:
          type: integer
          minimum: 1
          description: 1-based character position of the error in the statement; present for some `sql_error` problems.

    # ------------------------------------------------------------------ health and auth
    HealthStatus:
      type: object
      description: Liveness result.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`.
    ReadinessStatus:
      type: object
      description: Readiness result.
      required: [status, nodeState, checks]
      properties:
        status:
          type: string
          enum: [ready]
          description: Always `ready`; a server that is not ready answers 503 instead.
        nodeState:
          $ref: '#/components/schemas/NodeState'
        checks:
          type: array
          description: Individual readiness checks.
          items:
            type: object
            description: One readiness check.
            required: [name, ok]
            properties:
              name:
                type: string
                description: Check name, for example `localPostgres` or `managerReachable`.
              ok:
                type: boolean
                description: Whether the check passed.
              detail:
                type: string
                description: Explanation when the check failed.
    ClusterRoleName:
      type: string
      description: A built-in cluster role.
      enum: [kingres_admin, kingres_ops, kingres_readonly, kingres_stats]
    LoginRequest:
      type: object
      description: Credentials of a PostgreSQL role.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 63
          description: PostgreSQL role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
          description: Role password.
        issueToken:
          type: boolean
          default: false
          description: Also return a bearer token in the response (for the CLI).
    Session:
      type: object
      description: The signed-in user, the session and the identity of the cluster.
      required: [username, clusterRoles, expiresAt, clusterId, clusterName]
      properties:
        username:
          type: string
          description: Signed-in PostgreSQL role.
        clusterRoles:
          type: array
          description: Built-in cluster roles the user is a member of.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
        expiresAt:
          type: string
          format: date-time
          description: When the session or token expires (absolute).
        csrfToken:
          type:
            - string
            - 'null'
          description: |
            CSRF token to send as `X-CSRF-Token` with cookie authentication; null for bearer authentication.
            It is fixed for the lifetime of the session: `login` issues it and `GET /auth/session` returns the
            same value; nothing rotates it.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server that issued the session; null when that server is not part of a cluster.
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Identifier of the cluster; null when the server is not part of a cluster. Present for every role, so the shell can render for an account that only has `kingres_stats`.
        clusterName:
          type:
            - string
            - 'null'
          description: Display name of the cluster; null when the server is not part of a cluster.
        token:
          type:
            - string
            - 'null'
          description: Bearer token; only present in the login response when `issueToken` was true.

    # ------------------------------------------------------------------ setup
    NodeState:
      type: string
      description: Lifecycle state of a server.
      enum: [uninitialized, standalone, clustered]
    ServerId:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Identifier of a server. A server is a machine, defined as one distinct `host` value of the
        `kingres.node` catalog table; its id is that host string exactly as stored there (a DNS name or an
        IPv4/IPv6 address, IPv6 without brackets). The id is opaque to clients: compare it for equality, never
        parse or sort it numerically. It is a string so that the backend can later switch to a registered
        server id without changing the contract. Percent-encode it when it is used in a URL path.
      examples: ['10.0.0.11', db1.example.com]
    SetupTaskSummary:
      type: object
      description: |
        Summary of the task started by `initCluster` or `joinCluster`, served by `GET /setup/state` so that the
        wizard needs neither the setup token nor a session to follow it. It is the same task that
        `GET /tasks/{taskId}` returns after sign-in.
      required: [id, kind, state, progressPercent, steps, createdAt, updatedAt, error]
      properties:
        id:
          type: integer
          format: int64
          description: Task identifier.
        steps:
          type: array
          description: The ordered steps of the task with their state, so that the wizard can show where a failure happened.
          items:
            type: object
            description: One step.
            required: [name, state]
            properties:
              name:
                type: string
                description: Human-readable step name (English).
              state:
                type: string
                enum: [pending, running, done, failed]
                description: State of the step.
        createdAt:
          type: string
          format: date-time
          description: When the setup request was accepted.
        updatedAt:
          type: string
          format: date-time
          description: When the task last changed state or progress.
        kind:
          type: string
          enum: [cluster.init, cluster.join]
          description: Which setup operation started the task.
        state:
          $ref: '#/components/schemas/TaskState'
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress (`Task.progress.percent`).
        error:
          oneOf:
            - $ref: '#/components/schemas/TaskError'
            - type: 'null'
          description: Failure information; null unless `state` is `failed`.
    NodeStateInfo:
      type: object
      description: Setup state of a server.
      required: [state, address, hostname, version, postgresVersion, setupTokenRequired, localhostOnly, setupTask]
      properties:
        state:
          $ref: '#/components/schemas/NodeState'
        address:
          type: string
          description: Address (host:port) of this server's panel and REST API.
        hostname:
          type: string
          description: Host name of the machine.
        version:
          type: string
          description: KingresDB version.
        postgresVersion:
          type: string
          description: Version of the bundled PostgreSQL.
        setupTokenRequired:
          type: boolean
          description: True while the node is uninitialized and `X-Setup-Token` is needed for setup calls.
        localhostOnly:
          type: boolean
          description: True while the panel listens only on localhost (until the setup token is used).
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server identifier once the server belongs to a cluster; null before.
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier once the server belongs to a cluster; null before.
        setupTask:
          oneOf:
            - $ref: '#/components/schemas/SetupTaskSummary'
            - type: 'null'
          description: |
            Summary of the setup task. Null while no `initCluster` or `joinCluster` request was accepted; set
            from acceptance on, and kept after the task finished and after the node left `uninitialized`.
    NodeAddress:
      type: string
      description: Address of a server's panel and REST API as host:port, host being a DNS name, IPv4 or bracketed IPv6 address and port a number from 1 to 65535.
      pattern: '^(\[[0-9a-fA-F:]+\]|[A-Za-z0-9.-]+):([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
      examples: ['10.0.0.11:8091']
    DataPaths:
      type: object
      description: Directories used by this server.
      required: [dataDirectory]
      properties:
        dataDirectory:
          type: string
          description: Absolute path under which instance data directories are created. Immutable after initialization.
        walDirectory:
          type:
            - string
            - 'null'
          description: Absolute path for WAL files; null means inside the data directory.
        logDirectory:
          type:
            - string
            - 'null'
          description: Absolute path for log files; null means the system default.
    MemoryQuota:
      type: object
      description: Memory budget of this server.
      required: [totalMegabytes]
      properties:
        totalMegabytes:
          type: integer
          minimum: 512
          description: Total memory in MiB that KingresDB may use on this server; divided among its instances.
    FeatureFlags:
      type: object
      description: Optional engine features. Each can be turned on, never off again.
      required: [sharding, ledger]
      properties:
        sharding:
          type: boolean
          description: The `kingres_shard` extension is enabled.
        ledger:
          type: boolean
          description: The `kingres_ledger` extension is enabled.
    AdminAccount:
      type: object
      description: The first administrator account (a PostgreSQL role in `kingres_admin`).
      required: [username, password]
      properties:
        username:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: Password, at least 12 characters.
    AdminCredentials:
      type: object
      description: Credentials of an existing cluster administrator.
      required: [username, password]
      properties:
        username:
          type: string
          description: Role name in `kingres_admin`.
        password:
          type: string
          format: password
          writeOnly: true
          description: Role password.
    InitClusterRequest:
      type: object
      description: Settings for creating a new cluster on this server.
      required: [clusterName, admin, dataPaths, memoryQuota]
      properties:
        clusterName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'
          description: Display name of the cluster.
        admin:
          $ref: '#/components/schemas/AdminAccount'
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        features:
          $ref: '#/components/schemas/FeatureFlags'
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          default: 1
          description: Default number of standby copies of every shard group.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
    JoinClusterRequest:
      type: object
      description: Settings for joining this server to an existing cluster.
      required: [existingNodeAddress, admin, dataPaths]
      properties:
        existingNodeAddress:
          $ref: '#/components/schemas/NodeAddress'
        admin:
          $ref: '#/components/schemas/AdminCredentials'
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group (rack or zone) to place this server in.
        advertiseAddress:
          oneOf:
            - $ref: '#/components/schemas/NodeAddress'
            - type: 'null'
          description: Address other servers use to reach this one, if different from its listen address.

    # ------------------------------------------------------------------ this server
    ServiceName:
      type: string
      description: A process role inside `kingresd` or a bundled component.
      enum: [api, agent, manager, router, etcd, patroni, metrics]
    ServiceStatus:
      type: object
      description: Status of one service of this server.
      required: [name, state]
      properties:
        name:
          $ref: '#/components/schemas/ServiceName'
        state:
          type: string
          enum: [running, stopped, degraded, disabled]
          description: Service state.
        since:
          type: string
          format: date-time
          description: When the service entered this state.
        detail:
          type: string
          description: Explanation for `degraded` or `stopped`.
    LocalServerInfo:
      type: object
      description: Node-local summary of the server that served the request.
      required: [serverId, address, hostname, version, postgresVersion, nodeState, clusterId, uptimeSeconds, isManagerLeader, services]
      properties:
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server identifier; null unless clustered.
        address:
          type: string
          description: Address (host:port) of this server's REST API.
        hostname:
          type: string
          description: Host name.
        version:
          type: string
          description: KingresDB version.
        postgresVersion:
          type:
            - string
            - 'null'
          description: PostgreSQL version of the managed instance; null when no instance is running.
        nodeState:
          $ref: '#/components/schemas/NodeState'
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null unless clustered.
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds since `kingresd` started.
        isManagerLeader:
          type: boolean
          description: Whether this server currently runs the active manager.
        services:
          type: array
          description: Status of the local services.
          items: { $ref: '#/components/schemas/ServiceStatus' }
    CpuUsage:
      type: object
      description: CPU usage. A value the server cannot measure is null ("not available"), never 0.
      required: [cores, usagePercent]
      properties:
        cores:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Number of logical CPUs; null when not available.
        usagePercent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: Average utilization over the last sampling interval; null when not available.
        loadAverage1m:
          type:
            - number
            - 'null'
          minimum: 0
          description: One-minute load average; null when not available.
    MemoryUsage:
      type: object
      description: Memory usage. A value the server cannot measure is null ("not available"), never 0.
      required: [totalBytes, usedBytes]
      properties:
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Physical memory; null when not available.
        usedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Memory in use; null when not available.
        quotaBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Configured memory quota for KingresDB; null when not available.
    DiskUsage:
      type: object
      description: Usage of one filesystem. A value the server cannot measure is null ("not available"), never 0.
      required: [path, purpose, totalBytes, usedBytes]
      properties:
        path:
          type: string
          description: Mount point or directory.
        purpose:
          type: string
          enum: [data, wal, log, other]
          description: What KingresDB stores there.
        totalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Capacity; null when not available.
        usedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Used space; null when not available.
    ServerResources:
      type: object
      description: Disk, memory and CPU of a server.
      required: [cpu, memory, disks, sampledAt]
      properties:
        cpu:
          $ref: '#/components/schemas/CpuUsage'
        memory:
          $ref: '#/components/schemas/MemoryUsage'
        disks:
          type: array
          description: Filesystems used by KingresDB.
          items: { $ref: '#/components/schemas/DiskUsage' }
        sampledAt:
          type: string
          format: date-time
          description: When the values were sampled.
    InstanceRole:
      type: string
      description: Role of an instance in its shard group.
      enum: [primary, standby]
    Instance:
      type: object
      description: One PostgreSQL instance on a server. It is the primary or a standby of exactly one shard group.
      required: [id, serverId, shardGroupId, isMapGroup, role, state, port]
      properties:
        id:
          type: integer
          format: int32
          description: Instance identifier, equal to `node_id` in `kingres.node`.
        serverId:
          $ref: '#/components/schemas/ServerId'
        shardGroupId:
          type: integer
          format: int32
          minimum: 0
          description: Shard group the instance belongs to, equal to `group_id` in `kingres.node`. The map group has id 0.
        isMapGroup:
          type: boolean
          description: Whether the shard group is the map group (holds the cluster catalog).
        role:
          $ref: '#/components/schemas/InstanceRole'
        state:
          type: string
          enum: [running, starting, stopping, stopped, restarting, failed]
          description: Process state.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: PostgreSQL port of the instance.
        dataDirectory:
          type: string
          description: Data directory of the instance.
        version:
          type: string
          description: PostgreSQL version.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Size of the data directory; null when not available.
        upstreamInstanceId:
          type:
            - integer
            - 'null'
          format: int32
          description: For a standby, the instance it replicates from.
        replicationLagBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: For a standby, WAL bytes behind the primary; null for a primary.
        replicationLagSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: For a standby, replay lag in seconds; null for a primary.
    InstanceList:
      type: object
      description: Instances of a server.
      required: [items]
      properties:
        items:
          type: array
          description: The instances.
          items: { $ref: '#/components/schemas/Instance' }
    InstanceActionRequest:
      type: object
      description: Options of an instance stop or restart.
      properties:
        force:
          type: boolean
          default: false
          description: Proceed even when the instance holds the only up-to-date copy of a shard group.
    LogLevel:
      type: string
      description: Log severity.
      enum: [debug, info, warning, error]
    LogComponent:
      type: string
      description: Source of a log entry.
      enum: [api, agent, manager, router, etcd, patroni, postgres, metrics]
    LocalSettings:
      type: object
      description: Settings of this server only.
      required: [dataPaths, memoryQuota, logLevel, clientPorts, restartRequired]
      properties:
        dataPaths:
          $ref: '#/components/schemas/DataPaths'
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        clientPorts:
          type: object
          description: Client ports of the router on this server.
          required: [readWritePort]
          properties:
            readWritePort:
              type: integer
              minimum: 1
              maximum: 65535
              description: Read-write client port.
            readOnlyPort:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 65535
              description: Optional read-only client port; null when disabled.
        restartRequired:
          type: boolean
          description: True when a saved change needs a restart of this server's instances to take effect.
    LocalSettingsUpdate:
      type: object
      description: Partial update of local settings.
      minProperties: 1
      properties:
        memoryQuota:
          $ref: '#/components/schemas/MemoryQuota'
        logLevel:
          $ref: '#/components/schemas/LogLevel'
        logDirectory:
          type:
            - string
            - 'null'
          description: Absolute log directory; null for the system default.
    LeaveClusterRequest:
      type: object
      description: Options of leaving the cluster.
      properties:
        force:
          type: boolean
          default: false
          description: Leave even if the rest of the cluster cannot be reached.
    LogEntry:
      type: object
      description: One log line.
      required: [timestamp, level, component, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the entry was written.
        level:
          $ref: '#/components/schemas/LogLevel'
        component:
          $ref: '#/components/schemas/LogComponent'
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server that wrote the entry.
        instanceId:
          type:
            - integer
            - 'null'
          format: int32
          description: Instance that wrote the entry, for `postgres` and `patroni`.
        message:
          type: string
          description: Log message.
    LogPage:
      type: object
      description: A page of log entries.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Entries, newest first.
          items: { $ref: '#/components/schemas/LogEntry' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    NextCursor:
      type:
        - string
        - 'null'
      description: Cursor for the next page; null when this is the last page.

    # ------------------------------------------------------------------ cluster
    ClusterHealth:
      type: string
      description: Overall health.
      enum: [healthy, degraded, critical]
    ServerStatus:
      type: string
      description: |
        `live` healthy; `suspect` heartbeats are late; `draining` being emptied before removal;
        `decommissioning` rebalance away from it is running; `dead` no liveness for the failure timeout;
        `pendingRebalance` joined but holds no data yet.
      enum: [live, suspect, draining, decommissioning, dead, pendingRebalance]
    ServerCounts:
      type: object
      description: Number of servers per status.
      required: [total, live, suspect, draining, decommissioning, dead, pendingRebalance]
      properties:
        total:
          type: integer
          minimum: 0
          description: All servers.
        live:
          type: integer
          minimum: 0
          description: Servers with status `live`.
        suspect:
          type: integer
          minimum: 0
          description: Servers with status `suspect`.
        draining:
          type: integer
          minimum: 0
          description: Servers with status `draining`.
        decommissioning:
          type: integer
          minimum: 0
          description: Servers with status `decommissioning`.
        dead:
          type: integer
          minimum: 0
          description: Servers with status `dead`.
        pendingRebalance:
          type: integer
          minimum: 0
          description: Servers with status `pendingRebalance`.
    BucketCounts:
      type: object
      description: Bucket totals over all colocation groups.
      required: [total, underReplicated, unavailable, moving, orphan]
      properties:
        total:
          type: integer
          minimum: 0
          description: All buckets.
        underReplicated:
          type: integer
          minimum: 0
          description: Buckets with fewer live copies than the replica count.
        unavailable:
          type: integer
          minimum: 0
          description: Buckets with no live primary.
        moving:
          type: integer
          minimum: 0
          description: Buckets in state `moving`.
        orphan:
          type: integer
          minimum: 0
          description: Buckets in state `orphan` (left-over shards awaiting cleanup).
    RebalanceReason:
      type: string
      description: Why a rebalance is needed.
      enum: [serverAdded, serverRemoved, replicaCountChanged, replicasMissing, skewed, serverGroupChanged]
    ClusterSummary:
      type: object
      description: Short cluster summary for statistics-only accounts. Null means "not available".
      required: [clusterId, name, health, serverCount, databaseCount, openAlerts]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null when the node state carries no cluster identity.
        name:
          type:
            - string
            - 'null'
          description: Cluster name; null when the node state carries no cluster identity.
        health:
          $ref: '#/components/schemas/ClusterHealth'
        serverCount:
          type: integer
          minimum: 0
          description: Number of servers.
        databaseCount:
          type: integer
          minimum: 0
          description: Number of user databases.
        openAlerts:
          type: integer
          minimum: 0
          description: Number of open alerts; 0 when the alert system is not available.
    ClusterOverview:
      type: object
      description: Cluster-wide health summary.
      required: [clusterId, name, health, version, mapVersion, mapGroupAvailable, managerLeader, servers, buckets, databaseCount, rebalance, autoFailover, openAlerts, features, updatedAt]
      properties:
        clusterId:
          type:
            - string
            - 'null'
          format: uuid
          description: Cluster identifier; null when the node state carries no cluster identity.
        name:
          type:
            - string
            - 'null'
          description: Cluster name; null when the node state carries no cluster identity.
        health:
          $ref: '#/components/schemas/ClusterHealth'
        version:
          type: string
          description: KingresDB version of the cluster.
        mapVersion:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic version of the bucket map.
        mapGroupAvailable:
          type: boolean
          description: False while the map group is failing over; topology changes are paused.
        managerLeader:
          oneOf:
            - type: object
              description: The elected manager.
              required: [serverId, address]
              properties:
                serverId:
                  $ref: '#/components/schemas/ServerId'
                address:
                  type: string
                  description: Address of that server.
                since:
                  type: string
                  format: date-time
                  description: When it became leader.
            - type: 'null'
          description: The manager leader; null while an election is in progress.
        servers:
          $ref: '#/components/schemas/ServerCounts'
        buckets:
          $ref: '#/components/schemas/BucketCounts'
        databaseCount:
          type: integer
          minimum: 0
          description: Number of user databases.
        rebalance:
          type: object
          description: Rebalance summary.
          required: [needed, reasons, running, taskId]
          properties:
            needed:
              type: boolean
              description: Whether the current placement differs from the target placement.
            reasons:
              type: array
              description: Reasons a rebalance is needed.
              items: { $ref: '#/components/schemas/RebalanceReason' }
            running:
              type: boolean
              description: Whether a rebalance is running.
            taskId:
              type:
                - integer
                - 'null'
              format: int64
              description: Task of the running rebalance.
        autoFailover:
          type: object
          description: Auto-failover summary.
          required: [enabled, eventsSinceReset, maxCount]
          properties:
            enabled:
              type: boolean
              description: Whether auto-failover is enabled.
            eventsSinceReset:
              type: integer
              minimum: 0
              description: Automatic failovers since the last reset (a rebalance resets it).
            maxCount:
              type: integer
              minimum: 1
              description: Maximum automatic failovers before manual intervention is required.
        openAlerts:
          type: object
          description: Number of open alerts per severity.
          required: [critical, warning, info]
          properties:
            critical:
              type: integer
              minimum: 0
              description: Open critical alerts.
            warning:
              type: integer
              minimum: 0
              description: Open warning alerts.
            info:
              type: integer
              minimum: 0
              description: Open info alerts.
        features:
          $ref: '#/components/schemas/FeatureFlags'
        updatedAt:
          type: string
          format: date-time
          description: When this summary was computed.

    # ------------------------------------------------------------------ servers
    ServerResourceSummary:
      type: object
      description: Compact resource usage of a server. A value the server cannot measure is null ("not available"), never 0.
      required: [cpuUsagePercent, memoryUsedBytes, memoryTotalBytes, diskUsedBytes, diskTotalBytes]
      properties:
        cpuUsagePercent:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          description: CPU utilization; null when not available.
        memoryUsedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Memory in use; null when not available.
        memoryTotalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Physical memory; null when not available.
        diskUsedBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Used space on the data filesystem; null when not available.
        diskTotalBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Capacity of the data filesystem; null when not available.
    BucketHolding:
      type: object
      description: Number of buckets held as primary and as replica.
      required: [primary, replica]
      properties:
        primary:
          type: integer
          minimum: 0
          description: Buckets for which this server hosts the primary copy.
        replica:
          type: integer
          minimum: 0
          description: Buckets for which this server hosts a replica copy.
    Server:
      type: object
      description: A machine in the cluster, defined as one distinct host of the `kingres.node` catalog. Values the backend does not know yet are null ("not available"), never invented zeros.
      required: [id, address, hostname, status, serverGroup, shouldHaveShards, isManagerLeader, version, uptimeSeconds, joinedAt, lastHeartbeatAt, instances, buckets, sizeBytes, resources]
      properties:
        id:
          $ref: '#/components/schemas/ServerId'
        address:
          type: string
          description: Address (host:port) of the server's REST API.
        hostname:
          type: string
          description: Host name.
        status:
          $ref: '#/components/schemas/ServerStatus'
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group (rack or zone) name.
        shouldHaveShards:
          type: boolean
          description: Whether rebalance may place buckets on this server; false drains it.
        isManagerLeader:
          type: boolean
          description: Whether the active manager runs here.
        version:
          type:
            - string
            - 'null'
          description: KingresDB version of that server; null when the server cannot know it (a remote server whose version has not been reported).
        uptimeSeconds:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Seconds since `kingresd` started; null when not available (the server's agent is not reachable).
        joinedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the server joined the cluster; null when not available.
        lastHeartbeatAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Last heartbeat seen by the manager; null when not available.
        instances:
          type: array
          description: Instances on this server with role, shard group, port and lag.
          items: { $ref: '#/components/schemas/Instance' }
        buckets:
          $ref: '#/components/schemas/BucketHolding'
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Data size on this server; null when not available.
        replicationLagMaxSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: Largest replay lag of any standby on this server.
        resources:
          $ref: '#/components/schemas/ServerResourceSummary'
    DatabaseBucketCount:
      type: object
      description: Buckets of one database held by a server.
      required: [databaseName, primaryBuckets, replicaBuckets, primarySizeBytes, replicaSizeBytes]
      properties:
        databaseName:
          type: string
          description: Database name.
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets with their primary copy on the server.
        replicaBuckets:
          type: integer
          minimum: 0
          description: Buckets with a replica copy on the server.
        primarySizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of primary copies; null when bucket sizes are not available.
        replicaSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of replica copies; null when bucket sizes are not available.
    ServerDetail:
      description: A server with its bucket counts per database.
      allOf:
        - $ref: '#/components/schemas/Server'
        - type: object
          required: [bucketsByDatabase]
          properties:
            bucketsByDatabase:
              type: array
              description: Bucket counts per database.
              items: { $ref: '#/components/schemas/DatabaseBucketCount' }
    ServerList:
      type: object
      description: All servers.
      required: [items]
      properties:
        items:
          type: array
          description: The servers.
          items: { $ref: '#/components/schemas/Server' }
    AddServerRequest:
      type: object
      description: A server to add.
      required: [address, setupToken]
      properties:
        address:
          $ref: '#/components/schemas/NodeAddress'
        setupToken:
          type: string
          writeOnly: true
          minLength: 1
          description: The new server's one-time setup token.
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group to place the server in.
    ServerUpdateRequest:
      type: object
      description: Partial update of a server.
      minProperties: 1
      properties:
        serverGroup:
          type:
            - string
            - 'null'
          description: Server group name; null removes the server from its group. The group must exist.
        shouldHaveShards:
          type: boolean
          description: False excludes the server from bucket placement at the next rebalance.
    FailoverRequest:
      type: object
      description: Failover options.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [hard, graceful]
          description: '`graceful` waits for standbys to catch up (server must be live); `hard` promotes immediately and can lose async writes.'
    ServerGroup:
      type: object
      description: A rack or zone.
      required: [name, serverIds]
      properties:
        name:
          type: string
          description: Group name.
        description:
          type: string
          description: Free text.
        serverIds:
          type: array
          description: Member servers.
          items: { $ref: '#/components/schemas/ServerId' }
    ServerGroupCreateRequest:
      type: object
      description: A new server group.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$'
          description: Unique name.
        description:
          type: string
          maxLength: 200
          description: Free text.
    ServerGroupList:
      type: object
      description: All server groups.
      required: [items]
      properties:
        items:
          type: array
          description: The groups.
          items: { $ref: '#/components/schemas/ServerGroup' }

    # ------------------------------------------------------------------ databases
    Durability:
      type: string
      description: |
        Commit durability. `async` maps to `synchronous_commit = local` (a commit waits only for the
        local flush), `sync` to `on` (it waits until a quorum of synchronous standbys has flushed the
        commit to disk), and `syncApply` to `remote_apply` (it also waits until those standbys have
        applied it, so a read on them sees the commit).
      enum: [async, sync, syncApply]
      default: sync
    LedgerMode:
      type: string
      description: |
        `off` no ledger; `optIn` tables choose ledger individually; `appendOnly` or `updatable` make every
        new table a ledger table of that type.
      enum: [off, optIn, appendOnly, updatable]
    DatabaseStatus:
      type: string
      description: Lifecycle status of a database.
      enum: [creating, ready, dropping, failed]
    DatabaseGeneral:
      type: object
      description: General settings as read back. Per-database settings the backend cannot determine yet are null ("not available").
      required: [owner, encoding, lcCollate, lcCtype, connectionLimit]
      properties:
        owner:
          type:
            - string
            - 'null'
          description: Owner role. Can be changed later. Null when not available.
        encoding:
          type:
            - string
            - 'null'
          description: Character set encoding, for example `UTF8`. Immutable after creation. Null when not available.
          x-immutable: true
        lcCollate:
          type:
            - string
            - 'null'
          description: Collation locale. Immutable after creation. Null when not available.
          x-immutable: true
        lcCtype:
          type:
            - string
            - 'null'
          description: Character classification locale. Immutable after creation. Null when not available.
          x-immutable: true
        connectionLimit:
          type:
            - integer
            - 'null'
          minimum: -1
          description: Maximum concurrent connections; -1 is unlimited. Can be changed later. Null when not available.
    DatabaseGeneralCreate:
      type: object
      description: General settings for a new database; omitted fields take server defaults.
      properties:
        owner:
          type: string
          description: Owner role; defaults to the caller.
        encoding:
          type: string
          default: UTF8
          description: Character set encoding.
        lcCollate:
          type: string
          description: Collation locale; defaults to the cluster default.
        lcCtype:
          type: string
          description: Character classification locale; defaults to the cluster default.
        connectionLimit:
          type: integer
          minimum: -1
          default: -1
          description: Maximum concurrent connections; -1 is unlimited.
    ShardingSettings:
      type: object
      description: Sharding settings as read back (response only; the create request uses `ShardingCreateSettings`).
      required: [enabled, bucketCount]
      properties:
        enabled:
          type: boolean
          description: Whether tables of this database can be distributed. Can be turned on later, never off.
        bucketCount:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 4096
          description: Number of hash buckets per colocation group. Fixed at creation (immutable). Null when not available.
          x-immutable: true
    ShardingCreateSettings:
      type: object
      description: Sharding settings of a create request. A group that is present must be complete.
      required: [enabled, bucketCount]
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether tables of this database can be distributed. Can be turned on later, never off.
        bucketCount:
          type: integer
          minimum: 1
          maximum: 4096
          default: 128
          description: Number of hash buckets per colocation group, 1 to 4096, default 128. Fixed at creation (immutable).
          x-immutable: true
    ReplicationSettings:
      type: object
      description: Replication settings as read back (response only; the create request uses `ReplicationCreateSettings`).
      required: [durability, replicaCount]
      properties:
        durability:
          oneOf:
            - $ref: '#/components/schemas/Durability'
            - type: 'null'
          description: Commit durability of the database; null when not available.
        replicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Current cluster-wide replica count, shown for information. It is a cluster setting (physical
            replication copies whole instances); change it with PATCH /settings/cluster. It does not exist
            in any request schema.
    ReplicationCreateSettings:
      type: object
      description: Replication settings of a create request. The replica count is a cluster setting and cannot be given here.
      required: [durability]
      properties:
        durability:
          $ref: '#/components/schemas/Durability'
    LedgerSettings:
      type: object
      description: Ledger settings as read back (response only; the create request uses `LedgerCreateSettings`).
      required: [mode, digestIntervalSeconds]
      properties:
        mode:
          oneOf:
            - $ref: '#/components/schemas/LedgerMode'
            - type: 'null'
          description: Ledger mode; null when not available.
        digestIntervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 60
          maximum: 86400
          description: How often a block is closed and a digest generated automatically; null when not available.
    LedgerCreateSettings:
      type: object
      description: Ledger settings of a create request. A group that is present must be complete.
      required: [mode, digestIntervalSeconds]
      properties:
        mode:
          $ref: '#/components/schemas/LedgerMode'
        digestIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: How often a block is closed and a digest generated automatically.
    DatabaseStats:
      type: object
      description: Live statistics of a database. A statistic the backend cannot measure is null ("not available"), never 0.
      required: [sizeBytes, tableCount, activeConnections, transactionsPerSecond]
      properties:
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Total size over all shard groups (primary copies); null when not available.
        tableCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of user tables; null when not available.
        activeConnections:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Current connections; null when not available.
        transactionsPerSecond:
          type:
            - number
            - 'null'
          minimum: 0
          description: Committed transactions per second (recent average); null when not available.
    DatabaseHealth:
      type: object
      description: Replication health of a database. Null counters mean "not available" (no bucket map yet), never 0.
      required: [underReplicatedBuckets, unavailableBuckets]
      properties:
        underReplicatedBuckets:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Buckets with fewer live copies than the replica count; null when not available.
        unavailableBuckets:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Buckets with no live primary; null when not available.
    LedgerVerificationState:
      type: string
      description: '`never` not verified yet; `running` a verification is in progress; `passed` the last verification found nothing; `failed` the last verification found inconsistencies.'
      enum: [never, running, passed, failed]
    Database:
      type: object
      description: A database with its four settings groups and live statistics.
      required: [name, status, general, sharding, replication, ledger, stats, health, ledgerSummary, rebalanceRequired, createdBy, createdAt]
      properties:
        name:
          type: string
          description: Database name. Immutable.
          x-immutable: true
        status:
          $ref: '#/components/schemas/DatabaseStatus'
        general:
          $ref: '#/components/schemas/DatabaseGeneral'
        sharding:
          $ref: '#/components/schemas/ShardingSettings'
        replication:
          $ref: '#/components/schemas/ReplicationSettings'
        ledger:
          $ref: '#/components/schemas/LedgerSettings'
        stats:
          $ref: '#/components/schemas/DatabaseStats'
        health:
          $ref: '#/components/schemas/DatabaseHealth'
        ledgerSummary:
          type: object
          description: Ledger status summary.
          required: [verificationState, lastVerifiedBlockHeight]
          properties:
            verificationState:
              oneOf:
                - $ref: '#/components/schemas/LedgerVerificationState'
                - type: 'null'
              description: Verification state; null when not available (as opposed to `never`, which means the database was never verified).
            lastVerifiedBlockHeight:
              type:
                - integer
                - 'null'
              format: int64
              description: Highest verified block height (minimum over chains); null if never verified.
        rebalanceRequired:
          type: boolean
          description: Whether this database's buckets need rebalancing.
        createdBy:
          type:
            - string
            - 'null'
          description: Role that created the database; null when not recorded (databases created outside the control plane).
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Creation time; null when not recorded (databases created outside the control plane).
    DatabaseList:
      type: object
      description: All databases.
      required: [items]
      properties:
        items:
          type: array
          description: The databases.
          items: { $ref: '#/components/schemas/Database' }
    DatabaseCreateRequest:
      type: object
      description: A new database. A settings group that is present must be complete; an omitted group takes cluster defaults.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Database name; lower-case letters, digits and underscore.
        general:
          $ref: '#/components/schemas/DatabaseGeneralCreate'
        sharding:
          $ref: '#/components/schemas/ShardingCreateSettings'
        replication:
          $ref: '#/components/schemas/ReplicationCreateSettings'
        ledger:
          $ref: '#/components/schemas/LedgerCreateSettings'
    DatabaseUpdateRequest:
      type: object
      description: Partial update of the mutable settings. Immutable fields are not accepted.
      minProperties: 1
      properties:
        general:
          type: object
          description: Mutable general settings.
          minProperties: 1
          properties:
            owner:
              type: string
              description: New owner role.
            connectionLimit:
              type: integer
              minimum: -1
              description: New connection limit; -1 is unlimited.
        sharding:
          type: object
          description: Sharding changes.
          required: [enabled]
          properties:
            enabled:
              type: boolean
              enum: [true]
              description: Turn sharding on. Turning it off is not possible.
        replication:
          type: object
          description: Replication changes.
          required: [durability]
          properties:
            durability:
              $ref: '#/components/schemas/Durability'
        ledger:
          type: object
          description: Ledger changes. The mode can be raised from `off` and switched between `appendOnly` and `updatable` for new tables, but never set back to `off`.
          minProperties: 1
          properties:
            mode:
              $ref: '#/components/schemas/LedgerMode'
            digestIntervalSeconds:
              type: integer
              minimum: 60
              maximum: 86400
              description: New digest interval.
    IntegerRange:
      type: object
      description: A default value and its allowed range.
      required: [default, minimum, maximum]
      properties:
        default:
          type: integer
          description: Default value.
        minimum:
          type: integer
          description: Smallest allowed value.
        maximum:
          type: integer
          description: Largest allowed value.
    DatabaseCreateOptions:
      type: object
      description: What the create-database dialog offers.
      required: [encodings, collations, bucketCount, replicaCount, defaultDurability, ledgerDigestIntervalSeconds]
      properties:
        encodings:
          type: array
          description: Valid values of `general.encoding`.
          items:
            type: object
            description: One encoding.
            required: [name, isDefault]
            properties:
              name:
                type: string
                description: Encoding name as accepted by `general.encoding`, for example `UTF8`.
              isDefault:
                type: boolean
                description: Whether it is used when `general.encoding` is omitted.
        collations:
          type: array
          description: Valid values of `general.lcCollate` and `general.lcCtype` (the same list serves both).
          items:
            type: object
            description: One locale.
            required: [name, encodings, isDefault]
            properties:
              name:
                type: string
                description: Locale name, for example `en_US.UTF-8` or `C`.
              encodings:
                type:
                  - array
                  - 'null'
                description: Encodings the locale can be combined with. `null` means every encoding; an empty array means none (the locale is listed but cannot be combined with any encoding the server offers).
                items: { type: string }
              isDefault:
                type: boolean
                description: Whether it is used when the field is omitted.
        bucketCount:
          description: Bucket count of a sharded database; default 128, range 1 to 4096.
          $ref: '#/components/schemas/IntegerRange'
        replicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: Current cluster-wide replica count (cluster setting, shown for information).
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        ledgerDigestIntervalSeconds:
          description: Automatic digest interval of the ledger; default 3600, range 60 to 86400.
          $ref: '#/components/schemas/IntegerRange'

    # ------------------------------------------------------------------ tables
    TableClass:
      type: string
      description: |
        A table has one or more classes. `plain` is a normal table on its home shard group; `distributed` is
        hash-distributed over buckets; `reference` is copied to every shard group; `ledger` has a tamper-evident
        ledger. A table can be `distributed` and `ledger` (or `reference` and `ledger`) at the same time;
        `plain` is never combined with `distributed` or `reference`.
      enum: [plain, distributed, reference, ledger]
    TableDistribution:
      type: object
      description: How a distributed or reference table is spread over shard groups.
      required: [method, column, colocationId, bucketCount]
      properties:
        method:
          type: string
          enum: [hash, reference]
          description: '`hash` distributes rows by hash of the column; `reference` copies the table to every group.'
        column:
          type:
            - string
            - 'null'
          description: Distribution column; null for reference tables.
        colocationId:
          type: integer
          format: int32
          description: Colocation group of the table.
        bucketCount:
          type: integer
          minimum: 1
          description: Bucket count of the colocation group.
    TableLedger:
      type: object
      description: Ledger properties of a table.
      required: [mode, historyTable]
      properties:
        mode:
          type: string
          enum: [appendOnly, updatable]
          description: '`appendOnly` allows INSERT only; `updatable` keeps a history table of changed rows.'
        historyTable:
          type:
            - string
            - 'null'
          description: Name of the history table in the same schema; null for `appendOnly`.
    Table:
      type: object
      description: A table with its distribution and ledger properties.
      required: [schema, name, classes, distribution, ledger, homeShardGroupId, estimatedRows, sizeBytes]
      properties:
        schema:
          type: string
          description: Schema name.
        name:
          type: string
          description: Table name.
        classes:
          type: array
          description: Classes of the table (see `TableClass`).
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/TableClass' }
        distribution:
          oneOf:
            - $ref: '#/components/schemas/TableDistribution'
            - type: 'null'
          description: Distribution; null for a plain table.
        ledger:
          oneOf:
            - $ref: '#/components/schemas/TableLedger'
            - type: 'null'
          description: Ledger properties; null when the table is not a ledger table. Cannot be removed once set.
        homeShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Shard group (`group_id`; 0 is the map group, the default home) holding a plain table; null for distributed and reference tables.
        estimatedRows:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Estimated row count over all shards; null when not available.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Table size over all shards (primary copies); null when not available.
    DistributionBlockedReason:
      type: string
      description: |
        Why a column cannot be the distribution column. When several reasons apply the first of this list wins:
        `shardingDisabled` sharding is not enabled on the database; `tableNotPlain` the table is already
        distributed or a reference table; `unsupportedType` the column type cannot be hashed by the engine;
        `notInUniqueKey` the table has at least one primary or unique key that does not contain this column
        (PostgreSQL requires the partition key in every unique index; the keys are listed in
        `TableColumn.blockingKeys`). A table without any unique key never has this reason.
      enum: [shardingDisabled, tableNotPlain, unsupportedType, notInUniqueKey]
    TableColumn:
      type: object
      description: One column of a table.
      required: [name, type, nullable, canBeDistributionColumn, distributionBlockedReason, blockingKeys]
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          description: The text of PostgreSQL `format_type(atttypid, atttypmod)`, for example `bigint`, `character varying(20)` or `numeric(12,2)`. For display only; clients must not parse it.
        blockingKeys:
          type: array
          description: Names of the primary and unique keys (index names) that do not contain this column. Non-empty exactly when `distributionBlockedReason` is `notInUniqueKey`.
          items: { type: string }
        nullable:
          type: boolean
          description: True when the column has no NOT NULL constraint.
        canBeDistributionColumn:
          type: boolean
          description: Whether `PUT .../distribution` accepts this column as `distributionColumn` now.
        distributionBlockedReason:
          oneOf:
            - $ref: '#/components/schemas/DistributionBlockedReason'
            - type: 'null'
          description: Why the column cannot be the distribution column; null when `canBeDistributionColumn` is true.
    TableDetail:
      description: A table with its columns.
      allOf:
        - $ref: '#/components/schemas/Table'
        - type: object
          required: [columns]
          properties:
            columns:
              type: array
              description: Columns in ordinal position order.
              items: { $ref: '#/components/schemas/TableColumn' }
    TablePage:
      type: object
      description: A page of tables.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The tables.
          items: { $ref: '#/components/schemas/Table' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    TableRef:
      type: object
      description: A table reference.
      required: [schema, table]
      properties:
        schema:
          type: string
          description: Schema name.
        table:
          type: string
          description: Table name.
    EnableTableLedgerRequest:
      type: object
      description: How to put a table under ledger control.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [appendOnly, updatable]
          description: '`appendOnly` allows INSERT only; `updatable` also allows UPDATE and DELETE and keeps a history table.'
    DistributeTableRequest:
      type: object
      description: How to distribute a plain table.
      required: [method]
      properties:
        method:
          type: string
          enum: [hash, reference]
          description: Distribution method.
        distributionColumn:
          type: string
          description: Column to hash; required for `hash`, forbidden for `reference`.
        colocateWith:
          oneOf:
            - $ref: '#/components/schemas/TableRef'
            - type: 'null'
          description: Existing distributed table whose colocation group to join; null creates or reuses a group by column type.

    # ------------------------------------------------------------------ shards
    BucketState:
      type: string
      description: '`active` normal; `moving` being copied to another group; `orphan` left-over shard awaiting deferred cleanup.'
      enum: [active, moving, orphan]
    ColocationGroup:
      type: object
      description: Tables that share one bucket map.
      required: [colocationId, bucketCount, distributionColumnType, tableCount, sizeBytes]
      properties:
        colocationId:
          type: integer
          format: int32
          description: Colocation group identifier.
        bucketCount:
          type: integer
          minimum: 1
          description: Number of buckets.
        distributionColumnType:
          type: string
          description: PostgreSQL type of the distribution column.
        tableCount:
          type: integer
          minimum: 0
          description: Tables in the group.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Size of the group's data (primary copies); null when not available.
    ColocationGroupList:
      type: object
      description: Colocation groups of a database.
      required: [items]
      properties:
        items:
          type: array
          description: The groups.
          items: { $ref: '#/components/schemas/ColocationGroup' }
    Bucket:
      type: object
      description: One hash bucket of a colocation group.
      required: [bucket, shardGroupId, state, primaryServerId, replicaServerIds, sizeBytes, movingToShardGroupId]
      properties:
        bucket:
          type: integer
          minimum: 0
          description: Bucket number, `hash(key) % bucketCount`.
        shardGroupId:
          type: integer
          format: int32
          description: Shard group that owns the bucket.
        state:
          $ref: '#/components/schemas/BucketState'
        primaryServerId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Server currently hosting the owning group's primary; null if the group has no primary.
        replicaServerIds:
          type: array
          description: Servers hosting the owning group's standbys.
          items: { $ref: '#/components/schemas/ServerId' }
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of the bucket over all tables of the group; null when not available.
        movingToShardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Destination group while `state` is `moving`.
    BucketPage:
      type: object
      description: A page of the bucket map.
      required: [mapVersion, items, nextCursor]
      properties:
        mapVersion:
          type: integer
          format: int64
          description: Version of the bucket map the page was read from.
        items:
          type: array
          description: The buckets, ordered by number.
          items: { $ref: '#/components/schemas/Bucket' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    ServerBucketCount:
      type: object
      description: Buckets held by one server.
      required: [serverId, primaryBuckets, replicaBuckets, primarySizeBytes, replicaSizeBytes]
      properties:
        serverId:
          $ref: '#/components/schemas/ServerId'
        primaryBuckets:
          type: integer
          minimum: 0
          description: Buckets with their primary copy here.
        replicaBuckets:
          type: integer
          minimum: 0
          description: Buckets with a replica copy here.
        primarySizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of primary copies; null when bucket sizes are not available.
        replicaSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes of replica copies; null when bucket sizes are not available.
    BucketDistribution:
      type: object
      description: Bucket counts and sizes per server.
      required: [mapVersion, servers]
      properties:
        mapVersion:
          type: integer
          format: int64
          description: Version of the bucket map.
        servers:
          type: array
          description: One entry per server.
          items: { $ref: '#/components/schemas/ServerBucketCount' }

    # ------------------------------------------------------------------ replication
    ReplicationSyncState:
      type: string
      description: Synchronous state of a standby as in `pg_stat_replication.sync_state`.
      enum: [async, potential, sync, quorum]
    ReplicationMember:
      type: object
      description: One instance of a shard group in the replication topology.
      required: [instanceId, serverId, role, state, port, timeline, syncState, lagBytes, lagSeconds, isOnPreferredServer]
      properties:
        instanceId:
          type: integer
          format: int32
          description: Instance identifier.
        serverId:
          $ref: '#/components/schemas/ServerId'
        role:
          $ref: '#/components/schemas/InstanceRole'
        state:
          type: string
          enum: [running, starting, stopping, stopped, restarting, failed]
          description: Process state.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: PostgreSQL port.
        timeline:
          type: integer
          minimum: 1
          description: PostgreSQL timeline id.
        syncState:
          oneOf:
            - $ref: '#/components/schemas/ReplicationSyncState'
            - type: 'null'
          description: Synchronous state; null for a primary.
        lagBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: WAL bytes behind the primary; null for a primary.
        lagSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: Replay lag in seconds; null for a primary.
        isOnPreferredServer:
          type: boolean
          description: For a primary, whether it runs on the group's preferred (home) server.
    ReplicationSlot:
      type: object
      description: A replication slot on a primary.
      required: [name, type, active, instanceId, retainedWalBytes]
      properties:
        name:
          type: string
          description: Slot name.
        type:
          type: string
          enum: [physical, logical]
          description: Slot type; logical slots are used by bucket moves.
        active:
          type: boolean
          description: Whether a consumer is connected.
        instanceId:
          type: integer
          format: int32
          description: Instance that owns the slot.
        retainedWalBytes:
          type: integer
          format: int64
          minimum: 0
          description: WAL retained for the slot.
    ShardGroup:
      type: object
      description: A shard group (or the map group) with its replication state.
      required: [id, isMapGroup, preferredPrimaryServerId, health, primary, standbys, slots]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
          description: Shard group identifier, equal to `group_id` in `kingres.node`. The map group is group 0.
        isMapGroup:
          type: boolean
          description: Whether this is the map group (`group_id` 0).
        preferredPrimaryServerId:
          $ref: '#/components/schemas/ServerId'
        health:
          type: string
          enum: [healthy, degraded, unavailable]
          description: '`healthy` all standbys in sync; `degraded` a standby missing or lagging; `unavailable` no primary.'
        primary:
          oneOf:
            - $ref: '#/components/schemas/ReplicationMember'
            - type: 'null'
          description: Current primary; null while the group has none.
        standbys:
          type: array
          description: Standbys of the group.
          items: { $ref: '#/components/schemas/ReplicationMember' }
        slots:
          type: array
          description: Replication slots on the primary.
          items: { $ref: '#/components/schemas/ReplicationSlot' }
    ReplicationTopology:
      type: object
      description: Replication state of the whole cluster.
      required: [generatedAt, groups]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the topology was read.
        groups:
          type: array
          description: All shard groups including the map group.
          items: { $ref: '#/components/schemas/ShardGroup' }

    # ------------------------------------------------------------------ rebalance
    RebalanceOptions:
      type: object
      description: Options of a rebalance.
      properties:
        databases:
          type: array
          description: Restrict to these databases; omitted or empty means all.
          items: { type: string }
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          description: Concurrent bucket moves; defaults to the cluster setting (4 unless changed).
    RebalancePlanRequest:
      description: Options of a plan preview.
      allOf:
        - $ref: '#/components/schemas/RebalanceOptions'
        - type: object
          properties:
            moveLimit:
              type: integer
              minimum: 1
              maximum: 5000
              default: 200
              description: Maximum number of moves listed in the response.
    PlannedMove:
      type: object
      description: One bucket move of a plan.
      required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, estimatedSizeBytes, rank]
      properties:
        databaseName:
          type: string
          description: Database.
        colocationId:
          type: integer
          format: int32
          description: Colocation group.
        bucket:
          type: integer
          minimum: 0
          description: Bucket number.
        fromShardGroupId:
          type: integer
          format: int32
          description: Source shard group.
        toShardGroupId:
          type: integer
          format: int32
          description: Destination shard group.
        estimatedSizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Estimated bytes to copy; null when bucket sizes are not available.
        rank:
          type: integer
          minimum: 0
          maximum: 1000
          description: Priority from 0 to 1000; higher moves run earlier.
    RebalancePlan:
      type: object
      description: A rebalance plan preview.
      required: [needed, totals, truncated, moves, serverImpacts, warnings]
      properties:
        needed:
          type: boolean
          description: False when nothing would move.
        totals:
          type: object
          description: Totals over the full plan.
          required: [moveCount, totalBytes, estimatedDurationSeconds]
          properties:
            moveCount:
              type: integer
              minimum: 0
              description: Number of bucket moves.
            totalBytes:
              type:
                - integer
                - 'null'
              format: int64
              minimum: 0
              description: Bytes to copy; null when bucket sizes are not available.
            estimatedDurationSeconds:
              type:
                - integer
                - 'null'
              minimum: 0
              description: Rough duration estimate; null when not available.
        truncated:
          type: boolean
          description: True when `moves` is shorter than `totals.moveCount`.
        moves:
          type: array
          description: The first moves of the plan.
          items: { $ref: '#/components/schemas/PlannedMove' }
        serverImpacts:
          type: array
          description: Primary bucket count per server before and after the plan.
          items:
            type: object
            description: Effect of the plan on one server.
            required: [serverId, primaryBucketsBefore, primaryBucketsAfter]
            properties:
              serverId:
                $ref: '#/components/schemas/ServerId'
              primaryBucketsBefore:
                type: integer
                minimum: 0
                description: Primary buckets now.
              primaryBucketsAfter:
                type: integer
                minimum: 0
                description: Primary buckets after the plan.
        warnings:
          type: array
          description: Conditions the operator should know about, for example tables without a replica identity.
          items: { type: string }
    BucketMove:
      type: object
      description: A bucket move in flight.
      required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, phase, percent, sizeBytes]
      properties:
        databaseName:
          type: string
          description: Database.
        colocationId:
          type: integer
          format: int32
          description: Colocation group.
        bucket:
          type: integer
          minimum: 0
          description: Bucket number.
        fromShardGroupId:
          type: integer
          format: int32
          description: Source shard group.
        toShardGroupId:
          type: integer
          format: int32
          description: Destination shard group.
        phase:
          type: string
          enum: [prepare, copy, catchUp, switch, cleanup]
          description: Current phase of the move.
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Progress of the move.
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Bytes to move; null when bucket sizes are not available.
    RebalanceProgress:
      type: object
      description: Progress counters of a rebalance.
      required: [movesTotal, movesDone, movesInFlight, movesFailed, bytesMoved, percent]
      properties:
        movesTotal:
          type: integer
          minimum: 0
          description: Moves planned.
        movesDone:
          type: integer
          minimum: 0
          description: Moves completed.
        movesInFlight:
          type: integer
          minimum: 0
          description: Moves running now.
        movesFailed:
          type: integer
          minimum: 0
          description: Moves that failed.
        bytesMoved:
          type: integer
          format: int64
          minimum: 0
          description: Bytes copied so far.
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress.
    RebalanceStatus:
      type: object
      description: Current rebalance state.
      required: [state, needed, reasons, lastReport]
      properties:
        state:
          type: string
          enum: [idle, running, stopping, stopped, failed]
          description: '`idle` no rebalance in progress; `stopped` a stopped run that can be resumed.'
        needed:
          type: boolean
          description: Whether the placement differs from the target placement.
        reasons:
          type: array
          description: Why a rebalance is needed.
          items: { $ref: '#/components/schemas/RebalanceReason' }
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Task of the current or stopped run.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current run started.
        options:
          oneOf:
            - $ref: '#/components/schemas/RebalanceOptions'
            - type: 'null'
          description: Options of the current run.
        progress:
          oneOf:
            - $ref: '#/components/schemas/RebalanceProgress'
            - type: 'null'
          description: Progress of the current run; null while no run is active.
        inFlightMoves:
          type: array
          description: Moves running now.
          items: { $ref: '#/components/schemas/BucketMove' }
        lastReport:
          oneOf:
            - $ref: '#/components/schemas/RebalanceReportSummary'
            - type: 'null'
          description: Summary of the most recent finished, stopped or failed run, so the page can show what happened last while `progress` is null; null when no run has finished yet.
    RebalanceReportSummary:
      type: object
      description: Summary of one rebalance run.
      required: [id, outcome, startedAt, finishedAt, totals]
      properties:
        id:
          type: integer
          format: int64
          description: Report identifier; equals the identifier of the rebalance task.
        outcome:
          type: string
          enum: [completed, stopped, failed]
          description: How the run ended.
        startedAt:
          type: string
          format: date-time
          description: Start time.
        finishedAt:
          type: string
          format: date-time
          description: End time.
        options:
          $ref: '#/components/schemas/RebalanceOptions'
        totals:
          type: object
          description: Totals of the run.
          required: [movesTotal, movesDone, movesFailed, bytesMoved, durationSeconds]
          properties:
            movesTotal:
              type: integer
              minimum: 0
              description: Moves planned.
            movesDone:
              type: integer
              minimum: 0
              description: Moves completed.
            movesFailed:
              type: integer
              minimum: 0
              description: Moves failed.
            bytesMoved:
              type: integer
              format: int64
              minimum: 0
              description: Bytes copied.
            durationSeconds:
              type: integer
              minimum: 0
              description: Wall-clock duration.
    RebalanceReport:
      description: Full report of a rebalance run.
      allOf:
        - $ref: '#/components/schemas/RebalanceReportSummary'
        - type: object
          required: [moves]
          properties:
            moves:
              type: array
              description: Every move of the run.
              items:
                type: object
                description: Result of one move.
                required: [databaseName, colocationId, bucket, fromShardGroupId, toShardGroupId, outcome]
                properties:
                  databaseName:
                    type: string
                    description: Database.
                  colocationId:
                    type: integer
                    format: int32
                    description: Colocation group.
                  bucket:
                    type: integer
                    minimum: 0
                    description: Bucket number.
                  fromShardGroupId:
                    type: integer
                    format: int32
                    description: Source shard group.
                  toShardGroupId:
                    type: integer
                    format: int32
                    description: Destination shard group.
                  sizeBytes:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Bytes copied.
                  outcome:
                    type: string
                    enum: [done, failed, skipped]
                    description: Result of the move.
                  durationSeconds:
                    type: number
                    minimum: 0
                    description: Duration of the move.
                  error:
                    type:
                      - string
                      - 'null'
                    description: Error message for a failed move.
    RebalanceReportPage:
      type: object
      description: A page of rebalance report summaries.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Summaries, newest first.
          items: { $ref: '#/components/schemas/RebalanceReportSummary' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ tasks
    TaskState:
      type: string
      description: Task state machine state.
      enum: [pending, running, paused, failed, done]
    TaskKind:
      type: string
      description: |
        Kind of task. Each kind has one fixed `subject.type`; the table is in the README
        (section "Task kinds and subjects").
      enum:
        - cluster.init
        - cluster.join
        - server.add
        - server.remove
        - server.failover
        - server.leave
        - instance.start
        - instance.stop
        - instance.restart
        - database.create
        - database.update
        - database.drop
        - table.distribute
        - rebalance
        - replication.restorePreferredPrimaries
        - ledger.verify
        - networkAccess.apply
    TaskStep:
      type: object
      description: One step of a task.
      required: [name, state]
      properties:
        name:
          type: string
          description: Step name.
        state:
          type: string
          enum: [pending, running, done, failed, skipped]
          description: Step state.
        detail:
          type:
            - string
            - 'null'
          description: Extra information, for example the failing shard group.
        itemsDone:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Items completed, for example buckets moved.
        itemsTotal:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Items in total.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the step started.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the step ended.
    TaskProgress:
      type: object
      description: Progress of a task.
      required: [percent, steps]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress.
        currentStep:
          type:
            - string
            - 'null'
          description: Name of the running step.
        steps:
          type: array
          description: Per-step detail in execution order.
          items: { $ref: '#/components/schemas/TaskStep' }
    TaskError:
      type: object
      description: Why a task failed.
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable reason, for example `cancelled`, `step_failed`, `timeout`.
        message:
          type: string
          description: Human-readable explanation.
        step:
          type:
            - string
            - 'null'
          description: Step that failed.
        retryable:
          type: boolean
          description: Whether starting the same operation again may succeed.
    TaskSubject:
      type: object
      description: The resource a task works on.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [cluster, server, instance, database, table, rebalance, replication, ledgerVerification, networkAccess]
          description: Resource type.
        id:
          type: string
          description: |
            Resource identifier: database name; server id (`ServerId`); instance id (`node_id`) as a decimal
            string; `database/schema.table` for a table; the verification id; the task id for a rebalance;
            the literal `cluster`, `preferred-primaries` or `network-access` for the singleton subjects.
            See the README table "Task kinds and subjects".
    Task:
      type: object
      description: A durable long-running operation.
      required: [id, kind, state, progress, error, subject, cancellable, createdAt, updatedAt, createdBy]
      properties:
        id:
          type: integer
          format: int64
          description: Task identifier (`task_id` in `kingres.task`).
        kind:
          $ref: '#/components/schemas/TaskKind'
        state:
          $ref: '#/components/schemas/TaskState'
        progress:
          $ref: '#/components/schemas/TaskProgress'
        error:
          oneOf:
            - $ref: '#/components/schemas/TaskError'
            - type: 'null'
          description: Failure information; null unless `state` is `failed`.
        subject:
          oneOf:
            - $ref: '#/components/schemas/TaskSubject'
            - type: 'null'
          description: Resource the task works on.
        cancellable:
          type: boolean
          description: Whether `POST /tasks/{taskId}/cancel` is accepted now.
        createdAt:
          type: string
          format: date-time
          description: Creation time.
        updatedAt:
          type: string
          format: date-time
          description: Last state or progress change.
        createdBy:
          type: string
          description: Role that started the task, or `system` for automatic tasks such as auto-failover.
    TaskPage:
      type: object
      description: A page of tasks.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Tasks, newest first.
          items: { $ref: '#/components/schemas/Task' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ security
    ClusterRoleInfo:
      type: object
      description: A built-in cluster role.
      required: [name, description]
      properties:
        name:
          $ref: '#/components/schemas/ClusterRoleName'
        description:
          type: string
          description: What the role allows.
    ClusterRoleInfoList:
      type: object
      description: The built-in cluster roles.
      required: [items]
      properties:
        items:
          type: array
          description: The four roles.
          items: { $ref: '#/components/schemas/ClusterRoleInfo' }
    Role:
      type: object
      description: A PostgreSQL role.
      required: [name, canLogin, isSuperuser, canCreateDatabase, canCreateRole, connectionLimit, validUntil, memberOf, clusterRoles]
      properties:
        name:
          type: string
          description: Role name.
        canLogin:
          type: boolean
          description: LOGIN attribute; false means the account is disabled.
        isSuperuser:
          type: boolean
          description: SUPERUSER attribute (read-only; not changeable through the API).
        canCreateDatabase:
          type: boolean
          description: CREATEDB attribute.
        canCreateRole:
          type: boolean
          description: CREATEROLE attribute.
        connectionLimit:
          type: integer
          minimum: -1
          description: Connection limit; -1 is unlimited.
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: Password expiry; null for none.
        memberOf:
          type: array
          description: Ordinary roles this role is a member of (cluster roles excluded).
          items: { type: string }
        clusterRoles:
          type: array
          description: Built-in cluster roles this role is a member of.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
    RolePage:
      type: object
      description: A page of roles.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Roles ordered by name.
          items: { $ref: '#/components/schemas/Role' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    RoleCreateRequest:
      type: object
      description: A new role.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z_][a-z0-9_]{0,62}$'
          description: Role name.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: Initial password; required when `canLogin` is true.
        canLogin:
          type: boolean
          default: true
          description: LOGIN attribute.
        canCreateDatabase:
          type: boolean
          default: false
          description: CREATEDB attribute.
        canCreateRole:
          type: boolean
          default: false
          description: CREATEROLE attribute.
        connectionLimit:
          type: integer
          minimum: -1
          default: -1
          description: Connection limit; -1 is unlimited.
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: Password expiry.
        memberOf:
          type: array
          description: Ordinary roles to join.
          items: { type: string }
        clusterRoles:
          type: array
          description: Built-in cluster roles to join.
          items: { $ref: '#/components/schemas/ClusterRoleName' }
    RoleUpdateRequest:
      type: object
      description: Partial update of a role.
      minProperties: 1
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 1024
          description: New password.
        canLogin:
          type: boolean
          description: LOGIN attribute; false disables the account.
        canCreateDatabase:
          type: boolean
          description: CREATEDB attribute.
        canCreateRole:
          type: boolean
          description: CREATEROLE attribute.
        connectionLimit:
          type: integer
          minimum: -1
          description: Connection limit.
        validUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: Password expiry; null removes it.
    RoleMembershipsRequest:
      type: object
      description: The complete ordinary-role membership of a role.
      required: [memberOf]
      properties:
        memberOf:
          type: array
          description: Roles to be a member of; others are revoked.
          uniqueItems: true
          items: { type: string }
    RoleClusterRolesRequest:
      type: object
      description: The complete cluster-role membership of a role.
      required: [clusterRoles]
      properties:
        clusterRoles:
          type: array
          description: Cluster roles to be a member of; others are revoked.
          uniqueItems: true
          items: { $ref: '#/components/schemas/ClusterRoleName' }
    GrantLevel:
      type: string
      description: Object level of a grant.
      enum: [database, schema, table]
    Privilege:
      type: string
      description: |
        PostgreSQL privilege. Valid per level: database `connect`, `create`, `temporary`;
        schema `usage`, `create`; table `select`, `insert`, `update`, `delete`, `truncate`, `references`, `trigger`.
      enum: [connect, create, temporary, usage, select, insert, update, delete, truncate, references, trigger]
    Grant:
      type: object
      description: Privileges of a role on one object.
      required: [grantee, level, database, schema, table, privileges]
      properties:
        grantee:
          type: string
          description: Role holding the privileges.
        level:
          $ref: '#/components/schemas/GrantLevel'
        database:
          type: string
          description: Database.
        schema:
          type:
            - string
            - 'null'
          description: Schema; null at database level.
        table:
          type:
            - string
            - 'null'
          description: Table; null at database and schema level.
        privileges:
          type: array
          description: Privileges held.
          items: { $ref: '#/components/schemas/Privilege' }
    GrantPage:
      type: object
      description: A page of grants.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: The grants.
          items: { $ref: '#/components/schemas/Grant' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    GrantRequest:
      type: object
      description: Privileges to grant or revoke.
      required: [grantee, level, database, privileges]
      properties:
        grantee:
          type: string
          description: Role.
        level:
          $ref: '#/components/schemas/GrantLevel'
        database:
          type: string
          description: Database.
        schema:
          type: string
          description: Schema; required for levels `schema` and `table`.
        table:
          type: string
          description: Table; required for level `table`.
        privileges:
          type: array
          description: Privileges; must be valid for the level.
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Privilege' }
    GrantTemplateRequest:
      type: object
      description: A grant template to apply.
      required: [template, grantee, database]
      properties:
        template:
          type: string
          enum: [readOnly, readWrite, owner]
          description: Template name.
        grantee:
          type: string
          description: Role.
        database:
          type: string
          description: Database.
    NetworkAccessRule:
      type: object
      description: One pg_hba-style rule. Rules are evaluated in list order, first match wins.
      required: [type, databases, users, address, method]
      properties:
        type:
          type: string
          enum: [host, hostssl, hostnossl]
          description: Connection type.
        databases:
          type: array
          description: Database names, or `all`.
          minItems: 1
          items: { type: string }
        users:
          type: array
          description: Role names, or `all`.
          minItems: 1
          items: { type: string }
        address:
          type: string
          description: Client network in CIDR notation, or `all`.
        method:
          type: string
          enum: [scram-sha-256, cert, reject]
          description: Authentication method; `cert` requires a client certificate.
        comment:
          type:
            - string
            - 'null'
          description: Free text.
    NetworkAccess:
      type: object
      description: Network access configuration.
      required: [revision, tlsRequired, rules, applyStatus]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Revision of the rule set; incremented by every change.
        tlsRequired:
          type: boolean
          description: When true only `hostssl` and `cert` rules are accepted.
        rules:
          type: array
          description: Ordered rules.
          items: { $ref: '#/components/schemas/NetworkAccessRule' }
        applyStatus:
          type: array
          description: Per-server application of the current revision.
          items:
            type: object
            description: Application state on one server.
            required: [serverId, appliedRevision, error]
            properties:
              serverId:
                $ref: '#/components/schemas/ServerId'
              appliedRevision:
                type: integer
                format: int64
                description: Revision applied on that server.
              error:
                type:
                  - string
                  - 'null'
                description: Error from the last attempt, if any.
    NetworkAccessUpdateRequest:
      type: object
      description: The complete new rule set.
      required: [revision, tlsRequired, rules]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Revision the client based its change on.
        tlsRequired:
          type: boolean
          description: Require TLS for client connections.
        rules:
          type: array
          description: The complete ordered rule list.
          maxItems: 1000
          items: { $ref: '#/components/schemas/NetworkAccessRule' }
    AuditOutcome:
      type: string
      description: Result of an audited action.
      enum: [success, failure, denied]
    AuditAction:
      type: string
      description: |
        What happened. Either the `operationId` of the audited operation of this contract (for example
        `createDatabase`, `dropDatabase`, `login`, `executeQuery`), or one of the events that are not an
        operation: `loginFailed` (a sign-in attempt that was rejected, also for an unknown user), `setupTokenRejected`
        (a wrong setup token), `autoFailover` (a failover started by the manager, actor `system`). A denied
        or failed call of an operation is recorded under that operation's id with `outcome` `denied` or
        `failure`. Read-only operations are not audited except `executeQuery`.
      enum:
        - login
        - logout
        - loginFailed
        - setupTokenRejected
        - initCluster
        - joinCluster
        - updateThisServerSettings
        - restartThisServerInstance
        - stopThisServerInstance
        - startThisServerInstance
        - leaveCluster
        - addServer
        - updateServer
        - removeServer
        - failoverServer
        - autoFailover
        - createServerGroup
        - deleteServerGroup
        - createDatabase
        - updateDatabase
        - dropDatabase
        - distributeTable
        - enableTableLedger
        - restorePreferredPrimaries
        - startRebalance
        - stopRebalance
        - cancelTask
        - createRole
        - updateRole
        - deleteRole
        - setRoleMemberships
        - setRoleClusterRoles
        - createGrant
        - revokeGrants
        - applyGrantTemplate
        - replaceNetworkAccess
        - updateClusterSettings
        - generateLedgerDigest
        - startLedgerVerification
        - executeQuery
        - acknowledgeAlert
    AuditEvent:
      type: object
      description: One audit log entry.
      required: [id, timestamp, actor, source, action, outcome]
      properties:
        id:
          type: integer
          format: int64
          description: Monotonic event identifier.
        timestamp:
          type: string
          format: date-time
          description: When the action happened.
        actor:
          type: string
          description: Role that performed it, or `system`.
        actorAddress:
          type: string
          description: Client IP address.
        source:
          type: string
          enum: [panel, cli, rest, system]
          description: Client type.
        action:
          $ref: '#/components/schemas/AuditAction'
        resourceType:
          type: string
          description: Type of the affected resource.
        resourceId:
          type: string
          description: Identifier of the affected resource.
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        taskId:
          type:
            - integer
            - 'null'
          format: int64
          description: Task started by the action.
        requestId:
          type: string
          description: Request identifier for log correlation.
        details:
          type: object
          description: Action-specific data. Secrets are never recorded.
          additionalProperties: true
    AuditPage:
      type: object
      description: A page of audit events.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Events, newest first.
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ settings
    ClusterSettings:
      type: object
      description: Cluster-wide settings.
      required: [defaultReplicaCount, defaultDurability, autoFailover, rebalance, features, restart]
      properties:
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: Standby copies of every shard group. A change makes a rebalance necessary.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        autoFailover:
          type: object
          description: Automatic failover.
          required: [enabled, timeoutSeconds, maxCount, eventsSinceReset]
          properties:
            enabled:
              type: boolean
              description: Whether failed servers are failed over automatically.
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 3600
              description: Seconds without heartbeat before auto-failover.
            maxCount:
              type: integer
              minimum: 1
              maximum: 100
              description: Maximum automatic failovers before an operator must intervene; reset by a rebalance.
            eventsSinceReset:
              type: integer
              minimum: 0
              readOnly: true
              description: Automatic failovers since the last reset.
        rebalance:
          $ref: '#/components/schemas/RebalanceSettings'
        features:
          $ref: '#/components/schemas/FeatureFlags'
        restart:
          type: object
          description: Pending restart caused by enabling a feature.
          required: [required, serverIds]
          properties:
            required:
              type: boolean
              description: True while some server must restart to load an enabled extension.
            serverIds:
              type: array
              description: Servers that still need a restart.
              items: { $ref: '#/components/schemas/ServerId' }
    RebalanceSettings:
      type: object
      description: Rebalance defaults.
      required: [maxConcurrentMoves]
      properties:
        maxConcurrentMoves:
          type: integer
          minimum: 1
          maximum: 64
          default: 4
          description: Default number of concurrent bucket moves.
    ClusterSettingsUpdateRequest:
      type: object
      description: Partial update of cluster settings.
      minProperties: 1
      properties:
        defaultReplicaCount:
          type: integer
          minimum: 0
          maximum: 3
          description: New default replica count.
        defaultDurability:
          $ref: '#/components/schemas/Durability'
        autoFailover:
          type: object
          description: Auto-failover changes.
          minProperties: 1
          properties:
            enabled:
              type: boolean
              description: Enable or disable auto-failover.
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 3600
              description: Seconds without heartbeat before auto-failover.
            maxCount:
              type: integer
              minimum: 1
              maximum: 100
              description: Maximum automatic failovers.
        rebalance:
          $ref: '#/components/schemas/RebalanceSettings'
        features:
          type: object
          description: Features to turn on. `false` is rejected for a feature that is already on.
          minProperties: 1
          properties:
            sharding:
              type: boolean
              description: Turn the sharding extension on.
            ledger:
              type: boolean
              description: Turn the ledger extension on.

    # ------------------------------------------------------------------ ledger
    Sha256Hex:
      type: string
      description: SHA-256 value as 64 lower-case hexadecimal characters.
      pattern: '^[0-9a-f]{64}$'
    LedgerChainStatus:
      type: object
      description: Status of the ledger chain of one shard group.
      required: [shardGroupId, latestBlockHeight, latestBlockHash, latestBlockAt, lastVerifiedBlockHeight, verificationState]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Shard group owning the chain.
        latestBlockHeight:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Height of the latest closed block; null before the first block.
        latestBlockHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Hash of the latest block.
        latestBlockAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Time of the latest block.
        lastVerifiedBlockHeight:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Highest block height covered by a passed verification; null when not available or never verified.
        verificationState:
          oneOf:
            - $ref: '#/components/schemas/LedgerVerificationState'
            - type: 'null'
          description: Verification state of the chain; null when not available.
    LedgerStatus:
      type: object
      description: Ledger status of a database.
      required: [databaseName, mode, digestIntervalSeconds, verificationState, lastVerifiedAt, ledgerTableCount, chains]
      properties:
        databaseName:
          type: string
          description: Database.
        mode:
          oneOf:
            - $ref: '#/components/schemas/LedgerMode'
            - type: 'null'
          description: Ledger mode of the database; null when not available (no catalog stores it).
        digestIntervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 60
          description: Automatic digest interval; null when not available.
        verificationState:
          oneOf:
            - $ref: '#/components/schemas/LedgerVerificationState'
            - type: 'null'
          description: Verification state of the database; null when not available.
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the last verification finished; null when never verified or not available.
        ledgerTableCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Number of ledger tables; null when not available.
        chains:
          type: array
          description: One chain per shard group of a sharded database, or one chain otherwise.
          items: { $ref: '#/components/schemas/LedgerChainStatus' }
    LedgerStatusList:
      type: object
      description: Ledger status of all ledger-enabled databases.
      required: [items]
      properties:
        items:
          type: array
          description: The statuses.
          items: { $ref: '#/components/schemas/LedgerStatus' }
    LedgerBlock:
      type: object
      description: A ledger block header (`kingres.ledger_blocks`).
      required: [shardGroupId, height, prevHash, txMerkleRoot, blockHash, timestamp, hashVersion, transactionCount, signed]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Chain the block belongs to.
        height:
          type: integer
          format: int64
          minimum: 0
          description: Block height.
        prevHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Hash of the previous block; null for the first block.
        txMerkleRoot:
          $ref: '#/components/schemas/Sha256Hex'
        blockHash:
          $ref: '#/components/schemas/Sha256Hex'
        timestamp:
          type: string
          format: date-time
          description: Time the block was closed.
        hashVersion:
          type: integer
          minimum: 1
          description: Version of the canonical hash format.
        transactionCount:
          type: integer
          minimum: 0
          description: Transactions in the block.
        signed:
          type: boolean
          description: Whether the block carries a server signature.
    LedgerBlockPage:
      type: object
      description: A page of blocks.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Blocks, highest first.
          items: { $ref: '#/components/schemas/LedgerBlock' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    DigestAnchor:
      type: object
      description: An external destination a digest is anchored to.
      required: [target, status]
      properties:
        target:
          type: string
          enum: [worm, openTimestamps, tsa, ethereum]
          description: Anchoring destination type.
        status:
          type: string
          enum: [pending, anchored, failed]
          description: Anchoring state.
        anchoredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When anchoring completed.
        reference:
          type:
            - string
            - 'null'
          description: Destination-specific reference, for example an object URL or transaction id.
    LedgerDigest:
      type: object
      description: A database digest, the latest block hash of every chain at one moment.
      required: [id, databaseName, generatedAt, generatedBy, hashVersion, chains, aggregateHash, anchors]
      properties:
        id:
          type: integer
          format: int64
          description: Digest identifier.
        databaseName:
          type: string
          description: Database.
        generatedAt:
          type: string
          format: date-time
          description: Generation time.
        generatedBy:
          type:
            - string
            - 'null'
          description: Role that requested it, or `system` for scheduled digests; null when not available.
        hashVersion:
          type: integer
          minimum: 1
          description: Hash format version.
        chains:
          type: array
          description: Head of every chain.
          items:
            type: object
            description: Head block of one chain.
            required: [shardGroupId, blockHeight, blockHash]
            properties:
              shardGroupId:
                type: integer
                format: int32
                description: Shard group.
              blockHeight:
                type: integer
                format: int64
                minimum: 0
                description: Head block height.
              blockHash:
                $ref: '#/components/schemas/Sha256Hex'
        aggregateHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Merkle root over the chain heads for a sharded database; null otherwise.
        anchors:
          type: array
          description: Anchoring destinations; empty until anchoring is configured.
          items: { $ref: '#/components/schemas/DigestAnchor' }
    LedgerDigestPage:
      type: object
      description: A page of digests.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Digests, newest first.
          items: { $ref: '#/components/schemas/LedgerDigest' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    LedgerVerifyRequest:
      type: object
      description: Options of a verification.
      properties:
        scope:
          type: string
          enum: [full, sinceLastVerified]
          default: sinceLastVerified
          description: Verify the whole chain or only blocks after the last passed verification.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest to verify against; null uses the latest digest.
    LedgerInconsistency:
      type: object
      description: A discrepancy found by a verification.
      required: [shardGroupId, kind, detail]
      properties:
        shardGroupId:
          type: integer
          format: int32
          description: Affected chain.
        blockHeight:
          type:
            - integer
            - 'null'
          format: int64
          description: Affected block.
        kind:
          type: string
          enum: [blockHashMismatch, prevHashMismatch, merkleRootMismatch, rowHashMismatch, digestMismatch, missingBlock]
          description: Kind of discrepancy.
        table:
          type:
            - string
            - 'null'
          description: Affected table as `schema.table`, for row-level findings.
        detail:
          type: string
          description: Explanation with expected and actual values.
    LedgerVerification:
      type: object
      description: One verification run.
      required: [id, databaseName, state, scope, digestId, taskId, startedAt, finishedAt, startedBy, blocksChecked, rowsChecked, inconsistencies]
      properties:
        id:
          type: integer
          format: int64
          description: Verification identifier.
        databaseName:
          type: string
          description: Database.
        state:
          $ref: '#/components/schemas/LedgerVerificationState'
        scope:
          type: string
          enum: [full, sinceLastVerified]
          description: Scope used.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest verified against.
        taskId:
          type: integer
          format: int64
          description: Task running the verification.
        startedAt:
          type: string
          format: date-time
          description: Start time.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: End time; null while running.
        startedBy:
          type:
            - string
            - 'null'
          description: Role that started it, or `system`; null when not available.
        blocksChecked:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Blocks recomputed so far; null when not available (never 0 for "unknown").
        rowsChecked:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: Rows recomputed so far; null when not available (never 0 for "unknown").
        inconsistencies:
          type: array
          description: Findings; empty when the state is `passed`.
          items: { $ref: '#/components/schemas/LedgerInconsistency' }
    LedgerVerificationPage:
      type: object
      description: A page of verification runs.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Runs, newest first.
          items: { $ref: '#/components/schemas/LedgerVerification' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    InclusionProofRequest:
      type: object
      description: The row to prove.
      required: [schema, table, primaryKey]
      properties:
        schema:
          type: string
          description: Schema of the ledger table.
        table:
          type: string
          description: Ledger table.
        primaryKey:
          type: object
          description: Primary key column values of the row, by column name.
          minProperties: 1
          additionalProperties:
            type: [string, number, boolean]
        ledgerTxId:
          type:
            - integer
            - 'null'
          format: int64
          description: For an updatable table, the specific row version to prove; null proves the current version.
        op:
          type: string
          enum: [I, D]
          default: I
          description: Which ledger entry of the row to prove (`kingres.ledger_inclusion_proof` argument `op`). `I` proves that the version was written, `D` that it was removed (updatable tables only).
    MerkleStep:
      type: object
      description: One sibling hash on a Merkle path.
      required: [hash, position]
      properties:
        hash:
          $ref: '#/components/schemas/Sha256Hex'
        position:
          type: string
          enum: [left, right]
          description: Side on which the sibling is concatenated.
    InclusionProof:
      type: object
      description: Merkle proof that a row version is part of the ledger.
      required: [schema, table, primaryKey, op, shardGroupId, ledgerTxId, leafHash, leafIndex, merklePath, transactionMerkleRoot, block, shardHeadPath, aggregateHash, digestId, hashVersion]
      properties:
        schema:
          type: string
          description: Schema.
        table:
          type: string
          description: Table.
        primaryKey:
          type: object
          description: Primary key of the row.
          additionalProperties: true
        op:
          type: string
          enum: [I, D]
          description: 'The entry this proof is for. `I` means the row version was written in the transaction, `D` that it was removed in the transaction.'
        shardGroupId:
          type: integer
          format: int32
          description: Chain holding the row.
        ledgerTxId:
          type: integer
          format: int64
          description: Ledger transaction that wrote the row version.
        leafHash:
          $ref: '#/components/schemas/Sha256Hex'
        leafIndex:
          type: integer
          minimum: 0
          description: Position of the leaf among the transaction's rows.
        merklePath:
          type: array
          description: Path from the leaf to the transaction Merkle root, then to the block Merkle root.
          items: { $ref: '#/components/schemas/MerkleStep' }
        transactionMerkleRoot:
          $ref: '#/components/schemas/Sha256Hex'
        block:
          $ref: '#/components/schemas/LedgerBlock'
        shardHeadPath:
          oneOf:
            - type: array
              description: Path from the block hash to the aggregate hash.
              items: { $ref: '#/components/schemas/MerkleStep' }
            - type: 'null'
          description: Path from this chain's head to the aggregate hash; null for a non-sharded database.
        aggregateHash:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
          description: Aggregate hash of the digest used; null for a non-sharded database.
        digestId:
          type:
            - integer
            - 'null'
          format: int64
          description: Digest that covers the block; null if the block is newer than every digest.
        hashVersion:
          type: integer
          minimum: 1
          description: Hash format version needed to recompute the proof.

    # ------------------------------------------------------------------ query
    QueryRequest:
      type: object
      description: A SQL statement to run.
      required: [database, sql]
      properties:
        database:
          type: string
          description: Database to connect to.
        sql:
          type: string
          minLength: 1
          maxLength: 1000000
          description: Exactly one SQL statement.
        rowLimit:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
          description: Maximum rows returned; extra rows are dropped and `truncated` is set.
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 300000
          default: 30000
          description: Statement timeout.
    QueryColumn:
      type: object
      description: A result column.
      required: [name, type]
      properties:
        name:
          type: string
          description: Column name.
        type:
          type: string
          description: PostgreSQL type name.
    QueryResult:
      type: object
      description: Result of a statement.
      required: [columns, rows, rowCount, truncated, commandTag, durationMs]
      properties:
        columns:
          type: array
          description: Result columns; empty for statements without a result set.
          items: { $ref: '#/components/schemas/QueryColumn' }
        rows:
          type: array
          description: Rows as arrays of values in column order. bigint and numeric values larger than 2^53 are returned as strings; bytea as hex strings; SQL NULL as JSON null.
          items:
            type: array
            description: One row.
            items: {}
        rowCount:
          type: integer
          minimum: 0
          description: Rows returned in `rows`, or rows affected by a data-changing statement.
        truncated:
          type: boolean
          description: True when the result was cut at `rowLimit`.
        commandTag:
          type: string
          description: PostgreSQL command tag, for example `SELECT 2` or `INSERT 0 1`.
        durationMs:
          type: number
          minimum: 0
          description: Execution time.

    # ------------------------------------------------------------------ alerts
    AlertSeverity:
      type: string
      description: Alert severity.
      enum: [info, warning, critical]
    AlertState:
      type: string
      description: Alert state.
      enum: [open, acknowledged, resolved]
    AlertKind:
      type: string
      description: Alert type.
      enum:
        - serverDown
        - serverSuspect
        - underReplicatedBuckets
        - unavailableBuckets
        - replicationLagHigh
        - diskSpaceLow
        - memoryPressure
        - rebalanceNeeded
        - autoFailoverTriggered
        - autoFailoverLimitReached
        - mapGroupUnavailable
        - ledgerVerificationFailed
        - taskFailed
    Alert:
      type: object
      description: An alert.
      required: [id, kind, severity, state, title, message, raisedAt]
      properties:
        id:
          type: integer
          format: int64
          description: Alert identifier.
        kind:
          $ref: '#/components/schemas/AlertKind'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        state:
          $ref: '#/components/schemas/AlertState'
        title:
          type: string
          description: Short title.
        message:
          type: string
          description: Explanation.
        serverId:
          oneOf:
            - $ref: '#/components/schemas/ServerId'
            - type: 'null'
          description: Related server.
        databaseName:
          type:
            - string
            - 'null'
          description: Related database.
        raisedAt:
          type: string
          format: date-time
          description: When the alert was raised.
        acknowledgedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When it was acknowledged.
        acknowledgedBy:
          type:
            - string
            - 'null'
          description: Who acknowledged it.
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the condition cleared.
    AlertPage:
      type: object
      description: A page of alerts.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Alerts, newest first.
          items: { $ref: '#/components/schemas/Alert' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

    # ------------------------------------------------------------------ metrics
    MetricName:
      type: string
      description: |
        Metric names. Server-scoped: cpuUsagePercent, memoryUsedBytes, diskUsedBytes, connections,
        replicationLagBytes, replicationLagSeconds. Database-scoped: databaseSizeBytes, transactionsPerSecond,
        queriesPerSecond. Both scopes accept connections. Cluster-scoped: bucketsUnderReplicated.
      enum:
        - cpuUsagePercent
        - memoryUsedBytes
        - diskUsedBytes
        - connections
        - replicationLagBytes
        - replicationLagSeconds
        - databaseSizeBytes
        - transactionsPerSecond
        - queriesPerSecond
        - bucketsUnderReplicated
    MetricPoint:
      type: object
      description: One sample.
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Sample time (start of the step).
        value:
          type:
            - number
            - 'null'
          description: Value; null when there is no data for the step.
    MetricSeries:
      type: object
      description: One time series.
      required: [labels, points]
      properties:
        labels:
          type: object
          description: What the series is for.
          properties:
            serverId:
              $ref: '#/components/schemas/ServerId'
            databaseName:
              type: string
              description: Database of the series.
        points:
          type: array
          description: Samples in time order.
          items: { $ref: '#/components/schemas/MetricPoint' }
    MetricQueryResult:
      type: object
      description: Result of a metric query.
      required: [metric, unit, from, to, step, series]
      properties:
        metric:
          $ref: '#/components/schemas/MetricName'
        unit:
          type: string
          enum: [percent, bytes, count, countPerSecond, seconds]
          description: Unit of the values.
        from:
          type: string
          format: date-time
          description: Start of the range.
        to:
          type: string
          format: date-time
          description: End of the range.
        step:
          type: integer
          minimum: 1
          description: Resolution in seconds.
        series:
          type: array
          description: The series; a single series unless `groupBy` was used.
          items: { $ref: '#/components/schemas/MetricSeries' }
