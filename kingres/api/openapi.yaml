  /config/restarts:
    post:
      operationId: restartPendingInstances
      summary: Restart the instances that wait for a restart
      description: |
        Added in 0.8.0. Starts the task `config.restart`: restarts the instances that wait for a restart because of a
        configuration change, one server at a time, and stops at the first failure. For the five settings a
        standby needs at least as high as its primary (`max_connections`, `max_worker_processes`, `max_wal_senders`,
        `max_prepared_transactions`, `max_locks_per_transaction`) a standby is restarted before its primary when
        a value goes up and after it when a value goes down. **Restarting a primary is downtime for its shard group**
        (writes to its buckets fail until it is back; failover does not exist yet), so `acknowledgeDowntime` must be
        true (400 `validation_failed` otherwise). 409 `nothing_pending` when no instance waits, 409
        `config_restart_order_conflict` when one pair has a setting going up and another going down, 409
        `operation_in_progress` while a configuration task runs.
      tags: [Configuration]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
