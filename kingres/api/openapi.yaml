  /rebalance:
    get:
      operationId: getRebalanceStatus
      summary: Get the current rebalance status
      description: |
        Whether a rebalance is needed, running, stopped or idle, with progress and the moves in flight.
        `progress` and `inFlightMoves` describe the current run and are null or empty while idle. `lastReport`
        is the summary of the most recent finished, stopped or failed run (the same object as the newest item
        of `GET /rebalance/reports`) and is null when no run has finished yet.
      tags: [Rebalance]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Rebalance status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebalanceStatus' }
              examples:
                running:
                  value:
                    state: running
                    needed: true
                    reasons: [serverAdded]
                    taskId: 118
                    startedAt: '2026-11-14T10:05:00Z'
                    options: { maxConcurrentMoves: 4 }
                    progress: { movesTotal: 340, movesDone: 120, movesInFlight: 4, movesFailed: 0, bytesMoved: 536870912, percent: 35.3 }
                    lastReport:
                      id: 101
                      outcome: completed
                      startedAt: '2026-11-10T08:00:00Z'
                      finishedAt: '2026-11-10T08:20:00Z'
                      options: { maxConcurrentMoves: 4 }
                      totals: { movesTotal: 64, movesDone: 64, movesFailed: 0, bytesMoved: 134217728, durationSeconds: 1200 }
                    inFlightMoves:
                      - { databaseName: shop, colocationId: 1, bucket: 17, fromShardGroupId: 1, toShardGroupId: 3, phase: copy, percent: 40, sizeBytes: 2097152 }
                idle:
                  value:
                    state: idle
                    needed: false
                    reasons: []
                    taskId: null
                    startedAt: null
                    options: null
                    progress: null
                    inFlightMoves: []
                    lastReport: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: startRebalance
      summary: Start (or resume) a rebalance
      description: |
        Starts a cluster-wide rebalance as a resumable task, or resumes a stopped one. There is a single
        cluster-wide rebalance lock: returns 409 (`rebalance_in_progress`) when one is running. Moves run
        sequentially up to `maxConcurrentMoves`. Returns 503 (`map_group_unavailable`)
        while the map group is failing over.
      tags: [Rebalance]
      x-required-role: kingres_ops
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RebalanceOptions' }
            examples:
              default: { value: { maxConcurrentMoves: 4 } }
      responses:
