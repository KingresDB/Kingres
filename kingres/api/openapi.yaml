    TaskStep:
      type: object
      description: One step of a task.
      required: [name, state]
      properties:
        name:
          type: string
          description: Step name.
        state:
          type: string
          enum: [pending, running, done, failed, skipped]
          description: 'Step state. `skipped` (set by `kingresd` since 0.9.0; before, it recorded `done`): the step decided on purpose that it has nothing to do, and `detail` says why; the task goes on with the next step and counts the step as over. A paused task shows the step it will go on with as `pending`.'
        detail:
          type:
            - string
            - 'null'
          description: 'Extra information about the step, for example `Waiting for server db3, which cannot be reached`. Set while the step runs, and for a step that was `skipped` (the reason, for example `skipped: needs kingres_shard 0.5`); null otherwise.'
        shardGroupId:
          type:
            - integer
            - 'null'
          format: int32
          description: Added in 0.10.0, optional. The shard group a step of a multi-group task (`server.failover`) belongs to; null for a step of the whole task.
        itemsDone:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Items completed, for example buckets moved.
        itemsTotal:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Items in total.
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the step started.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the step ended.
    TaskProgress:
      type: object
      description: Progress of a task.
      required: [percent, steps]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Overall progress.
        currentStep:
          type:
            - string
            - 'null'
          description: Name of the running step.
        steps:
          type: array
          description: Per-step detail in execution order.
          items: { $ref: '#/components/schemas/TaskStep' }
    TaskError:
      type: object
      description: Why a task failed.
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable reason, for example `cancelled`, `step_failed`, `timeout`.
        message:
          type: string
          description: Human-readable explanation.
        step:
          type:
            - string
            - 'null'
          description: Step that failed.
        retryable:
          type: boolean
          description: Whether starting the same operation again may succeed.
    TaskSubject:
      type: object
      description: The resource a task works on.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [cluster, server, instance, database, table, rebalance, replication, ledgerVerification, networkAccess, config, ledgerKey, bucket, schema, upload]
          description: Resource type.
        id:
          type: string
          description: |
            Resource identifier: database name; server id (`ServerId`); instance id (`node_id`) as a decimal
            string; `database/schema.table` for a table; the verification id; the task id for a rebalance;
            the literal `cluster`, `preferred-primaries`, `network-access` or (0.11.0, type `ledgerKey`) `signing` for the singleton subjects; the upload id for type `upload` (0.29.0).
            See the README table "Task kinds and subjects".
    Task:
      type: object
      description: A durable long-running operation.
      required: [id, kind, state, progress, error, subject, detail, cancellable, createdAt, updatedAt, createdBy]
      properties:
        id:
          type: integer
          format: int64
          description: Task identifier (`task_id` in `kingres.task`). From 0.13.0 the id is 0 for the task that stands for the bootstrap of a map group failover while no task can be recorded (the system database is not writable yet); `GET /tasks/0` on the server that runs the bootstrap answers it, and `GET /failover` names the recorded task (`taskId`) once it exists. Id 0 never names a stored task.
        detail:
          type:
            - string
            - 'null'
          description: |
            Free text the running step recorded for the operator: the server a step is waiting for, or the
            certificate fingerprint seen when a server was added. Null when there is none. The text of the
            running step is repeated in `TaskStep.detail`.
        kind:
          $ref: '#/components/schemas/TaskKind'
        state:
          $ref: '#/components/schemas/TaskState'
        progress:
          $ref: '#/components/schemas/TaskProgress'
        error:
          oneOf:
            - $ref: '#/components/schemas/TaskError'
            - type: 'null'
          description: Failure information; null unless `state` is `failed`.
        subject:
          oneOf:
            - $ref: '#/components/schemas/TaskSubject'
            - type: 'null'
          description: Resource the task works on.
        cancellable:
          type: boolean
          description: "Whether `POST /tasks/{taskId}/cancel` is accepted now: true for a `pending`, `running` or `paused` task that the task engine runs."
        createdAt:
          type: string
          format: date-time
          description: Creation time.
        updatedAt:
          type: string
          format: date-time
          description: Last state or progress change.
        createdBy:
          type: string
          description: Role that started the task, or `system` for automatic tasks such as auto-failover.
    TaskPage:
      type: object
      description: A page of tasks.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Tasks, newest first.
          items: { $ref: '#/components/schemas/Task' }
        nextCursor:
          $ref: '#/components/schemas/NextCursor'

