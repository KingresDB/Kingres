        Returns what the create-database dialog may offer: the valid encodings and collations, the default
        bucket count and its allowed range, the default durability and the cluster's replica count (a
        cluster setting, shown for information; see `PATCH /settings/cluster`). Static for a given
        server version except `replicaCount` and `defaultDurability`, which follow the cluster settings.
      tags: [Databases]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseCreateOptions' }
              examples:
                default:
                  value:
                    encodings:
                      - { name: UTF8, isDefault: true }
                      - { name: LATIN1, isDefault: false }
                    collations:
                      - { name: en_US.UTF-8, encodings: [UTF8], isDefault: true }
                      - { name: C, encodings: null, isDefault: false }
                    bucketCount: { default: 128, minimum: 1, maximum: 4096 }
                    replicaCount: 1
                    defaultDurability: sync
                    ledgerDigestIntervalSeconds: { default: 3600, minimum: 60, maximum: 86400 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /databases:
    get:
      operationId: listDatabases
      summary: List databases
      description: |
        All user databases with size, bucket distribution, replication health, ledger status and activity.
        Not paginated. The internal `kingres_system` database and template databases are not listed.
      tags: [Databases]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: All databases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseList' }
              examples:
                one:
                  value:
                    items:
                      - name: shop
                        status: ready
                        general: { owner: app, encoding: UTF8, lcCollate: en_US.UTF-8, lcCtype: en_US.UTF-8, connectionLimit: -1 }
                        sharding: { enabled: true, bucketCount: 128 }
                        replication: { durability: sync, replicaCount: 1 }
                        ledger: { mode: optIn, digestIntervalSeconds: 3600 }
                        stats: { sizeBytes: 2147483648, tableCount: 14, activeConnections: 12, transactionsPerSecond: 340.5 }
                        health: { underReplicatedBuckets: 0, unavailableBuckets: 0 }
                        ledgerSummary: { verificationState: passed, lastVerifiedBlockHeight: 4210 }
                        rebalanceRequired: false
                        createdBy: kingres_root
                        createdAt: '2026-10-01T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createDatabase
      summary: Create a database
      description: |
        Starts one durable task that creates the database on every shard group, installs the
        `kingres_shard` and `kingres_ledger` extensions as selected, records the settings in the cluster
        registry and applies the durability level. The task is idempotent and cleans up a partially created
        database on failure. `GET /databases/{databaseName}` returns the database with status `creating`
        immediately.
        Immutable after creation: `name`, `general.encoding`, `general.lcCollate`, `general.lcCtype`,
        `sharding.bucketCount`.
      tags: [Databases]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseCreateRequest' }
            examples:
              sharded:
                value:
                  name: shop
                  general: { owner: app, encoding: UTF8, connectionLimit: -1 }
                  sharding: { enabled: true, bucketCount: 128 }
                  replication: { durability: sync }
                  ledger: { mode: optIn, digestIntervalSeconds: 3600 }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /databases/{databaseName}:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    get:
      operationId: getDatabase
      summary: Get a database
      description: One database with its four settings groups and live statistics.
      tags: [Databases]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The database.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Database' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateDatabase
      summary: Update a database
      description: |
        Changes mutable settings. Owner, connection limit and durability are applied synchronously and
        return 200. Enabling sharding or the ledger needs background work and returns 202 with a task.
        The replica count is a cluster setting and is not accepted here (`PATCH /settings/cluster`).
        Sending an immutable field with a different value returns 409 (`immutable_field`). Sharding and
        the ledger can be turned on but never off (`422`).
      tags: [Databases]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseUpdateRequest' }
            examples:
              durability: { value: { replication: { durability: syncApply } } }
      responses:
        '200':
          description: Settings applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Database' }
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: dropDatabase
      summary: Drop a database
      description: |
        Drops the database on every shard group. Irreversible. The caller must repeat the database name in the
        `confirm` query parameter (type-the-name confirmation), otherwise 422. Ledger tables do not
        protect a database from being dropped; the audit log keeps the record.
      tags: [Databases]
      x-required-role: kingres_admin
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must equal the database name.
          schema: { type: string }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /databases/{databaseName}/tables:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
    get:
      operationId: listTables
      summary: List tables of a database
