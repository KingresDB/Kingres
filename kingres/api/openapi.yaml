          application/json:
            schema: { $ref: '#/components/schemas/GrantRequest' }
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /grants/template-applications:
    post:
      operationId: applyGrantTemplate
      summary: Apply a grant template
      description: |
        Applies one of three templates to a role on a database. `readOnly` grants CONNECT, USAGE on all
        schemas and SELECT on all current and future tables. `readWrite` adds INSERT, UPDATE and DELETE
        (not on append-only ledger tables). `owner` makes the role the database owner.
      tags: [Grants]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantTemplateRequest' }
            examples:
              readonly: { value: { template: readOnly, grantee: bob, database: shop } }
      responses:
        '204': { description: Template applied. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /settings/network-access:
    get:
      operationId: getNetworkAccess
      summary: Get network access rules
      description: The ordered client network rules (pg_hba style) and whether each server has applied the current revision.
      tags: [Network access]
      x-required-role: kingres_admin
      responses:
        '200':
          description: Network access configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAccess' }
              examples:
                default:
                  value:
                    revision: 7
                    tlsRequired: true
                    rules:
                      - { type: hostssl, databases: [all], users: [all], address: 10.0.0.0/24, method: scram-sha-256, comment: Internal clients }
                    applyStatus:
                      - { serverId: 10.0.0.11, appliedRevision: 7, error: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: replaceNetworkAccess
      summary: Replace network access rules
      description: |
        Replaces the complete ordered rule list and applies it on every server (a reload of `pg_hba.conf`).
        `revision` must equal the current revision, otherwise 409 (optimistic concurrency). Node-to-node
        rules for cluster members are added by the system and cannot be removed. A rule set that would lock
        out the caller's own address is rejected with 422. Returns a task that finishes when all servers applied it.

        **Dry run (0.6.0).** With `dryRun=true` the request is checked exactly as for a real change (body
        validation, `revision` conflict 409, the lock-out rule 422) and nothing is changed: no task is created, no
        rule is applied, nothing is written to the audit log. A request that would be accepted answers 200
        `NetworkAccessCheck`; one that would be refused answers the same problem as without the flag. The
        panel can use it to show the outcome (for example the lock-out) before the administrator confirms.
      tags: [Network access]
      x-required-role: kingres_admin
      parameters:
        - name: dryRun
          in: query
          description: Added in 0.6.0. When true, only check the request (see the description). Default false.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkAccessUpdateRequest' }
      responses:
        '200':
          description: "Dry run only (`dryRun=true`) - the change would be accepted."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAccessCheck' }
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /audit:
    get:
      operationId: listAuditEvents
      summary: List audit events
      description: |
        Append-only log of sign-ins and every administrative action through the panel, CLI or REST API, newest first.

        **Answers for the whole cluster from any server (0.6.0).** Every server writes its own audit file: a
        sign-in is recorded by the server that took it, an administrative action by the manager leader that ran
        it (also when it arrived at another server). The server that receives the request asks every other
        server for its part (as `listLogs` does), merges the answers newest first (by `timestamp`, then
        `id`) and names the servers that did not answer in `missingServers` (`partial: true`): an
        administrator never sees a log that silently lacks a server. Events of a server that was removed from
        the cluster are gone with it. `AuditEvent.id` is unique in the cluster (see there) and
        `AuditEvent.serverId` names the server whose log holds the event. A cursor is valid for the whole
        cluster-wide listing and not across revisions (a cursor of 0.5.0 is refused with 400 `validation_failed`).

        **Operations are not run while the audit log cannot be written (0.6.0).** A mutating operation by an
        authenticated caller is answered 503 `service_unavailable` before it has any effect when the server
        that would run it cannot write its audit file (full disk, lost file); reads and `login` are not
        refused. A write that fails after the operation ran (the disk filled in between) is logged by the
        server and cannot be undone.
      tags: [Audit]
      x-required-role: kingres_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: actor
          in: query
          description: Return only events by this role name.
          schema: { type: string }
        - name: action
          in: query
          description: Return only events with this action (the `operationId` of the audited operation or one of the non-operation events, see `AuditAction`), for example `createDatabase`.
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: outcome
          in: query
          description: Return only events with this outcome.
          schema: { $ref: '#/components/schemas/AuditOutcome' }
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
              examples:
                one:
                  value:
                    items:
                      - id: 90412
                        timestamp: '2026-11-14T09:58:00Z'
                        actor: alice
                        actorAddress: 10.0.0.50
                        source: panel
                        action: createDatabase
                        resourceType: database
                        resourceId: shop
                        outcome: success
                        taskId: 117
                        requestId: 0b6c1a2e
                        details: { sharding: true }
                    nextCursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /settings/cluster:
    get:
      operationId: getClusterSettings
      summary: Get cluster settings
      description: Auto-failover, default replica count and durability, rebalance concurrency and feature flags.
      tags: [Settings]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: Cluster settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterSettings' }
              examples:
                defaults:
                  value:
                    defaultReplicaCount: 1
                    defaultDurability: sync
                    autoFailover: { enabled: true, timeoutSeconds: 120, maxCount: 1, eventsSinceReset: 0 }
                    rebalance: { maxConcurrentMoves: 4 }
                    features: { sharding: true, ledger: true }
                    restart: { required: false, serverIds: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateClusterSettings
      summary: Update cluster settings
      description: |
        Partial update; omitted properties are unchanged and nested objects are merged. Changing
        `defaultReplicaCount` (0.7.0) starts the task `standby.reconcile`, which adds or removes standby instances group
        by group until every shard group has that many (as many as the servers allow; a group never has two instances on
        one server), and it is not a rebalance. `defaultReplicaCount` set to its current value starts the same check. Feature flags can be
        turned on but never off; the first enable of a feature needs a restart of every server (reported in
        `restart`), because the extensions load through `shared_preload_libraries`.

        **One operation, two answers (0.9.0).** An update that starts no task (every setting but the replica count, and
        a replica count with nothing to do) answers **200** with the settings. An update that starts a task answers
        like every operation that starts one, **202** with the `Task` and `Location: /api/v1/tasks/{taskId}`, when
        the request carries `Prefer: respond-async` (RFC 7240; the answer then has `Preference-Applied: respond-async`).
        The settings are stored before the task starts, and `GET /settings/cluster` returns them. A client that does
        not send the header gets 200 and the settings, as in 0.8.0, and finds the task in `GET /tasks`; the panel sends
        the header. The header is ignored for an update that starts no task.
      tags: [Settings]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterSettingsUpdateRequest' }
            examples:
              failover: { value: { autoFailover: { enabled: true, timeoutSeconds: 60, maxCount: 2 } } }
      responses:
        '200':
          description: The updated settings (no task was started, or the request did not ask for the task).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterSettings' }
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /config/parameters:
    get:
      operationId: listConfigParameters
      summary: List PostgreSQL parameters with their values on every server
      description: |
        Added in 0.8.0. Every parameter of the running PostgreSQL version and of the extensions that define parameters,
        read from `pg_settings` of the answering server (type, unit, range, enum values, context), with the effective
        value on every server read from that server, the level each value comes from and whether a restart is
        pending. Ordered by name; keyset cursor over the name. Parameters that `kingresd` itself needs (`kind`
        `managed`) or that run commands or name files (`kind` `refused`) are listed read-only with the reason.
        A value that PostgreSQL hides from an ordinary database user (a superuser-only parameter) is never returned
        to any role: `hidden` is true and the values are null. A server that could not be read is named in
        `missingServers` and `partial` is true; its `servers[]` entry has `state` `unknown`.
      tags: [Configuration]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Case-insensitive substring of the name or the description.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          description: Return only parameters of this category (PostgreSQL's text, for example `Resource Usage / Memory`; a top-level category such as `Resource Usage` matches its sub-categories).
          schema: { type: string, maxLength: 200 }
        - name: changed
          in: query
          description: When true, only parameters that have an override at some level.
          schema: { type: boolean }
        - name: differing
          in: query
          description: When true, only parameters whose effective value differs between servers.
          schema: { type: boolean }
        - name: pendingRestart
          in: query
          description: When true, only parameters that wait for a restart on at least one server.
          schema: { type: boolean }
        - name: state
          in: query
          description: Return only parameters that are in this state on at least one server.
          schema: { $ref: '#/components/schemas/ConfigServerState' }
        - name: kind
          in: query
          description: Return only parameters of this kind.
          schema: { $ref: '#/components/schemas/ConfigParameterKind' }
      responses:
        '200':
          description: A page of parameters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigParameterList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/parameters/{name}:
    parameters:
      - $ref: '#/components/parameters/ConfigParameterName'
    get:
      operationId: getConfigParameter
      summary: Get one PostgreSQL parameter
      description: |
        Added in 0.8.0. The same object as one item of `listConfigParameters`. 404 `config_parameter_unknown` when the running
        version and its extensions have no such parameter.
      tags: [Configuration]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/changes/preview:
    post:
      operationId: previewConfigChange
      summary: Check a configuration change and show what it would do
      description: |
        Added in 0.8.0. Runs exactly the checks of `applyConfigChange` (names, levels, managed and refused
        parameters, cluster-only parameters, type, unit and range from `pg_settings`, PostgreSQL's own check of the
        value) and reports which servers would change and how, without changing anything. Always 200 for a request
        that is well formed: `valid` is false and `problems` explain when the change would be refused. `kingres_admin`
        because it takes the same body as the change.
      tags: [Configuration]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigChangeRequest' }
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigChangePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /config/changes:
    get:
      operationId: listConfigChanges
      summary: List configuration changes
      description: |
        Added in 0.8.0. The history of changes made through `applyConfigChange` and `revertConfigChange`, newest first, with the
        old and the new value and the level. Keyset cursor over `changeId`.
      tags: [Configuration]
      x-required-role: kingres_readonly
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: name
          in: query
          description: Return only changes of this parameter.
          schema: { type: string, maxLength: 63 }
        - name: level
          in: query
          description: Return only changes at this level.
          schema: { $ref: '#/components/schemas/ConfigLevel' }
        - name: scopeId
          in: query
          description: Return only changes of this server group, server or database.
          schema: { type: string, maxLength: 253 }
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigChangeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: applyConfigChange
      summary: Change PostgreSQL parameters
      description: |
        Added in 0.8.0. Sets or removes the value of parameters at the cluster, server group, server or database level
        and starts the task `config.apply`: it checks the request again, records the change, then writes the
        override file of each server, checks it with PostgreSQL, reloads and reads the effective values back, one step
        per server. A parameter that needs a restart is reported `pendingRestart` per server; nothing is restarted
        (see `restartPendingInstances`). A server that is down gets the change when it returns (the step waits and says
        which). A server that fails does not stop the others: the task ends failed with `config_incomplete`, and the
        steps and `listConfigServers` say which servers applied, wait for a restart, failed or wait. Refused with 400
        `validation_failed` (a value that is not valid for its parameter; `errors[]` names the change) and 422
        `config_parameter_managed`, `config_parameter_refused`, `config_level_not_allowed` and `config_value_below_floor`;
        404 `not_found` for an unknown server group, server or database; 409 `operation_in_progress` while another
        configuration task runs. Nothing is written before every change has passed.
      tags: [Configuration]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
