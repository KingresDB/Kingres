  /config/changes/preview:
    post:
      operationId: previewConfigChange
      summary: Check a configuration change and show what it would do
      description: |
        Added in 0.8.0. Runs exactly the checks of `applyConfigChange` (names, levels, managed and refused
        parameters, cluster-only parameters, type, unit and range from `pg_settings`, PostgreSQL's own check of the
        value) and reports which servers would change and how, without changing anything. Always 200 for a request
        that is well formed: `valid` is false and `problems` explain when the change would be refused. `kingres_admin`
        because it takes the same body as the change.
      tags: [Configuration]
      x-required-role: kingres_admin
