                    - { name: Create database on group 2, state: running, detail: null, itemsDone: 0, itemsTotal: 1, startedAt: '2026-11-14T09:58:02Z', finishedAt: null }
                    - { name: Install extensions, state: pending, detail: null, itemsDone: null, itemsTotal: null, startedAt: null, finishedAt: null }
                error: null
                subject: { type: database, id: shop }
