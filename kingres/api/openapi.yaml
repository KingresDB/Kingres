  /databases/{databaseName}/schemas/{schemaName}/tables/{tableName}/distribution:
    parameters:
      - $ref: '#/components/parameters/DatabaseName'
      - $ref: '#/components/parameters/SchemaName'
      - $ref: '#/components/parameters/TableName'
    put:
      operationId: distributeTable
      summary: Distribute a table
      description: |
        Turns a plain table into a hash-distributed table (by a distribution column) or a reference table
        (a full copy on every shard group). Requires sharding to be enabled on the database. Long-running: returns a task.

        **0.14.0 (increment 9.6): a table with rows can be distributed.** `mode` `online` copies the rows while writers go on
        (`create_distributed_table_concurrently`; needs a primary key or a unique index on NOT NULL columns); `blocking` makes writers wait for the whole copy;
        `auto` (the default) is online for a table with a usable key and more than 100000 estimated rows. `bucketCount` sets the bucket count of a new
        colocation group. `dependentViews` `recreate` makes the plain views that use the table be made again on the new table. A table that cannot be
        distributed is refused before the task exists with 422 `table_not_eligible` and the `blockers` (the table's own report: for example a trigger, a foreign key to an ordinary table,
        a materialized view that uses it). The free space of every destination server is checked first (step *Check free space*). A RANGE or LIST partitioned table
        becomes a user-partitioned distributed table (blocking only). The text below, that the table must be empty, holds for contract versions before 0.14.0.

        **0.32.0: distribute with related tables.** `relatedTables` lists the ordinary tables that are linked to the table by foreign keys, directly or through
        each other (`listRelatedTables` gives the list). They are distributed together with the table, in one task, colocated with it (the table joins the group
        of `colocateWith` or opens a new one; the related tables join the group of the table). The task drops the keys between the tables, distributes the table
        and then each related table (one step each; a repeated run goes on with the tables that are not distributed yet), adds the keys back `NOT VALID` and
        validates them. No key between these tables is enforced from the first drop to the last add; the task says so on its detail, and it takes the blocking
        copy only (`mode` `online` is refused with 400 `validation_failed`). The list must be the whole set (a missing table is the blocker `related_table_missing`),
        and every related table needs a distribution column (`distributionColumn`, or the one that follows from the keys). A failure puts the keys back where it
        can and says in the task error which keys were not restored.

        **What the sharding extension can do, and what this operation refuses (0.9.0 states exactly that).**
        *Hash* (`kingres.create_distributed_table`): the table must be **empty** (422 `unprocessable`: distributing a
        table that has rows is a later phase; create an empty copy, distribute it and insert the rows), have a primary
        key or unique key that includes the distribution column, and be an ordinary permanent table without foreign keys,
        triggers, exclusion constraints, row-level security, inheritance or storage parameters. *Reference*
        (`kingres.create_reference_table`, 0.9.0; `unsupported_operation` before): the same table restrictions, no
        distribution column and no `colocateWith` (400 `validation_failed` when given); the rows it has are copied to every
        group. **Neither is possible for a ledger table** (422 `unprocessable`): the ledger is kept per node. A table
        the extension refuses fails the task with the extension's own reason.
      tags: [Tables]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistributeTableRequest' }
            examples:
              hash: { value: { method: hash, distributionColumn: customer_id } }
              reference: { value: { method: reference } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

    delete:
      operationId: undistributeTable
      summary: Turn a distributed table back into a plain table
      description: |
        Added in 0.14.0 (increment 9.6). Turns a distributed or reference table back into an ordinary table on one server
        (`kingres.undistribute_table`, or `undistribute_table_concurrently` in mode `online`). With `cascadeViaForeignKeys` the tables
        that foreign keys link to it are undistributed in the same operation; without it a table that is linked to others is refused
        (422 `table_not_eligible`, the linked tables named in `blockers`). The table goes to the primary of the shard group
        `targetGroupId` (default 0, the map group). Long-running: returns a task of kind `table.undistribute`. `mode`: `auto` (online when
        the table has a usable key and more than 100000 estimated rows, otherwise blocking), `online` (writers go on; needs a primary key or a unique index
        on NOT NULL columns) or `blocking` (writers wait for the whole copy). A user-partitioned table cannot be undistributed in this version
        (`table_not_eligible`). The free space of the target server is checked first. `dependentViews` `recreate` makes the plain views that use the table be made
        again on the new table (setting `kingres_shard.dependent_views`); a view on a server that will not hold the table makes the table not eligible.
      tags: [Tables]
      x-required-role: kingres_admin
      parameters:
        - name: cascadeViaForeignKeys
          in: query
          schema: { type: boolean, default: false }
          description: Undistribute the tables that foreign keys link to this one too.
        - name: targetGroupId
          in: query
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
          description: Shard group (`group_id`) whose primary receives the table; 0 is the map group.
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/TableChangeMode' }
        - name: dependentViews
          in: query
          schema: { $ref: '#/components/schemas/DependentViews' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: alterTableDistribution
      summary: Change the distribution of a distributed table
      description: |
        Added in 0.14.0. Changes the distribution column, the bucket count or the colocation group of a distributed table
        (`kingres.alter_distributed_table`, or `alter_distributed_table_concurrently` in mode `online`); with `cascadeToColocated`
        the tables of its colocation group change together (blocking mode only). At least one of `distributionColumn`, `bucketCount` and
        `colocateWith` is needed (400 `validation_failed` otherwise). Long-running: returns a task of kind `table.alter`. A request that
        changes the catalog only (no row moves) is done in one step. The free space of every destination server is checked first.
        A user-partitioned table cannot be altered in this version (`table_not_eligible`).
      tags: [Tables]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlterTableDistributionRequest' }
            examples:
              buckets: { value: { bucketCount: 512 } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

