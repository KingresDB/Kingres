                    servers: { total: 3, live: 2, suspect: 1, draining: 0, decommissioning: 0, dead: 0, pendingRebalance: 0 }
                    buckets: { total: 3072, underReplicated: 512, unavailable: 0, moving: 0, orphan: 0 }
                    databaseCount: 2
