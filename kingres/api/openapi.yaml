  /servers:
    get:
      operationId: listServers
      summary: List servers
      description: All servers of the cluster with status, instances, bucket counts, lag and resource usage. Not paginated.
      tags: [Servers]
      x-required-role: kingres_readonly
      parameters:
        - name: status
          in: query
          description: Return only servers with this status.
          schema: { $ref: '#/components/schemas/ServerStatus' }
        - name: serverGroup
          in: query
          description: Return only servers in this server group.
          schema: { type: string }
      responses:
        '200':
          description: All servers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerList' }
              examples:
                two:
                  value:
                    items:
                      - id: 10.0.0.11
                        address: 10.0.0.11:8091
                        hostname: db1
                        status: live
                        serverGroup: rack-a
                        shouldHaveShards: true
                        isManagerLeader: true
                        version: 1.0.0
                        uptimeSeconds: 86400
                        joinedAt: '2026-10-01T09:00:00Z'
                        lastHeartbeatAt: '2026-11-14T10:00:00Z'
                        certificateExpiresAt: '2027-10-01T09:00:00Z'
                        seenFingerprint: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        fingerprintPinned: true
                        instances:
                          - { id: 1, serverId: 10.0.0.11, shardGroupId: 0, isMapGroup: true, role: primary, state: running, port: 5432, replicationLagBytes: null, replicationLagSeconds: null }
                          - { id: 2, serverId: 10.0.0.11, shardGroupId: 2, isMapGroup: false, role: standby, state: running, port: 5433, replicationLagBytes: 1024, replicationLagSeconds: 0.2 }
                        buckets: { primary: 128, replica: 128 }
                        sizeBytes: 5368709120
                        resources: { cpuUsagePercent: 18.5, memoryUsedBytes: 4294967296, memoryTotalBytes: 17179869184, diskUsedBytes: 21474836480, diskTotalBytes: 107374182400 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: addServer
      summary: Add a server
      description: |
        Adds an uninitialized server to the cluster. The manager leader contacts the new server at `address`
        with its setup token, which performs the same join as the first-run wizard. The server appears as
        `pendingRebalance`; adding and rebalancing are two separate steps and no data moves until
        `POST /rebalance` is called. Long-running: returns a task.

        **Requires `kingres_admin` (0.6.0; `kingres_ops` before, which was a privilege escalation).** Adding a
        server gives it a certificate of the cluster and, later in the same task, every role with its password
        verifier; whoever may do that may become any role. `joinCluster` has always required an administrator.
        The certificate is issued, and the verifiers are sent, only for a request that an administrator made
        and that named the server's certificate (see `AddServerRequest.expectedFingerprint` and
        `allowUnpinned`); a server that holds a certificate but has not finished joining (`status` still
        pending) may make no other call to the cluster.

        Refused with 409 `operation_in_progress` while a database import (`importDatabase`) is pending, running or paused, and an import is refused while a server is being added: the
        private database of an import is made on the servers that the import started with, so a server that joined meanwhile would be in its catalog without the database.
      tags: [Servers]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddServerRequest' }
            examples:
              default: { value: { address: 10.0.0.13:8091, setupToken: 7f3a-91bc-44d0, serverGroup: rack-c } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServer
      summary: Get a server
      description: One server with its instances and the number of buckets it holds per database.
      tags: [Servers]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateServer
      summary: Update a server
      description: |
        Changes the server group or whether the server should hold shards (partial update, answered
        synchronously with the whole `Server`). **Only `serverGroup` and `shouldHaveShards` can be
        changed**; every other property of `Server` is read-only and a request that contains any other
        member is refused with 400 `validation_failed` (`errors[].field` names it, for example `/status`).
        An empty body is refused with 400. A value equal to the current one changes nothing and still
        answers 200. Changing either value may make a rebalance necessary (`ClusterOverview.rebalance`);
        no data moves until `POST /rebalance`.

        Refusals: 404 for an unknown server; 422 `unprocessable` with `errors[].field` `/serverGroup` when
        the named group does not exist (create it with `createServerGroup` first); 409
        `operation_in_progress` while the server is being added, removed or left (status `decommissioning`, or
        `pendingRebalance` before its join has finished); 409 `rebalance_in_progress` while a rebalance **runs**
        (a stopped rebalance does not block it: between a stop and a start again an operator changes
        `shouldHaveShards`, and the run computes its plan again when it starts).

        `shouldHaveShards: false` makes the server `draining` until a rebalance has moved its buckets away
        (`POST /rebalance`); `true` makes a server that owns no bucket `pendingRebalance`. Nothing moves by itself.
        The change is made in the sharding catalog of every database through `kingres.set_node_property`; 409
        `no_receiving_server` when it would leave no server that should hold shards.

        While a database import (`importDatabase`) is pending, running or paused, a request that changes `shouldHaveShards` is refused with 409 `operation_in_progress` (the private
        database of the import has a catalog that no change of the flag follows); a request that only changes `serverGroup`, or that sets a value equal to the current one, is not refused.
      tags: [Servers]
      x-required-role: kingres_ops
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerUpdateRequest' }
            examples:
              drain: { value: { shouldHaveShards: false } }
              regroup: { value: { serverGroup: rack-b } }
      responses:
        '200':
          description: The updated server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: removeServer
      summary: Remove a server (drain)
      description: |
        Removes a server that holds no data: unregisters it from the catalog, withdraws its certificate
        (revoked on every server), tells it to delete its instance and reset itself to `uninitialized`,
        and forgets it (status `decommissioning` while the task runs). Returns a task (`server.remove`) for
        the whole removal. **The operation does not move data**: to empty a server, set
        `shouldHaveShards: false` (`PATCH /servers/{serverId}`) and run `POST /rebalance`, then remove it.
        The standbys are handled by the removal itself (0.9.0): the standbys the server hosts for other groups, and
        the standbys of its own group elsewhere, are removed with it (the reconcile of the standbys then places new
        ones where the cluster allows); they do not count as buckets the server owns.
        The task checks the conditions again when it starts.

        Refusals, checked in this order: 404 for an unknown server; 409 `last_server` (the only server of
        the cluster); 409 `server_hosts_map_group` (the server hosts an instance of the map group, shard
        group 0, which is the manager leader's catalog); 409 `server_owns_buckets` (it runs the primary of a
        shard group that owns buckets in any database; the problem `detail` names the databases and counts; since 0.9.0
        the standbys it hosts for other groups are not counted); 409 `rebalance_in_progress` while a rebalance runs and `operation_in_progress` while
        another task of this server runs. A `dead` server is refused with 422 `node_state_invalid`: fail
        it over first.

        A database import (`importDatabase`) that is pending, running or paused refuses the removal with 409 `operation_in_progress`, and an import is refused while a removal is
        unfinished. The buckets that the private database of a failed import that was kept (`keepOnFailure`) holds on the server keep it from being removed too: the `detail` of
        `server_owns_buckets` names that database, which an operator drops with `dropDatabase`.
      tags: [Servers]
      x-required-role: kingres_ops
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{serverId}/failover:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: failoverServer
      summary: Fail over a server
      description: |
        Promotes, for every shard group whose primary runs on this server (or for the groups named in
        `shardGroupIds`), one standby to primary on its own server, one group at a time, the map group first.
        `graceful` is the planned switchover: it waits for the standbys to catch up and requires a `live`
        server (no data loss). `hard` is for a dead or unresponsive server and can lose asynchronously
        replicated writes. The promoted servers then carry extra load until
        `POST /replication/restore-preferred-primaries`.

        **0.10.0.** The request can name the groups (`shardGroupIds`), the standby to promote per group
        (`targets`), accept a possible loss of data (`allowDataLoss`), ask for the plan only (`dryRun`: 200
        `FailoverPlan`, nothing changes) and carry a `comment` for the audit event. A failover that could lose
        data is refused with 409 `failover_needs_decision` until the request says `allowDataLoss`; the
        `detail` names the groups and the loss, and `dryRun` answers the whole plan. Refused with 409 `no_replica_available` when a group has no
        standby that is ready, `cluster_inconsistent` when a standby is not registered in the sharding catalog (or the
        primary names one in `synchronous_standby_names` that the catalog does not have), 503 `quorum_unavailable` when the server that answers cannot hear a majority of the
        servers, `lease_settings_differ` when the servers do not use the same lease duration and margin,
        `version_mismatch`, `failover_in_progress` (one failover or restore at a time, cluster-wide),
        `rebalance_in_progress` (a rebalance that did not stop within a minute) and `operation_in_progress`.
        422 `node_state_invalid` for `graceful` on a server that is not `live`, 422 `unprocessable` for a group
        the server is not primary of or a target that is not a standby of the group. While `kingresd` lacks a
        part of the design, the request answers 422 `unsupported_operation`: this revision's server implements
        `hard` and `graceful` for ordinary groups.

        **0.33.0, the role for a loss of data.** A hard request that includes the map group of a server that is alive (see 0.28.0) and carries
        `allowDataLoss: true` is refused with 403 `forbidden` unless the session has `kingres_admin`; the operation otherwise needs `kingres_ops`, and the
        same request for an ordinary group, or for the map group without `allowDataLoss`, stays with `kingres_ops`.

        **0.13.0, the planned switchover (`graceful`).** For each group, in this order: the writes of the group stop on the old primary
        (new connections go elsewhere, the other sessions are ended), the distributed transactions end, the old primary stops with a fast
        shutdown and releases its lease, the standby that streams from it is proven to hold everything the old primary wrote, and only then
        is it promoted. A standby that is behind, or a proof that cannot be made, rolls the group back (the old primary starts again, the
        writes are let in again) and the task ends `failed` with the code `standby_behind` or `switchover_unproven`; a stop of the writes
        that does not succeed in two minutes ends it with `cannot_quiesce`, and prepared transactions that do not end with
        `prepared_transactions_pending`. The task can be cancelled until the promotion has begun (`Task.cancellable`). Refused with 409
        `group_degraded` when no standby of a group streams from its primary (or the named target does not), and with 422
        `unsupported_operation` for a request that cannot run on this server (see 0.28.0 below for the map group).

        **0.13.0, the map group.** The failover of the server that runs the primary of the map group (and the manager
        leader) is accepted by any server that does not hear it, in mode `hard` only (`dryRun` and `graceful` answer 422
        `unsupported_operation`): the server asks a server that hosts a ready standby of the map group to run the bootstrap, and
        answers 202 with a Task whose `id` is 0, `state` `running` and the steps of the bootstrap, with `Location: /api/v1/failover`;
        the client polls `GET /failover` (answered by that server) until `taskId` is not null, then `GET /tasks/{id}` on the new
        manager leader. The old leader's rebalance is paused (`stoppedBy` `safetyRule`). The key of the certificate authority is not
        copied to the new leader: the alert `certificateAuthorityUnavailable` says what the operator must do.

        **0.18.0, a planned switchover of the map group.** `mode: graceful` for the server that runs the primary of the map group, sent to the
        leader (that server) while it answers, is a switchover like any other, with the map group last: the task starts the bootstrap of the chosen
        standby's server, stops the old leader cleanly and sends it the proof, the standby's server promotes on the proof and becomes the manager
        leader, and its task engine finishes the task (the task is read from the new leader once the old leader's system database is stopped). The
        steps of the map group that the old leader could not record are the ones before `Verify the new primary`. A hard failover of a server whose
        map group primary answers (mode `hard`) is the subject of 0.28.0 below.
        When the manager leader is gone and the request is answered by a server that is not the candidate, the request travels to the candidate with the proof of the
        operator's session (ADR 0026); a session of the token kind has no proof key and gets 503 `service_unavailable` for this case.

        **0.28.0, a hard failover of the map group while its server is alive.** `mode: hard` for the server that runs the primary of the map group, sent
        to the leader (that server) while it answers, is accepted (it was 422 `unsupported_operation`); the map group is the last group of the task. The
        leader judges the loss before it changes anything (a loss that the request did not accept with `allowDataLoss` is 409 `failover_needs_decision`, as for any group),
        starts the bootstrap of a standby's server, which waits for the lease, and then fences its own primary of the map group in one step: its lease is no
        longer renewed, a marker keeps the primary from starting, it is stopped with an immediate shutdown, and only when it is seen stopped is the lease
        handed to the standby's server, which then promotes (ranking all the standbys after the stop) and becomes the manager leader. A primary that
        cannot be stopped is stopped by the watchdog when its lease runs out, and the standby's server takes the lease after that. Nothing is promoted without
        the lease, so two writable primaries are impossible. The task is read from the new leader (id and report as for a planned switchover). A loss that
        shows only after the stop (a standby that cannot be read any more) pauses the bootstrap with `failoverNeedsDecision`; the repeated request, sent to
        the server of the standby, carries the decision. `dryRun` for this case is answered by the leader as for any group.

        The task is `server.failover`, one block of steps per group (`TaskStep.shardGroupId`). A task that
        waits for an operator is `paused`; a repeat of this request for the same server resumes it. From the moment
        the task starts to stop the old primary of a group the task can only go forward (`Task.cancellable` is false:
        the group has no primary until a standby is promoted, so a rollback is not offered in this revision; a cancel
        before it lifts the freezes). The report id is
        the task id (`getFailoverReport`). Needs `kingres_ops`.
      tags: [Servers]
      x-required-role: kingres_ops
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailoverRequest' }
            examples:
              hard: { value: { mode: hard } }
              oneGroup: { value: { mode: hard, shardGroupIds: [2], targets: [{ shardGroupId: 2, serverId: db3 }], comment: disk failure } }
              plan: { value: { mode: hard, dryRun: true } }
      responses:
        '200':
          description: The plan of a request with `dryRun` true; nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FailoverPlan' }
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{serverId}/drain:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: drainServer
      summary: Drain a server
      description: |
        Added in 0.15.0. Makes a server removable: sets its `shouldHaveShards` to false, moves every bucket its shard groups own to
        the other servers (the run of `startRebalance` with `drainOnly`, the strategy and threshold of the cluster settings), waits
        until the server owns no bucket and none is on its way, and, with `removeWhenDone`, removes the server with the task of
        `removeServer`. The cluster stays in service. A drain is a **task of kind `rebalance`** (not a kind of its own): the run is
        the rebalance of the cluster, so `getRebalanceStatus` shows it (`trigger` `drain`), `stopRebalance` stops it, a new `POST
        /rebalance` or `drainServer` goes on with a stopped one, `cancelTask` ends it (the flag stays false: the server stays
        `draining` until it is given back with `PATCH /servers/{serverId}` `shouldHaveShards: true`), the report has the id of the
        task, and no other rebalance or change of the servers can run meanwhile.

        Refused before a task exists: 404 for an unknown server; 409 `last_server`; 409 `no_receiving_server` (no other server runs a
        primary and should hold shards); 409 `server_hosts_map_group` (the server runs the primary of the map group and no other server runs a standby of it, so the map group cannot be handed over);
        409 `replicas_cannot_be_kept` (fewer servers than `replicaCount + 1` would remain; `acceptFewerReplicas` overrides); 409
        `group_degraded` (a group of the server has fewer healthy standbys than the replica count); 409 `rebalance_in_progress` and
        `operation_in_progress`; 422 `node_state_invalid` for a `dead` server; 422 `unprocessable` when the server holds ordinary
        (not distributed) tables that leave with it and `acknowledgeLocalData` is not true. Changed in 0.31.0 (additive; no member changes): the distributed schemas (phase 11) of the server's groups move off it with the buckets, as items of the plan with `kind` `schema`, and the drain is refused with 409 `schema_pinned` (a schema holds a ledger table) or 422 `unprocessable` (a table of a schema is not logged or has neither a key nor a full replica identity, or its group does not answer) when a schema cannot be moved, naming the schema; the task ends only when no bucket and no schema is left on the server. The standbys that the server hosts are
        relocated by the step `Relocate the standbys hosted on the server`: the server is taken out of the ring of the standbys, the reconcile of the standbys
        places the replacements on the other servers before it removes the old ones, and the step waits until none is left (the groups are listed by
        `previewServerDrain`, `standbyShardGroupIds`); when another server cannot take them the task fails with `replicas_cannot_be_kept` unless `acceptFewerReplicas`.
        A server that runs the primary of the map group (the manager leader) is drained too (0.27.0): once the buckets have moved, the step `Hand over the map group`
        pauses the task, asks for a planned switchover of shard group 0 (`failoverServer`, mode `graceful`) to a standby on another server, and the drain goes on under the
        new manager leader when the switchover has ended. The task is paused meanwhile (`getRebalanceStatus` shows `stopped`, `stoppedBy` `safetyRule`) and keeps its id. A switchover
        that is refused or rolled back fails the task with the code of the refusal, or `server_hosts_map_group` when the server still runs the map group; the server stays `draining`
        and the drain can be started again. Needs `kingres_ops`.

        A drain is refused with 409 `operation_in_progress` while a database import (`importDatabase`) is pending, running or paused, and an import is refused while a drain is pending or
        running; a drain that is paused does not refuse an import, but it cannot be resumed until the import has ended. The buckets that the private database of a failed import that was kept
        (`keepOnFailure`) holds on the server keep the drain from ending: the task fails with `server_owns_buckets` and its detail names that database, which an operator drops with `dropDatabase`.
      tags: [Servers]
      x-required-role: kingres_ops
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrainRequest' }
            examples:
              drainAndRemove: { value: { removeWhenDone: true } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{serverId}/drain-preview:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: previewServerDrain
      summary: Preview the drain of a server
      description: |
        Added in 0.15.0. What `drainServer` would do now and what stands in its way, without changing anything: the moves (the plan
        of `previewRebalancePlan` with the server excluded and `drainOnly`), their bytes, the groups whose standby runs on the server,
        whether the replica count can be kept on the servers that remain, the databases in which the server holds ordinary tables that
        leave with it, and the blockers (each with the problem code `drainServer` would answer). From 0.31.0 the moves include the distributed schemas of the server (`kind` `schema`, `schemaName`), and a schema that cannot move is a blocker (`schema_pinned`, `unprocessable`). 404 for an unknown server.
      tags: [Servers]
      x-required-role: kingres_readonly
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrainPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{serverId}/certificates/renewals:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: renewServerCertificates
      summary: Renew the certificates of a server now
      description: |
        Added in 0.5.0. Gives the server a new certificate from the cluster certificate authority now,
        without waiting for the renewal job (every server renews its own certificate by itself when less
        than a configurable part of its lifetime is left). One certificate is the server certificate and
        the client certificate of the server's internal API and of its PostgreSQL instance, so this renews
        both. The key of the server stays; the new certificate carries the same names. Nothing is restarted:
        the internal API and the connections to the other servers read the certificate at every handshake
        and the PostgreSQL instance of the server re-reads it with a reload. Connections that are open keep
        working. Returns a task (`certificate.renew`, subject type `server`).

        The manager leader holds the certificate authority key today. When it does not, the operation is
        refused with 503 `certificate_authority_unavailable`. 404 for an unknown server; 409
        `certificate_revoked` for a server whose certificates were revoked (it gets no new certificate: remove
        it with `removeServer` or let it leave, and join it again); 409 `operation_in_progress` while another
        task of this server runs; 409 `conflict` for a server that is not an active member.
      tags: [Servers]
      x-required-role: kingres_admin
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /servers/{serverId}/certificates/revocations:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: revokeServerCertificates
      summary: Revoke the certificates of a server
      description: |
        Added in 0.5.0. Revokes every certificate that was issued to the server and may still be valid, and
        sends the revocation list to every server and every PostgreSQL instance of the cluster. Returns a
        task (`certificate.revoke`, subject type `server`; it waits for a server that cannot be reached, as
        every cluster-wide task does).

        **What stops working.** From the moment the task has sent the list to a server, that server's
        internal API refuses the revoked server (every call it makes, including forwarding, recording its
        tasks and asking to leave, answers 401), and the PostgreSQL instances refuse its certificate
        (`hostssl ... cert`, the sharding extension's connections to and from it), so statements that need a
        shard on the revoked server fail. Connections that were open before keep running until they end.
        The revoked server keeps running and keeps its data; its own REST API still answers for what it can
        do alone (`GET /this-server`, its instances) but it cannot change the cluster.

        **How the server gets back in.** A revoked server never gets a new certificate (`renewServerCertificates`
        answers 409 `certificate_revoked`; its renewal job is refused too). Take it out and add it again: a
        server that owns no bucket is removed with `removeServer` (or it leaves with `leaveCluster` and
        `force: true`, which resets it without the cluster, after which `removeServer` still has to take it out of
        the cluster's list) and joins again with a new setup token and a new key. A server that still owns buckets
        cannot be removed before a rebalance has emptied it, which is not possible while it is cut off; this version
        has no other way back. The leader still reaches the revoked server to give it the revocation list and to tell
        it to reset itself.

        The manager leader's own certificates cannot be revoked (409 `server_hosts_map_group`). The
        operation needs the certificate authority key like `renewServerCertificates`: 503
        `certificate_authority_unavailable` when the manager leader does not hold it. 404 for an unknown
        server; 409 `certificate_revoked` when they are revoked already; 409 `operation_in_progress`.
      tags: [Servers]
      x-required-role: kingres_admin
      responses:
        '202': { $ref: '#/components/responses/AcceptedTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /certificate-authority/escrow:
    get:
      operationId: getCaEscrow
      summary: Get the escrow of the certificate authority key
      description: |
        Added in 0.26.0. Whether the escrow of the key of the cluster certificate authority is on, which servers hold
        a sealed copy of the key and whether each copy is the newest. The escrow lets a new manager leader (after the
        failover of the map group) issue, renew and revoke certificates without the old leader: it opens its own copy
        and goes on. Without it the new leader raises the alert `certificateAuthorityUnavailable` until an operator
        restores `pki/ca.key` and `pki/revoked.json` by hand. The answer is the leader's (the request is forwarded).
        Needs `kingres_admin`. The key itself is never in an answer, in a task, in an audit event or in the
        PostgreSQL instances.
      tags: [Servers]
      x-required-role: kingres_admin
      responses:
        '200':
          description: The escrow of the CA key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaEscrowStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: setCaEscrow
      summary: Switch the escrow of the certificate authority key on or off
      description: |
        Added in 0.26.0. `enabled: true` makes the leader seal the CA key and the revocation list to every server that
        hosts a ready standby of the map group (the servers that can become leader) and send each its copy over the
        internal API; the leader then keeps the copies current (after every revocation, when the standbys change, and at
        least every 6 hours). `enabled: false` takes every copy and every escrow key away from the servers; a server that
        cannot be reached is asked again every minute and stays listed until it has deleted its copy. The answer is the
        status after the first round; a recipient that could not be reached is `pending` and the leader sends again.

        Each copy is encrypted so that only the escrow key of its server opens it (X25519 and AES-256-GCM); that key
        is a file of the server and is not its TLS key. **A server that holds a copy can become the CA: its disk is as
        sensitive as the leader's.** Switch the escrow on only when the servers that host standbys of the map group are
        as trusted as the leader. A server that is removed while it holds a copy, and that cannot be reached to delete
        it, must be treated as knowing the CA key (the rotation of the CA itself is not part of this contract).

        The operation needs the CA key on the leader: 503 `certificate_authority_unavailable` when it does not. It is
        audited under `setCaEscrow`.
      tags: [Servers]
      x-required-role: kingres_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaEscrowUpdate' }
            examples:
              on: { value: { enabled: true } }
      responses:
        '200':
          description: The escrow after the operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaEscrowStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /certificate-authority/escrow/rotations:
    post:
      operationId: rotateCaEscrow
      summary: Rotate the escrow keys and reseal the copies
      description: |
        Added in 0.26.0. Every recipient makes a new escrow key, the leader seals a new generation of the copy to it,
        and the recipient deletes its old key and old copy when the new copy is stored. Use it when the escrow keys
        may have been exposed without the CA key being known to be (a copy of an old disk image, a retired server).
        It does not change the CA key: a copy that an attacker already took together with the escrow key that opens it
        still opens. 409 `conflict` while the escrow is off; 503 `certificate_authority_unavailable` when the leader
        has no CA key. Audited under `rotateCaEscrow`.
      tags: [Servers]
      x-required-role: kingres_admin
      responses:
        '200':
          description: The escrow after the rotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaEscrowStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /server-groups:
    get:
      operationId: listServerGroups
      summary: List server groups
      description: Server groups (racks or zones) and their member servers. Not paginated.
      tags: [Server groups]
      x-required-role: kingres_readonly
