#
# Development topology: three KingresDB nodes on one Docker network with fixed
# names, one published panel port and one volume each.  The nodes start
# uninitialized, each with its own setup token (read them with ./tokens.sh).
#
# Joining the nodes into one cluster is NOT implemented in kingresd yet: today
# each node is an independent uninitialized node.  This file only prepares the
# topology (names, network, ports, volumes) that the join feature will use.
#
# Usage (from this directory):
#   docker compose up --build -d     build the image (clean snapshot advised,
#                                    see README.md) and start three nodes
#   ./tokens.sh                      print the setup token of every node
#   docker compose down              stop (volumes stay)
#   docker compose down --volumes    stop and delete the data of all nodes
#
# Environment (all optional):
#   KINGRES_BUILD_CONTEXT   build context, default ../../.. (repository root).
#                           Point it at a snapshot made by build/snapshot.sh
#                           to build only committed files.
#   KINGRES_IMAGE           image name, default kingres:dev
#   KINGRES_PANEL_PORT_1/2/3  host ports of the panels, default 8091/8092/8093
#   KINGRES_PANEL_BIND      host address the ports are bound to, default
#                           127.0.0.1 (the setup token protects an
#                           uninitialized node, but it is not a reason to
#                           publish it to the network)

name: kingres-dev

x-node: &node
  image: ${KINGRES_IMAGE:-kingres:dev}
  restart: unless-stopped
  pull_policy: never    # the image is built by kingres-1 (or already present)
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - kingres

services:
  kingres-1:
    <<: *node
    build:
      context: ${KINGRES_BUILD_CONTEXT:-../../..}
      dockerfile: kingres/packaging/docker/Dockerfile
    pull_policy: build
    container_name: kingres-1
    hostname: kingres-1
    ports:
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PANEL_PORT_1:-8091}:8091"
    volumes:
      - kingres-1-data:/var/lib/kingres

  kingres-2:
    <<: *node
    container_name: kingres-2
    hostname: kingres-2
    ports:
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PANEL_PORT_2:-8092}:8091"
    volumes:
      - kingres-2-data:/var/lib/kingres

  kingres-3:
    <<: *node
    container_name: kingres-3
    hostname: kingres-3
    ports:
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PANEL_PORT_3:-8093}:8091"
    volumes:
      - kingres-3-data:/var/lib/kingres

networks:
  kingres:
    name: kingres-net

volumes:
  kingres-1-data:
    name: kingres-1-data
  kingres-2-data:
    name: kingres-2-data
  kingres-3-data:
    name: kingres-3-data
