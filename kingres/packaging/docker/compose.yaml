#
# Development topology: three KingresDB nodes on one Docker network with fixed
# names, one published panel port and one volume each.  The nodes start
# uninitialized, each with its own setup token (read them with ./tokens.sh).
#
# Each node starts uninitialized.  Create a cluster on one node (panel or
# setup API) and make the others members of it, either from the cluster
# (addServer) or from the new node (joinCluster); test/test-compose.sh does
# both through the REST API with the certificate fingerprints pinned.  What
# joining needs is set below: the mutual-TLS internal API on the port above the
# REST port (8092), the host name of each node as its server id (it must
# resolve, from every other node, to that node on the shared network), a
# database listening on all addresses and one volume per node.
#
# One cluster runs one PostgreSQL major, so the image is always chosen: there
# is no default (kingres:<version>-pg18 or kingres:<version>-pg19, made by
# build-image.sh, which reads the major from the source tree).
#
# Usage (from this directory):
#   ./build-image.sh --rev kingres-18        build kingres:<version>-pg18
#   KINGRES_IMAGE=kingres:0.1.0-pg18 docker compose up -d
#                                    start three nodes of that image
#   ./tokens.sh                      print the setup token of every node
#   docker compose down              stop (volumes stay)
#   docker compose down --volumes    stop and delete the data of all nodes
#
# Environment:
#   KINGRES_IMAGE           image to run, REQUIRED (for example kingres:0.1.0-pg19)
#   KINGRES_PANEL_PORT_1/2/3  host ports of the panels, default 8091/8092/8093
#   KINGRES_PG_PORT_1/2/3     host ports of the databases, default 5432/5433/5434
#                           (stop a local PostgreSQL or change them)
#   KINGRES_PANEL_BIND      host address the ports are bound to, default
#                           127.0.0.1 (the setup token protects an
#                           uninitialized node, but it is not a reason to
#                           publish it to the network)

name: kingres-dev

x-node-environment: &node-environment
  # The mutual-TLS port of the server-to-server API, used when nodes are
  # joined into one cluster.  It must be the port above the REST port
  # (KINGRES_LISTEN, 8091): a server is known to the others by its REST
  # address and its internal API is looked up at the next port.  It is not
  # published to the host.
  KINGRES_INTERNAL_LISTEN: "0.0.0.0:8092"

x-node: &node
  image: ${KINGRES_IMAGE:?set KINGRES_IMAGE to the image of one PostgreSQL major, for example kingres:0.1.0-pg18 (build it with ./build-image.sh)}
  restart: unless-stopped
  # "docker stop" shuts the database down first (entrypoint.sh): allow it time.
  stop_grace_period: 120s
  pull_policy: never    # the image is built with build-image.sh, not pulled
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - kingres

services:
  kingres-1:
    <<: *node
    container_name: kingres-1
    hostname: kingres-1
    environment:
      <<: *node-environment
      # The server id: its certificate names it and the other nodes connect to
      # it by this name (the host name of the container, which must resolve to
      # this node from every other node).
      KINGRES_SERVER_HOST: kingres-1
    ports:
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PANEL_PORT_1:-8091}:8091"
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PG_PORT_1:-5432}:5432"
    volumes:
      - kingres-1-data:/var/lib/kingres

  kingres-2:
    <<: *node
    container_name: kingres-2
    hostname: kingres-2
    environment:
      <<: *node-environment
      # The server id: its certificate names it and the other nodes connect to
      # it by this name (the host name of the container, which must resolve to
      # this node from every other node).
      KINGRES_SERVER_HOST: kingres-2
    ports:
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PANEL_PORT_2:-8092}:8091"
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PG_PORT_2:-5433}:5432"
    volumes:
      - kingres-2-data:/var/lib/kingres

  kingres-3:
    <<: *node
    container_name: kingres-3
    hostname: kingres-3
    environment:
      <<: *node-environment
      # The server id: its certificate names it and the other nodes connect to
      # it by this name (the host name of the container, which must resolve to
      # this node from every other node).
      KINGRES_SERVER_HOST: kingres-3
    ports:
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PANEL_PORT_3:-8093}:8091"
      - "${KINGRES_PANEL_BIND:-127.0.0.1}:${KINGRES_PG_PORT_3:-5434}:5432"
    volumes:
      - kingres-3-data:/var/lib/kingres

networks:
  kingres:
    name: kingres-net

volumes:
  kingres-1-data:
    name: kingres-1-data
  kingres-2-data:
    name: kingres-2-data
  kingres-3-data:
    name: kingres-3-data
