#
# Settings for the pg_regress run.  The extension itself needs no preloaded
# library; the test timepart_convert converts partitions to columnar storage,
# and kingres_columnar must be preloaded to write columnar data (it registers
# a WAL resource manager).  kingres/dev/ext.sh preloads a library named like
# the extension by default; this replaces that list.
shared_preload_libraries = 'kingres_columnar'
max_prepared_transactions = 0

kingres_timepart.trust_table_owners = on
